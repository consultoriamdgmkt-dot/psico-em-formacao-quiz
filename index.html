 "Além disso, o professor indica que as teorias da motivação seriam trabalhadas nas aulas seguintes."], "memory": "A aula introduz motivação e liderança como temas centrais do conteúdo que será desenvolvido."}], "case": "Uma empresa compra uma máquina moderna para aumentar significativamente sua produção e reduzir custos. O equipamento é instalado e novos procedimentos são definidos, mas os trabalhadores recebem apenas orientações informais e não passam por uma preparação adequada. Com o tempo, surgem dificuldades na execução e na manutenção do novo processo. A situação demonstra o problema central apresentado na aula: investir nos processos sem preparar as pessoas responsáveis por colocá-los em funcionamento rompe o equilíbrio necessário entre as duas grandes forças da organização."}, "2": {"title": "Motivação, Aprendizagem e Teorias Motivacionais", "blocks": [{"title": "Motivação e estímulo não são a mesma coisa", "paras": ["A aula começa discutindo a relação entre aprendizagem e motivação. A questão inicial é se aprendemos melhor porque estamos motivados ou se o próprio aprendizado pode aumentar nossa motivação.", "Para desenvolver essa discussão, o professor estabelece uma distinção central entre motivação e estímulo.", "Estímulo", "O estímulo é apresentado como algo que atua de fora para dentro. Recompensas, condições externas e outros elementos do ambiente podem estimular uma pessoa.", "Motivação", "Na perspectiva trabalhada na aula, a motivação é apresentada como um movimento interno, algo que nasce dentro da pessoa e se manifesta em direção à ação.", "Por isso, mesmo quando se fala em fatores externos capazes de influenciar o comportamento, o professor diferencia esses elementos da motivação propriamente dita:", "ESTÍMULO → de fora para dentro\nMOTIVAÇÃO → movimento que nasce internamente", "O salário aparece como exemplo dessa distinção. Na discussão da aula, ele pode funcionar como elemento externo, mas não é considerado suficiente, por si só, para produzir uma motivação interna duradoura."], "memory": "A aula começa discutindo a relação entre aprendizagem e motivação. A questão inicial é se aprendemos melhor porque estamos motivados ou se o próprio aprendizado pode aumentar nossa motivação."}, {"title": "O papel da liderança na motivação", "paras": ["Dentro da Psicologia Organizacional, diferentes fatores podem interferir na maneira como o trabalhador realiza suas atividades.", "A liderança ganha importância porque o líder pode criar condições que favoreçam o desenvolvimento profissional. Entretanto, segundo a lógica apresentada na aula, o líder não simplesmente “coloca” motivação dentro de outra pessoa.", "Sua atuação pode estimular e criar condições capazes de alcançar aquilo que existe internamente no trabalhador.", "Assim, existe uma diferença entre oferecer estímulos externos e compreender aquilo que internamente move cada pessoa."], "memory": "Dentro da Psicologia Organizacional, diferentes fatores podem interferir na maneira como o trabalhador realiza suas atividades."}, {"title": "Aprendizagem e motivação", "paras": ["A aula problematiza a ideia de que toda aprendizagem depende obrigatoriamente de motivação. É possível memorizar determinado conteúdo momentaneamente mesmo sem grande envolvimento.", "A discussão, porém, caminha para uma relação mais profunda entre motivação e aprendizagem significativa.", "Quando a pessoa encontra significado naquilo que está aprendendo, pensa sobre o conteúdo, envolve-se e consegue relacioná-lo à própria realidade, a aprendizagem tende a ultrapassar a simples memorização.", "A motivação também pode ser alimentada pelo próprio processo de aprendizagem: compreender algo, resolver um problema ou perceber que está avançando pode aumentar a disposição para continuar aprendendo.", "Portanto, a relação não é apresentada simplesmente como uma sequência rígida. Aprender pode favorecer a motivação e a motivação pode favorecer um envolvimento mais profundo com a aprendizagem."], "memory": "A aula problematiza a ideia de que toda aprendizagem depende obrigatoriamente de motivação. É possível memorizar determinado conteúdo momentaneamente mesmo sem grande envolvimento."}, {"title": "O ecossistema da aprendizagem", "paras": ["Para compreender essa conexão, o professor introduz a ideia de um ecossistema da aprendizagem.", "Nesse ecossistema, três dimensões recebem destaque:", "Cognitiva", "Aprender precisa mobilizar o pensamento. A pessoa deve ser levada a:", "pensar;", "refletir;", "analisar problemas;", "elaborar possibilidades;", "procurar soluções;", "compreender;", "criar.", "A capacidade de resolver problemas aparece como uma experiência particularmente importante, porque mobiliza o indivíduo cognitivamente e pode favorecer sua percepção de competência.", "Afetiva", "A aprendizagem também precisa alcançar os sentimentos. Não basta apenas apresentar uma informação racionalmente; o envolvimento afetivo participa da conexão construída com aquilo que está sendo aprendido.", "O professor relaciona essa dimensão também às organizações: quando o trabalhador é percebido como pessoa dentro da organização, sua relação com o trabalho pode ser diferente.", "Motivacional", "A terceira dimensão é o próprio movimento interno que leva a pessoa em determinada direção. É aquilo que sustenta a busca, o interesse e a disposição para continuar.", "Assim:", "COGNITIVO + AFETIVO + MOTIVACIONAL → ECOSSISTEMA DA APRENDIZAGEM"], "memory": "Para compreender essa conexão, o professor introduz a ideia de um ecossistema da aprendizagem."}, {"title": "Resolver problemas, autonomia e aprendizagem", "paras": ["A resolução de problemas aparece como elemento importante da dimensão cognitiva.", "Quando a pessoa recebe uma situação que exige reflexão, elaboração e busca de soluções, ela deixa de ocupar uma posição exclusivamente passiva no processo de aprendizagem.", "Nesse contexto, o professor introduz a autonomia como um elemento das concepções contemporâneas de motivação.", "Ter autonomia na aprendizagem significa não receber necessariamente todas as respostas prontas. O estudante pode receber provocações e reflexões e, a partir delas, pesquisar, aprofundar-se, questionar e construir novas conexões.", "Quanto maior a possibilidade de participação ativa, maior pode ser a conexão da pessoa com aquilo que está aprendendo."], "memory": "A resolução de problemas aparece como elemento importante da dimensão cognitiva."}, {"title": "Afetividade, percepção e engajamento no trabalho", "paras": ["A dimensão afetiva é levada da aprendizagem para o contexto organizacional.", "A aula questiona organizações que desejam trabalhadores altamente engajados, com “sentimento de dono” e disposição para contribuir além do mínimo esperado, mas que oferecem apenas uma relação baseada em:", "horário de entrada;", "execução de tarefas;", "intervalos;", "horário de saída;", "pagamento do salário.", "O professor provoca uma questão importante: o que a organização está fazendo para produzir o envolvimento que exige do trabalhador?", "A ideia de chamar alguém de “colaborador” não é suficiente. Para que essa relação tenha significado, o trabalhador precisa ser percebido dentro da organização.", "O envolvimento afetivo, portanto, aparece como um fator importante na construção do engajamento."], "memory": "A dimensão afetiva é levada da aprendizagem para o contexto organizacional."}, {"title": "Pensamento, sentimento, comportamento e resultado", "paras": ["Uma sequência para explicar como aquilo que pensamos pode repercutir nas nossas ações:", "PENSAMENTO → SENTIMENTO → COMPORTAMENTO → RESULTADO", "Aquilo que a pessoa pensa produz repercussões sobre aquilo que sente. O sentimento, por sua vez, relaciona-se ao comportamento, e o comportamento produz resultados.", "O comportamento pode se manifestar tanto por meio da linguagem verbal quanto da linguagem não verbal.", "Essa sequência ajuda a compreender por que o aprendizado não é apresentado apenas como processo de aquisição de informações. Ele também envolve pensamento, sentimento e ação."], "memory": "PENSAMENTO → SENTIMENTO → COMPORTAMENTO → RESULTADO"}, {"title": "Aprender e apreender", "paras": ["O professor estabelece uma distinção didática entre aprender e apreender.", "Aprender", "Está relacionado a compreender, assimilar e reter uma informação.", "Apreender", "Na forma trabalhada em aula, significa avançar para a utilização daquilo que foi aprendido, conseguindo colocar o conhecimento em prática no cotidiano.", "O aprendizado ganha outra dimensão quando o estudante sai da sala de aula, observa seus diferentes ambientes, identifica os conceitos estudados e tenta aplicá-los à realidade.", "Isso pode acontecer nos ciclos discutidos na aula anterior: família, trabalho/escola, amizades e contextos sociais mais amplos.", "Assim, a aprendizagem se consolida quando a pessoa não apenas recebe a informação, mas passa a observar, conversar, experimentar e aplicar aquilo que estudou."], "memory": "O professor estabelece uma distinção didática entre aprender e apreender."}, {"title": "Os primeiros estudos sobre pessoas e ambiente de trabalho", "paras": ["Historicamente estudos realizados no contexto industrial, mencionando as experiências de Hawthorne.", "O ponto enfatizado é que os primeiros estudos observavam como alterações no ambiente e nas condições de trabalho poderiam repercutir na produtividade.", "Mudanças em aspectos como:", "iluminação;", "bancadas;", "cadeiras;", "condições físicas do ambiente;", "eram relacionadas a mudanças na produção.", "Nesse momento histórico, portanto, a análise ainda estava fortemente voltada para elementos externos ao trabalhador.", "Essa trajetória é utilizada na aula para mostrar como os estudos sobre motivação foram progressivamente avançando para outras explicações."], "memory": "Historicamente estudos realizados no contexto industrial, mencionando as experiências de Hawthorne."}, {"title": "Maslow e a Hierarquia das Necessidades", "paras": ["Na sequência histórica estudada, aparece a teoria de Abraham Maslow.", "Maslow organiza as necessidades humanas de maneira hierárquica:", "1. Necessidades fisiológicas\nRelacionadas às necessidades básicas do organismo.", "2. Necessidades de segurança\nRelacionadas à proteção e à sensação de segurança.", "3. Necessidades sociais\nRelacionadas à convivência, aos grupos e às relações sociais.", "4. Necessidades de estima\nRelacionadas à percepção de valor e reconhecimento.", "5. Autorrealização\nRelacionada ao desenvolvimento e à realização das próprias potencialidades.", "Na forma apresentada na aula, a teoria propõe uma progressão: necessidades de níveis inferiores precisam estar atendidas para que as necessidades seguintes ganhem espaço.", "O próprio professor ressalta, entretanto, que se trata de uma teoria construída em determinado contexto histórico, e provoca a turma a pensar se essa progressão ocorre de maneira tão integral na realidade atual."], "memory": "Na sequência histórica estudada, aparece a teoria de Abraham Maslow."}, {"title": "Herzberg: fatores higiênicos e motivacionais", "paras": ["A aula também introduz a teoria de Herzberg, organizada em dois conjuntos de fatores.", "Fatores higiênicos", "Relacionam-se às condições externas e ao contexto no qual o trabalho acontece.", "Na lógica apresentada durante a aula, esses elementos precisam ser diferenciados daquilo que efetivamente produz o movimento motivacional interno.", "Fatores motivacionais", "Relacionam-se mais diretamente aos elementos capazes de produzir envolvimento com o próprio trabalho.", "A distinção é importante porque melhorar uma condição externa não significa automaticamente produzir motivação interna.", "Essa ideia se conecta à discussão realizada no início da aula sobre estímulo e motivação."], "memory": "A aula também introduz a teoria de Herzberg, organizada em dois conjuntos de fatores."}, {"title": "Das teorias clássicas às concepções contemporâneas", "paras": ["O professor situa Maslow e Herzberg como teorias construídas em determinados momentos históricos e chama atenção para o desenvolvimento posterior dos estudos sobre motivação.", "As teorias clássicas continuam importantes para compreender o campo, mas as concepções mais recentes passam a observar com maior atenção aspectos que ultrapassam simplesmente a satisfação integral e sequencial de necessidades.", "Nesse movimento, a aula menciona Daniel Pink e a Motivação 3.0, destacando especialmente a autonomia.", "A autonomia aparece como a possibilidade de a pessoa participar ativamente, buscar caminhos, tomar iniciativa e construir seu próprio desenvolvimento, em vez de depender apenas de comandos ou recompensas externas."], "memory": "O professor situa Maslow e Herzberg como teorias construídas em determinados momentos históricos e chama atenção para o desenvolvimento posterior dos estudos sobre motivação."}], "case": "Uma empresa reclama que seus funcionários demonstram pouco engajamento. A gestão acredita que aumentar salários e oferecer bônus resolverá o problema, mas mantém um trabalho em que os profissionais apenas cumprem tarefas previamente determinadas, possuem pouca autonomia, recebem pouco reconhecimento e raramente são convidados a pensar ou resolver problemas. Pela perspectiva desenvolvida na aula, os incentivos externos podem funcionar como estímulos, mas não garantem sozinhos uma conexão motivacional interna. Para favorecer maior envolvimento, é necessário considerar também dimensões cognitivas, afetivas e motivacionais da experiência de trabalho."}, "3": {"title": "Motivação Interna, Maslow, Autoeficácia e Modelagem", "blocks": [{"title": "Alguém consegue motivar outra pessoa?", "paras": ["Uma questão central da aula anterior:", "“Alguém motiva alguém?”", "A discussão diferencia novamente motivação de estímulo.", "Uma pessoa pode observar alguém que admira, receber uma recompensa, ouvir uma fala ou encontrar um ambiente favorável e, a partir disso, modificar seu comportamento. Entretanto, na perspectiva trabalhada pelo professor, esses elementos atuam como estímulos externos.", "Motivação", "É o movimento que precisa acontecer internamente no indivíduo. O motivo para agir precisa encontrar conexão com aquilo que a própria pessoa pensa, sente, deseja ou busca.", "Estímulo", "É aquilo que vem de fora e pode criar condições, incentivar ou favorecer determinado comportamento.", "O problema de depender exclusivamente do estímulo externo é que, quando ele desaparece, o comportamento produzido por ele também pode desaparecer.", "ESTÍMULO → vem de fora e pode incentivar", "MOTIVAÇÃO → movimento construído internamente"], "memory": "A discussão diferencia novamente motivação de estímulo."}, {"title": "O papel do psicólogo diante da motivação", "paras": ["Essa distinção tem uma consequência importante para a atuação do psicólogo.", "O profissional não deve assumir para si a responsabilidade de “motivar” diretamente outra pessoa, como se pudesse produzir internamente aquilo que somente o próprio indivíduo pode encontrar.", "Na aula, o papel do psicólogo é apresentado de outra maneira: ajudar a pessoa a encontrar o caminho de volta para essa conexão interna.", "Isso exige compreender que o profissional não sabe previamente:", "- o que existe no coração daquela pessoa;", "- como ela pensa;", "- quais são suas crenças;", "- qual é seu propósito;", "- quais são seus objetivos;", "- o que possui significado para ela.", "Por isso, em vez de fornecer respostas prontas, o psicólogo pode utilizar perguntas adequadas para que a própria pessoa encontre suas respostas.", "O psicólogo não coloca a motivação dentro da pessoa. Ele pode ajudá-la a encontrar aquilo que internamente produz seu movimento."], "memory": "Essa distinção tem uma consequência importante para a atuação do psicólogo."}, {"title": "Cognição e afetividade no caminho da motivação", "paras": ["O aprendizado como elemento importante para que a pessoa consiga construir essa conexão interna.", "O processo envolve duas dimensões trabalhadas anteriormente:", "Cognitivo", "Refere-se à forma de pensar, interpretar, compreender e construir significado.", "Afetivo", "Refere-se à conexão com sentimentos e com aquilo que possui significado emocional para a pessoa.", "Essa integração como uma conexão entre mente e coração.", "Quando a pessoa consegue construir cognitivamente um objetivo e também encontrar nele uma conexão afetiva, pode surgir o movimento interno necessário para caminhar em determinada direção.", "Isso não significa que a pessoa fará somente aquilo de que gosta. Muitas vezes, ela precisará executar tarefas desagradáveis ou difíceis porque consegue relacioná-las a um objetivo maior que possui significado."], "memory": "O aprendizado como elemento importante para que a pessoa consiga construir essa conexão interna."}, {"title": "Criar condições não é o mesmo que motivar", "paras": ["Se a motivação é interna, isso não significa que o ambiente externo seja irrelevante.", "A importância de:", "- criar um ambiente adequado;", "- oferecer condições;", "- apoiar;", "- participar do processo;", "- favorecer pertencimento.", "Esses elementos externos funcionam como estímulos e condições que podem ajudar a pessoa a encontrar seu próprio caminho interno.", "Portanto:", "Criar condições ≠ produzir diretamente a motivação.", "O ambiente pode favorecer o processo, mas a conexão motivacional precisa ocorrer no próprio indivíduo."], "memory": "Se a motivação é interna, isso não significa que o ambiente externo seja irrelevante."}, {"title": "Motivação exige coragem e determinação", "paras": ["A aula também problematiza a ideia de que estar motivado significa fazer apenas aquilo que é agradável.", "Manter-se em direção a um objetivo pode ser difícil e exigir:", "- coragem;", "- determinação;", "- renúncias;", "- persistência;", "- realização de tarefas que não são prazerosas.", "O exemplo discutido em sala é o de alguém que deseja alcançar determinado objetivo profissional e, por isso, dedica várias horas ao estudo e abre mão temporariamente de outras atividades.", "A motivação, nesse caso, não elimina as dificuldades. O que sustenta a ação é a conexão entre aquilo que a pessoa está fazendo agora e aquilo que deseja alcançar."], "memory": "A aula também problematiza a ideia de que estar motivado significa fazer apenas aquilo que é agradável."}, {"title": "Maslow: necessidades humanas e motivação", "paras": ["A Teoria da Hierarquia das Necessidades de Maslow.", "As necessidades discutidas são:", "Necessidades fisiológicas", "Relacionadas às condições básicas do organismo, como alimentação e outras necessidades fundamentais.", "Necessidades de segurança", "Relacionadas à proteção e à busca por condições de segurança.", "Necessidades sociais", "Relacionadas à convivência, aos vínculos e às relações com outras pessoas.", "Necessidades de estima", "Relacionadas à valorização e à percepção de valor.", "Autorrealização", "Relacionada à realização e à busca de plenitude.", "A teoria apresenta essas necessidades em uma organização ascendente, na qual o atendimento das necessidades mais básicas cria condições para o avanço em direção às demais."], "memory": "A Teoria da Hierarquia das Necessidades de Maslow."}, {"title": "A universalidade das necessidades precisa ser ponderada", "paras": ["Uma parte importante da aula é dedicada a discutir criticamente a ideia de que as necessidades propostas por Maslow seriam universais.", "A turma levanta uma questão: mesmo que determinadas necessidades estejam presentes nos seres humanos, elas possuem a mesma intensidade para todas as pessoas?", "A discussão chega à necessidade de fazer ponderações.", "A intensidade e a forma como determinada necessidade aparece podem variar de acordo com:", "- cultura;", "- história individual;", "- contexto social;", "- território;", "- época;", "- condições econômicas;", "- experiências de vida.", "Assim, duas pessoas podem apresentar necessidades sociais, por exemplo, mas isso não significa que precisem da mesma quantidade ou do mesmo tipo de interação social.", "A aula também compara diferentes contextos sociais: as necessidades que ganham maior importância para alguém vivendo em condições básicas precárias podem ser diferentes daquelas que ocupam maior espaço para uma pessoa cujas condições materiais já estão atendidas."], "memory": "Uma parte importante da aula é dedicada a discutir criticamente a ideia de que as necessidades propostas por Maslow seriam universais."}, {"title": "Maslow é uma teoria situada em seu contexto", "paras": ["O professor enfatiza que Maslow elaborou sua teoria a partir de pesquisas realizadas em determinado momento histórico.", "Por isso, a teoria deve ser compreendida como uma construção teórica que ajuda a interpretar a motivação, mas precisa ser analisada considerando transformações sociais, culturais e históricas.", "A aula mantém dois pontos da teoria como importantes para a discussão:"], "memory": "O professor enfatiza que Maslow elaborou sua teoria a partir de pesquisas realizadas em determinado momento histórico."}, {"title": "As necessidades humanas apresentadas possuem relevância para compreender o comportamento.", "paras": [], "memory": "Compreenda as necessidades humanas apresentadas possuem relevância para compreender o comportamento. e observe como esse conceito aparece nas situações de trabalho."}, {"title": "Existe uma ideia de ascendência entre necessidades mais básicas e a busca pela autorrealização.", "paras": ["Ao mesmo tempo, essa ascendência deve ser interpretada com as ponderações discutidas em relação ao contexto, à cultura, ao tempo e à individualidade."], "memory": "Ao mesmo tempo, essa ascendência deve ser interpretada com as ponderações discutidas em relação ao contexto, à cultura, ao tempo e à individualidade."}, {"title": "Necessidades podem competir entre si", "paras": ["A discussão também mostra que as pessoas precisam administrar diferentes necessidades simultaneamente.", "Atender uma necessidade própria pode significar, em determinado momento, não atender imediatamente à necessidade apresentada por outra pessoa.", "Isso não significa necessariamente rejeição ou falta de consideração. Pode representar simplesmente uma priorização de necessidades.", "Esse ponto reforça que a motivação não pode ser compreendida apenas pela existência de uma lista universal de necessidades. É necessário observar como cada pessoa organiza, prioriza e atribui intensidade às próprias necessidades em determinado contexto."], "memory": "A discussão também mostra que as pessoas precisam administrar diferentes necessidades simultaneamente."}, {"title": "Autoeficácia e modelagem", "paras": ["Na sequência, o professor introduz a teoria da autoeficácia e da modelagem.", "A discussão da aula concentra-se principalmente na modelagem.", "Modelagem", "É apresentada como o processo de observar aquilo que outra pessoa faz e reproduzir seus comportamentos, estratégias ou formas de agir buscando alcançar resultados semelhantes.", "A lógica pode ser representada assim:", "“Se essa pessoa faz determinadas coisas e alcança determinado resultado, posso fazer o mesmo para tentar alcançar resultado semelhante.”", "A modelagem vai além de uma imitação momentânea e superficial. Na explicação do professor, ela pode chegar à tentativa de reproduzir também maneiras de pensar e organizar o comportamento."], "memory": "Na sequência, o professor introduz a teoria da autoeficácia e da modelagem."}, {"title": "Os riscos da modelagem", "paras": ["Uma visão crítica sobre o uso indiscriminado da modelagem, principalmente quando alguém promete que basta reproduzir seus comportamentos para alcançar os mesmos resultados.", "O problema central é que:", "Pessoas diferentes não necessariamente alcançarão os mesmos resultados executando exatamente as mesmas ações.", "Existem diferenças relacionadas a:", "- história;", "- experiência;", "- preparação;", "- características individuais;", "- tempo de desenvolvimento;", "- condições disponíveis.", "O exemplo utilizado é o de dois corredores. Um atleta pode treinar durante muitas horas porque desenvolveu essa capacidade ao longo de anos. Uma pessoa que está começando não necessariamente poderá reproduzir imediatamente a mesma rotina e obter o mesmo resultado.", "Assim:", "MODELAR ≠ GARANTIR O MESMO RESULTADO"], "memory": "Uma visão crítica sobre o uso indiscriminado da modelagem, principalmente quando alguém promete que basta reproduzir seus comportamentos para alcançar os mesmos resultados."}, {"title": "Modelagem nas organizações", "paras": ["A modelagem também pode aparecer dentro das organizações.", "Um profissional recém-chegado pode observar alguém que apresenta bons resultados e tentar reproduzir:", "- sua rotina;", "- seus métodos;", "- suas estratégias;", "- seus comportamentos;", "- suas formas de trabalhar.", "Isso pode ser utilizado como referência, mas se torna problemático quando a organização ignora as diferenças entre as pessoas.", "A aula cita situações em equipes comerciais nas quais profissionais que não conseguem atingir metas tentam reproduzir exatamente o comportamento de colegas de alto desempenho.", "Nesses casos, a liderança precisa investigar o que está acontecendo em vez de simplesmente concluir que todos deveriam agir da mesma maneira."], "memory": "A modelagem também pode aparecer dentro das organizações."}, {"title": "Modelagem, metas, mérito e recompensa", "paras": ["A discussão aproxima a modelagem de contextos organizacionais baseados em:", "REGRAS → METAS/OBJETIVOS → RESULTADOS → MÉRITO → RECOMPENSA", "Quando a organização estabelece metas e associa seu cumprimento a bônus ou outras recompensas, alguns trabalhadores podem tentar modelar profissionais considerados bem-sucedidos para alcançar o mesmo resultado.", "A modelagem passa, então, a funcionar como uma possível estratégia para atingir o desempenho esperado e obter a recompensa.", "O professor ressalta novamente que isso exige cuidado: reproduzir o comportamento de outra pessoa não garante que o resultado também será reproduzido."], "memory": "REGRAS → METAS/OBJETIVOS → RESULTADOS → MÉRITO → RECOMPENSA"}, {"title": "Da modelagem para a próxima teoria", "paras": ["Ao final da aula, o professor propõe que a turma reflita sobre as teorias estudadas e faça comparações entre elas.", "São retomados:", "- Maslow;", "- Herzberg;", "- estímulo e resposta;", "- modelagem.", "O professor também anuncia como próxima discussão a teoria de Vroom, deixando-a como tema para reflexão e continuidade da disciplina.", "Portanto, nesta aula, Vroom é apenas introduzido como próximo conteúdo; a teoria ainda não é desenvolvida conceitualmente na transcrição enviada."], "memory": "Ao final da aula, o professor propõe que a turma reflita sobre as teorias estudadas e faça comparações entre elas."}], "case": "Uma empresa possui um vendedor que supera constantemente suas metas. A liderança decide orientar todos os novos vendedores a reproduzirem exatamente sua rotina, sua forma de abordar clientes e seus hábitos, prometendo que assim alcançarão os mesmos resultados. Alguns profissionais melhoram, enquanto outros apresentam queda de desempenho e frustração. Pela discussão da aula, a modelagem pode oferecer referências, mas não garante resultados idênticos, pois cada trabalhador possui características, experiências, condições e formas próprias de construir sua motivação. A liderança precisa compreender essas diferenças em vez de pressupor que reproduzir um modelo produzirá necessariamente o mesmo resultado."}, "4": {"title": "Teoria da Expectativa, Motivação Intrínseca e Limites dos Incentivos Externos", "blocks": [{"title": "Retomada: motivação interna × fatores externos", "paras": ["A distinção construída anteriormente entre motivação intrínseca e fatores externos.", "Na perspectiva defendida pelo professor, fatores externos podem:", "estimular;", "inspirar;", "criar condições;", "oferecer oportunidades;", "favorecer determinado comportamento.", "Entretanto, eles não substituem o movimento interno da pessoa.", "O professor reforça, portanto, a ideia:", "“Ninguém motiva ninguém.”", "Isso não significa que outras pessoas ou o ambiente não tenham influência. Um professor, líder ou psicólogo pode estimular, inspirar, criar caminhos e construir um ambiente favorável. Porém, a pessoa precisa encontrar internamente uma conexão com sua história, seus pensamentos, seus sentimentos e seus objetivos."], "memory": "A distinção construída anteriormente entre motivação intrínseca e fatores externos."}, {"title": "Aprendizado e motivação intrínseca", "paras": ["O aprendizado volta a aparecer como parte importante desse processo.", "Quando existe uma conexão interna com aquilo que está sendo realizado, a pessoa não depende exclusivamente de recompensas externas para continuar agindo.", "Ela consegue relacionar sua ação a:", "um objetivo;", "um propósito;", "sua história;", "sua forma de pensar;", "seus sentimentos.", "Na aula, isso é exemplificado pelo estudante que recebe determinado material e, por iniciativa própria, decide pesquisar e aprofundar o assunto.", "O professor pode ter apresentado o conteúdo, mas foi o próprio estudante que realizou o movimento de buscar mais.", "Esse movimento é utilizado como exemplo de motivação intrínseca."], "memory": "O aprendizado volta a aparecer como parte importante desse processo."}, {"title": "Cultura organizacional como ambiente favorável", "paras": ["Nas organizações, o desafio não é simplesmente encontrar uma recompensa diferente para cada trabalhador.", "A importância de construir uma cultura organizacional favorável, capaz de oferecer condições para que as pessoas estabeleçam uma conexão com aquilo que fazem.", "Benefícios, recompensas, comissões e outras vantagens podem ser positivos. Entretanto, a organização não deveria depender continuamente deles para conseguir envolvimento.", "Quanto maior a dependência de incentivos externos, maior pode ser a necessidade de continuar oferecendo novos estímulos para sustentar determinados comportamentos.", "Por isso, a aula direciona a atenção para a construção de condições organizacionais que favoreçam a conexão interna do trabalhador com aquilo que realiza."], "memory": "Nas organizações, o desafio não é simplesmente encontrar uma recompensa diferente para cada trabalhador."}, {"title": "Motivação não é empolgação", "paras": ["Outro ponto destacado é a diferença entre motivação e empolgação.", "Uma pessoa pode ficar momentaneamente animada diante de:", "uma recompensa;", "uma novidade;", "um aumento salarial;", "uma promessa;", "um benefício.", "Essa reação imediata não significa necessariamente que exista uma motivação interna consolidada.", "Empolgação", "Pode surgir como resposta momentânea a determinado estímulo.", "Motivação", "Na perspectiva desenvolvida nas aulas, envolve uma conexão interna mais profunda com aquilo que movimenta a pessoa.", "Assim:", "EMPOLGAÇÃO MOMENTÂNEA ≠ MOTIVAÇÃO INTRÍNSECA"], "memory": "Outro ponto destacado é a diferença entre motivação e empolgação."}, {"title": "Teoria da Expectativa de Vroom", "paras": ["A aula entra na Teoria da Expectativa de Vroom, que havia sido anunciada ao final da aula anterior.", "Na forma estudada, a teoria relaciona três elementos:", "Expectativa", "A pessoa avalia se seu esforço poderá produzir o desempenho necessário.", "A questão pode ser representada por:", "“Meu esforço vale a pena? Eu consigo realizar isso?”", "Instrumentalidade", "A pessoa avalia se o desempenho alcançado realmente produzirá determinado resultado ou recompensa.", "A questão é:", "“Se eu alcançar o desempenho esperado, receberei aquilo que foi prometido?”", "Valência", "Refere-se ao valor que a pessoa atribui ao resultado ou à recompensa.", "A questão é:", "“Aquilo que vou receber possui valor para mim?”"], "memory": "A aula entra na Teoria da Expectativa de Vroom, que havia sido anunciada ao final da aula anterior."}, {"title": "A lógica multiplicativa de Vroom", "paras": ["A aula chama atenção para uma característica importante da teoria: os três componentes aparecem relacionados de maneira multiplicativa.", "A lógica trabalhada pode ser representada como:", "MOTIVAÇÃO = EXPECTATIVA × INSTRUMENTALIDADE × VALÊNCIA", "Isso significa que os elementos não aparecem simplesmente somados.", "Se um deles assumir valor zero, o resultado da multiplicação também será zero.", "Por exemplo, uma recompensa pode ser muito desejada, mas, se o trabalhador acreditar que seu esforço não permitirá atingir o desempenho exigido, a relação proposta pela teoria é comprometida.", "Da mesma forma, a pessoa pode acreditar que consegue atingir a meta, mas não enxergar valor na recompensa oferecida."], "memory": "A aula chama atenção para uma característica importante da teoria: os três componentes aparecem relacionados de maneira multiplicativa."}, {"title": "A crítica do professor à Teoria de Vroom", "paras": ["A aula não apresenta Vroom apenas de maneira descritiva. O professor faz uma leitura crítica da teoria.", "Sua principal provocação é que os componentes utilizados pela teoria podem fazer com que a ação fique muito dependente de fatores externos:", "“Vale a pena meu esforço?”\n“O que eu ganho se fizer isso?”\n“A recompensa possui valor?”", "Na interpretação desenvolvida em aula, isso se aproxima mais da lógica dos estímulos externos do que da concepção de motivação intrínseca defendida pelo professor.", "Por isso, é importante separar duas coisas ao estudar:", "Vroom propõe:\nExpectativa × Instrumentalidade × Valência.", "O professor problematiza:\nUma explicação muito dependente desses elementos pode deixar a ação condicionada à existência de estímulos e recompensas externas."], "memory": "A aula não apresenta Vroom apenas de maneira descritiva. O professor faz uma leitura crítica da teoria."}, {"title": "A “cenourinha”: recompensa e manutenção do comportamento", "paras": ["Para explicar sua crítica, o professor utiliza a analogia da “cenourinha”.", "Quando o comportamento depende de uma recompensa continuamente colocada à frente da pessoa, surge uma questão:", "o que acontece quando a recompensa desaparece?", "A aula aproxima essa discussão da relação entre estímulo e resposta. Quando a manutenção de determinado comportamento depende do estímulo, retirar o estímulo pode enfraquecer a resposta.", "Nas organizações, isso pode se tornar particularmente desafiador porque seria necessário sustentar continuamente diferentes estímulos para diferentes trabalhadores."], "memory": "Para explicar sua crítica, o professor utiliza a analogia da “cenourinha”."}, {"title": "O exemplo do aumento salarial", "paras": ["O aumento salarial aparece como exemplo de um fator externo que pode produzir uma reação positiva imediata.", "O trabalhador recebe o aumento e pode ficar satisfeito ou empolgado naquele momento. Entretanto, segundo a discussão realizada em aula, essa reação não significa necessariamente uma mudança motivacional interna permanente.", "Depois de algum tempo, o novo salário pode passar a fazer parte da realidade cotidiana.", "O exemplo é utilizado para reforçar que:", "um benefício externo pode produzir efeitos importantes sem necessariamente construir, sozinho, uma motivação intrínseca duradoura."], "memory": "O aumento salarial aparece como exemplo de um fator externo que pode produzir uma reação positiva imediata."}, {"title": "Benefício aparente × problema real", "paras": ["Um caso organizacional no qual o proprietário acreditava estar ajudando seus trabalhadores ao emprestar dinheiro sempre que eles precisavam.", "Posteriormente, os valores eram descontados gradualmente do salário.", "À primeira vista, a prática poderia ser interpretada como benefício ou ajuda. Entretanto, alguns trabalhadores chegavam ao final do mês com poucos recursos disponíveis porque parte do salário já estava comprometida.", "O caso demonstra que uma intervenção não deve ser avaliada apenas pela intenção de quem a oferece.", "É necessário investigar:", "a situação concreta do trabalhador;", "seus gastos;", "suas dívidas;", "o contexto familiar;", "os efeitos da prática;", "a história que está produzindo aquele comportamento."], "memory": "Um caso organizacional no qual o proprietário acreditava estar ajudando seus trabalhadores ao emprestar dinheiro sempre que eles precisavam."}, {"title": "Investigar antes de simplesmente oferecer estímulos", "paras": ["Diante do problema dos empréstimos, a solução proposta não foi simplesmente continuar fornecendo dinheiro.", "A organização passou a investigar a situação e trabalhar aspectos relacionados à educação financeira.", "Isso envolvia compreender:", "quais eram as contas do trabalhador;", "como ele utilizava seu dinheiro;", "quais dívidas já existiam;", "como estava organizada sua vida financeira.", "A proposta passou a envolver acompanhamento e aprendizagem, inclusive com participação familiar em determinadas situações.", "O ponto central é que resolver momentaneamente uma necessidade não significa necessariamente atuar sobre aquilo que produz o problema."], "memory": "Diante do problema dos empréstimos, a solução proposta não foi simplesmente continuar fornecendo dinheiro."}, {"title": "Educação como construção de autonomia", "paras": ["O exemplo financeiro também recupera a importância do aprendizado discutido nas aulas anteriores.", "Em vez de apenas entregar um recurso externo, a proposta passa a ser ajudar o trabalhador a desenvolver condições para compreender e reorganizar sua própria situação.", "Isso como uma forma de educar e construir um caminho, e não simplesmente manter uma relação contínua de dependência.", "Essa lógica se conecta à concepção de motivação que vem sendo construída:", "ESTÍMULO ISOLADO → pode resolver momentaneamente", "APRENDIZADO + CONDIÇÕES + CONEXÃO INTERNA → favorecem construção mais consistente"], "memory": "O exemplo financeiro também recupera a importância do aprendizado discutido nas aulas anteriores."}, {"title": "Condições financeiras, insatisfação e trabalho", "paras": ["A discussão também mostra que problemas financeiros podem repercutir na relação do trabalhador com a organização.", "Quando uma pessoa trabalha durante todo o mês e praticamente não possui recursos disponíveis ao receber o salário, podem surgir:", "insatisfação;", "preocupação;", "desgaste;", "dificuldades familiares;", "perda de concentração.", "A aula relaciona esse contexto inclusive ao trabalho operacional com máquinas e equipamentos, chamando atenção para possíveis consequências de uma pessoa emocionalmente preocupada ou desconcentrada durante a execução de atividades.", "Portanto, compreender o trabalhador exige olhar além do comportamento imediatamente visível e investigar as condições relacionadas a ele."], "memory": "A discussão também mostra que problemas financeiros podem repercutir na relação do trabalhador com a organização."}, {"title": "O cuidado com a ideia de “ajudar”", "paras": ["Os exemplos discutidos produzem uma questão importante para a atuação organizacional:", "aquilo que a empresa considera ajuda realmente ajuda o trabalhador?", "Uma prática pode ter uma intenção positiva e, ao mesmo tempo, produzir consequências diferentes das esperadas.", "Por isso, a intervenção exige compreender o contexto e os efeitos concretos daquilo que está sendo feito.", "Essa lógica também se aplica ao uso de:", "recompensas;", "benefícios;", "bônus;", "comissões;", "incentivos.", "Eles podem ser úteis, mas precisam ser analisados dentro de uma compreensão mais ampla da pessoa e da organização."], "memory": "aquilo que a empresa considera ajuda realmente ajuda o trabalhador?"}, {"title": "Transição para autodeterminação e Motivação 3.0", "paras": ["Ao final da aula, o professor indica uma mudança de direção no estudo das teorias motivacionais.", "Depois de discutir teorias e abordagens fortemente relacionadas a necessidades, estímulos, recompensas e expectativas, a próxima etapa seria aprofundar perspectivas relacionadas à autodeterminação.", "O professor também anuncia que essa discussão permitirá avançar posteriormente para Daniel Pink e a Motivação 3.0.", "Nesta aula, porém, esses conteúdos são apenas indicados como continuidade.", "Autodeterminação e Daniel Pink ainda não são desenvolvidos conceitualmente nesta transcrição."], "memory": "Ao final da aula, o professor indica uma mudança de direção no estudo das teorias motivacionais."}], "case": "Uma empresa deseja aumentar a produtividade e cria um bônus para quem superar determinada meta. Inicialmente, a equipe demonstra grande empolgação, mas, depois de algum tempo, a gestão percebe que precisa aumentar ou modificar continuamente as recompensas para manter o mesmo comportamento. Pela discussão da aula, o caso permite compreender tanto a lógica da Teoria da Expectativa — na qual o trabalhador avalia esforço, relação entre desempenho e recompensa e valor do resultado — quanto a crítica apresentada pelo professor: quando o comportamento depende predominantemente de fatores externos, sua manutenção pode exigir novos estímulos, sem necessariamente construir uma motivação intrínseca."}, "5": {"title": "Visão Sistêmica, Motivação Intrínseca e Extrínseca e Aplicação das Teorias", "blocks": [{"title": "Retomada da avaliação: não analisar um comportamento isoladamente", "paras": ["A aula começa com uma retomada da avaliação e das dificuldades encontradas pelos alunos ao interpretar uma situação envolvendo motivação.", "A partir disso, o professor destaca um princípio importante para a Psicologia Organizacional: um problema de comportamento não deve ser analisado de maneira isolada.", "Quando o psicólogo se depara com determinada situação dentro de uma organização, não deve escolher imediatamente uma única teoria ou uma única causa para explicá-la.", "É necessário ampliar o olhar e compreender:", "- a pessoa;", "- o contexto;", "- as relações;", "- a liderança;", "- as condições de trabalho;", "- os processos organizacionais;", "- os diferentes fatores que podem estar relacionados ao comportamento observado."], "memory": "A aula começa com uma retomada da avaliação e das dificuldades encontradas pelos alunos ao interpretar uma situação envolvendo motivação."}, {"title": "Visão sistêmica", "paras": ["O conceito central apresentado é a visão sistêmica.", "Ter uma visão sistêmica significa compreender que determinado problema faz parte de um conjunto de relações e não pode ser entendido adequadamente quando analisado de maneira fragmentada.", "O professor cita como referência a ideia apresentada em A Quinta Disciplina, de Peter Senge, associando-a à necessidade de enxergar as relações existentes entre diferentes elementos de uma situação.", "No estudo, isso significa não tratar cada conteúdo como se estivesse completamente separado dos demais.", "Na prática profissional, significa não reduzir um problema organizacional a uma explicação única.", "VISÃO FOCADA/ISOLADA → observa apenas uma parte", "VISÃO SISTÊMICA → relaciona pessoa, contexto, processos e diferentes variáveis"], "memory": "O conceito central apresentado é a visão sistêmica."}, {"title": "O problema apresentado nem sempre é o problema real", "paras": ["Para demonstrar a visão sistêmica, o professor apresenta uma situação hipotética envolvendo um trabalhador chamado Lucas.", "A organização procura o psicólogo porque Lucas estaria:", "- isolando-se;", "- apresentando dificuldades;", "- sob pressão para cumprir uma meta;", "- aparentemente sem conseguir responder às expectativas da gestão.", "A direção apresenta a situação como um problema de Lucas e exige uma solução rápida.", "Entretanto, o psicólogo não deveria simplesmente aceitar essa definição.", "A pergunta passa a ser:", "O problema é realmente apenas de Lucas?", "A situação pode envolver também liderança, cobrança, metas, clima, relações interpessoais, condições organizacionais e a própria história do trabalhador."], "memory": "Para demonstrar a visão sistêmica, o professor apresenta uma situação hipotética envolvendo um trabalhador chamado Lucas."}, {"title": "Investigar antes de intervir", "paras": ["Diante de um problema organizacional, a primeira tarefa não é julgar nem apresentar imediatamente uma solução.", "É necessário investigar.", "No caso apresentado, o professor propõe conversar inicialmente com o gestor para compreender sua percepção e também reduzir a pressão exercida sobre o trabalhador.", "Depois, outras pessoas podem ser ouvidas para ampliar a compreensão da situação.", "A lógica é construir gradualmente uma leitura mais ampla do problema.", "O psicólogo deve trabalhar com hipóteses, e não com conclusões precipitadas.", "Por isso, o professor reforça:", "Pensar hipóteses → investigar → relacionar informações → compreender o contexto → intervir"], "memory": "Diante de um problema organizacional, a primeira tarefa não é julgar nem apresentar imediatamente uma solução."}, {"title": "Feedback positivo e construção de aliados", "paras": ["Ao conversar com o gestor, o professor orienta que o psicólogo não inicie a interação atacando ou culpabilizando a liderança.", "Em vez de dizer que o gestor está “acabando com a equipe”, a proposta é realizar um feedback positivo, reconhecendo aspectos de sua atuação e utilizando elementos trazidos pelo próprio interlocutor para conduzir a conversa.", "A escuta precisa ser atenta.", "O psicólogo pode utilizar aquilo que a própria pessoa diz para formular perguntas, produzir reflexão e ampliar a compreensão da situação.", "O objetivo é criar condições para que o gestor participe do processo, tornando-se um aliado na intervenção, em vez de simplesmente colocá-lo na posição de culpado."], "memory": "Ao conversar com o gestor, o professor orienta que o psicólogo não inicie a interação atacando ou culpabilizando a liderança."}, {"title": "Sem julgamento", "paras": ["Outro princípio enfatizado é a necessidade de trabalhar sem julgamento.", "O psicólogo não deve chegar à organização procurando imediatamente:", "- culpados;", "- certos e errados;", "- uma causa única;", "- uma resposta pronta.", "A análise precisa considerar diferentes perspectivas.", "Isso é particularmente importante porque aquilo que inicialmente parece ser um problema individual pode estar relacionado a processos organizacionais mais amplos.", "Sem julgamento não significa ausência de análise.", "Significa investigar antes de concluir."], "memory": "Outro princípio enfatizado é a necessidade de trabalhar sem julgamento."}, {"title": "O caso de Lucas e a motivação", "paras": ["Ao ampliar a análise do caso, surge a hipótese de que Lucas possa não estar intrinsecamente motivado para aquele trabalho.", "Entretanto, mesmo essa hipótese precisa ser investigada.", "O professor levanta a possibilidade de Lucas ter procurado o emprego inicialmente para atender uma necessidade de segurança, retomando a teoria de Maslow trabalhada nas aulas anteriores.", "Assim, uma situação aparentemente relacionada apenas à motivação pode envolver simultaneamente:", "- necessidades;", "- segurança;", "- contexto profissional;", "- liderança;", "- pressão;", "- metas;", "- relações;", "- clima organizacional.", "O exemplo demonstra por que as teorias precisam ser conectadas, e não utilizadas de maneira isolada."], "memory": "Ao ampliar a análise do caso, surge a hipótese de que Lucas possa não estar intrinsecamente motivado para aquele trabalho."}, {"title": "Aplicação integrada das teorias", "paras": ["O objetivo do estudo das teorias não é simplesmente decorar autores.", "O professor afirma que não pretende aprofundar todas as teorias separadamente como se cada uma fosse uma explicação completa da realidade.", "O mais importante é desenvolver a capacidade de identificar:", "Estamos diante de motivação intrínseca ou extrínseca?", "Existe um movimento interno ou predominam estímulos externos?", "O comportamento observado está relacionado somente ao indivíduo ou também ao contexto?", "As teorias ajudam a construir diferentes formas de compreender uma situação, mas precisam ser interpretadas considerando o período em que foram desenvolvidas e as condições em que são aplicadas."], "memory": "O objetivo do estudo das teorias não é simplesmente decorar autores."}, {"title": "Motivação intrínseca × motivação extrínseca", "paras": ["A distinção entre motivação intrínseca e extrínseca volta a ocupar posição central.", "Motivação intrínseca", "Está relacionada ao movimento interno da pessoa, àquilo que estabelece conexão com sua forma de pensar, seus sentimentos, seus objetivos e sua história.", "Motivação extrínseca", "Na linguagem utilizada durante as aulas, aparece associada aos estímulos externos que procuram produzir ou manter determinado comportamento.", "A pergunta fundamental passa a ser:", "“A pessoa está realmente motivada ou está sendo estimulada?”", "Essa diferença é apresentada como mais importante do que simplesmente memorizar isoladamente cada teoria motivacional."], "memory": "A distinção entre motivação intrínseca e extrínseca volta a ocupar posição central."}, {"title": "Retomada crítica da Teoria da Expectativa", "paras": ["A Teoria da Expectativa, trabalhada na aula anterior, volta a ser discutida.", "Sua crítica de que a relação entre expectativa, instrumentalidade e valência pode produzir uma situação em que a pessoa esteja continuamente avaliando fatores externos:", "- “Meu esforço vale a pena?”", "- “Vou conseguir?”", "- “Vou receber aquilo que foi prometido?”", "- “Aquilo que vou receber tem valor para mim?”", "Na leitura apresentada em aula, essa lógica pode produzir pressão e dependência de elementos externos.", "Por isso, a teoria é analisada dentro da distinção maior entre motivação intrínseca e estímulos externos."], "memory": "A Teoria da Expectativa, trabalhada na aula anterior, volta a ser discutida."}, {"title": "Teorias precisam ser contextualizadas historicamente", "paras": ["O professor também chama atenção para o momento histórico em que determinadas teorias foram construídas.", "As primeiras abordagens sobre comportamento e produtividade estavam inseridas em contextos marcados pela industrialização, pelo Taylorismo e pelo Fordismo.", "Em determinados momentos, melhorar elementos externos do ambiente de trabalho e observar seus efeitos sobre a produtividade representou uma mudança importante.", "Entretanto, o professor alerta que não é possível simplesmente permanecer preso a essas explicações.", "As teorias precisam ser compreendidas considerando:", "- a época;", "- o contexto;", "- as características das organizações;", "- as mudanças na compreensão do trabalhador."], "memory": "O professor também chama atenção para o momento histórico em que determinadas teorias foram construídas."}, {"title": "Procedimento não substitui educação", "paras": ["A aula amplia essa discussão para situações relacionadas à saúde e segurança no trabalho.", "O exemplo da implementação de normas e procedimentos.", "Criar uma norma, estabelecer um processo ou determinar o uso de um equipamento não garante automaticamente que o comportamento esperado ocorrerá.", "Um trabalhador pode, por exemplo, saber que deveria utilizar determinado EPI e ainda assim não utilizá-lo.", "Por isso, segundo a discussão apresentada, a organização precisa desenvolver também um processo educativo.", "NORMA/PROCEDIMENTO → estabelece o que deve ser feito", "PROCESSO EDUCATIVO → trabalha a compreensão da pessoa sobre aquilo que está fazendo", "Essa discussão recupera a ideia apresentada desde a primeira aula: processos e pessoas precisam caminhar juntos."], "memory": "A aula amplia essa discussão para situações relacionadas à saúde e segurança no trabalho."}, {"title": "Processos e pessoas", "paras": ["A discussão sobre segurança retoma diretamente um dos princípios apresentados pelo professor desde o início do bimestre.", "Uma organização pode:", "- formalizar procedimentos;", "- criar normas;", "- adquirir equipamentos;", "- estabelecer regras;", "- exigir comportamentos.", "Entretanto, se não trabalhar com as pessoas que executam esses processos, pode haver uma distância entre aquilo que foi estabelecido e aquilo que realmente acontece.", "Por isso:", "PROCESSOS + PESSOAS → precisam ser trabalhados conjuntamente", "A implementação técnica, sozinha, não garante mudança comportamental."], "memory": "A discussão sobre segurança retoma diretamente um dos princípios apresentados pelo professor desde o início do bimestre."}, {"title": "Mudanças organizacionais e culturais", "paras": ["Sua experiência com empresas para mostrar que determinadas mudanças não acontecem de maneira imediata.", "Ele relata transformações observadas ao longo do tempo em organizações, especialmente relacionadas à formalização, segurança e organização do trabalho.", "A ideia central é que mudanças organizacionais também envolvem mudanças culturais.", "Quando determinada prática ainda não faz parte da cultura de uma organização ou de um setor, sua transformação pode exigir:", "- tempo;", "- educação;", "- acompanhamento;", "- mudança de percepção;", "- novos processos.", "Assim, novamente, não basta estabelecer uma regra e esperar adesão automática."], "memory": "Sua experiência com empresas para mostrar que determinadas mudanças não acontecem de maneira imediata."}, {"title": "Transição para Locke e Latham", "paras": ["Ao final da aula, o professor anuncia a continuidade das teorias motivacionais e destaca que os alunos devem observar especialmente a teoria de Locke e Latham.", "O conteúdo é associado à discussão sobre metas.", "O professor também menciona a ferramenta SMART, mas indica que o foco naquele momento deveria estar principalmente na teoria de Locke e Latham.", "Nesta transcrição, a teoria ainda não é desenvolvida em detalhes. Ela aparece como conteúdo que será aprofundado na sequência.", "Portanto, para esta aula, o ponto seguro é:", "Locke e Latham → teoria relacionada ao estabelecimento de metas.", "Não cabe ainda acrescentar características específicas das metas que não foram desenvolvidas nesta aula."], "memory": "Ao final da aula, o professor anuncia a continuidade das teorias motivacionais e destaca que os alunos devem observar especialmente a teoria de Locke e Latham."}, {"title": "Transição para Daniel Pink", "paras": ["O professor também menciona Daniel Pink, retomando a continuidade anunciada na aula anterior.", "Assim como Locke e Latham, Daniel Pink aparece como parte da sequência das teorias que serão organizadas e comparadas posteriormente.", "Nesta aula, porém, seus componentes ainda não são explicados de forma suficiente para constituir um bloco conceitual próprio.", "O professor indica que pretende posteriormente reunir as teorias em um quadro para permitir uma compreensão integrada."], "memory": "O professor também menciona Daniel Pink, retomando a continuidade anunciada na aula anterior."}], "case": "Lucas começou a apresentar isolamento e dificuldades para cumprir uma meta, e seu gestor concluiu que ele estava desmotivado e pediu ao psicólogo que resolvesse rapidamente o problema. Uma atuação baseada na visão sistêmica não deveria aceitar imediatamente essa interpretação. O psicólogo precisaria investigar a percepção do gestor, conversar com Lucas e considerar liderança, pressão, metas, necessidades, relações, clima e condições organizacionais, trabalhando com hipóteses e evitando julgamentos. O caso demonstra que um comportamento aparentemente individual pode estar relacionado a diferentes elementos do sistema organizacional."}, "6": {"title": "Integração das Teorias de Motivação, Ecossistema de Aprendizagem e Visão Sistêmica", "blocks": [{"title": "Delimitação do conteúdo da avaliação", "paras": ["Que, na parte dele, a avaliação será centrada em motivação. Liderança e poder não entram nesse momento.", "A estrutura informada para sua parte da avaliação é:", "- 2 questões discursivas;", "- 1 questão objetiva;", "- as três construídas a partir de estudos de caso.", "A proposta não é simplesmente perguntar a definição de uma teoria. O aluno deverá reconhecer elementos presentes no caso, relacioná-los aos conceitos estudados e explicar o comportamento apresentado.", "Que as questões serão semelhantes, em estrutura, ao caso de Lucas discutido em sala."], "memory": "Que, na parte dele, a avaliação será centrada em motivação. Liderança e poder não entram nesse momento."}, {"title": "Motivação como base para o estudo posterior da liderança", "paras": ["O conteúdo de motivação foi desenvolvido antes de liderança de forma intencional.", "Para compreender posteriormente a atuação de um líder, é necessário primeiro compreender o indivíduo e o processo motivacional.", "A sequência construída pelo professor é:", "Compreender aprendizagem e motivação → compreender o indivíduo → posteriormente compreender a atuação da liderança", "Assim, motivação funciona como uma base conceitual para o conteúdo seguinte."], "memory": "O conteúdo de motivação foi desenvolvido antes de liderança de forma intencional."}, {"title": "Visão sistêmica na resolução das questões", "paras": ["A visão sistêmica, trabalhada anteriormente.", "Uma situação organizacional não deve ser analisada por uma única informação. O aluno precisa observar diferentes pistas presentes no caso e estabelecer relações entre elas.", "Isso significa evitar respostas baseadas apenas em uma palavra-chave.", "A lógica esperada é:", "Identificar os elementos do caso → reconhecer os conceitos relacionados → estabelecer conexões → explicar o problema", "O objetivo é desenvolver uma forma de raciocínio próxima daquela utilizada pelo psicólogo diante de situações organizacionais."], "memory": "Uma situação organizacional não deve ser analisada por uma única informação. O aluno precisa observar diferentes pistas presentes no caso e estabelecer relações entre elas."}, {"title": "Caso de Lucas: contrato de trabalho instável", "paras": ["Novamente o caso de Lucas para demonstrar como as questões devem ser interpretadas.", "Lucas acabou de ingressar em uma equipe sob um contrato de trabalho instável.", "Essa informação não aparece por acaso.", "Na leitura da Pirâmide de Maslow, a instabilidade do contrato está relacionada à necessidade de:", "Segurança", "Portanto:", "Contrato instável → necessidade de segurança afetada", "O aluno precisa aprender a identificar essas pistas dentro do enunciado."], "memory": "Novamente o caso de Lucas para demonstrar como as questões devem ser interpretadas."}, {"title": "Caso de Lucas: conflitos e isolamento", "paras": ["Outra informação do caso é que Lucas enfrenta conflitos constantes no grupo e sente-se isolado.", "Novamente, essa informação deve ser relacionada à Pirâmide de Maslow.", "Nesse caso, o professor associa o isolamento e as dificuldades de integração à dimensão:", "Social / pertencimento", "Assim:", "Isolamento e conflitos → necessidade social/de pertencimento afetada", "Lucas apresenta, portanto, dificuldades relacionadas simultaneamente à segurança e ao pertencimento social."], "memory": "Outra informação do caso é que Lucas enfrenta conflitos constantes no grupo e sente-se isolado."}, {"title": "Caso de Lucas: necessidade de aprender rapidamente", "paras": ["Além das dificuldades anteriores, o gestor exige que Lucas aprenda rapidamente um software técnico altamente complexo para resolver um problema operacional da empresa.", "A palavra “aprenda” introduz outro conjunto de conceitos: o ecossistema de aprendizagem estudado.", "O caso, portanto, não deve ser respondido somente com Maslow.", "É necessário conectar:", "Maslow + ecossistema de aprendizagem", "Esse é exatamente o tipo de integração que o professor pretende avaliar."], "memory": "Além das dificuldades anteriores, o gestor exige que Lucas aprenda rapidamente um software técnico altamente complexo para resolver um problema operacional da empresa."}, {"title": "Ecossistema de aprendizagem: cognitivo e afetivo", "paras": ["O professor destaca especialmente dois componentes relacionados à aprendizagem:", "Cognitivo", "Está relacionado à forma de pensar e aos processos necessários para aprender. No exemplo apresentado, aparecem elementos como atenção e processamento das informações necessárias para dominar o software.", "Afetivo", "Está relacionado à dimensão emocional envolvida no processo de aprendizagem.", "Aprendizagem e motivação à necessidade de uma conexão entre essas dimensões.", "Em sua explicação:", "Cognição + afeto → construção interna da aprendizagem → possibilidade de motivação intrínseca"], "memory": "Está relacionado à forma de pensar e aos processos necessários para aprender. No exemplo apresentado, aparecem elementos como atenção e processamento das informações necessárias para dominar o software."}, {"title": "Segurança e pertencimento interferindo na aprendizagem", "paras": ["O caso de Lucas exige justamente a integração dessas duas partes.", "Por um lado, Lucas enfrenta:", "- insegurança decorrente do contrato instável;", "- conflitos;", "- isolamento;", "- falta de pertencimento.", "Por outro, precisa aprender rapidamente um conteúdo técnico complexo.", "A preocupação com sua permanência no emprego e a ausência de suporte social podem prejudicar as condições afetivas e cognitivas envolvidas no processo de aprendizagem.", "A preocupação com a “sobrevivência” no cargo pode ocupar o foco atencional e o processamento de informações necessários à aprendizagem.", "Portanto, a resposta não termina em “Lucas está desmotivado”.", "É necessário explicar por que sua motivação e sua aprendizagem estão prejudicadas."], "memory": "O caso de Lucas exige justamente a integração dessas duas partes."}, {"title": "Modelo de raciocínio esperado no caso de Lucas", "paras": ["A análise pode ser organizada da seguinte maneira:", "1. Identificar a pista: contrato instável.", "2. Relacionar: necessidade de segurança em Maslow.", "3. Identificar a pista: conflitos e isolamento.", "4. Relacionar: necessidade social/de pertencimento.", "5. Identificar a pista: precisa aprender rapidamente um software complexo.", "6. Relacionar: ecossistema de aprendizagem.", "7. Integrar: insegurança e isolamento interferem nos componentes afetivos e cognitivos necessários ao aprendizado e, consequentemente, prejudicam a construção da motivação.", "Essa é a visão sistêmica aplicada à questão."], "memory": "2. Relacionar: necessidade de segurança em Maslow."}, {"title": "Aprendizagem e motivação intrínseca", "paras": ["Uma ideia central desenvolvida ao longo das aulas:", "A motivação intrínseca depende de uma construção interna.", "Aprender não significa apenas receber uma informação.", "É necessário que a pessoa consiga:", "- formar uma maneira de pensar;", "- incorporar aquilo à própria vida;", "- construir um novo paradigma;", "- colocar o aprendizado em prática;", "- estabelecer uma conexão afetiva com aquilo.", "Quando essa construção ocorre, o comportamento deixa de depender exclusivamente de estímulos externos."], "memory": "A motivação intrínseca depende de uma construção interna."}, {"title": "Conhecimento, habilidade e atitude", "paras": ["Ao explicar quando o aprendizado se consolida, o professor utiliza três elementos:", "Conhecimento — saber.", "Habilidade — saber fazer.", "Atitude — querer fazer.", "A aprendizagem não se encerra no conhecimento teórico. Ela envolve a capacidade de transformar aquilo que se sabe em ação e incorporar esse aprendizado ao comportamento.", "Na lógica apresentada em aula:", "Conhecimento + habilidade + atitude + dimensão afetiva → aprendizagem incorporada"], "memory": "A aprendizagem não se encerra no conhecimento teórico. Ela envolve a capacidade de transformar aquilo que se sabe em ação e incorporar esse aprendizado ao comportamento."}, {"title": "Motivação verdadeira × empolgação e estímulo", "paras": ["O professor estabelece uma distinção importante entre motivação intrínseca e estados produzidos externamente.", "Motivação intrínseca", "É descrita como um movimento interno, construído e incorporado pela pessoa. Por estar relacionado à aprendizagem, às formas de pensar e à dimensão afetiva, tende a permanecer.", "Estímulo, animação ou empolgação", "Podem produzir uma resposta, mas não necessariamente significam que ocorreu uma construção motivacional interna.", "O professor sintetiza essa diferença mostrando que a pessoa pode continuar fazendo algo mesmo quando o estímulo externo deixa de existir, porque aquele comportamento já possui um registro interno para ela."], "memory": "O professor estabelece uma distinção importante entre motivação intrínseca e estados produzidos externamente."}, {"title": "Estímulos externos e produtividade", "paras": ["Teorias anteriores para mostrar como os estudos sobre comportamento passaram por diferentes explicações.", "A discussão menciona experiências nas quais alterações no ambiente e nas relações de trabalho foram associadas a mudanças de produtividade.", "A aula recupera, portanto, a diferença entre:", "Estimular externamente determinado comportamento", "E", "Construir uma motivação intrínseca que permaneça mesmo sem aquele estímulo.", "Essa distinção como eixo para compreender criticamente as diferentes teorias motivacionais."], "memory": "Teorias anteriores para mostrar como os estudos sobre comportamento passaram por diferentes explicações."}, {"title": "A importância de não estudar as teorias isoladamente", "paras": ["O professor deixa claro que a avaliação não pretende verificar apenas se o aluno decorou uma definição.", "A questão pode fornecer uma teoria e, em seguida, apresentar uma situação que exige conexão com outro conteúdo.", "Por isso, estudar apenas:", "“Maslow = hierarquia de necessidades”", "Não é suficiente.", "É necessário conseguir reconhecer:", "Contrato instável → segurança", "Isolamento → pertencimento/social", "Exigência de aprendizagem → componentes cognitivos e afetivos", "E depois conectar esses elementos em uma explicação única."], "memory": "O professor deixa claro que a avaliação não pretende verificar apenas se o aluno decorou uma definição."}, {"title": "Resposta simples × resposta técnica", "paras": ["Ao analisar o caso de Lucas, o professor mostra que não pretende exigir uma formulação excessivamente técnica.", "Uma resposta simples, mas conceitualmente correta, pode demonstrar compreensão.", "Por exemplo:", "Resposta simples:", "Lucas está inseguro com o trabalho e não se sente integrado à equipe. Essas condições dificultam sua motivação e também sua capacidade de se concentrar no aprendizado exigido.", "Uma resposta mais técnica poderia aprofundar:", "Resposta técnica:", "O contrato instável compromete a necessidade de segurança e os conflitos e o isolamento prejudicam a necessidade social/de pertencimento. Essas condições interferem nos fatores afetivos e cognitivos envolvidos na aprendizagem, dificultando a construção da motivação necessária para que Lucas aprenda o novo software.", "O essencial é que exista relação entre os conceitos e o caso."], "memory": "Ao analisar o caso de Lucas, o professor mostra que não pretende exigir uma formulação excessivamente técnica."}], "case": "Lucas ingressou recentemente em uma empresa com contrato instável, enfrenta conflitos constantes com sua equipe e sente-se isolado. Ao mesmo tempo, seu gestor exige que aprenda rapidamente um software complexo para solucionar um problema operacional. Uma análise sistêmica não deve reduzir a situação à afirmação de que Lucas “não está motivado”. O contrato instável relaciona-se à necessidade de segurança, enquanto o isolamento compromete a dimensão social/de pertencimento. Essas condições podem interferir nos componentes afetivos e cognitivos envolvidos na aprendizagem, dificultando a construção interna necessária para que Lucas se motive e domine o novo conhecimento."}, "7": {"title": "Teorias da Motivação: da influência externa à autodeterminação", "blocks": [{"title": "Visão sistêmica das teorias de motivação", "paras": ["A tabela utilizada para reunir as diferentes teorias de motivação. A finalidade é construir uma visão macro e sistêmica, evitando que cada teoria seja estudada como um conteúdo isolado.", "Ao observar a evolução dessas teorias, um eixo importante é perceber como as explicações sobre motivação passam progressivamente de uma ênfase nos fatores externos para uma compreensão maior dos processos internos do indivíduo.", "A questão central continua sendo:", "O comportamento está sendo mantido por estímulos externos ou existe uma motivação intrínseca construída internamente?"], "memory": "A tabela utilizada para reunir as diferentes teorias de motivação. A finalidade é construir uma visão macro e sistêmica, evitando que cada teoria seja estudada como um conteúdo isolado."}, {"title": "Aprendizagem e motivação intrínseca", "paras": ["A conexão entre aprendizagem e motivação.", "Aprender, nessa abordagem apresentada em aula, não significa apenas repetir uma informação. A aprendizagem envolve construir um registro interno capaz de modificar a maneira como a pessoa pensa e interpreta sua realidade.", "Cognição", "Está relacionada à forma de pensar. A aprendizagem permite construir novos paradigmas e novas maneiras de compreender determinada situação.", "Afetividade", "O conteúdo aprendido também se conecta à dimensão emocional. A pessoa atribui significado àquilo que aprendeu.", "Quando cognição e afetividade se integram, o aprendizado pode ser incorporado à vida da pessoa.", "Por isso, alguém pode continuar realizando algo mesmo diante de cansaço, dificuldades ou ausência de recompensas imediatas: existe um movimento interno sustentando aquele comportamento.", "Esse movimento é relacionado pelo professor à motivação intrínseca."], "memory": "Está relacionada à forma de pensar. A aprendizagem permite construir novos paradigmas e novas maneiras de compreender determinada situação."}, {"title": "Motivação intrínseca × estímulos externos", "paras": ["Motivação intrínseca", "É apresentada como um movimento interno que permanece mesmo diante de dificuldades. A pessoa incorporou determinado objetivo, construiu significado e não depende exclusivamente de recompensas externas para continuar.", "Estímulos externos", "São elementos do ambiente capazes de influenciar o comportamento. Podem produzir respostas e aumentar momentaneamente determinados comportamentos, mas não significam necessariamente que exista motivação intrínseca.", "Essa distinção acompanha a análise das diferentes teorias apresentadas na aula."], "memory": "É apresentada como um movimento interno que permanece mesmo diante de dificuldades. A pessoa incorporou determinado objetivo, construiu significado e não depende exclusivamente de recompensas externas para continuar."}, {"title": "Elton Mayo e os fatores psicológicos e sociais", "paras": ["Na reconstrução histórica estudada, Elton Mayo aparece ligado às experiências de Hawthorne e à percepção de que o comportamento e a produtividade não dependem somente das condições físicas de trabalho.", "A observação dos trabalhadores mostrou a importância de fatores psicológicos e sociais, como:", "- sentir-se observado;", "- sentir-se valorizado;", "- relações estabelecidas no ambiente;", "- formação de grupos;", "- normas criadas espontaneamente pelos próprios grupos.", "Grupos espontâneos", "Os trabalhadores formam relações e grupos que podem desenvolver suas próprias normas e influenciar o comportamento dos integrantes.", "A contribuição apresentada marca um avanço em relação a uma compreensão exclusivamente mecânica da produtividade, embora o professor ainda situe essa abordagem predominantemente na influência exercida pelo ambiente sobre o comportamento."], "memory": "Na reconstrução histórica estudada, Elton Mayo aparece ligado às experiências de Hawthorne e à percepção de que o comportamento e a produtividade não dependem somente das condições físicas de trabalho."}, {"title": "Maslow e a hierarquia das necessidades", "paras": ["Na sequência histórica, o professor apresenta Abraham Maslow e sua compreensão das necessidades humanas.", "A ideia central trabalhada é a existência de uma hierarquia de necessidades.", "A pirâmide representa essa organização porque sua base sustenta os níveis posteriores. Na explicação da aula, necessidades mais básicas precisam ser atendidas para permitir o avanço para necessidades superiores.", "O professor chama atenção especialmente para a diferença entre necessidades mais ligadas às condições externas e aquelas relacionadas ao desenvolvimento interno do indivíduo.", "O caso de Lucas, discutido anteriormente, exemplifica essa aplicação:", "Contrato instável → segurança afetada", "Isolamento e conflitos → necessidade social/de pertencimento afetada", "A teoria permite, portanto, identificar quais necessidades estão comprometidas em determinada situação."], "memory": "Na sequência histórica, o professor apresenta Abraham Maslow e sua compreensão das necessidades humanas."}, {"title": "Herzberg: fatores higiênicos e fatores motivacionais", "paras": ["O professor aproxima Herzberg da discussão sobre fatores externos e internos.", "Fatores higiênicos", "Relacionam-se às condições que cercam o trabalho. Na lógica apresentada durante a comparação das teorias, permanecem mais próximos da dimensão externa.", "Fatores motivacionais", "Aproximam-se da dimensão interna da motivação.", "O ponto principal da comparação realizada em sala é perceber que oferecer condições externas não equivale automaticamente a construir uma motivação intrínseca duradoura.", "Assim, salário, benefícios ou outras condições externas podem exercer influência, mas o professor alerta para não confundir essa influência com a motivação interna propriamente dita."], "memory": "O professor aproxima Herzberg da discussão sobre fatores externos e internos."}, {"title": "Skinner: estímulo, resposta e consequências", "paras": ["Na sequência apresentada, Skinner aparece relacionado à influência das consequências ambientais sobre o comportamento.", "A ideia trabalhada é:", "Estímulo → resposta → consequências", "O comportamento pode ser moldado pelas consequências produzidas no ambiente.", "A motivação é discutida, nesse momento da aula, ainda sob forte influência de elementos externos: modifica-se o ambiente e observa-se a resposta comportamental.", "Skinner para reforçar a evolução histórica das teorias e mostrar como, durante um longo período, grande parte das explicações ainda procurava compreender o que acontece ao redor da pessoa para modificar seu comportamento."], "memory": "Na sequência apresentada, Skinner aparece relacionado à influência das consequências ambientais sobre o comportamento."}, {"title": "Bandura: modelagem e autoeficácia", "paras": ["Na discussão de Bandura, o professor destaca dois elementos.", "Modelagem", "A pessoa observa alguém que alcançou determinado resultado e pode utilizar esse indivíduo como modelo.", "O exemplo apresentado é observar alguém que conseguiu alcançar uma carreira ou posição desejada e analisar o caminho percorrido por essa pessoa.", "O indivíduo passa a pensar:", "“Se aquela pessoa conseguiu chegar até lá, como ela fez?”", "A observação do modelo pode orientar a construção do próprio comportamento.", "Autoeficácia", "Está relacionada à crença da pessoa de que é capaz de realizar determinada ação ou alcançar determinado resultado.", "Assim, não basta simplesmente existir um modelo. A pessoa precisa desenvolver a crença de que também consegue agir em direção ao resultado pretendido."], "memory": "Na discussão de Bandura, o professor destaca dois elementos."}, {"title": "Vroom e a Teoria da Expectativa", "paras": ["Victor Vroom como um momento importante da discussão, porque o indivíduo passa a realizar um cálculo diante da situação.", "Na formulação trabalhada em sala:", "Expectativa × Instrumentalidade × Valência", "A motivação depende da relação entre esses elementos.", "O professor enfatiza que, se um deles for anulado, a motivação prevista pela teoria também é comprometida."], "memory": "Victor Vroom como um momento importante da discussão, porque o indivíduo passa a realizar um cálculo diante da situação."}, {"title": "Expectativa: comparação", "paras": ["Na explicação específica dada pelo professor nesta aula:", "Expectativa = comparação.", "A pessoa observa uma situação e compara possibilidades antes de agir.", "Ela analisa o que está diante dela e formula uma expectativa em relação à ação.", "Diferentes exemplos para demonstrar esse raciocínio, como aceitar um desafio profissional, realizar uma atividade ou avaliar uma oportunidade.", "Macete utilizado na aula:", "Expectativa → comparar."], "memory": "A pessoa observa uma situação e compara possibilidades antes de agir."}, {"title": "Instrumentalidade: caixa de ferramentas e competência", "paras": ["Na formulação utilizada pelo professor:", "Instrumentalidade = ferramentas/competências disponíveis para realizar aquilo.", "A pessoa se questiona:", "“Eu tenho competência para fazer isso?”", "A metáfora de uma caixa de ferramentas.", "Dentro dessa caixa estariam os conhecimentos, habilidades e recursos pessoais necessários para realizar a atividade.", "Assim:", "Instrumentalidade → instrumento → ferramentas → competência.", "No exemplo de uma promoção, a pessoa pode perguntar se possui as competências exigidas para assumir a nova função ou se precisará desenvolver novas capacidades."], "memory": "Instrumentalidade = ferramentas/competências disponíveis para realizar aquilo."}, {"title": "Valência: o valor da recompensa", "paras": ["Na explicação da aula:", "Valência = o valor atribuído ao que será obtido.", "A pergunta passa a ser:", "“O que eu vou ganhar com isso e isso vale a pena para mim?”", "Esse ganho não precisa ser apenas financeiro.", "Pode envolver:", "- satisfação;", "- aprendizagem;", "- experiência;", "- crescimento;", "- empregabilidade;", "- recursos financeiros.", "Duas pessoas podem receber exatamente a mesma proposta e atribuir valores diferentes a ela.", "Por isso, o mesmo resultado pode apresentar valências diferentes para indivíduos diferentes.", "Macete utilizado na aula:", "Valência → valor."], "memory": "Valência = o valor atribuído ao que será obtido."}, {"title": "O exemplo da promoção profissional", "paras": ["Uma promoção para demonstrar como diferentes pessoas podem raciocinar diante da mesma situação.", "Um funcionário recebe a possibilidade de assumir um cargo superior.", "Ele começa a analisar:", "Expectativa", "Compara a situação atual com aquilo que poderá acontecer ao aceitar a promoção.", "Instrumentalidade", "Questiona se possui as competências e ferramentas necessárias para exercer a nova função.", "Valência", "Avalia se aquilo que receberá em troca — salário, aprendizado, experiência ou empregabilidade — possui valor suficiente.", "Uma pessoa pode considerar que o aumento salarial não compensa o esforço necessário para adquirir novas competências.", "Outra pode aceitar a mesma proposta porque considera que o aprendizado adquirido aumentará sua empregabilidade futura.", "O contexto é o mesmo, mas o cálculo realizado pelos indivíduos é diferente."], "memory": "Uma promoção para demonstrar como diferentes pessoas podem raciocinar diante da mesma situação."}, {"title": "Vroom e a dependência dos três elementos", "paras": ["A aula reforça a relação multiplicativa entre os componentes apresentados:", "Expectativa × Instrumentalidade × Valência", "Se uma das dimensões for anulada, a motivação prevista pela teoria também é anulada.", "Exemplo:", "Uma pessoa pode considerar uma atividade extremamente recompensadora, mas acreditar que não possui as competências necessárias para realizá-la.", "Nesse caso, o valor da recompensa, sozinho, não seria suficiente.", "Da mesma forma, alguém pode acreditar que possui todas as competências necessárias, mas não perceber qualquer valor no resultado final.", "Por isso, a teor
