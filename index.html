dividuação na liderança servidora", "body": "Um aspecto destacado é que o líder servidor conhece as especificidades de cada integrante.\n\nEle não trata necessariamente todos de maneira idêntica.\n\nProcura compreender como cada pessoa funciona e quais são suas necessidades dentro da equipe.\n\nAssim, o líder consegue:\n\naproximar-se quando a pessoa precisa de apoio;\n\nafastar-se quando ela precisa de autonomia;\n\nreconhecer competências;\n\nadaptar sua interação às especificidades de cada integrante.\n\nO foco não está simplesmente em “tratar todos igualmente”, mas em compreender cada pessoa dentro do coletivo.", "key": "Um aspecto destacado é que o líder servidor conhece as especificidades de cada integrante."}, {"title": "O compromisso ético do Líder Servidor", "body": "Sua liderança tende a ser reconhecida naturalmente pelas pessoas, em vez de depender exclusivamente da imposição de um cargo.\n\nA equipe reconhece sua liderança pela maneira como ele se relaciona, participa e serve ao coletivo.\n\nEsse tipo de liderança favorece uma conexão mais profunda entre seus integrantes.", "key": "Sua liderança tende a ser reconhecida naturalmente pelas pessoas, em vez de depender exclusivamente da imposição de um cargo."}, {"title": "Grupo, Equipe e Time", "body": "Grupo\n\nExiste um conjunto de pessoas, mas com menor integração entre seus objetivos e ações.\n\nEquipe\n\nAs pessoas possuem um objetivo comum e trabalham para alcançá-lo.\n\nTime\n\nExiste uma integração ainda maior.\n\nO objetivo coletivo passa a ser incorporado pelos integrantes como parte de seus próprios objetivos.\n\nA diferença central apresentada entre equipe e time está na integralidade dos objetivos.\n\nEQUIPE → todos trabalham para o mesmo objetivo.\n\nTIME → o objetivo do coletivo passa a ser também um objetivo pessoal de seus integrantes.", "key": "EQUIPE → todos trabalham para o mesmo objetivo."}, {"title": "A interdependência no Time", "body": "No time, o integrante não considera seu trabalho concluído apenas porque alcançou sua própria meta.\n\nEle reconhece que seu resultado está ligado ao resultado dos demais.\n\nEm uma equipe, um vendedor pode atingir sua meta individual e considerar sua tarefa concluída.\n\nEm um time, ao atingir sua meta, ele procura quem ainda não alcançou o resultado e oferece apoio, contatos ou oportunidades para que o objetivo coletivo também seja atingido.\n\nAssim:\n\n“EU ATINGI MINHA META” → equipe\n\n“NÓS PRECISAMOS ATINGIR NOSSA META” → time\n\nO time apresenta maior integração e interdependência.", "key": "“NÓS PRECISAMOS ATINGIR NOSSA META” → time"}, {"title": "Líder Transformacional", "body": "O Líder Transformacional é caracterizado pela capacidade de produzir transformação nas pessoas e no coletivo.\n\ntransformar pessoas → transformar grupos em equipes → transformar equipes em times.\n\nSua atuação não se limita à manutenção da estrutura existente.\n\nEle desenvolve pessoas e amplia a integração do coletivo.", "key": "O Líder Transformacional é caracterizado pela capacidade de produzir transformação nas pessoas e no coletivo."}, {"title": "Liderança Transformacional e Liderança Matricial", "body": "Nesse modelo, pessoas de diferentes áreas podem ser reunidas para trabalhar em torno de um projeto.\n\nPor exemplo:\n\nfinanceiro;\n\nmarketing;\n\noperação;\n\noutras áreas organizacionais.\n\nEssas pessoas possuem conhecimentos e características diferentes, mas precisam ser integradas em torno de um mesmo projeto.\n\nO líder transformacional é apresentado como alguém capaz de agregar essas diferenças e conduzir pessoas de diferentes departamentos em direção ao objetivo coletivo.", "key": "O líder transformacional é apresentado como alguém capaz de agregar essas diferenças e conduzir pessoas de diferentes departamentos em direção ao objetivo coletivo."}, {"title": "O motor ético e moral da liderança transformacional", "body": "Na explicação do professor, a liderança transformacional apresenta como importante motor motivacional o nível moral e ético.\n\nIsso ajuda a diferenciá-la de uma liderança orientada exclusivamente por recompensas, punições ou trocas.\n\nO transformacional busca desenvolver e transformar o liderado e o próprio coletivo.", "key": "Na explicação do professor, a liderança transformacional apresenta como importante motor motivacional o nível moral e ético."}, {"title": "Líder Transacional", "body": "O Líder Transacional atua principalmente pela lógica da troca.\n\nA relação pode ser resumida como:\n\nRESULTADO ↔ RECOMPENSA\n\nExiste negociação: determinada entrega está associada a determinada contrapartida.\n\nPortanto:\n\nTRANSACIONAL = TROCA / NEGOCIAÇÃO\n\nTRANSFORMACIONAL = TRANSFORMAÇÃO / DESENVOLVIMENTO\n\nEssa diferença é central para não confundir os dois conceitos.\n\nPODER POSICIONAL\n→ Coerção + Recompensa + Legitimidade\n→ elementos extrínsecos\n→ concentração da autoridade\n→ aproximação com liderança autocrática\n\nPODER PESSOAL\n→ Referência + Especialista\n→ aproximação com motivação intrínseca\n→ Autodeterminação / Motivação 3.0\n→ autonomia e competência\n→ liderança democrática / servidora\n\nPODER RELACIONAL\n→ Informação + Conexão\n→ análise depende da intenção de uso\n\nLÍDER SERVIDOR\n→ serve + escuta + conhece cada integrante\n→ autonomia quando possível + proximidade quando necessária\n→ individuação\n\nGRUPO → EQUIPE → TIME\n→ aumento da integração\n→ objetivo comum\n→ interdependência\n\nLÍDER TRANSACIONAL\n→ troca e negociação\n\nLÍDER TRANSFORMACIONAL\n→ transforma pessoas e coletivos\n→ grupo → equipe → time\n→ pode integrar diferentes áreas\n→ dimensão ética e moral", "key": "Essa diferença é central para não confundir os dois conceitos."}], "case": "Uma gerente coordena profissionais de diferentes setores em um projeto. Ela conhece as competências de cada integrante, estabelece objetivos claros e concede autonomia para a execução, sem realizar microgerenciamento. Quando um integrante termina sua parte, é incentivado a apoiar os demais, pois o resultado só é considerado alcançado quando todo o coletivo chega ao objetivo. A gerente também utiliza seu conhecimento como referência e procura desenvolver os profissionais para que assumam responsabilidades cada vez maiores. Na lógica trabalhada na aula, essa situação apresenta elementos de Poder Pessoal, autonomia, formação de time e características de uma liderança servidora e transformacional."}, "12": {"title": "Liderança Situacional: Tarefa, Relacionamento, Competência e Delegação", "blocks": [{"title": "O princípio da Liderança Situacional", "body": "A Liderança Situacional parte da análise da relação entre líder, liderado e tarefa.\n\nO líder não deve agir da mesma maneira em todas as circunstâncias.\n\nAntes de definir seu comportamento, precisa compreender a situação em que aquele liderado se encontra.\n\nPara isso, observa elementos como:\n\n- a competência do liderado;\n\n- sua autonomia;\n\n- seu envolvimento com a tarefa;\n\n- sua situação motivacional naquele momento;\n\n- a tarefa ou missão que precisa ser realizada;\n\n- o contexto em que essa tarefa será executada.\n\nA ideia central é que o comportamento do líder deve ser ajustado à situação encontrada.\n\nLIDERADO + TAREFA + SITUAÇÃO → COMPORTAMENTO DO LÍDER", "key": "A ideia central é que o comportamento do líder deve ser ajustado à situação encontrada."}, {"title": "Perspectiva e expectativa", "body": "Expectativa\n\nÉ aquilo que se espera que aconteça.\n\nNa explicação utilizada em aula, corresponde a um olhar direcionado “para fora”, para algo que ainda é esperado.\n\nPerspectiva\n\nCorresponde a olhar “para dentro” da situação, procurando compreender os elementos que já estão presentes e como eles se relacionam.\n\nAo estudar o gráfico da Liderança Situacional, a proposta é desenvolver uma perspectiva: analisar aquilo que o modelo mostra e compreender a relação entre tarefa, relacionamento e situação do liderado.", "key": "Na explicação utilizada em aula, corresponde a um olhar direcionado “para fora”, para algo que ainda é esperado."}, {"title": "Os dois eixos da Liderança Situacional", "body": "O gráfico trabalhado em aula utiliza dois elementos fundamentais:\n\nTarefa\n\nRepresenta aquilo que precisa ser realizado: o fazer, a missão, a atividade ou o resultado esperado.\n\nO comportamento de tarefa pode ser:\n\nAlto → o líder precisa fornecer maior direcionamento sobre o que deve ser feito;\n\nBaixo → o liderado já domina a tarefa e exige menor direcionamento.\n\nRelacionamento\n\nRepresenta o nível de proximidade e acompanhamento necessário entre líder e liderado.\n\nPode ser:\n\nAlto → o líder mantém maior proximidade, conversa, acompanha, orienta ou apoia;\n\nBaixo → a necessidade dessa proximidade é menor.\n\nA combinação desses dois eixos origina os quatro comportamentos estudados:\n\nS1 — Direcionador\n\nTarefa alta + relacionamento baixo.\n\nS2 — Orientador\n\nTarefa alta + relacionamento alto.\n\nS3 — Apoiador\n\nTarefa baixa + relacionamento alto.\n\nS4 — Delegador\n\nTarefa baixa + relacionamento baixo.", "key": "Alto → o líder precisa fornecer maior direcionamento sobre o que deve ser feito;"}, {"title": "S1: Perfil Direcionador", "body": "No perfil direcionador, a principal preocupação do líder está na tarefa.\n\nTAREFA ALTA + RELACIONAMENTO BAIXO\n\nO liderado pode estar chegando naquele contexto e ainda não conhece suficientemente:\n\n- as regras;\n\n- os procedimentos;\n\n- as diretrizes;\n\n- os objetivos;\n\n- os padrões esperados;\n\n- a maneira específica de realizar aquela atividade.\n\nPor isso, o líder precisa fornecer direcionamento.\n\nNesse momento, a prioridade não é construir uma relação intensa, mas garantir que o liderado compreenda aquilo que precisa executar.", "key": "Nesse momento, a prioridade não é construir uma relação intensa, mas garantir que o liderado compreenda aquilo que precisa executar."}, {"title": "O exemplo do marceneiro", "body": "Ele já sabe fabricar cadeiras e possui competência profissional.\n\nEntretanto, acabou de chegar a uma nova empresa e ainda não sabe produzir o modelo específico de cadeira daquela organização.\n\nO líder já sabe que ele é marceneiro e possui conhecimento técnico, mas ainda precisa apresentar:\n\n- os projetos utilizados;\n\n- os padrões da empresa;\n\n- os objetivos;\n\n- as diretrizes;\n\n- a forma como aquela tarefa deve ser executada naquele contexto.\n\nPortanto, possuir competência profissional não significa automaticamente dominar uma tarefa específica em uma nova organização.\n\nNesse primeiro momento:\n\nO líder direciona porque o liderado precisa conhecer como aquela tarefa deve ser executada naquele contexto.", "key": "O líder já sabe que ele é marceneiro e possui conhecimento técnico, mas ainda precisa apresentar:"}, {"title": "S2: Perfil Orientador", "body": "Depois que o liderado avança, o comportamento do líder também pode mudar.\n\nNo perfil orientador:\n\nTAREFA ALTA + RELACIONAMENTO ALTO\n\nO líder ainda acompanha a execução da tarefa porque ela continua exigindo atenção, mas já existe uma relação maior com o liderado.\n\nEle pode perguntar:\n\n- Como está realizando a atividade?\n\n- Está utilizando os equipamentos corretamente?\n\n- Encontrou alguma dificuldade?\n\n- O resultado está dentro do esperado?\n\nAgora não existe apenas direcionamento. Existe também maior interação.\n\nO líder continua preocupado com a execução, mas passa a orientar e acompanhar mais proximamente o desenvolvimento do liderado.", "key": "Depois que o liderado avança, o comportamento do líder também pode mudar."}, {"title": "S3: Perfil Apoiador", "body": "No perfil apoiador, ocorre uma mudança importante:\n\nTAREFA BAIXA + RELACIONAMENTO ALTO\n\nNesse momento, o líder já sabe que o liderado conhece a tarefa.\n\nEle já demonstrou anteriormente que possui competência para realizá-la.\n\nPor isso, o líder não precisa permanecer explicando continuamente como fazer.\n\nA necessidade maior passa para o relacionamento.\n\nO líder procura:\n\n- permanecer próximo;\n\n- apoiar;\n\n- oferecer feedback;\n\n- perceber inseguranças;\n\n- acompanhar o estado motivacional;\n\n- ajudar diante de alguma dificuldade.\n\nA preocupação deixa de estar concentrada na execução técnica e passa para o apoio ao liderado.\n\nEle já sabe fazer → não preciso ensinar novamente → preciso apoiá-lo quando necessário.", "key": "Ele já sabe fazer → não preciso ensinar novamente → preciso apoiá-lo quando necessário."}, {"title": "Competência não elimina momentos de insegurança", "body": "Mesmo uma pessoa competente pode apresentar insegurança ou passar por uma dificuldade.\n\nIsso não significa automaticamente que ela deixou de saber executar a tarefa.\n\nComo o líder já possui evidências anteriores de que o profissional sabe realizar aquela atividade, sua resposta pode ser oferecer feedback e apoio, acompanhando temporariamente a situação.\n\nPortanto, é necessário distinguir:\n\nNão saber fazer\n\nDe\n\nSaber fazer, mas precisar de apoio naquele momento.\n\nEssa leitura é importante para escolher o comportamento de liderança adequado.", "key": "Isso não significa automaticamente que ela deixou de saber executar a tarefa."}, {"title": "S4: Perfil Delegador", "body": "O último comportamento apresentado é o delegador.\n\nTAREFA BAIXA + RELACIONAMENTO BAIXO\n\nNesse estágio, o liderado:\n\n- conhece a tarefa;\n\n- possui competência;\n\n- apresenta autonomia;\n\n- já percorreu um processo de desenvolvimento;\n\n- não necessita de acompanhamento constante.\n\nO líder pode entregar a missão e permitir que o trabalho seja realizado com autonomia.\n\nIsso não significa desaparecer completamente.\n\nO líder ainda pode verificar indicadores e acompanhar os resultados, mas não precisa permanecer constantemente ao lado do liderado.", "key": "O último comportamento apresentado é o delegador."}, {"title": "Delegar não é “delargar”", "body": "DELEGAR ≠ “DELARGAR”\n\nLíder que não delega\n\nCentraliza tudo porque não consegue confiar ou permitir que outras pessoas assumam responsabilidades.\n\nLíder que “delarga”\n\nEntrega atividades sem ter realizado anteriormente o processo necessário de direcionamento, orientação e apoio.\n\nNesse segundo caso, o líder chama sua atitude de delegação, mas o liderado pode não estar preparado para assumir aquela responsabilidade.\n\nA delegação adequada aparece depois de um processo:\n\nDIRECIONAR → ORIENTAR → APOIAR → DELEGAR", "key": "DIRECIONAR → ORIENTAR → APOIAR → DELEGAR"}, {"title": "O exemplo das 400 cadeiras", "body": "Imagine que a equipe receba uma encomenda de 400 cadeiras para serem produzidas em 10 dias.\n\nSe os profissionais já conhecem:\n\n- o modelo;\n\n- o processo;\n\n- a organização;\n\n- suas responsabilidades;\n\n- a maneira de executar o trabalho;\n\nO líder não precisa explicar novamente cada etapa.\n\nEle pode apresentar a missão, combinar a meta e permitir que a equipe execute.\n\nDepois, acompanha pontualmente:\n\n“Como está nossa meta?”\n\n“Estamos conseguindo produzir a quantidade diária necessária?”\n\nEsse acompanhamento não elimina a delegação.\n\nO líder apenas não realiza microgerenciamento porque a equipe já possui condições para trabalhar com autonomia.", "key": "Imagine que a equipe receba uma encomenda de 400 cadeiras para serem produzidas em 10 dias."}, {"title": "A Liderança Situacional exige leitura individualizada", "body": "Não existe uma única resposta adequada para todos os liderados.\n\nA mesma pessoa pode inclusive necessitar de comportamentos diferentes do líder conforme:\n\n- a tarefa;\n\n- sua competência naquela atividade;\n\n- sua autonomia;\n\n- seu envolvimento;\n\n- seu momento motivacional.\n\nPor isso, a Liderança Situacional exige uma análise individualizada.\n\nNão se escolhe S1, S2, S3 ou S4 apenas pela personalidade do líder.\n\nO comportamento deve ser escolhido a partir da situação entre liderado e tarefa.", "key": "Não existe uma única resposta adequada para todos os liderados."}, {"title": "Competência e autonomia modificam a atuação do líder", "body": "À medida que aumentam a competência e a autonomia do liderado, diminui a necessidade de direcionamento constante.\n\nS1 — Direcionar\n\n“Vou mostrar o que precisa ser feito.”\n\nS2 — Orientar\n\n“Você já avançou, mas ainda vou acompanhar e orientar.”\n\nS3 — Apoiar\n\n“Você sabe fazer; agora meu papel principal é apoiá-lo.”\n\nS4 — Delegar\n\n“Você possui competência e autonomia para assumir essa responsabilidade.”\n\nO objetivo é que o líder reconheça em qual situação o liderado está antes de decidir como agir.", "key": "“Você sabe fazer; agora meu papel principal é apoiá-lo.”"}, {"title": "Liderança Situacional e os estilos estudados anteriormente", "body": "Um líder pode apresentar uma tendência predominante — democrática, autocrática, servidora ou transformacional — e, ao mesmo tempo, demonstrar determinado comportamento dentro da Liderança Situacional.\n\nIsso significa que os conceitos não devem ser confundidos.\n\nEstilo predominante do líder e comportamento situacional diante de uma tarefa/liderado são leituras diferentes.\n\nUma pessoa pode ter características democráticas e, diante de alguém que precisa de muito direcionamento, utilizar S1.", "key": "Isso significa que os conceitos não devem ser confundidos."}, {"title": "Liderança Transformacional e o perfil Apoiador", "body": "O líder transformacional foi retomado como aquele que:\n\n- inspira;\n\n- compartilha;\n\n- agrega;\n\n- acompanha;\n\n- observa o estado motivacional;\n\n- permanece próximo das pessoas.\n\nQuando a tarefa já é dominada pelo liderado, essas características podem aparecer em uma atuação mais próxima do S3 — Apoiador, com menor preocupação em ensinar a tarefa e maior atenção à relação.\n\nIsso não significa que “transformacional = apoiador” em todas as situações.\n\nA atividade mostra como uma tendência de liderança pode aparecer na forma como a pessoa prefere agir diante dos liderados.", "key": "Quando a tarefa já é dominada pelo liderado, essas características podem aparecer em uma atuação mais próxima do S3 — Apoiador, com menor preocupação em ensinar a tarefa e maior atenção à relação."}, {"title": "Autoconhecimento e tendência de liderança", "body": "a pessoa pode escolher aquilo que gostaria de ser, em vez daquilo que realmente costuma fazer.\n\nPor isso, é necessário responder considerando o comportamento efetivo:\n\n“Como eu realmente ajo nessa situação?”\n\nE não:\n\n“Qual seria a resposta que parece mais correta?”\n\nO exercício de autoconhecimento ajuda a identificar tendências, mas a Liderança Situacional exige que o líder consiga ir além de sua preferência pessoal e faça a leitura da situação.\n\nLIDERANÇA SITUACIONAL\n\n→ analisar liderado + tarefa + situação\n\n→ competência\n\n→ autonomia\n\n→ envolvimento/motivação\n\n→ necessidade de direcionamento e relacionamento\n\nS1 — DIRECIONADOR\n\n→ tarefa alta\n\n→ relacionamento baixo\n\n→ fornecer diretrizes\n\nS2 — ORIENTADOR\n\n→ tarefa alta\n\n→ relacionamento alto\n\n→ orientar + acompanhar\n\nS3 — APOIADOR\n\n→ tarefa baixa\n\n→ relacionamento alto\n\n→ apoiar + feedback + proximidade\n\nS4 — DELEGADOR\n\n→ tarefa baixa\n\n→ relacionamento baixo\n\n→ autonomia + acompanhamento pontual\n\nDIRECIONAR → ORIENTAR → APOIAR → DELEGAR\n\nREGRA CENTRAL\n\nDelegar não é abandonar.\n\nA delegação pressupõe que o liderado tenha condições para assumir aquela responsabilidade.", "key": "Por isso, é necessário responder considerando o comportamento efetivo:"}], "case": "Uma empresa contrata Rafael, marceneiro com vários anos de experiência. Embora saiba fabricar móveis, ele nunca trabalhou com os modelos utilizados pela nova empresa. Inicialmente, o líder apresenta projetos, padrões e procedimentos e acompanha sua execução. Depois de algum tempo, Rafael já conhece o processo, mas ainda recebe orientação e acompanhamento. Mais tarde, demonstra domínio completo da tarefa, embora em determinado período apresente insegurança e precise de apoio e feedback. Após consolidar sua autonomia, recebe sozinho a responsabilidade por novas encomendas, enquanto o líder acompanha apenas metas e resultados. O caso representa a lógica da Liderança Situacional: S1 Direcionar → S2 Orientar → S3 Apoiar → S4 Delegar, conforme mudam a competência, a autonomia e as necessidades do liderado diante da tarefa."}, "13": {"title": "Revisão do Ecossistema da Liderança: Poder, Estilos e Modelos de Liderança", "blocks": [{"title": "O ecossistema da liderança", "body": "A proposta é compreender os conceitos de maneira integrada, conectando motivação, poder e formas de atuação do líder.\n\nNesse conjunto aparecem:\n\n- conceito de líder e poder;\n\n- matrizes de motivação;\n\n- bases e tipologias de poder;\n\n- relação entre poder e motivação;\n\n- liderança autocrática, democrática e liberal;\n\n- liderança transacional;\n\n- liderança transformacional;\n\n- liderança servidora;\n\n- liderança situacional.\n\nO objetivo não é apenas reconhecer os nomes, mas compreender de onde vem a influência do líder, como ele exerce essa influência e quais comportamentos aparecem na relação com os liderados.", "key": "A proposta é compreender os conceitos de maneira integrada, conectando motivação, poder e formas de atuação do líder."}, {"title": "Bases de poder e comportamento de liderança", "body": "A posição formal ocupada por uma pessoa não determina, sozinha, a maneira como ela irá liderar.\n\nUm profissional pode possuir poder legítimo porque ocupa formalmente determinado cargo e, mesmo assim, adotar uma atuação democrática.\n\nPor isso, é necessário distinguir:\n\nBase de poder\n\n→ indica de onde vem a possibilidade de influência.\n\nEstilo ou modelo de liderança\n\n→ indica como o líder atua diante das pessoas e das situações.\n\nEssa distinção permite compreender por que dois gestores que ocupam cargos semelhantes podem liderar de maneiras completamente diferentes.", "key": "→ indica de onde vem a possibilidade de influência."}, {"title": "Liderança Autocrática", "body": "Na liderança autocrática, o poder permanece fortemente centralizado no líder.\n\nO poder legítimo aparece com destaque porque a autoridade está relacionada à posição ocupada na estrutura organizacional.\n\nO líder utiliza sua autoridade para manter a centralização das decisões e exercer controle sobre a execução.\n\n- centralização;\n\n- autoridade;\n\n- controle;\n\n- baixa tolerância;\n\n- preocupação com a execução;\n\n- microgerenciamento.\n\nO líder tende a decidir e determinar aquilo que deverá ser realizado.\n\nAUTOCRÁTICO → centralização + autoridade + controle", "key": "AUTOCRÁTICO → centralização + autoridade + controle"}, {"title": "Poder legítimo não significa necessariamente liderança autocrática", "body": "Um ponto importante da revisão é que possuir poder legítimo não transforma automaticamente alguém em líder autocrático.\n\nUma pessoa pode ter sido:\n\n- promovida;\n\n- contratada para uma função de gestão;\n\n- formalmente colocada naquela posição.\n\nConsequentemente, possui autoridade decorrente do cargo.\n\nEntretanto, na prática, pode ouvir sua equipe, compartilhar decisões e incentivar a participação.\n\nNesse caso, existe poder legítimo decorrente da posição, mas o comportamento pode ser democrático.\n\nPortanto:\n\nCARGO ≠ ESTILO DE LIDERANÇA", "key": "Um ponto importante da revisão é que possuir poder legítimo não transforma automaticamente alguém em líder autocrático."}, {"title": "Liderança Democrática", "body": "O líder democrático trabalha de maneira mais participativa e compartilhada.\n\nEle procura incluir outras pessoas nas discussões e decisões, atuando como moderador dos debates e favorecendo a construção de consenso.\n\n- escuta ativa;\n\n- participação;\n\n- empatia;\n\n- flexibilidade;\n\n- tolerância à pluralidade;\n\n- compartilhamento das decisões;\n\n- abertura a diferentes pontos de vista.\n\nAssim, o líder precisa reconhecer que sua própria interpretação não constitui necessariamente uma verdade absoluta.\n\nDEMOCRÁTICO → ouvir + compartilhar + construir decisões", "key": "DEMOCRÁTICO → ouvir + compartilhar + construir decisões"}, {"title": "Liderança Liberal", "body": "Na liderança liberal, existe baixa intervenção do líder na condução cotidiana das atividades.\n\nNa forma discutida em aula, esse líder pode simplesmente entregar uma atividade e deixar que os outros resolvam.\n\nÉ nesse contexto que aparece novamente a distinção entre:\n\nDelegar\n\nE\n\n“delargar”.\n\nQuando existe apenas entrega da responsabilidade, sem acompanhamento, orientação ou preparação adequada, o líder não está necessariamente realizando uma delegação estruturada.\n\nEntre as características mencionadas estão:\n\n- baixa intervenção;\n\n- alta dependência da iniciativa de terceiros;\n\n- neutralidade;\n\n- acompanhamento reduzido;\n\n- entrega das demandas aos outros.\n\nLIBERAL → pouca intervenção + elevada autonomia deixada aos demais", "key": "LIBERAL → pouca intervenção + elevada autonomia deixada aos demais"}, {"title": "Liderança Servidora", "body": "A liderança servidora é caracterizada pela forte disposição do líder para servir e permanecer próximo das pessoas e da operação.\n\n- poder moral;\n\n- relações;\n\n- referência;\n\n- altruísmo;\n\n- humildade;\n\n- disposição para ajudar;\n\n- proximidade com as pessoas;\n\n- preocupação com o processo e com os liderados.\n\nO líder servidor procura contribuir para que as pessoas consigam realizar seu trabalho.\n\nservir não significa fazer tudo no lugar do outro.", "key": "A liderança servidora é caracterizada pela forte disposição do líder para servir e permanecer próximo das pessoas e da operação."}, {"title": "O risco do excesso na liderança servidora", "body": "O líder servidor pode ultrapassar o limite de sua atuação quando começa a assumir continuamente as tarefas dos próprios liderados.\n\nSobrecarga do próprio líder\n\nQuando o líder permanece constantemente na operação, assumindo tarefas que poderiam ser realizadas pelos colaboradores, aumenta sua própria carga de trabalho e pode gerar estresse.\n\nAlém disso, perde tempo que poderia utilizar para pensar estrategicamente.\n\nRedução da oportunidade de desenvolvimento do liderado\n\nAo fazer continuamente pelo outro, o líder retira da pessoa a oportunidade de:\n\n- aprender;\n\n- tentar;\n\n- executar;\n\n- desenvolver competência;\n\n- assumir responsabilidade;\n\n- construir autonomia.\n\nAssim:\n\nSERVIR ≠ SUBSTITUIR O LIDERADO\n\nO papel do líder pode envolver orientar, ensinar, apoiar e acompanhar sem necessariamente executar a tarefa pelo colaborador.", "key": "O líder servidor pode ultrapassar o limite de sua atuação quando começa a assumir continuamente as tarefas dos próprios liderados."}, {"title": "Perfeccionismo e dificuldade de delegar", "body": "“Se eu não fizer, não fica certo.”\n\nOu:\n\n“Precisa ser feito do meu jeito.”\n\nO perfeccionismo pode levar o líder a assumir novamente as tarefas porque acredita que conseguirá executá-las melhor ou mais rapidamente.\n\nIsso cria um ciclo:\n\nCentralização → sobrecarga → falta de tempo para ensinar → colaborador não desenvolve autonomia → nova centralização\n\nO problema se intensifica quando o treinamento acontece apenas em momentos de urgência.\n\nO líder precisa de resultado rápido, não consegue esperar o processo de aprendizagem e acaba realizando a atividade sozinho.\n\nComo consequência, podem surgir:\n\n- estresse;\n\n- insatisfação;\n\n- dificuldade de desenvolvimento;\n\n- atraso;\n\n- sobrecarga;\n\n- repetição do problema.", "key": "Centralização → sobrecarga → falta de tempo para ensinar → colaborador não desenvolve autonomia → nova centralização"}, {"title": "O valor do “imperfeito feito” no desenvolvimento", "body": "permitir que outra pessoa faça uma atividade também significa aceitar que, inicialmente, ela talvez não a execute exatamente da maneira como o líder faria.\n\nInterferir continuamente para corrigir cada pequeno detalhe pode impedir o processo de aprendizagem.\n\nA liderança precisa reconhecer limites entre:\n\nAcompanhar e desenvolver\n\nE\n\nControlar e substituir.\n\nPermitir a execução, orientar e corrigir quando necessário cria oportunidades para que a pessoa desenvolva competência e autonomia.", "key": "permitir que outra pessoa faça uma atividade também significa aceitar que, inicialmente, ela talvez não a execute exatamente da maneira como o líder faria."}, {"title": "Liderança Transformacional", "body": "A liderança transformacional é apresentada como aquela capaz de provocar desenvolvimento e transformação.\n\nSua influência está associada a elementos como:\n\n- referência;\n\n- confiança;\n\n- autoridade moral;\n\n- visão de futuro;\n\n- mobilização;\n\n- desenvolvimento;\n\n- transformação dos padrões existentes.\n\nAs pessoas reconhecem a liderança porque confiam naquele líder e encontram nele uma referência.\n\nTRANSFORMACIONAL → desenvolver + inspirar + transformar", "key": "A liderança transformacional é apresentada como aquela capaz de provocar desenvolvimento e transformação."}, {"title": "Os quatro movimentos da Liderança Transformacional", "body": "Influência idealizada\n\nO líder funciona como referência e procura compreender aquilo que pode mobilizar o liderado.\n\nSua atuação produz confiança e reconhecimento.\n\nMotivação inspiracional\n\nO líder ajuda a pessoa a olhar para frente e perceber:\n\n- objetivos;\n\n- propósito;\n\n- missão;\n\n- possibilidades futuras.\n\nEle procura identificar aquilo que pode ser estimulado internamente no liderado e utiliza estímulos coerentes com essa leitura.\n\nEstimulação intelectual\n\nO líder desafia a pessoa a pensar.\n\nEle não aceita necessariamente a primeira resposta e apresenta outras possibilidades para que o liderado amplie sua forma de compreender e resolver problemas.\n\nESTIMULAÇÃO INTELECTUAL → questionar + pensar + descobrir outros caminhos\n\nConsideração individualizada\n\nO líder procura compreender cada pessoa de maneira particular.\n\nNão trabalha apenas com uma visão genérica da equipe.\n\nFaz uma leitura das necessidades e características de cada liderado.", "key": "ESTIMULAÇÃO INTELECTUAL → questionar + pensar + descobrir outros caminhos"}, {"title": "A organização como organismo vivo", "body": "A empresa é apresentada como um organismo vivo.\n\nAssim como diferentes sistemas funcionam simultaneamente no organismo humano, muitos processos acontecem ao mesmo tempo dentro de uma organização.\n\nNem tudo pode ser observado ou controlado diretamente pelo líder.\n\nPor isso existem:\n\n- sistemas de gestão;\n\n- processos de acompanhamento;\n\n- indicadores;\n\n- mecanismos de controle e avaliação.\n\nAo mesmo tempo, conhecer individualmente os liderados é desafiador justamente porque a organização possui múltiplos acontecimentos e relações funcionando simultaneamente.\n\nEssa complexidade torna a consideração individualizada especialmente importante e difícil.", "key": "A empresa é apresentada como um organismo vivo."}, {"title": "Humildade intelectual na liderança", "body": "Humildade intelectual.\n\nConhecimento e inteligência emocional são importantes, mas ouvir o outro exige também controlar:\n\n- orgulho;\n\n- ego;\n\n- necessidade de estar sempre certo.\n\nA falta de humildade pode impedir o líder de considerar perspectivas diferentes e gerar conflitos interpessoais.\n\nPortanto:\n\nHUMILDADE INTELECTUAL → reconhecer limites próprios + ouvir o outro + permitir outras perspectivas", "key": "HUMILDADE INTELECTUAL → reconhecer limites próprios + ouvir o outro + permitir outras perspectivas"}, {"title": "Liderança Transacional", "body": "A palavra central da liderança transacional é:\n\nTROCA.\n\nO líder estabelece uma relação em que determinada ação está associada a uma contrapartida.\n\nA base de poder de recompensa aparece com destaque nessa dinâmica.\n\nA lógica pode ser representada como:\n\n“Eu ofereço algo → espero algo em troca.”\n\nEssa troca pode envolver:\n\n- recompensa;\n\n- desempenho;\n\n- permanência;\n\n- lealdade;\n\n- cumprimento de determinado compromisso.", "key": "“Eu ofereço algo → espero algo em troca.”"}, {"title": "Exemplo de Liderança Transacional", "body": "Imagine que um funcionário queira cursar uma faculdade e solicite apoio financeiro da empresa.\n\nA organização concorda em pagar parte dos estudos, mas estabelece como condição que o trabalhador permaneça na empresa por determinado período.\n\nExiste uma troca explícita:\n\nEMPRESA → financia a formação\n\nTRABALHADOR → assume compromisso de permanência\n\nEssa relação exemplifica a lógica transacional apresentada em aula.", "key": "TRABALHADOR → assume compromisso de permanência"}, {"title": "Transformacional × Transacional", "body": "Transacional\n\nExiste uma troca.\n\n“Eu ofereço algo e espero uma contrapartida.”\n\nTransformacional\n\nO foco está no desenvolvimento da pessoa, sem colocar necessariamente uma troca como condição para esse desenvolvimento.\n\nO exemplo utilizado é o treinamento.\n\nUma organização com postura transformacional pode qualificar um trabalhador mesmo reconhecendo que, futuramente, ele poderá sair da empresa.\n\nA lógica apresentada é:\n\n“Prefiro desenvolver uma pessoa, gerar qualificação e empregabilidade, mesmo que futuramente ela saia, do que manter alguém sem desenvolvimento.”\n\nAssim:\n\nTRANSACIONAL → troca\n\nTRANSFORMACIONAL → desenvolvimento e transformação", "key": "O exemplo utilizado é o treinamento."}, {"title": "Liderança Situacional", "body": "A Liderança Situacional é retomada como o modelo que exige a adequação do comportamento do líder conforme o momento de desenvolvimento do liderado.\n\nO líder modula:\n\n- comportamento de tarefa;\n\n- comportamento de relacionamento;\n\nDe acordo com a situação encontrada.\n\nPara isso, precisa desenvolver características como:\n\n- sensibilidade diagnóstica;\n\n- capacidade de leitura;\n\n- paciência;\n\n- criatividade;\n\n- versatilidade.\n\nO desafio está justamente em compreender que pessoas diferentes — ou a mesma pessoa diante de tarefas diferentes — podem exigir atuações diferentes.", "key": "A Liderança Situacional é retomada como o modelo que exige a adequação do comportamento do líder conforme o momento de desenvolvimento do liderado."}, {"title": "Integração dos modelos", "body": "É necessário reconhecer a lógica predominante de cada um:\n\nAUTOCRÁTICO\n\n→ autoridade + centralização + controle.\n\nDEMOCRÁTICO\n\n→ participação + escuta + compartilhamento.\n\nLIBERAL\n\n→ baixa intervenção + autonomia elevada deixada aos demais.\n\nSERVIDOR\n\n→ servir + proximidade + desenvolvimento, com cuidado para não substituir o liderado.\n\nTRANSACIONAL\n\n→ troca + negociação + recompensa/contrapartida.\n\nTRANSFORMACIONAL\n\n→ inspiração + desenvolvimento + transformação.\n\nSITUACIONAL\n\n→ adequação do comportamento conforme liderado + tarefa + situação.\n\nECOSSISTEMA DA LIDERANÇA\n\nPODER\n\n→ de onde vem a capacidade de influência\n\nESTILO/MODELO DE LIDERANÇA\n\n→ como essa influência é exercida\n\nAUTOCRÁTICA\n\n→ centraliza\n\nDEMOCRÁTICA\n\n→ compartilha\n\nLIBERAL\n\n→ intervém pouco\n\nSERVIDORA\n\n→ serve e desenvolve\n\nservir não é fazer tudo pelo outro\n\nTRANSACIONAL\n\n→ troca\n\nTRANSFORMACIONAL\n\n→ transforma e desenvolve\n\n→ influência idealizada\n\n→ motivação inspiracional\n\n→ estimulação intelectual\n\n→ consideração individualizada\n\nSITUACIONAL\n\n→ diagnostica e adapta\n\n→ tarefa + relacionamento + desenvolvimento do liderado", "key": "→ autoridade + centralização + controle."}], "case": "Uma gerente é reconhecida pela equipe como competente e disponível, mas costuma assumir pessoalmente as tarefas sempre que percebe que alguém está demorando ou executando de maneira diferente da sua. Ela afirma que prefere “fazer logo” para garantir que tudo fique perfeito. Com isso, permanece sobrecarregada, tem pouco tempo para atividades estratégicas e seus colaboradores continuam recorrendo a ela sempre que encontram dificuldades. O caso demonstra que a disposição para servir pode perder sua função de desenvolvimento quando o líder substitui continuamente o liderado: ao fazer pelo outro, aumenta sua própria sobrecarga e reduz as oportunidades de aprendizagem e construção de autonomia da equipe."}, "14": {"title": "Relações Interpessoais, Arquitetura das Atitudes e Contrato Psicológico", "blocks": [{"title": "Relações interpessoais", "body": "As relações interpessoais envolvem os vínculos e as interações estabelecidos entre as pessoas.\n\nQuando pensamos em relações, aparecem elementos como:\n\ninteração;\n\nvínculo;\n\nconexão;\n\nrede de relacionamentos;\n\nnetwork.\n\nDentro das organizações, ninguém atua completamente isolado.\n\nAs pessoas estabelecem conexões que interferem na maneira como trabalham, aprendem, lideram, cooperam e percebem o ambiente.\n\nPor isso, compreender as relações interpessoais exige uma visão sistêmica, conectando esse novo conteúdo aos conhecimentos estudados anteriormente.", "key": "As relações interpessoais envolvem os vínculos e as interações estabelecidos entre as pessoas."}, {"title": "Pensamento sistêmico: conectando os conteúdos", "body": "Para compreendê-las, é necessário recuperar conhecimentos já construídos, como:\n\necossistema da aprendizagem;\n\nteorias motivacionais;\n\nbases de poder;\n\ncaracterísticas e atributos do líder;\n\nestilos de liderança;\n\nliderança situacional;\n\nliderança transacional;\n\nliderança transformacional.\n\nA relação entre pessoas atravessa todos esses conteúdos.\n\nPENSAMENTO SISTÊMICO → conectar os conceitos em vez de analisá-los isoladamente", "key": "Para compreendê-las, é necessário recuperar conhecimentos já construídos, como:"}, {"title": "Relações interpessoais e ambiente de trabalho", "body": "O ambiente organizacional interfere nas relações que são construídas.\n\nQuando existem condições favoráveis às boas relações, as interações podem ser facilitadas.\n\nQuando o ambiente é desfavorável, podem surgir dificuldades relacionais.\n\nAssim:\n\nAMBIENTE ↔ RELAÇÕES INTERPESSOAIS\n\nO comportamento das pessoas não deve ser analisado sem considerar o contexto em que essas relações acontecem.", "key": "Quando o ambiente é desfavorável, podem surgir dificuldades relacionais."}, {"title": "Relações interpessoais e bases de poder", "body": "As bases de poder também ajudam a compreender as relações interpessoais.\n\nTambém aparece a base de referência, na qual a pessoa se torna uma referência capaz de gerar identificação e inspiração.\n\nPortanto, o poder não se manifesta apenas pela posição formal.\n\nAs próprias relações construídas entre as pessoas podem participar da capacidade de influência.", "key": "As bases de poder também ajudam a compreender as relações interpessoais."}, {"title": "Relações interpessoais e Liderança Situacional", "body": "A Liderança Situacional também depende da relação entre líder e liderado.\n\nO líder observa a situação e adapta seu comportamento, podendo:\n\ndirecionar;\n\norientar;\n\napoiar;\n\ndelegar.\n\nA relação estabelecida com o liderado muda conforme a situação, a tarefa e o desenvolvimento daquela pessoa.\n\nPor isso, a liderança não acontece separadamente das relações interpessoais.\n\nA maneira como o líder se aproxima, acompanha, orienta ou concede autonomia interfere diretamente na relação construída.", "key": "A Liderança Situacional também depende da relação entre líder e liderado."}, {"title": "Relações interpessoais e Liderança Transacional", "body": "A liderança transacional também está ligada às relações porque funciona por meio de trocas.\n\nExiste uma relação em que determinadas ações são associadas a determinadas contrapartidas.\n\nAssim, aquilo que foi estudado anteriormente sobre liderança transacional volta a aparecer:\n\nTRANSACIONAL → relação baseada em troca\n\nDependendo de como essas trocas são construídas e percebidas, elas também interferem nas relações entre organização, líder e trabalhador.", "key": "TRANSACIONAL → relação baseada em troca"}, {"title": "Arquitetura das Atitudes", "body": "arquitetura das atitudes.\n\nA expressão procura compreender como as atitudes e os posicionamentos de uma pessoa são construídos.\n\nUma atitude não aparece isoladamente. Ela possui uma base formada por diferentes elementos.\n\nEntre os aspectos mencionados estão:\n\nvalores;\n\npilares pessoais;\n\nexperiências;\n\nforma de enxergar a vida;\n\nexpectativas;\n\nmaneira de se posicionar.\n\nPortanto:\n\nARQUITETURA DAS ATITUDES → estrutura que participa da construção da forma como a pessoa se posiciona", "key": "ARQUITETURA DAS ATITUDES → estrutura que participa da construção da forma como a pessoa se posiciona"}, {"title": "Valores e posicionamentos", "body": "Os valores participam da forma como uma pessoa interpreta situações e estabelece relações.\n\nQuando alguém se posiciona diante de outra pessoa ou de determinada situação, esse posicionamento não surge do nada.\n\nEle está relacionado à maneira como aquela pessoa construiu sua própria visão de mundo.\n\nPor isso, duas pessoas podem vivenciar a mesma situação e produzir interpretações diferentes.\n\nA arquitetura das atitudes ajuda justamente a compreender que aquilo que aparece externamente é resultado de elementos construídos ao longo da experiência da pessoa.", "key": "A arquitetura das atitudes ajuda justamente a compreender que aquilo que aparece externamente é resultado de elementos construídos ao longo da experiência da pessoa."}, {"title": "Expectativas nas relações", "body": "As relações interpessoais frequentemente produzem expectativas.\n\nQuando alguém cria uma expectativa em relação a outra pessoa, tende a imaginar:\n\ncomo ela deveria agir;\n\no que deveria entregar;\n\ncomo deveria responder;\n\naquilo que provavelmente fará.\n\nO problema é que essa expectativa é construída principalmente a partir da própria percepção de quem espera.\n\nA pessoa projeta no outro aquilo que imagina que deveria acontecer.\n\nEXPECTATIVA → aquilo que eu espero do outro ou da situação", "key": "O problema é que essa expectativa é construída principalmente a partir da própria percepção de quem espera."}, {"title": "Expectativa e frustração", "body": "A expectativa pode gerar frustração porque não temos acesso completo àquilo que existe no outro.\n\nQuando observamos alguém, temos acesso apenas a uma parte da pessoa.\n\nExistem elementos que permanecem abaixo da superfície e que não conhecemos completamente.\n\nAssim:\n\nEU OBSERVO UMA PARTE → CRIO UMA EXPECTATIVA → O OUTRO AGE A PARTIR DE SUA PRÓPRIA HISTÓRIA → A EXPECTATIVA PODE NÃO SER CORRESPONDIDA\n\nQuanto maior a idealização construída sobre aquilo que o outro deveria fazer, maior pode ser a possibilidade de frustração.", "key": "EU OBSERVO UMA PARTE → CRIO UMA EXPECTATIVA → O OUTRO AGE A PARTIR DE SUA PRÓPRIA HISTÓRIA → A EXPECTATIVA PODE NÃO SER CORRESPONDIDA"}, {"title": "O iceberg nas relações interpessoais", "body": "A metáfora do iceberg ajuda a compreender por que julgamentos e expectativas podem falhar.\n\nA parte visível não representa a totalidade da pessoa.\n\nQuando criamos uma expectativa utilizando apenas aquilo que conseguimos observar, deixamos de considerar diversos elementos que participam de seu comportamento.\n\nPor isso, relações interpessoais exigem cuidado com interpretações superficiais.\n\nA discussão também é relacionada às redes sociais: aquilo que aparece publicamente corresponde apenas a uma parte da realidade, mas pode ser utilizado pelas pessoas para construir interpretações e expectativas muito maiores.", "key": "A discussão também é relacionada às redes sociais: aquilo que aparece publicamente corresponde apenas a uma parte da realidade, mas pode ser utilizado pelas pessoas para construir interpretações e expectativas muito maiores."}, {"title": "Contrato Psicológico", "body": "O contrato psicológico envolve expectativas construídas na relação entre pessoa e organização.\n\nDiferentemente de uma obrigação simplesmente formalizada em um documento, ele envolve aquilo que a pessoa acredita, espera e percebe nessa relação.\n\nPor isso, podem existir expectativas mesmo quando as funções formais de um cargo estão descritas.\n\nCONTRATO FORMAL → aquilo que está explicitamente estabelecido\n\nCONTRATO PSICOLÓGICO → expectativas e percepções construídas na relação\n\nA pessoa pode esperar da organização determinadas condições que não aparecem integralmente em um contrato escrito.", "key": "CONTRATO FORMAL → aquilo que está explicitamente estabelecido"}, {"title": "A subjetividade entra na organização junto com o trabalhador", "body": "Quando uma pessoa entra em uma organização, ela não deixa sua história do lado de fora.\n\nEla leva consigo:\n\nexperiências anteriores;\n\nexpectativas;\n\nnecessidades;\n\nvalores;\n\ninterpretações;\n\nprojetos pessoais.\n\nAssim, duas pessoas que ocupam funções semelhantes podem estabelecer contratos psicológicos diferentes com a organização.\n\nO trabalho pode representar muito mais do que remuneração.\n\nPara uma pessoa, por exemplo, determinada oportunidade profissional pode significar:\n\nestabilidade;\n\nsegurança;\n\nreconhecimento;\n\npossibilidade de crescimento;\n\ntransformação de sua realidade.\n\nEsses significados participam das expectativas construídas antes e durante a experiência de trabalho.", "key": "Quando uma pessoa entra em uma organização, ela não deixa sua história do lado de fora."}, {"title": "O encontro entre expectativa e realidade organizacional", "body": "Uma pessoa pode chegar a um trabalho cheia de expectativas e disposição.\n\nAo entrar efetivamente no ambiente organizacional, começa a encontrar:\n\npráticas reais;\n\nrelações já estabelecidas;\n\ncultura existente;\n\nformas de liderança;\n\ncomportamentos de colegas;\n\npossibilidades e limitações concretas.\n\nNesse momento, o contrato psicológico começa a ser confrontado com a experiência real.\n\nQuando existe grande distância entre aquilo que a pessoa esperava e aquilo que encontra, pode surgir frustração.\n\nEXPECTATIVA → EXPERIÊNCIA REAL → CONFIRMAÇÃO OU FRUSTRAÇÃO", "key": "EXPECTATIVA → EXPERIÊNCIA REAL → CONFIRMAÇÃO OU FRUSTRAÇÃO"}, {"title": "O exemplo do serviço público", "body": "Uma pessoa pode ingressar por concurso associando aquela carreira a:\n\nestabilidade;\n\nsegurança;\n\ntranquilidade;\n\nrealização profissional.\n\nEntretanto, ao entrar no ambiente, encontra uma realidade organizacional concreta.\n\nForam mencionados outros elementos que podem interferir na experiência, como:\n\nreconhecimento;\n\npossibilidade de crescimento;\n\ndesenvolvimento;\n\nliderança;\n\ndistribuição das responsabilidades;\n\nautonomia;\n\npolíticas internas;\n\nburocracia;\n\nrelações estabelecidas no ambiente.\n\nPortanto, é necessário analisar o contexto e a história da pessoa antes de produzir uma explicação única para seu comportamento.", "key": "Portanto, é necessário analisar o contexto e a história da pessoa antes de produzir uma explicação única para seu comportamento."}, {"title": "Autoconhecimento e regulação das expectativas", "body": "Criar expectativas é apresentado como algo presente na experiência humana.\n\nEntretanto, quanto maior o autoconhecimento, maior pode ser a capacidade de perceber de onde determinada expectativa está surgindo.\n\nIsso ajuda a compreender que aquilo que esperamos do outro pode estar baseado mais em nossas próprias percepções do que naquilo que efetivamente foi combinado.\n\nA questão não é simplesmente eliminar qualquer expectativa, mas desenvolver capacidade de reconhecer e ajustar aquilo que projetamos nas relações.", "key": "Criar expectativas é apresentado como algo presente na experiência humana."}, {"title": "Duas dimensões do Contrato Psicológico", "body": "DIMENSÃO TRANSACIONAL\n\ne\n\nDIMENSÃO RELACIONAL\n\nEssas dimensões recuperam conceitos já discutidos anteriormente e permitem compreender diferentes formas de relação entre trabalhador e organização.", "key": "Essas dimensões recuperam conceitos já discutidos anteriormente e permitem compreender diferentes formas de relação entre trabalhador e organização."}, {"title": "Contrato Psicológico Transacional", "body": "A dimensão transacional é estruturada principalmente em trocas materiais e imediatas.\n\nEntre suas características aparecem:\n\nobrigações econômicas delimitadas;\n\ncondições previamente estabelecidas;\n\nbaixo envolvimento emocional com os propósitos da organização;\n\nconformidade às exigências mínimas.\n\nA relação tende a estar mais concentrada naquilo que cada parte deve entregar.\n\nA lógica pode ser resumida como:\n\nORGANIZAÇÃO → oferece determinada contrapartida\n\nTRABALHADOR → entrega aquilo que foi estabelecido\n\nExiste proximidade com a lógica já estudada na liderança transacional: a troca ocupa posição central.", "key": "A dimensão transacional é estruturada principalmente em trocas materiais e imediatas."}, {"title": "Contrato Psicológico Relacional", "body": "A dimensão relacional envolve uma relação mais ampla entre trabalhador e organização.\n\nlealdade recíproca;\n\nsuporte psicossocial;\n\noportunidades de desenvolvimento;\n\nestabilidade percebida;\n\nvínculo;\n\nenvolvimento.\n\nA relação não fica limitada apenas à troca econômica imediata.\n\nExiste uma construção mais ampla de vínculo entre pessoa e organização.\n\nRELACIONAL → vínculo + reciprocidade + suporte + desenvolvimento\n\nA quebra dessas expectativas pode produzir forte desilusão justamente porque existe maior investimento subjetivo na relação.", "key": "RELACIONAL → vínculo + reciprocidade + suporte + desenvolvimento"}, {"title": "Comunicação clara e Contrato Psicológico", "body": "Quanto mais claramente a organização comunica:\n\naquilo que oferece;\n\naquilo que espera;\n\naquilo que pode proporcionar;\n\naquilo que cobra do trabalhador;\n\nmenor tende a ser o espaço para expectativas construídas apenas a partir de suposições.\n\nIsso não elimina completamente o contrato psicológico, porque a subjetividade continua presente, mas ajuda a aproximar expectativas e realidade.\n\nCOMUNICAÇÃO CLARA → maior clareza sobre expectativas recíprocas", "key": "COMUNICAÇÃO CLARA → maior clareza sobre expectativas recíprocas"}, {"title": "Relações interpessoais como construção sistêmica", "body": "Elas são atravessadas por:\n\nvalores;\n\nexpectativas;\n\nhistória individual;\n\nambiente;\n\nliderança;\n\npoder;\n\nmotivação;\n\ncultura;\n\ncomunicação;\n\ncontratos psicológicos.\n\nPor isso, o olhar da Psicologia Organizacional precisa ser sistêmico.\n\nUma dificuldade de relacionamento pode estar relacionada não somente às pessoas envolvidas, mas também à maneira como o próprio contexto organizacional estrutura suas relações.\n\nRELAÇÕES INTERPESSOAIS\n→ vínculos + interação + conexão\n\nVISÃO SISTÊMICA\n→ motivação + liderança + poder + ambiente + relações\n\nARQUITETURA DAS ATITUDES\n→ valores + experiências + visão de mundo + expectativas + posicionamentos\n\nEXPECTATIVA\n→ construída a partir da própria percepção\n→ pode envolver idealização\n→ pode gerar frustração\n\nICEBERG\n→ vemos apenas parte da realidade do outro\n\nCONTRATO PSICOLÓGICO\n→ expectativas e percepções construídas na relação pessoa–organização\n\nTRANSACIONAL\n→ trocas materiais\n→ obrigações delimitadas\n→ baixo envolvimento emocional\n→ exigências mínimas\n\nRELACIONAL\n→ vínculo\n→ lealdade recíproca\n→ suporte psicossocial\n→ desenvolvimento\n→ estabilidade percebida\n\nCOMUNICAÇÃO CLARA\n→ ajuda a alinhar aquilo que organização e trabalhador esperam um do outro", "key": "RELAÇÕES INTERPESSOAIS\n→ vínculos + interação + conexão"}], "case": "João ingressa em uma organização acreditando que seu bom desempenho será acompanhado por reconhecimento, oportunidades de desenvolvimento e possibilidade de crescimento. Essas condições nunca foram formalmente prometidas, mas foram construídas por João a partir da imagem que possuía da empresa e de suas experiências anteriores. Depois de algum tempo, percebe que a organização espera apenas o cumprimento das atividades previstas e oferece basicamente a remuneração combinada, sem as oportunidades que ele imaginava. Embora o contrato formal esteja sendo cumprido, João se sente profundamente frustrado. O caso evidencia a diferença entre o que está formalmente estabelecido e o contrato psicológico, formado também pelas expectativas e percepções construídas na relação com a organização."}};

<script>
/* v46 — 2º bimestre dinâmico via Supabase REST.
   O 1º bimestre permanece com o conteúdo local da v45. */
const SB_URL='https://bkdfgwgimgasxepnqrsw.supabase.co';
const SB_KEY='sb_publishable_bG7Useu9fYSKwXFvPEc3uA_hoMhK6T8';
const SB_HEADERS={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};

async function sbGet(path){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:SB_HEADERS});
  if(!r.ok) throw new Error('Supabase '+r.status+': '+await r.text());
  return await r.json();
}
const SB2={professores:[],aulas:[],topicos:[],casos:[],questoes:[],alternativas:[]};

async function loadSegundoBimestre(){
  const bs=await sbGet('bimestres?numero=eq.2&select=id&limit=1');
  if(!bs.length) throw new Error('2º bimestre não encontrado.');
  const bid=bs[0].id;
  const [profs,aulas]=await Promise.all([
    sbGet('professores?ativo=eq.true&select=id,nome,slug&order=nome.asc'),
    sbGet('aulas?bimestre_id=eq.'+bid+'&publicada=eq.true&select=id,professor_id,numero,titulo,resumo,ordem&order=ordem.asc,numero.asc')
  ]);
  SB2.professores=profs; SB2.aulas=aulas;
  if(!aulas.length) return;
  const ids=aulas.map(a=>a.id).join(',');
  const [tops,casos,qs]=await Promise.all([
    sbGet('topicos?aula_id=in.('+ids+')&select=id,aula_id,titulo,conteudo,ordem&order=ordem.asc'),
    sbGet('estudos_caso?aula_id=in.('+ids+')&select=id,aula_id,enunciado,resposta_esperada,criterios,ordem&order=ordem.asc'),
    sbGet('questoes?aula_id=in.('+ids+')&select=id,aula_id,tipo,enunciado,resposta_esperada,explicacao,ordem&order=ordem.asc')
  ]);
  SB2.topicos=tops; SB2.casos=casos; SB2.questoes=qs;
  if(qs.length){
    SB2.alternativas=await sbGet('alternativas?questao_id=in.('+qs.map(q=>q.id).join(',')+')&select=id,questao_id,letra,texto,correta,ordem&order=ordem.asc');
  }
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nl(v){return esc(v).replace(/\n/g,'<br>');}

async function openBimester2Dynamic(){
  M.innerHTML='<div class="page-head"><h1>2º Bimestre</h1><p>Carregando aulas atualizadas...</p></div>';
  try{
    await loadSegundoBimestre();
    const cards=SB2.professores.map(p=>{
      const aa=SB2.aulas.filter(a=>a.professor_id===p.id);
      return `<button class="card" onclick="openProfessor2('${p.id}')"><h3>${esc(p.nome)}</h3><div class="mut">${aa.length?aa.length+' aula'+(aa.length>1?'s':''):'Nenhuma aula publicada'}</div></button>`;
    }).join('');
    M.innerHTML=`<div class="page-head"><button class="back" onclick="home()">← Início</button><h1>2º Bimestre</h1><p>Conteúdo carregado do banco de dados.</p></div><div class="cards">${cards}</div>`;
  }catch(e){
    M.innerHTML=`<div class="page-head"><button class="back" onclick="home()">← Início</button><h1>2º Bimestre</h1><p>Não foi possível carregar as aulas agora.</p><div class="feedback">${esc(e.message)}</div></div>`;
  }
}
function openProfessor2(pid){
  const p=SB2.professores.find(x=>x.id===pid), aa=SB2.aulas.filter(a=>a.professor_id===pid);
  M.innerHTML=`<div class="page-head"><button class="back" onclick="openBimester2Dynamic()">← 2º Bimestre</button><h1>${esc(p?.nome||'Professor')}</h1><p>Aulas publicadas</p></div><div class="cards">${
    aa.length?aa.map(a=>`<button class="card" onclick="openLesson2('${a.id}')"><h3>${esc(a.titulo)}</h3><div class="mut">${SB2.topicos.filter(t=>t.aula_id===a.id).length} tópicos</div></button>`).join(''):'<div class="card"><h3>Nenhuma aula publicada ainda.</h3></div>'
  }</div>`;
}
function openLesson2(aid){
  const a=SB2.aulas.find(x=>x.id===aid), p=SB2.professores.find(x=>x.id===a?.professor_id);
  const tops=SB2.topicos.filter(t=>t.aula_id===aid), casos=SB2.casos.filter(c=>c.aula_id===aid), qs=SB2.questoes.filter(q=>q.aula_id===aid);
  const blocks=tops.map((t,i)=>`<section class="lesson" id="t2-${i}"><span class="prof">Prof. ${esc(p?.nome||'')}</span><h2>${esc(t.titulo)}</h2><div class="cesar-direct">${nl(t.conteudo)}</div></section>`).join('');
  const caseHtml=casos.map(c=>`<section class="lesson"><h2>Situação-problema</h2><div class="case">${nl(c.enunciado)}</div>${c.resposta_esperada?`<details><summary>Ver resposta esperada</summary><div class="feedback">${nl(c.resposta_esperada)}</div></details>`:''}</section>`).join('');
  const qHtml=qs.map(q=>{
    const al=SB2.alternativas.filter(x=>x.questao_id===q.id);
    return `<section class="lesson"><h2>Questão de fixação</h2><p>${nl(q.enunciado)}</p>${al.map(x=>`<div class="apply-opt"><b>${esc(x.letra)})</b> ${esc(x.texto)}</div>`).join('')}${q.resposta_esperada?`<details><summary>Conferir resposta</summary><div class="feedback">${nl(q.resposta_esperada)}${q.explicacao?'<br><br>'+nl(q.explicacao):''}</div></details>`:''}</section>`;
  }).join('');
  M.innerHTML=`<div class="journey"><button class="back" onclick="openProfessor2('${a.professor_id}')">← Aulas de ${esc(p?.nome||'')}</button><article class="lesson"><h1>${esc(a.titulo)}</h1>${a.resumo?`<div class="sub">${nl(a.resumo)}</div>`:''}</article>${blocks}${caseHtml}${qHtml}</div>`;
}

openBimester=function(n){ if(Number(n)===2) return openBimester2Dynamic(); return _openBimesterV46(n); };

openProfessor2=function(pid){let p=SB2.professores.find(x=>x.id===pid),aa=SB2.aulas.filter(a=>a.professor_id===pid);shell2(`<div class="page-head"><button class="back" onclick="openBimester2Dynamic()">← 2º Bimestre</button><h1>${esc(p?.nome||'')}</h1><p>Aulas publicadas</p></div><div class="cards">${aa.length?aa.map(a=>`<button class="card" onclick="openLesson2('${a.id}',0)"><h3>${esc(a.titulo)}</h3><div class="mut">${SB2.topicos.filter(t=>t.aula_id===a.id).length} blocos</div></button>`).join(''):'<div class="card">Nenhuma aula publicada ainda.</div>'}</div>`)}
openLesson2=function(aid,idx=0){let a=SB2.aulas.find(x=>x.id===aid),p=SB2.professores.find(x=>x.id===a?.professor_id),tops=SB2.topicos.filter(t=>t.aula_id===aid),casos=SB2.casos.filter(c=>c.aula_id===aid),qs=SB2.questoes.filter(q=>q.aula_id===aid),n=tops.length,i=Math.max(0,Math.min(idx,n));let body='',nav=tops.map((t,j)=>`<button class="${j===i?'active':''}" onclick="openLesson2('${aid}',${j})">Bloco ${j+1}</button>`).join('');
if(i<n){let t=tops[i];body=`<section class="lesson"><span class="prof">Prof. ${esc(p?.nome||'')}</span><h2>${esc(t.titulo)}</h2><div class="cesar-direct">${nl(t.conteudo)}</div><div style="display:flex;justify-content:space-between;gap:10px;margin-top:20px">${i?`<button class="back" onclick="openLesson2('${aid}',${i-1})">← Anterior</button>`:'<span></span>'}<button class="back" onclick="openLesson2('${aid}',${i+1})">${i===n-1?'Atividades':'Próximo'} →</button></div></section>`}else{body=casos.map((c,k)=>`<section class="lesson"><h2>Situação-problema</h2><div class="case">${nl(c.enunciado)}</div><textarea class="study-answer" id="case-${k}" placeholder="Escreva sua resposta para a situação-problema..."></textarea><button class="analyze-btn" onclick='analyzeOpen("case-${k}",${JSON.stringify(c.resposta_esperada||"")})'>Analisar e corrigir</button><div id="fb-case-${k}"></div></section>`).join('');
body+=qs.map((q,k)=>{let al=SB2.alternativas.filter(x=>x.questao_id===q.id);if(al.length)return `<section class="lesson"><h2>Questão de fixação</h2><p>${nl(q.enunciado)}</p>${al.map(x=>`<button class="choice" onclick='gradeChoice(this,${x.correta},${JSON.stringify(q.explicacao||"")})'><b>${esc(x.letra)})</b> ${esc(x.texto)}</button>`).join('')}<div class="choice-feedback"></div></section>`;return `<section class="lesson"><h2>Questão de fixação</h2><p>${nl(q.enunciado)}</p><textarea class="study-answer" id="open-${k}" placeholder="Escreva sua resposta..."></textarea><button class="analyze-btn" onclick='analyzeOpen("open-${k}",${JSON.stringify(q.resposta_esperada||q.explicacao||"")})'>Analisar e corrigir</button><div id="fb-open-${k}"></div></section>`}).join('')}
shell2(`<div class="journey"><button class="back" onclick="openProfessor2('${a.professor_id}')">← Aulas de ${esc(p?.nome||'')}</button><article class="lesson"><h1>${esc(a.titulo)}</h1></article>${i<n?`<div class="block-nav">${nav}</div>`:''}${body}</div>`)}
function gradeChoice(b,c,e){let s=b.closest('.lesson');s.querySelectorAll('.choice').forEach(x=>{x.disabled=true;x.classList.remove('ok','no')});b.classList.add(c?'ok':'no');s.querySelector('.choice-feedback').innerHTML=`<div class="feedback-box"><b>${c?'✓ Correto':'✗ Incorreto'}</b>${e?'<br>'+nl(e):''}</div>`}
function analyzeOpen(id,expected){let ta=document.getElementById(id),o=document.getElementById('fb-'+id),ans=ta.value.trim();if(!ans){o.innerHTML='<div class="feedback-box">Escreva sua resposta primeiro.</div>';return}if(!expected){o.innerHTML='<div class="feedback-box">Resposta registrada. Ainda não há critérios de correção cadastrados.</div>';return}let norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' '),stop=new Set('a o e de da do das dos em no na nos nas um uma para por com que se ao aos as os sua seu suas seus como'.split(' ')),keys=[...new Set(norm(expected).split(/\s+/).filter(w=>w.length>4&&!stop.has(w)))],user=new Set(norm(ans).split(/\s+/)),r=keys.length?keys.filter(k=>user.has(k)).length/keys.length:0,label=r>=.45?'✓ Resposta consistente':r>=.22?'△ Parcialmente correta':'✗ Precisa revisar',msg=r>=.45?'Você contemplou os principais elementos esperados.':r>=.22?'Há elementos corretos, mas faltam pontos importantes.':'A resposta se distancia dos principais critérios esperados.';o.innerHTML=`<div class="feedback-box"><b>${label}</b><br>${msg}</div>`}
</script>
</body></html>
