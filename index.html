const D2={"juliana":[{"title":"Aula 1 — Gestão de Pessoas e Métodos de Aplicação","sections":[["1. Transição para o novo núcleo formativo","No primeiro bimestre, o núcleo formativo esteve voltado à Psicologia, Saúde e Bem-Estar do Trabalhador, abordando temas como riscos psicossociais, GRO, inclusão, Lei de Cotas, racismo estrutural e condições de trabalho.\n\nNo segundo bimestre, inicia-se o núcleo Gestão de Pessoas e Métodos de Aplicação. A proposta passa a aprofundar como as organizações administram, desenvolvem e acompanham as pessoas e como a Psicologia participa desses processos."],["2. Gestão de Pessoas","A Gestão de Pessoas pode ser compreendida como um conjunto de estratégias, práticas e processos destinados a atrair, desenvolver, engajar e reter profissionais dentro de uma organização.\n\nEmbora muitas dessas atividades estejam associadas ao setor de Recursos Humanos, a Gestão de Pessoas ultrapassa as funções administrativas e assume uma dimensão estratégica.\n\nIsso ocorre porque são as pessoas que executam as atividades, produzem conhecimento e contribuem diretamente para os objetivos da organização.\n\nGerir pessoas não significa apenas contratar funcionários, organizar documentos ou administrar salários. A organização precisa pensar em como desenvolver competências técnicas e comportamentais e criar condições para que os profissionais desempenhem adequadamente suas funções.\n\nA Gestão de Pessoas procura estabelecer uma relação de equilíbrio entre os objetivos da organização e as necessidades dos trabalhadores.\n\nUma gestão inadequada pode contribuir para: desmotivação; conflitos; baixa produtividade; problemas de comunicação; rotatividade de profissionais.\n\nPor outro lado, práticas estruturadas de gestão podem favorecer o desenvolvimento profissional, o envolvimento dos trabalhadores, a inovação e a permanência de talentos."],["3. Gestão de Pessoas, resultados e Cultura Organizacional","A Gestão de Pessoas funciona como uma conexão entre pessoas e resultados. Não basta buscar produtividade. É necessário compreender quais condições favorecem o desempenho e como a organização pode proporcionar um ambiente no qual os profissionais tenham condições de contribuir efetivamente.\n\nA Gestão de Pessoas interfere diretamente na Cultura Organizacional.\n\nDecisões relacionadas à contratação, liderança, reconhecimento, comunicação e desenvolvimento mostram aos trabalhadores aquilo que a organização realmente valoriza.\n\nPor isso, a cultura não é formada apenas pelo que a empresa declara formalmente. Ela também é construída pelas experiências concretas vivenciadas pelos trabalhadores.\n\nMissão, valores e práticas da organização estão relacionados a essa cultura."],["4. Recrutamento, Seleção e Desenvolvimento","O recrutamento e a seleção buscam identificar profissionais que apresentem características compatíveis com as exigências do cargo e com a cultura da organização.\n\nUma seleção adequada não deve considerar apenas conhecimentos técnicos. Também podem ser analisados aspectos como competências comportamentais, capacidade de relacionamento, potencial de desenvolvimento e alinhamento com os valores organizacionais.\n\nPor isso, um processo seletivo pode utilizar diferentes recursos, como entrevistas e testes, buscando compreender o candidato de maneira mais ampla.\n\nA Gestão de Pessoas não termina na contratação. O profissional precisa ser acompanhado e ter possibilidades de desenvolvimento.\n\nNesse processo, o feedback assume importância especial. Não é adequado permitir que o trabalhador descubra somente no final de um processo que seu desempenho estava abaixo do esperado.\n\nA devolutiva permite que ele compreenda o que está adequado, o que precisa ser modificado e como pode melhorar seu desempenho.\n\nA professora também destaca a importância da atuação técnica da Psicologia nesses processos, inclusive diante de situações delicadas de avaliação e acompanhamento profissional."],["5. Motivação, Reconhecimento e Engajamento","Motivar profissionais não significa apenas oferecer recompensas financeiras.\n\nO salário continua importante, mas outros elementos também interferem na relação do trabalhador com seu trabalho, como reconhecimento, possibilidade de desenvolvimento, autonomia, qualidade das relações e sentimento de pertencimento.\n\nReconhecimento também pode ocorrer quando alguém recebe uma devolutiva positiva sobre aquilo que realizou adequadamente.\n\nA professora enfatiza que uma pessoa pode inclusive preferir determinadas condições de trabalho a um salário maior quando encontra um ambiente no qual se sente melhor e consegue desempenhar suas atividades com maior tranquilidade.\n\nO engajamento está relacionado à disposição do trabalhador para participar ativamente da organização e contribuir para seus objetivos.\n\nPara favorecê-lo, é importante que a pessoa perceba significado em seu trabalho e que suas contribuições sejam reconhecidas.\n\nPolíticas de reconhecimento, planos de carreira, oportunidades de aprendizagem e benefícios podem fortalecer o vínculo entre trabalhador e organização. A ausência de reconhecimento, por outro lado, pode contribuir para a perda de profissionais."],["6. Clima Organizacional × Cultura Organizacional","Clima Organizacional está relacionado à percepção dos colaboradores sobre o ambiente de trabalho, envolvendo relacionamentos, liderança, comunicação, crescimento e condições de trabalho. O clima pode apresentar mudanças mais rápidas, por exemplo, quando ocorrem alterações na liderança, comunicação ou condições de trabalho.\n\nCultura Organizacional envolve valores, crenças, práticas e padrões compartilhados que orientam como as pessoas agem dentro da organização. É mais profunda e está relacionada à identidade construída pela organização ao longo do tempo.\n\n🧠 Clima = como as pessoas percebem e vivenciam o ambiente naquele contexto.\n🧠 Cultura = valores, crenças e padrões construídos ao longo do tempo.\n\nOs dois conceitos são relacionados, mas não são sinônimos."],["7. Papel do Psicólogo na Gestão de Pessoas","A atuação do psicólogo organizacional exige considerar simultaneamente a pessoa, o trabalho e a organização.\n\nA professora reforça a necessidade de uma postura profissional e técnica. Mesmo quando o psicólogo conhece pessoalmente os envolvidos em determinado conflito, sua atuação não deve se transformar simplesmente em julgamento de quem está “certo” ou “errado”.\n\nAlém disso, modificar práticas organizacionais pode ser difícil porque determinados padrões de liderança e de funcionamento podem estar consolidados há muito tempo.\n\nAssim, o psicólogo pode atuar em processos como seleção, desenvolvimento, avaliação, feedback e análise das relações e das condições organizacionais, mantendo um olhar técnico sobre os processos de Gestão de Pessoas."]],"case":"Uma empresa apresenta alta rotatividade e queda no desempenho. Os trabalhadores relatam que recebem ordens sem possibilidade de diálogo, raramente recebem feedback, não sabem claramente o que precisam melhorar e afirmam que bons resultados quase nunca são reconhecidos. Apesar de a empresa declarar oficialmente que “as pessoas são seu maior valor”, essas experiências fazem parte da rotina dos funcionários. A situação demonstra que a Gestão de Pessoas não pode ficar restrita às funções administrativas: é necessário analisar comunicação, liderança, reconhecimento, desenvolvimento, clima e as próprias práticas que concretizam a cultura da organização.","question":"Uma organização percebe aumento da rotatividade e decide oferecer um bônus financeiro aos funcionários. Entretanto, os trabalhadores continuam relatando ausência de reconhecimento, poucas oportunidades de desenvolvimento, dificuldades na relação com a liderança e problemas de comunicação. Considerando o conteúdo da aula, qual interpretação é mais adequada?","options":["A) A estratégia é suficiente, pois a motivação profissional depende prioritariamente da recompensa financeira.","B) A organização precisa considerar outros fatores da Gestão de Pessoas, pois reconhecimento, desenvolvimento, relações e pertencimento também influenciam o envolvimento com o trabalho.","C) O problema deve ser tratado exclusivamente no recrutamento, substituindo os trabalhadores que apresentam menor motivação.","D) A situação demonstra exclusivamente um problema de cultura organizacional, não estando relacionada às práticas de Gestão de Pessoas."],"answer":"B"}],"cesar":[{"title":"Aula 2 — Mercado de Trabalho na Atualidade","sections":[["1. O trabalho contemporâneo e suas transformações","O mercado de trabalho atual não pode ser compreendido apenas como uma relação entre trabalhador e emprego. Para a Psicologia Organizacional e do Trabalho, o trabalho participa da construção da identidade, do sentimento de utilidade e do pertencimento coletivo.\n\nO modelo tradicional, marcado por contratos mais estáveis, trajetórias profissionais previsíveis e separação mais definida entre trabalho e vida pessoal, vem sendo transformado. Surgem relações mais flexíveis, novas formas de contratação, mudanças tecnológicas e maior responsabilização do próprio trabalhador pela manutenção de sua empregabilidade.\n\nNesse contexto, a Psicologia precisa analisar não somente as características individuais, mas também as condições concretas e sociais em que o trabalho ocorre."],["2. Plataformização, tecnologia e gestão algorítmica","A expansão de aplicativos, plataformas digitais, inteligência artificial e da chamada gig economy modifica as relações de trabalho.\n\nAs plataformas não funcionam apenas como intermediárias. Elas podem organizar e controlar o trabalho por meio de algoritmos, avaliações, métricas e mecanismos de acompanhamento do desempenho.\n\nO controle que anteriormente poderia ocorrer diretamente por uma chefia passa a ser realizado também por sistemas digitais. Métricas, avaliações automatizadas e mecanismos pouco transparentes podem determinar ritmo, acesso às atividades e avaliação do trabalhador. Isso pode favorecer vigilância algorítmica, isolamento e redução do apoio entre trabalhadores.\n\nA tecnologia também modifica as competências exigidas pelo mercado. A introdução de inteligência artificial e automação não significa simplesmente o desaparecimento do trabalho humano. Novas tecnologias alteram funções e criam a necessidade de aprendizagem e qualificação.\n\nA discussão realizada em sala enfatiza, portanto, a importância de saber utilizar essas ferramentas de maneira adequada, compreender suas possibilidades e desenvolver competências para acompanhar as transformações do trabalho."],["3. Micro, Pequenas e Médias Empresas — MPMEs","As Micro, Pequenas e Médias Empresas possuem características organizacionais próprias e não devem ser analisadas exatamente da mesma maneira que grandes organizações.\n\nEm empresas familiares, vínculos pessoais e de parentesco podem se misturar aos critérios técnicos da organização. Isso pode gerar dificuldades em situações como promoção, definição de funções, tomada de decisão e resolução de conflitos. O psicólogo precisa compreender simultaneamente os aspectos técnicos, relacionais e institucionais presentes nessas organizações.\n\nEm estruturas menores, é comum que uma mesma pessoa desempenhe diversas funções. Nem sempre existem setores especializados e sistemas formais de Recursos Humanos. Essa realidade pode produzir sobrecarga de papéis e exige do psicólogo uma leitura adequada ao tamanho e às condições reais da organização.\n\nAlém disso, quando o contato com proprietários e fundadores é muito direto, características da própria liderança podem influenciar fortemente o clima organizacional."],["4. Empreendedorismo de oportunidade × empreendedorismo de sobrevivência","Empreendedorismo de oportunidade ocorre quando há planejamento, identificação de uma oportunidade ou nicho e busca deliberada por maior autonomia e realização.\n\nEmpreendedorismo de sobrevivência pode surgir da ausência de alternativas no emprego formal e da necessidade imediata de obtenção de renda. Nesse caso, o trabalhador pode enfrentar jornadas extensas, ausência de descanso remunerado, instabilidade financeira, isolamento e dificuldade de separar trabalho e vida pessoal.\n\nA aula chama atenção para o risco de interpretar toda forma de empreendedorismo como sinônimo automático de liberdade e autonomia. A condição concreta em que a atividade ocorre precisa ser analisada."],["5. Trabalho no Serviço Público","O serviço público constitui um campo específico de atuação profissional e apresenta diferentes contextos nos âmbitos municipal, estadual e federal.\n\nA estabilidade funcional pode oferecer proteção contra determinadas formas de desligamento, mas não significa ausência de sofrimento no trabalho.\n\nO trabalhador pode experimentar dificuldades relacionadas à burocracia, rigidez organizacional, pouca possibilidade de mudança, conflitos institucionais, desgaste emocional e sensação de aprisionamento profissional.\n\nA discussão realizada em sala também destacou que uma rotina extremamente repetitiva ou a percepção de poucas possibilidades de mudança podem afetar a relação da pessoa com o próprio trabalho.\n\nAssim, a Psicologia não deve partir da ideia de que estabilidade profissional é sinônimo de bem-estar psicológico."],["6. Trabalho presencial, remoto e híbrido","Trabalho presencial favorece contato direto, interação espontânea e construção cotidiana das relações, mas pode envolver deslocamentos cansativos, menor flexibilidade e dificuldades de conciliação entre vida pessoal e profissional.\n\nTrabalho remoto pode eliminar deslocamentos e proporcionar maior flexibilidade, porém também pode provocar diluição dos limites entre trabalho e vida pessoal, isolamento e dificuldade de desconexão.\n\nTrabalho híbrido combina características do presencial e do remoto. Pode proporcionar maior equilíbrio, mas também pode gerar dificuldades de comunicação, agendas fragmentadas e necessidade constante de adaptação.\n\nDireito à desconexão: celulares, plataformas e sistemas corporativos permitem que o trabalho ultrapasse facilmente o horário formal. Mensagens, notificações e demandas podem alcançar o trabalhador durante períodos destinados ao descanso. Por isso, a desconexão é importante para a recuperação física e psicológica."],["7. Contrato psicológico e novas carreiras","Contrato psicológico é o conjunto de expectativas e percepções sobre aquilo que trabalhador e organização esperam um do outro, envolvendo crenças sobre obrigações recíprocas entre empregado e empregador. Quando essas expectativas são rompidas, podem ocorrer mudanças na relação entre a pessoa e a organização.\n\nCarreira Proteana: a carreira passa a ser conduzida principalmente pelo próprio indivíduo, orientada por seus valores e pela percepção pessoal de sucesso.\n\nCarreira sem Fronteiras: a trajetória profissional não precisa permanecer vinculada a uma única organização. Pode envolver diferentes empresas, funções, áreas e competências transferíveis entre contextos.\n\nAssim, as carreiras contemporâneas podem apresentar trajetórias menos lineares e maior mobilidade profissional."],["8. Saúde mental e adoecimento relacionado ao trabalho","Burnout é apresentado como fenômeno ocupacional relacionado ao estresse crônico no trabalho e trabalha três dimensões: Exaustão emocional — esgotamento da energia psíquica; Despersonalização/cinismo — distanciamento, frieza e postura defensiva em relação ao trabalho e às pessoas; Baixa realização profissional — percepção negativa sobre a própria atuação e perda do sentido atribuído ao trabalho.\n\nA discussão não deve reduzir o adoecimento a uma fragilidade individual. É necessário analisar as condições e a organização do trabalho.\n\nQuiet Quitting: o material relaciona a “demissão silenciosa” à recusa de realizar atividades além daquilo que está previsto no contrato, como uma forma de autopreservação.\n\nGreat Resignation: refere-se ao movimento de desligamento voluntário de organizações consideradas abusivas ou tóxicas.\n\nBusca por propósito: aparece a procura por trabalhos mais compatíveis com valores pessoais, saúde e sentido atribuído à atividade profissional."],["9. Gerações e Segurança Psicológica","O ambiente de trabalho contemporâneo reúne diferentes gerações, que podem apresentar expectativas distintas em relação à autoridade, carreira, estabilidade, propósito e comunicação. A aula apresenta a convivência entre Baby Boomers, Geração X, Millennials/Geração Y e Geração Z.\n\nEssas diferenças podem produzir tensões, mas não devem ser tratadas simplesmente como defeitos individuais. A gestão precisa compreender diferentes expectativas e desenvolver formas adequadas de comunicação e liderança.\n\nSegurança psicológica corresponde a um ambiente no qual as pessoas se sentem livres para falar, fazer perguntas, assumir riscos interpessoais e apontar erros sem medo de punição, ridicularização ou represálias.\n\nQuando existe uma cultura de medo, os trabalhadores podem esconder problemas e deixar de comunicar erros importantes. Assim, o erro pode ser utilizado como oportunidade de aprendizagem quando existe um ambiente que permite sua discussão de maneira segura."],["10. O papel diagnóstico e ético da Psicologia Organizacional","Um ponto central do material é evitar a psicologização das carências estruturais.\n\nIsso significa que problemas produzidos pelas condições de trabalho não devem ser automaticamente explicados como fragilidades psicológicas individuais.\n\nMetas desumanas, sobrecarga, assédio e conflitos organizacionais não devem ser tratados apenas com estratégias destinadas a fazer o trabalhador “suportar melhor” a situação.\n\nO psicólogo deve analisar indicadores como absenteísmo, presenteísmo e rotatividade como possíveis sinais de problemas organizacionais e investigar as condições que estão produzindo esses fenômenos.\n\nA atuação psicológica deve, portanto, contribuir para transformar os processos de trabalho e preservar a dignidade humana."]],"case":"Uma pequena empresa familiar adota novas ferramentas de inteligência artificial e sistemas digitais para aumentar a produtividade. Como não possui um setor formal de RH, alguns trabalhadores acumulam funções, recebem mensagens fora do expediente e são avaliados continuamente por indicadores digitais. A direção interpreta o aumento da rotatividade e do esgotamento como falta de adaptação dos funcionários às novas tecnologias. A análise da Psicologia Organizacional, entretanto, exige observar conjuntamente a estrutura da empresa, o acúmulo de funções, a gestão tecnológica, os limites entre trabalho e descanso, o clima organizacional e os indicadores de sofrimento, evitando transformar problemas das condições de trabalho em supostas fragilidades individuais.","question":"Uma organização apresenta aumento simultâneo de afastamentos, rotatividade e relatos de esgotamento. A direção propõe oferecer aos trabalhadores uma palestra sobre “resiliência”, sem modificar metas, jornadas ou práticas de gestão. Considerando a perspectiva apresentada no material, qual deve ser a análise do psicólogo organizacional?","options":["A) Priorizar o desenvolvimento emocional dos trabalhadores, pois afastamentos indicam dificuldade individual de adaptação.","B) Considerar os indicadores como possíveis sinais de disfunções organizacionais e investigar as condições e os processos de trabalho antes de individualizar o problema.","C) Recomendar a substituição dos trabalhadores que apresentam dificuldades para acompanhar as exigências contemporâneas.","D) Concentrar a intervenção exclusivamente na motivação, pois condições organizacionais não fazem parte da atuação psicológica."],"answer":"B"}],"patricia":[],"mariana":[]};

function noteFromStudy(title,concept,meta='Conteúdo de estudo'){
 const safeTitle=String(title||'Conceito'),safeConcept=String(concept||'');
 const id='note-'+Date.now();
 const box=document.createElement('div');box.className='note-panel';box.id=id;
 box.innerHTML=`<b>${safeTitle}</b><div class="concept-box">${safeConcept}</div><label><b>Minha anotação</b></label><textarea placeholder="Escreva o que você quer lembrar sobre este conceito..."></textarea><div class="note-actions"><button class="primary">Salvar anotação</button><button class="note-btn">Cancelar</button></div>`;
 const host=document.querySelector('.step,.lesson,.card,.content')||M;host.appendChild(box);
 const buttons=box.querySelectorAll('button');
 buttons[0].onclick=()=>{const txt=box.querySelector('textarea').value.trim();if(!txt)return;const a=getNotes();a.unshift({id:Date.now(),title:safeTitle,concept:safeConcept,text:txt,meta,date:new Date().toLocaleDateString('pt-BR')});saveNotes(a);box.innerHTML='<b>✓ Anotação salva no Caderno</b>'};
 buttons[1].onclick=()=>box.remove();
 box.scrollIntoView({behavior:'smooth',block:'center'});
}

 M.innerHTML=`<div class="setup"><button class="back" onclick="home()">← Home</button><section class="hero"><span class="tag">CADERNO DE ANOTAÇÕES</span><h1>Minhas anotações</h1><p>As anotações ficam ligadas ao conceito que você estava estudando.</p></section>
 ${a.length?`<div class="notes-grid">${a.map(n=>`<article class="note-card"><small>${n.meta} • ${n.date}</small><h3>${n.title}</h3><div class="concept-box">${n.concept}</div><div class="note-text"><b>Minha anotação</b><br>${n.text}</div><div class="note-actions"><button class="note-btn" onclick="deleteNote(${n.id})">Excluir</button></div></article>`).join('')}</div>`:`<div class="empty-state"><div style="font-size:32px">✎</div><h2>Seu caderno ainda está vazio</h2><p>Durante o estudo, use o botão “Anotar conceito”. O conceito aparecerá aqui junto com a sua anotação.</p></div>`}</div>`;
}
function deleteNote(id){if(confirm('Excluir esta anotação?')){saveNotes(getNotes().filter(n=>n.id!==id));notesHome()}}
function addNoteButtons(){
 document.querySelectorAll('.note-concept-btn').forEach(b=>b.remove());
 const candidates=[...M.querySelectorAll('h2,h3,h4')].filter(h=>h.textContent.trim().length>2);
 candidates.slice(0,30).forEach(h=>{
   const parent=h.parentElement;if(!parent)return;
   const text=[...parent.querySelectorAll('p')].map(p=>p.textContent.trim()).find(t=>t.length>20);
   if(!text)return;
   const b=document.createElement('button');b.className='note-btn note-concept-btn';b.textContent='✎ Anotar conceito';
   b.onclick=()=>noteFromStudy(h.textContent.trim(),text,'Núcleo Formativo');
   h.insertAdjacentElement('afterend',b);
 });
}

function formatBody(body){
  const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const parts=[];
  body.split(/\n/).forEach(line=>{
    const t=line.trim();
    if(!t){ parts.push('<div class="study-gap"></div>'); return; }
    if(/^•\s+/.test(t)){
      const txt=t.replace(/^•\s+/,"");
      const m=txt.match(/^([^:]{2,160}):\s*(.*)$/);
      if(m){
        parts.push(`<div class="study-topic"><strong>• ${esc(m[1])}:</strong>${m[2]?`<div>${esc(m[2])}</div>`:''}</div>`);
      } else {
        parts.push(`<div class="study-topic"><strong>• ${esc(txt)}</strong></div>`);
      }
    } else {
      parts.push(`<p>${esc(t)}</p>`);
    }
  });
  return parts.join("");
}

function normalizeDBLesson(a,tt,cc,qs){const mc=qs.find(q=>q.tipo==='multipla_escolha');return {title:`Aula ${a.numero} — ${a.titulo}`,sections:tt.map(t=>[t.titulo,t.conteudo||'']),case:(cc[0]&&cc[0].enunciado)||'',question:mc?mc.enunciado:'',options:mc?(mc.alternativas||[]).map(x=>`${x.letra}) ${x.texto}`):[],answer:mc?((mc.alternativas||[]).find(x=>x.correta)||{}).letra:'A'} }

function journeyQuizPool(pid){const js=D.journeys[pid]||[];let pool=[];js.forEach((j,ji)=>{if(j.map)return;(j.steps||[]).forEach((st,si)=>{if(st.check&&st.check.q&&st.check.opts){pool.push({lesson:ji+1,block:si+1,topic:st.title||`Bloco ${si+1}`,q:st.check.q,opts:st.check.opts,ans:st.check.ans,why:st.check.why||'Revise o conceito central deste bloco.'})}})});return pool}
function professorQuizPool(pid){let pool=pid==='juliana'?[...QB]:journeyQuizPool(pid);const seen=new Set();return pool.filter(q=>{const k=(q.q||'').toLowerCase().replace(/\s+/g,' ').trim();if(!k||seen.has(k))return false;seen.add(k);return true})}
function quizProfessorOptions(){return [['juliana','Prof. Juliana'],['cesar','Prof. César'],['patricia','Prof. Patrícia'],['mariana','Prof. Mariana']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}
function quizHome(){if(!requireAuth())return;M.innerHTML=`<div class="quizhub"><section class="quizhero"><span class="tag">QUIZ</span><h1>Teste o que você aprendeu</h1><p>As questões são organizadas por professor e pela extensão do conteúdo estudado, sem exigir a mesma quantidade para todos.</p></section><section class="quizsetup"><div class="quizrow"><label>Professor / matéria<select id="qprof" onchange="updateQuizProfessor()">${quizProfessorOptions()}</select></label><label>Conteúdo<select id="qlesson" onchange="updateQuizMode()"></select></label></div><div class="quizrow"><label>Tipo de revisão<select id="qcount"><option value="complete">Revisão completa</option><option value="5">Quiz rápido — até 5 questões</option><option value="10">Quiz rápido — até 10 questões</option></select></label><div><div class="call" id="qcoverage" style="margin:0"></div></div></div><button class="primary" style="width:100%" onclick="beginQuiz()">Começar quiz →</button></section></div>`;updateQuizProfessor()}
function updateQuizProfessor(){const pid=document.getElementById('qprof').value,pool=professorQuizPool(pid),lessons=[...new Set(pool.map(q=>q.lesson))].sort((a,b)=>a-b),sel=document.getElementById('qlesson');sel.innerHTML=`<option value="all">Todo o conteúdo disponível</option>${lessons.map(n=>`<option value="${n}">Aula ${n}</option>`).join('')}`;updateQuizMode()}
function updateQuizMode(){const pid=document.getElementById('qprof')?.value||'juliana',l=document.getElementById('qlesson'),box=document.getElementById('qcoverage');if(!l||!box)return;const pool=professorQuizPool(pid).filter(x=>l.value==='all'||x.lesson==l.value);box.innerHTML=`<b>Cobertura disponível:</b><br>${pool.length} questão${pool.length===1?'':'ões'} distinta${pool.length===1?'':'s'} para esta seleção.`}
function beginQuiz(){const pid=document.getElementById('qprof').value,l=document.getElementById('qlesson').value,c=document.getElementById('qcount').value;let pool=professorQuizPool(pid).filter(x=>l==='all'||x.lesson==l);if(c!=='complete')pool=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(+c,pool.length));else pool=[...pool].sort((a,b)=>a.lesson-b.lesson||a.block-b.block);if(!pool.length){alert('Ainda não há questões cadastradas para esta seleção.');return}QSTATE={pool,i:0,score:0,wrong:[],chosen:null};renderQuiz()}
</script>

<script>
// ===== v35: padrão pedagógico unificado =====

// Explicações ampliadas recuperadas dos materiais completos do 1º bimestre.
// Juliana e Mariana permanecem como estavam.
const RICH_DEEP={
cesar:[
`Toda organização articula PROCESSOS e PESSOAS. Processos incluem procedimentos, tarefas, máquinas, equipamentos, softwares e sistemas; pessoas interpretam, aprendem, executam e sustentam esses processos. Um procedimento tecnicamente correto pode falhar quando treinamento, compreensão, adaptação ou condições de execução são insuficientes.

O olhar da Psicologia Organizacional está justamente nessa interação. Não basta perguntar se o processo foi desenhado corretamente: é necessário observar como comportamento, aprendizagem, relações, cultura, liderança e condições de trabalho interferem na execução. Tecnologia sem desenvolvimento humano pode produzir uma organização avançada nos recursos e frágil na prática.

O professor também trabalhou os ciclos de interferência — família, trabalho/escola, amizades e sociedade — para mostrar que as pessoas chegam à organização com crenças, experiências e formas de interpretar o mundo. Motivação e liderança atravessam esses diferentes contextos. Liderar envolve influência, responsabilidade, confiança, exemplo e compreensão das pessoas e dos processos; por isso, autoconhecimento e autovigilância também são relevantes.`,
`Motivação não é apenas entusiasmo momentâneo. Ela ajuda a compreender direção, intensidade e persistência do comportamento. Um estímulo externo pode provocar uma resposta, mas não explica sozinho por que uma pessoa mantém determinado comportamento ao longo do tempo.

A aprendizagem também depende da interação entre pessoa e ambiente. O trabalhador observa consequências, recebe feedback, interpreta experiências e modifica respostas. Por isso, treinamento não deve ser tratado como simples transmissão de informação: é necessário criar condições para compreender, praticar, receber retorno e incorporar novas formas de agir.

Ao analisar uma queda de desempenho, o psicólogo não deve concluir imediatamente que “falta motivação”. É preciso investigar tarefa, recursos, expectativas, recompensas, relações, aprendizagem, liderança e significado atribuído ao trabalho.`,
`As teorias motivacionais oferecem lentes diferentes. Maslow organiza necessidades em fisiológicas, segurança, sociais, estima e autorrealização. Herzberg distingue fatores higiênicos — que evitam insatisfação — de fatores motivacionais, relacionados a desafio, responsabilidade, autonomia e crescimento.

Vroom propõe que a motivação depende da relação entre expectativa, instrumentalidade e valência: acreditar que o esforço pode gerar desempenho, que o desempenho pode produzir determinada consequência e que essa consequência possui valor. Locke e Latham são associados a metas claras, específicas e desafiadoras acompanhadas de feedback.

Na Teoria da Autodeterminação, Deci e Ryan destacam autonomia, competência e pertencimento. Daniel Pink retoma a importância da motivação intrínseca, autonomia, desenvolvimento e propósito. As teorias não devem ser usadas como rótulos isolados: em situações reais, diferentes elementos podem atuar simultaneamente.`,
`Na teoria da expectativa, três perguntas ajudam a organizar o raciocínio: “Se eu me esforçar, consigo desempenhar?”, “Se eu desempenhar, isso produzirá a consequência esperada?” e “Essa consequência realmente tem valor para mim?”. Uma recompensa pode existir e ainda assim ter pouco efeito quando uma dessas relações é fraca.

Na Autodeterminação, autonomia significa perceber possibilidade de escolha e participação; competência envolve sentir-se capaz de lidar com os desafios; pertencimento refere-se à conexão com outras pessoas. Autonomia não significa ausência de regras, e pertencimento não significa concordância permanente.

Ao comparar as duas abordagens, observe que Vroom enfatiza relações cognitivas entre esforço, desempenho e resultados, enquanto a Autodeterminação destaca necessidades psicológicas que favorecem formas mais autônomas de motivação.`,
`A visão sistêmica evita sentenças rápidas sobre o indivíduo. Um atraso, uma falha ou uma queda de desempenho é um dado inicial, não um diagnóstico. A análise precisa considerar pessoa, tarefa, equipe, liderança, recursos, regras, tecnologia, comunicação e contexto.

Hipótese não é diagnóstico. O psicólogo formula possibilidades explicativas e busca evidências em múltiplas fontes antes de concluir. Entrevistas, observação, indicadores e informações do trabalho podem se complementar.

As teorias estudadas servem para organizar perguntas, não para encaixar pessoas em categorias. O fluxo mais consistente é observar o fenômeno, levantar hipóteses, coletar evidências, integrar diferentes níveis de análise e somente depois propor intervenção.`,
`Poder é a capacidade ou o potencial de influenciar pessoas e controlar recursos, podendo existir mesmo quando não é exercido. Liderança é tratada como processo de influência interpessoal orientado a objetivos compartilhados, e não simplesmente como potencial disponível.

As bases de poder incluem: legítimo/posicional, coerção, recompensa, especialista, referência, informação e conexão. Cargo, punição e recompensa se apoiam mais diretamente na posição; conhecimento e identificação podem sustentar influência mesmo sem autoridade formal.

Nos estilos clássicos, a liderança autocrática centraliza decisões; a democrática amplia participação e mediação; a liberal ou laissez-faire reduz a intervenção do líder. Nenhum rótulo deve ser interpretado isoladamente do contexto, da tarefa e das características da equipe.`,
`A liderança transacional opera pela lógica da troca: metas, desempenho, recompensas e correções. A transformacional busca inspiração, desenvolvimento e mudança, envolvendo influência idealizada, motivação inspiradora, estimulação intelectual e consideração individualizada. A liderança servidora enfatiza escuta, responsabilidade e crescimento das pessoas.

A liderança também pode ser compreendida pelas lentes EU, ELES e NÓS: características e comportamentos do líder, participação dos liderados e construção coletiva da liderança. Equipes aprendem quando perguntam, compartilham informações, discutem erros, experimentam e constroem conhecimento conjuntamente.

Segurança psicológica é a crença compartilhada de que a equipe permite assumir riscos interpessoais sem humilhação ou represália. Isso favorece perguntas, relato de erros, aprendizagem e participação; não significa ausência de cobrança ou de responsabilidade.`
],
patricia:[
`A Psicologia Organizacional estuda o comportamento humano nas organizações e a relação entre pessoas e trabalho. Seu campo não se reduz ao RH nem ao recrutamento e seleção. Pode envolver desenvolvimento, clima, liderança, conflitos, saúde mental, desempenho, relações interpessoais e processos organizacionais.

A análise pode ocorrer em diferentes níveis. No nível individual, observam-se experiências, competências, atitudes e comportamento. No nível grupal, entram comunicação, papéis, normas, conflitos, cooperação e pertencimento. No nível organizacional, analisam-se estrutura, cultura, políticas, processos e condições de trabalho.

Além dos níveis, a POT acompanha fenômenos que atravessam esses níveis, como motivação, liderança, comunicação, clima, cultura, satisfação, comprometimento, estresse, saúde mental e desempenho. O objetivo é evitar explicações reducionistas.`,
`A regra central é: primeiro diagnosticar, depois intervir. A demanda apresentada pela gestão não é automaticamente o problema real. “A equipe está desmotivada”, por exemplo, é uma interpretação inicial que precisa ser investigada.

O diagnóstico pode articular entrevistas, observação, indicadores e diferentes fontes. A formulação do problema deve considerar o que ocorre, em que contexto, com quem, em quais condições e quais evidências sustentam a hipótese.

Depois do diagnóstico vêm planejamento, intervenção, acompanhamento e avaliação. A intervenção deve responder à necessidade identificada e possuir objetivos que permitam verificar posteriormente seus efeitos.`,
`Pessoa, trabalho e organização precisam ser analisados em conjunto. A pessoa traz história, recursos, necessidades, competências e formas de interpretar a experiência. O trabalho possui tarefas, exigências, responsabilidades, ritmo, recursos e condições. A organização estabelece estrutura, regras, liderança, comunicação, cultura e formas de reconhecimento.

Baixo desempenho, atrasos, conflitos ou pedidos de demissão não provam falta de comprometimento. É necessário investigar conhecimentos, clareza de tarefas, recursos, carga, autonomia, liderança, comunicação, clima, reconhecimento, treinamento e condições de trabalho.

A análise técnica começa pela observação do fenômeno, formula hipóteses e procura evidências antes de responsabilizar o indivíduo ou escolher uma intervenção.`,
`Contratar é apenas o início da relação de trabalho. Integração, treinamento, desenvolvimento e acompanhamento ajudam o trabalhador a compreender tarefas, expectativas, recursos e formas de funcionamento da organização.

Treinamento se concentra principalmente em conhecimentos e habilidades necessários ao trabalho atual; desenvolvimento prepara para desafios e responsabilidades futuras; educação corresponde a um processo contínuo de aprendizagem ao longo da carreira.

Comunicação não é apenas emitir uma mensagem. É necessário verificar compreensão, possibilidade de resposta e efeitos da informação sobre o trabalho. Feedback permite acompanhar o desempenho e orientar mudanças sem esperar apenas o momento final da avaliação.`,
`A organização pode contratar o psicólogo, mas não controla tecnicamente sua atuação. O profissional continua responsável por suas decisões e deve respeitar dignidade, direitos, bem-estar, sigilo e responsabilidade técnica.

Informações pessoais e psicológicas precisam ser protegidas e compartilhadas apenas quando pertinentes à finalidade profissional. Avaliações podem afetar contratação, promoção, desligamento, desenvolvimento e encaminhamentos; por isso exigem cuidado ético.

Autonomia técnica significa que pressões organizacionais não substituem critérios profissionais. Pesquisa de clima, documentos e devolutivas também devem respeitar finalidade, necessidade da informação e proteção das pessoas.`,
`Um grupo envolve pessoas que interagem, compartilham contexto ou objetivos e desenvolvem papéis, normas e formas de funcionamento. Uma equipe pressupõe maior interdependência, coordenação, cooperação e responsabilidade compartilhada pelos resultados.

Papéis ajudam a organizar expectativas; normas orientam comportamentos; coesão relaciona-se à força dos vínculos e ao pertencimento. Esses elementos podem favorecer coordenação, mas também produzir pressão por conformidade.

Conflito não é necessariamente negativo. Pode ser funcional quando amplia reflexão e qualidade das decisões, ou disfuncional quando se transforma em hostilidade, ataques pessoais e competição destrutiva.`,
`Equipes autogerenciáveis recebem maior autonomia para organizar e acompanhar parte do próprio trabalho, dentro dos limites da organização. Autogestão não significa abandono: exige objetivos claros, responsabilidades, comunicação, confiança, cooperação e acompanhamento.

Loafing social ou preguiça social ocorre quando o esforço individual diminui em uma tarefa coletiva, especialmente quando a contribuição de cada membro fica pouco visível. Groupthink ou pensamento grupal ocorre quando a busca por consenso reduz análise crítica e questionamento.

Liderança informal pode emergir da interação do grupo mesmo sem cargo formal. A autonomia funciona melhor quando existem clareza, participação e responsabilidade compartilhada.`,
`Desempenho não é simplesmente produzir muito. Envolve qualidade, prazos, responsabilidade, iniciativa, resolução de problemas, cooperação, relações e adaptação às mudanças.

Produtividade relaciona resultados aos recursos utilizados. Eficiência diz respeito ao uso adequado dos recursos; eficácia significa alcançar o objetivo. Esses conceitos se relacionam, mas não são sinônimos.

Capacidade e motivação não garantem desempenho quando faltam oportunidade e condições para executar. Antes de responsabilizar o trabalhador, é necessário analisar recursos, tarefas, carga, autonomia, liderança, comunicação e condições de trabalho.`
]};

function deepHTML(){
 if(!['cesar','patricia'].includes(cur.sid))return '';
 const arr=RICH_DEEP[cur.sid]||[],txt=arr[cur.ji];
 return txt?`<div class="learn-deep"><h3>🧠 Para compreender a aula</h3>${formatBody(txt)}</div>`:'';
}

["Uma empresa oferece bônus para reduzir a rotatividade, mas os profissionais continuam relatando pouca escuta, ausência de feedback e falta de perspectivas de desenvolvimento. Qual leitura é mais adequada?",["A) Aumentar o bônus, pois a permanência depende principalmente do valor financeiro oferecido.","B) Rever também reconhecimento, desenvolvimento, liderança e comunicação, pois esses fatores interferem no vínculo com a organização.","C) Substituir os profissionais que demonstram insatisfação, pois o problema indica incompatibilidade individual com a cultura.","D) Concentrar a intervenção no recrutamento, pois uma seleção mais rigorosa elimina dificuldades posteriores de gestão."],1,"A recompensa financeira pode contribuir, mas o caso apresenta fatores de gestão que também interferem no vínculo e no engajamento."],
["Uma organização possui profissionais de diferentes áreas e afirma que sua gestão de pessoas se limita a folha de pagamento, admissão e desligamento. Qual aspecto está sendo desconsiderado?",["A) A dimensão estratégica de desenvolver, acompanhar, engajar e reter pessoas em relação aos objetivos organizacionais.","B) A necessidade de transferir todas as decisões sobre pessoas exclusivamente aos gestores de cada setor.","C) A prioridade de substituir processos de desenvolvimento por controles administrativos mais padronizados.","D) A ideia de que práticas de gestão devem se concentrar apenas nos profissionais com baixo desempenho."],0,"Gestão de Pessoas ultrapassa rotinas administrativas e inclui desenvolvimento, acompanhamento e condições para o desempenho."],
["Uma empresa declara que 'as pessoas são seu maior valor', mas líderes raramente reconhecem bons resultados e decisões são comunicadas sem diálogo. O que esse contraste evidencia?",["A) A cultura depende principalmente das declarações formais divulgadas pela organização.","B) O clima e a cultura são construídos também pelas práticas concretas vivenciadas pelos trabalhadores.","C) A ausência de reconhecimento afeta apenas a motivação individual, sem relação com a cultura.","D) A comunicação da liderança interfere no clima, mas não expressa valores organizacionais."],1,"Valores declarados precisam aparecer nas práticas; a experiência cotidiana também comunica o que a organização efetivamente valoriza."],
["Em um processo seletivo, dois candidatos possuem domínio técnico semelhante. Um deles demonstra maior capacidade de cooperação e aprendizagem para uma função que exige trabalho interdependente. Qual decisão é mais coerente?",["A) Considerar apenas o domínio técnico, porque características comportamentais devem ser avaliadas somente após a contratação.","B) Integrar requisitos técnicos e comportamentais relacionados à função, sem transformar afinidade pessoal em critério de escolha.","C) Priorizar o candidato mais semelhante à equipe atual, porque homogeneidade reduz conflitos e facilita adaptação.","D) Escolher pelo potencial de aprendizagem, deixando os requisitos técnicos para serem desenvolvidos depois da contratação."],1,"A seleção deve relacionar critérios técnicos e comportamentais às exigências reais da função, evitando critérios de afinidade."],
["Uma funcionária entrega resultados consistentes, mas relata que nunca recebe retorno sobre seu trabalho e não sabe quais possibilidades de crescimento possui. Qual prática responde melhor ao problema?",["A) Criar acompanhamento com feedback e oportunidades de desenvolvimento, tornando expectativas e possibilidades mais claras.","B) Aumentar a supervisão diária, pois a falta de retorno indica necessidade de controle mais próximo sobre as tarefas.","C) Manter o modelo atual, já que resultados satisfatórios mostram que reconhecimento e desenvolvimento são secundários.","D) Oferecer somente uma recompensa financeira, pois reconhecimento profissional se expressa principalmente por remuneração."],0,"Feedback e desenvolvimento ajudam a tornar expectativas, reconhecimento e possibilidades de crescimento mais claros."],
["Após a troca de liderança, trabalhadores passam a relatar pior comunicação e menor abertura para participação, embora os valores formais da empresa permaneçam iguais. Qual conceito ajuda primeiro a compreender a mudança percebida?",["A) Cultura organizacional, porque qualquer mudança de liderança altera imediatamente os valores profundos da organização.","B) Clima organizacional, porque as percepções sobre relações e liderança podem mudar mais rapidamente que padrões culturais.","C) Seleção profissional, porque mudanças no ambiente decorrem principalmente do perfil das pessoas contratadas.","D) Estrutura organizacional, porque percepções dos trabalhadores dependem exclusivamente da distribuição formal de cargos."],1,"O clima pode se alterar rapidamente com mudanças na liderança e na comunicação; a cultura tende a ser mais profunda e duradoura."],
["Um psicólogo é chamado para decidir qual lado 'está certo' em um conflito entre gestor e equipe. Qual postura é tecnicamente mais adequada?",["A) Apoiar a equipe, porque a posição hierárquica do gestor produz assimetria suficiente para definir a causa do conflito.","B) Investigar relações, comunicação, condições e práticas de gestão antes de formular uma análise e propor intervenção.","C) Apoiar o gestor, porque a responsabilidade pelos resultados dá à liderança maior legitimidade para definir o problema.","D) Evitar qualquer análise do conflito, porque relações entre liderança e trabalhadores não pertencem à Gestão de Pessoas."],1,"A atuação técnica exige compreender o contexto e os fatores organizacionais, sem assumir previamente quem está certo."]
],
cesar:[
["Uma empresa instala um novo sistema e culpa os funcionários pelos erros que surgem na primeira semana, embora não tenha oferecido treinamento. Qual análise é mais consistente?",["A) Os erros confirmam resistência individual à tecnologia e justificam substituir quem apresenta dificuldade.","B) A análise deve considerar simultaneamente processo, treinamento e condições de aprendizagem antes de atribuir a falha às pessoas.","C) O sistema deve ser mantido sem ajustes, pois processos tecnológicos independem da forma como as pessoas os executam.","D) A principal medida é aumentar a cobrança por resultados, porque pressão acelera a adaptação aos novos procedimentos."],1,"Processos e pessoas são interdependentes; uma falha de execução não pode ser explicada sem considerar preparação e condições."],
["Um trabalhador recebe uma recompensa atrativa, mas acredita que, mesmo se aumentar seu esforço, não conseguirá atingir a meta por falta de recursos. Pela lógica de Vroom, qual elo está fragilizado?",["A) A expectativa entre esforço e desempenho, porque ele não acredita que seu esforço possa produzir o resultado exigido.","B) A valência da recompensa, porque qualquer dificuldade operacional torna o benefício sem valor para o trabalhador.","C) A instrumentalidade, porque a empresa deixou de relacionar desempenho e recompensa em seu sistema de reconhecimento.","D) O pertencimento, porque a falta de recursos reduz necessariamente a identificação social com a equipe."],0,"O problema descrito está na crença de que esforço poderá gerar desempenho, isto é, na expectativa."],
["Uma equipe recebe metas específicas e desafiadoras, mas não recebe retorno durante a execução. Qual elemento do modelo de Locke e Latham está insuficiente?",["A) A existência de recompensas externas, necessárias para que metas específicas produzam qualquer efeito motivacional.","B) O feedback, que permite acompanhar o progresso e ajustar o comportamento em relação às metas estabelecidas.","C) O pertencimento, que substitui a necessidade de metas quando o trabalho depende de cooperação entre profissionais.","D) A coerção, que garante comprometimento quando metas desafiadoras aumentam a exigência sobre a equipe."],1,"Metas claras, específicas e desafiadoras são associadas a feedback que permita acompanhar e ajustar o desempenho."],
["Uma profissional possui liberdade para organizar sua tarefa, sente-se capaz de executá-la e mantém vínculos positivos com a equipe. Qual leitura é mais adequada pela Autodeterminação?",["A) O contexto favorece autonomia, competência e pertencimento, necessidades relacionadas a formas mais autônomas de motivação.","B) O contexto favorece expectativa, instrumentalidade e valência, dimensões que compõem a Autodeterminação.","C) O contexto demonstra apenas satisfação higiênica, porque autonomia e vínculos evitam insatisfação sem influenciar motivação.","D) O contexto demonstra poder de referência, pois liberdade e competência dependem da identificação com a liderança."],0,"O cenário reúne exatamente autonomia, competência e pertencimento."],
["Uma equipe apresenta queda de desempenho após aumento de carga, troca de sistema e redução do quadro. A direção afirma que 'as pessoas perderam a motivação'. Qual deve ser o primeiro movimento analítico?",["A) Aplicar uma teoria motivacional e classificar os trabalhadores segundo a necessidade predominante de cada um.","B) Investigar múltiplas fontes e condições do trabalho antes de transformar a hipótese de desmotivação em diagnóstico.","C) Criar recompensas financeiras imediatamente, porque queda de desempenho indica insuficiência de incentivos externos.","D) Realizar treinamento comportamental, pois mudanças organizacionais afetam primeiro a atitude individual dos trabalhadores."],1,"A visão sistêmica diferencia hipótese de diagnóstico e exige investigação de condições, contexto e evidências."],
["Uma coordenadora consegue obediência porque pode aplicar sanções, enquanto um técnico sem cargo formal influencia colegas por seu domínio do trabalho. Quais bases aparecem, respectivamente?",["A) Poder de referência e poder legítimo, pois ambos dependem do reconhecimento espontâneo do grupo.","B) Poder de coerção e poder de especialista, porque um se apoia em punição e o outro em conhecimento técnico.","C) Poder de recompensa e poder de informação, porque sanções e conhecimento dependem do controle de recursos.","D) Poder legítimo e poder de conexão, porque posição hierárquica e experiência técnica derivam de relações estratégicas."],1,"A ameaça de sanção caracteriza coerção; a influência pelo domínio técnico caracteriza poder de especialista."],

["Um líder estabelece metas e recompensas claras; outro estimula novas ideias, inspira propósito e acompanha o desenvolvimento individual. Qual comparação é mais adequada?",["A) O primeiro se aproxima da liderança transacional e o segundo da transformacional.","B) O primeiro se aproxima da liderança servidora e o segundo da autocrática.","C) Ambos representam liderança transacional, porque os dois buscam desempenho e resultados.","D) Ambos representam liderança transformacional, porque qualquer acompanhamento individual transforma a equipe."],0,"Troca entre desempenho e recompensa caracteriza o enfoque transacional; inspiração e desenvolvimento aproximam-se do transformacional."],

<script>
const CESAR14={"1": {"title": "Introdução à Psicologia Organizacional: Processos, Pessoas, Motivação e Liderança", "blocks": [{"title": "As duas grandes forças das organizações", "body": "A aula parte de uma visão central para compreender o funcionamento das organizações: toda organização é movimentada por duas grandes forças — processos e pessoas.\n\nProcessos\n\nOs processos correspondem aos procedimentos, tarefas, sistemas, máquinas, equipamentos e formas definidas para executar o trabalho. A organização pode investir em tecnologia, softwares, equipamentos, redução de custos e aumento da produtividade para aperfeiçoar esses processos.\n\nCriar ou adquirir um novo processo, porém, não garante que ele funcionará de maneira adequada e contínua. Existe uma diferença entre implantar um procedimento e conseguir que ele seja executado, mantido e incorporado à rotina.\n\nPessoas\n\nSão as pessoas que colocam os processos em funcionamento. Por isso, não basta uma organização adquirir uma máquina, instalar um software ou definir um novo procedimento sem preparar aqueles que irão utilizá-lo.\n\nUm investimento tecnológico pode ampliar muito a capacidade produtiva, mas essa mudança também exige treinamento e preparação das pessoas para a nova realidade.\n\nEquilíbrio entre processos e pessoas\n\nO desafio da gestão está em equilibrar essas duas forças. Uma organização que concentra seus investimentos apenas em procedimentos, máquinas e sistemas, mas não desenvolve as pessoas responsáveis por operá-los, pode comprometer os próprios resultados esperados.\n\nA gestão eficaz depende, portanto, da articulação entre:\n\nPROCESSOS + PESSOAS → GESTÃO EFICAZ\n\nEssas duas forças interferem na cultura e nas subculturas da empresa, nas estratégias organizacionais e também nos processos táticos do cotidiano."}, {"title": "O olhar da Psicologia dentro das organizações", "body": "A proposta da disciplina é compreender o universo das organizações a partir do olhar da Psicologia, dialogando também com uma perspectiva de gestão.\n\nO psicólogo organizacional não observa somente os procedimentos existentes. Ele também precisa compreender as pessoas que executam esses procedimentos e a relação construída entre pessoa, trabalho e funcionamento organizacional.\n\nNesse sentido, uma questão importante não é apenas:\n\n“Qual é o procedimento?”\n\nMas também:\n\n“Quem coloca esse procedimento em funcionamento e em quais condições isso acontece?”\n\nA Psicologia Organizacional entra justamente nesse espaço em que processos e pessoas precisam funcionar de maneira articulada."}, {"title": "Ciclos de interferência e intervenção", "body": "A aula apresenta a ideia de que as pessoas vivem inseridas em diferentes ciclos de interferência e intervenção. Em cada um deles, o indivíduo influencia outras pessoas e também recebe influências.\n\n1º ciclo — Família\n\nÉ apresentado como o círculo de maior proximidade, no qual recebemos grande quantidade de interferências e também exercemos forte influência.\n\n2º ciclo — Trabalho e escola\n\nSão espaços nos quais convivemos, desenvolvemos atividades e estabelecemos relações que produzem influência mútua.\n\n3º ciclo — Amizades\n\nTambém existe influência recíproca, embora a intensidade possa ser diferente daquela encontrada nos círculos mais próximos.\n\n4º ciclo — Contextos sociais mais amplos\n\nA influência se estende para espaços progressivamente mais amplos, como bairro, cidade e estado.\n\nA ideia apresentada é que aquilo que construímos nos círculos mais próximos pode ser levado aos demais espaços de convivência."}, {"title": "Crenças e formas de pensar", "body": "As pessoas não chegam aos diferentes ambientes de maneira neutra. Elas carregam suas crenças, entendidas na aula como estruturas relacionadas à forma de pensar.\n\nEssas crenças acompanham o indivíduo nos diferentes ciclos de interferência e intervenção e participam da maneira como ele interpreta situações, relaciona-se com outras pessoas e exerce influência.\n\nAssim, aquilo que uma pessoa leva para o trabalho não começa necessariamente dentro da empresa. Parte de suas formas de pensar e de suas experiências também é construída em outros círculos de sua vida."}, {"title": "Liderança depende do contexto", "body": "A discussão da aula indica que uma pessoa pode exercer liderança em determinado ambiente e não necessariamente assumir a mesma posição em outro.\n\nAlguém pode, por exemplo, exercer liderança na família e não ocupar esse papel no trabalho, ou assumir a liderança diante de determinada situação quando surge uma necessidade.\n\nPortanto, a liderança não aparece na aula apenas como algo associado a um cargo permanente. O contexto, a oportunidade e a necessidade podem favorecer o surgimento da liderança."}, {"title": "Liderança como capacidade de influenciar pessoas", "body": "Ao perguntar o que é necessário para que um líder surja, a discussão chega a uma ideia fundamental:\n\nliderança envolve influenciar pessoas.\n\nDurante a construção desse conceito, aparecem diferentes elementos associados ao exercício da liderança:\n\nassumir responsabilidades;\n\nconquistar a confiança das pessoas;\n\nser exemplo;\n\nreconhecer a si mesmo;\n\nconhecer processos;\n\npossuir clareza sobre aquilo que está sendo proposto;\n\nconhecer a equipe;\n\nsaber tratar as pessoas;\n\ndesenvolver autoconhecimento;\n\npossuir desejo e vontade.\n\nEsses elementos não aparecem como uma fórmula isolada, mas ajudam a compreender que a liderança envolve tanto a relação com outras pessoas quanto a capacidade de compreender a si próprio."}, {"title": "Autoconhecimento e liderança", "body": "O autoconhecimento recebe destaque na discussão sobre liderança.\n\nAntes de conduzir outras pessoas, o indivíduo precisa desenvolver percepção sobre si mesmo. Isso envolve observar suas próprias formas de pensar, reações e comportamentos.\n\nA aula chama atenção especialmente para a necessidade de vigiar os próprios pensamentos. A forma como o líder pensa pode repercutir na maneira como interpreta situações, trata pessoas e exerce influência.\n\nPor isso, liderança não envolve somente conhecimento técnico ou conhecimento dos processos. Existe também uma dimensão pessoal relacionada à maneira como o próprio líder se conhece e se conduz."}, {"title": "Motivação e liderança como eixos da disciplina", "body": "A aula introduz motivação e liderança como temas centrais do conteúdo que será desenvolvido.\n\nEsses fenômenos não aparecem apenas dentro das empresas. Eles atravessam diferentes espaços da vida e os diferentes ciclos de interferência e intervenção.\n\nO conteúdo anunciado pelo professor para a sequência da disciplina inclui:\n\nCiclo 1\n\nliderança e poder nas organizações;\n\nteorias de liderança;\n\ntipos de liderança;\n\ncaracterísticas e comportamentos do líder.\n\nCiclo 2\n\natributos dos líderes;\n\nrelações interpessoais no trabalho;\n\nsatisfação;\n\ncomprometimento;\n\ncomunicação assertiva no trabalho.\n\nAlém disso, o professor indica que as teorias da motivação seriam trabalhadas nas aulas seguintes."}], "case": "Uma empresa compra uma máquina moderna para aumentar significativamente sua produção e reduzir custos. O equipamento é instalado e novos procedimentos são definidos, mas os trabalhadores recebem apenas orientações informais e não passam por uma preparação adequada. Com o tempo, surgem dificuldades na execução e na manutenção do novo processo. A situação demonstra o problema central apresentado na aula: investir nos processos sem preparar as pessoas responsáveis por colocá-los em funcionamento rompe o equilíbrio necessário entre as duas grandes forças da organização."}, "2": {"title": "Motivação, Aprendizagem e Teorias Motivacionais", "blocks": [{"title": "Motivação e estímulo não são a mesma coisa", "body": "A aula começa discutindo a relação entre aprendizagem e motivação. A questão inicial é se aprendemos melhor porque estamos motivados ou se o próprio aprendizado pode aumentar nossa motivação.\n\nPara desenvolver essa discussão, o professor estabelece uma distinção central entre motivação e estímulo.\n\nEstímulo\n\nO estímulo é apresentado como algo que atua de fora para dentro. Recompensas, condições externas e outros elementos do ambiente podem estimular uma pessoa.\n\nMotivação\n\nNa perspectiva trabalhada na aula, a motivação é apresentada como um movimento interno, algo que nasce dentro da pessoa e se manifesta em direção à ação.\n\nPor isso, mesmo quando se fala em fatores externos capazes de influenciar o comportamento, o professor diferencia esses elementos da motivação propriamente dita:\n\nESTÍMULO → de fora para dentro\nMOTIVAÇÃO → movimento que nasce internamente\n\nO salário aparece como exemplo dessa distinção. Na discussão da aula, ele pode funcionar como elemento externo, mas não é considerado suficiente, por si só, para produzir uma motivação interna duradoura."}, {"title": "O papel da liderança na motivação", "body": "Dentro da Psicologia Organizacional, diferentes fatores podem interferir na maneira como o trabalhador realiza suas atividades.\n\nA liderança ganha importância porque o líder pode criar condições que favoreçam o desenvolvimento profissional. Entretanto, segundo a lógica apresentada na aula, o líder não simplesmente “coloca” motivação dentro de outra pessoa.\n\nSua atuação pode estimular e criar condições capazes de alcançar aquilo que existe internamente no trabalhador.\n\nAssim, existe uma diferença entre oferecer estímulos externos e compreender aquilo que internamente move cada pessoa."}, {"title": "Aprendizagem e motivação", "body": "A aula problematiza a ideia de que toda aprendizagem depende obrigatoriamente de motivação. É possível memorizar determinado conteúdo momentaneamente mesmo sem grande envolvimento.\n\nA discussão, porém, caminha para uma relação mais profunda entre motivação e aprendizagem significativa.\n\nQuando a pessoa encontra significado naquilo que está aprendendo, pensa sobre o conteúdo, envolve-se e consegue relacioná-lo à própria realidade, a aprendizagem tende a ultrapassar a simples memorização.\n\nA motivação também pode ser alimentada pelo próprio processo de aprendizagem: compreender algo, resolver um problema ou perceber que está avançando pode aumentar a disposição para continuar aprendendo.\n\nPortanto, a relação não é apresentada simplesmente como uma sequência rígida. Aprender pode favorecer a motivação e a motivação pode favorecer um envolvimento mais profundo com a aprendizagem."}, {"title": "O ecossistema da aprendizagem", "body": "Para compreender essa conexão, o professor introduz a ideia de um ecossistema da aprendizagem.\n\nNesse ecossistema, três dimensões recebem destaque:\n\nCognitiva\n\nAprender precisa mobilizar o pensamento. A pessoa deve ser levada a:\n\npensar;\n\nrefletir;\n\nanalisar problemas;\n\nelaborar possibilidades;\n\nprocurar soluções;\n\ncompreender;\n\ncriar.\n\nA capacidade de resolver problemas aparece como uma experiência particularmente importante, porque mobiliza o indivíduo cognitivamente e pode favorecer sua percepção de competência.\n\nAfetiva\n\nA aprendizagem também precisa alcançar os sentimentos. Não basta apenas apresentar uma informação racionalmente; o envolvimento afetivo participa da conexão construída com aquilo que está sendo aprendido.\n\nO professor relaciona essa dimensão também às organizações: quando o trabalhador é percebido como pessoa dentro da organização, sua relação com o trabalho pode ser diferente.\n\nMotivacional\n\nA terceira dimensão é o próprio movimento interno que leva a pessoa em determinada direção. É aquilo que sustenta a busca, o interesse e a disposição para continuar.\n\nAssim:\n\nCOGNITIVO + AFETIVO + MOTIVACIONAL → ECOSSISTEMA DA APRENDIZAGEM"}, {"title": "Resolver problemas, autonomia e aprendizagem", "body": "A resolução de problemas aparece como elemento importante da dimensão cognitiva.\n\nQuando a pessoa recebe uma situação que exige reflexão, elaboração e busca de soluções, ela deixa de ocupar uma posição exclusivamente passiva no processo de aprendizagem.\n\nNesse contexto, o professor introduz a autonomia como um elemento das concepções contemporâneas de motivação.\n\nTer autonomia na aprendizagem significa não receber necessariamente todas as respostas prontas. O estudante pode receber provocações e reflexões e, a partir delas, pesquisar, aprofundar-se, questionar e construir novas conexões.\n\nQuanto maior a possibilidade de participação ativa, maior pode ser a conexão da pessoa com aquilo que está aprendendo."}, {"title": "Afetividade, percepção e engajamento no trabalho", "body": "A dimensão afetiva é levada da aprendizagem para o contexto organizacional.\n\nA aula questiona organizações que desejam trabalhadores altamente engajados, com “sentimento de dono” e disposição para contribuir além do mínimo esperado, mas que oferecem apenas uma relação baseada em:\n\nhorário de entrada;\n\nexecução de tarefas;\n\nintervalos;\n\nhorário de saída;\n\npagamento do salário.\n\nO professor provoca uma questão importante: o que a organização está fazendo para produzir o envolvimento que exige do trabalhador?\n\nA ideia de chamar alguém de “colaborador” não é suficiente. Para que essa relação tenha significado, o trabalhador precisa ser percebido dentro da organização.\n\nO envolvimento afetivo, portanto, aparece como um fator importante na construção do engajamento."}, {"title": "Pensamento, sentimento, comportamento e resultado", "body": "A aula apresenta uma sequência para explicar como aquilo que pensamos pode repercutir nas nossas ações:\n\nPENSAMENTO → SENTIMENTO → COMPORTAMENTO → RESULTADO\n\nAquilo que a pessoa pensa produz repercussões sobre aquilo que sente. O sentimento, por sua vez, relaciona-se ao comportamento, e o comportamento produz resultados.\n\nO comportamento pode se manifestar tanto por meio da linguagem verbal quanto da linguagem não verbal.\n\nEssa sequência ajuda a compreender por que o aprendizado não é apresentado apenas como processo de aquisição de informações. Ele também envolve pensamento, sentimento e ação."}, {"title": "Aprender e apreender", "body": "O professor estabelece uma distinção didática entre aprender e apreender.\n\nAprender\n\nEstá relacionado a compreender, assimilar e reter uma informação.\n\nApreender\n\nNa forma trabalhada em aula, significa avançar para a utilização daquilo que foi aprendido, conseguindo colocar o conhecimento em prática no cotidiano.\n\nO aprendizado ganha outra dimensão quando o estudante sai da sala de aula, observa seus diferentes ambientes, identifica os conceitos estudados e tenta aplicá-los à realidade.\n\nIsso pode acontecer nos ciclos discutidos na aula anterior: família, trabalho/escola, amizades e contextos sociais mais amplos.\n\nAssim, a aprendizagem se consolida quando a pessoa não apenas recebe a informação, mas passa a observar, conversar, experimentar e aplicar aquilo que estudou."}, {"title": "Os primeiros estudos sobre pessoas e ambiente de trabalho", "body": "A aula recupera historicamente estudos realizados no contexto industrial, mencionando as experiências de Hawthorne.\n\nO ponto enfatizado é que os primeiros estudos observavam como alterações no ambiente e nas condições de trabalho poderiam repercutir na produtividade.\n\nMudanças em aspectos como:\n\niluminação;\n\nbancadas;\n\ncadeiras;\n\ncondições físicas do ambiente;\n\neram relacionadas a mudanças na produção.\n\nNesse momento histórico, portanto, a análise ainda estava fortemente voltada para elementos externos ao trabalhador.\n\nEssa trajetória é utilizada na aula para mostrar como os estudos sobre motivação foram progressivamente avançando para outras explicações."}, {"title": "Maslow e a Hierarquia das Necessidades", "body": "Na sequência histórica apresentada pelo professor, aparece a teoria de Abraham Maslow.\n\nMaslow organiza as necessidades humanas de maneira hierárquica:\n\n1. Necessidades fisiológicas\nRelacionadas às necessidades básicas do organismo.\n\n2. Necessidades de segurança\nRelacionadas à proteção e à sensação de segurança.\n\n3. Necessidades sociais\nRelacionadas à convivência, aos grupos e às relações sociais.\n\n4. Necessidades de estima\nRelacionadas à percepção de valor e reconhecimento.\n\n5. Autorrealização\nRelacionada ao desenvolvimento e à realização das próprias potencialidades.\n\nNa forma apresentada na aula, a teoria propõe uma progressão: necessidades de níveis inferiores precisam estar atendidas para que as necessidades seguintes ganhem espaço.\n\nO próprio professor ressalta, entretanto, que se trata de uma teoria construída em determinado contexto histórico, e provoca a turma a pensar se essa progressão ocorre de maneira tão integral na realidade atual."}, {"title": "Herzberg: fatores higiênicos e motivacionais", "body": "A aula também introduz a teoria de Herzberg, organizada em dois conjuntos de fatores.\n\nFatores higiênicos\n\nRelacionam-se às condições externas e ao contexto no qual o trabalho acontece.\n\nNa lógica apresentada durante a aula, esses elementos precisam ser diferenciados daquilo que efetivamente produz o movimento motivacional interno.\n\nFatores motivacionais\n\nRelacionam-se mais diretamente aos elementos capazes de produzir envolvimento com o próprio trabalho.\n\nA distinção é importante porque melhorar uma condição externa não significa automaticamente produzir motivação interna.\n\nEssa ideia se conecta à discussão realizada no início da aula sobre estímulo e motivação."}, {"title": "Das teorias clássicas às concepções contemporâneas", "body": "O professor situa Maslow e Herzberg como teorias construídas em determinados momentos históricos e chama atenção para o desenvolvimento posterior dos estudos sobre motivação.\n\nAs teorias clássicas continuam importantes para compreender o campo, mas as concepções mais recentes passam a observar com maior atenção aspectos que ultrapassam simplesmente a satisfação integral e sequencial de necessidades.\n\nNesse movimento, a aula menciona Daniel Pink e a Motivação 3.0, destacando especialmente a autonomia.\n\nA autonomia aparece como a possibilidade de a pessoa participar ativamente, buscar caminhos, tomar iniciativa e construir seu próprio desenvolvimento, em vez de depender apenas de comandos ou recompensas externas."}], "case": "Uma empresa reclama que seus funcionários demonstram pouco engajamento. A gestão acredita que aumentar salários e oferecer bônus resolverá o problema, mas mantém um trabalho em que os profissionais apenas cumprem tarefas previamente determinadas, possuem pouca autonomia, recebem pouco reconhecimento e raramente são convidados a pensar ou resolver problemas. Pela perspectiva desenvolvida na aula, os incentivos externos podem funcionar como estímulos, mas não garantem sozinhos uma conexão motivacional interna. Para favorecer maior envolvimento, é necessário considerar também dimensões cognitivas, afetivas e motivacionais da experiência de trabalho."}, "3": {"title": "Motivação Interna, Maslow, Autoeficácia e Modelagem", "blocks": [{"title": "Alguém consegue motivar outra pessoa?", "body": "A aula retoma uma questão central da aula anterior:\n\n“Alguém motiva alguém?”\n\nA discussão diferencia novamente motivação de estímulo.\n\nUma pessoa pode observar alguém que admira, receber uma recompensa, ouvir uma fala ou encontrar um ambiente favorável e, a partir disso, modificar seu comportamento. Entretanto, na perspectiva trabalhada pelo professor, esses elementos atuam como estímulos externos.\n\nMotivação\n\nÉ o movimento que precisa acontecer internamente no indivíduo. O motivo para agir precisa encontrar conexão com aquilo que a própria pessoa pensa, sente, deseja ou busca.\n\nEstímulo\n\nÉ aquilo que vem de fora e pode criar condições, incentivar ou favorecer determinado comportamento.\n\nO problema de depender exclusivamente do estímulo externo é que, quando ele desaparece, o comportamento produzido por ele também pode desaparecer.\n\nESTÍMULO → vem de fora e pode incentivar\n\nMOTIVAÇÃO → movimento construído internamente"}, {"title": "O papel do psicólogo diante da motivação", "body": "Essa distinção tem uma consequência importante para a atuação do psicólogo.\n\nO profissional não deve assumir para si a responsabilidade de “motivar” diretamente outra pessoa, como se pudesse produzir internamente aquilo que somente o próprio indivíduo pode encontrar.\n\nNa aula, o papel do psicólogo é apresentado de outra maneira: ajudar a pessoa a encontrar o caminho de volta para essa conexão interna.\n\nIsso exige compreender que o profissional não sabe previamente:\n\n- o que existe no coração daquela pessoa;\n\n- como ela pensa;\n\n- quais são suas crenças;\n\n- qual é seu propósito;\n\n- quais são seus objetivos;\n\n- o que possui significado para ela.\n\nPor isso, em vez de fornecer respostas prontas, o psicólogo pode utilizar perguntas adequadas para que a própria pessoa encontre suas respostas.\n\nO psicólogo não coloca a motivação dentro da pessoa. Ele pode ajudá-la a encontrar aquilo que internamente produz seu movimento."}, {"title": "Cognição e afetividade no caminho da motivação", "body": "A aula retoma o aprendizado como elemento importante para que a pessoa consiga construir essa conexão interna.\n\nO processo envolve duas dimensões trabalhadas anteriormente:\n\nCognitivo\n\nRefere-se à forma de pensar, interpretar, compreender e construir significado.\n\nAfetivo\n\nRefere-se à conexão com sentimentos e com aquilo que possui significado emocional para a pessoa.\n\nO professor apresenta essa integração como uma conexão entre mente e coração.\n\nQuando a pessoa consegue construir cognitivamente um objetivo e também encontrar nele uma conexão afetiva, pode surgir o movimento interno necessário para caminhar em determinada direção.\n\nIsso não significa que a pessoa fará somente aquilo de que gosta. Muitas vezes, ela precisará executar tarefas desagradáveis ou difíceis porque consegue relacioná-las a um objetivo maior que possui significado."}, {"title": "Criar condições não é o mesmo que motivar", "body": "Se a motivação é interna, isso não significa que o ambiente externo seja irrelevante.\n\nO professor destaca a importância de:\n\n- criar um ambiente adequado;\n\n- oferecer condições;\n\n- apoiar;\n\n- participar do processo;\n\n- favorecer pertencimento.\n\nEsses elementos externos funcionam como estímulos e condições que podem ajudar a pessoa a encontrar seu próprio caminho interno.\n\nPortanto:\n\nCriar condições ≠ produzir diretamente a motivação.\n\nO ambiente pode favorecer o processo, mas a conexão motivacional precisa ocorrer no próprio indivíduo."}, {"title": "Motivação exige coragem e determinação", "body": "A aula também problematiza a ideia de que estar motivado significa fazer apenas aquilo que é agradável.\n\nManter-se em direção a um objetivo pode ser difícil e exigir:\n\n- coragem;\n\n- determinação;\n\n- renúncias;\n\n- persistência;\n\n- realização de tarefas que não são prazerosas.\n\nO exemplo discutido em sala é o de alguém que deseja alcançar determinado objetivo profissional e, por isso, dedica várias horas ao estudo e abre mão temporariamente de outras atividades.\n\nA motivação, nesse caso, não elimina as dificuldades. O que sustenta a ação é a conexão entre aquilo que a pessoa está fazendo agora e aquilo que deseja alcançar."}, {"title": "Maslow: necessidades humanas e motivação", "body": "A aula retoma a Teoria da Hierarquia das Necessidades de Maslow.\n\nAs necessidades discutidas são:\n\nNecessidades fisiológicas\n\nRelacionadas às condições básicas do organismo, como alimentação e outras necessidades fundamentais.\n\nNecessidades de segurança\n\nRelacionadas à proteção e à busca por condições de segurança.\n\nNecessidades sociais\n\nRelacionadas à convivência, aos vínculos e às relações com outras pessoas.\n\nNecessidades de estima\n\nRelacionadas à valorização e à percepção de valor.\n\nAutorrealização\n\nRelacionada à realização e à busca de plenitude.\n\nA teoria apresenta essas necessidades em uma organização ascendente, na qual o atendimento das necessidades mais básicas cria condições para o avanço em direção às demais."}, {"title": "A universalidade das necessidades precisa ser ponderada", "body": "Uma parte importante da aula é dedicada a discutir criticamente a ideia de que as necessidades propostas por Maslow seriam universais.\n\nA turma levanta uma questão: mesmo que determinadas necessidades estejam presentes nos seres humanos, elas possuem a mesma intensidade para todas as pessoas?\n\nA discussão chega à necessidade de fazer ponderações.\n\nA intensidade e a forma como determinada necessidade aparece podem variar de acordo com:\n\n- cultura;\n\n- história individual;\n\n- contexto social;\n\n- território;\n\n- época;\n\n- condições econômicas;\n\n- experiências de vida.\n\nAssim, duas pessoas podem apresentar necessidades sociais, por exemplo, mas isso não significa que precisem da mesma quantidade ou do mesmo tipo de interação social.\n\nA aula também compara diferentes contextos sociais: as necessidades que ganham maior importância para alguém vivendo em condições básicas precárias podem ser diferentes daquelas que ocupam maior espaço para uma pessoa cujas condições materiais já estão atendidas."}, {"title": "Maslow é uma teoria situada em seu contexto", "body": "O professor enfatiza que Maslow elaborou sua teoria a partir de pesquisas realizadas em determinado momento histórico.\n\nPor isso, a teoria deve ser compreendida como uma construção teórica que ajuda a interpretar a motivação, mas precisa ser analisada considerando transformações sociais, culturais e históricas.\n\nA aula mantém dois pontos da teoria como importantes para a discussão:"}, {"title": "As necessidades humanas apresentadas possuem relevância para compreender o comportamento.", "body": ""}, {"title": "Existe uma ideia de ascendência entre necessidades mais básicas e a busca pela autorrealização.", "body": "Ao mesmo tempo, essa ascendência deve ser interpretada com as ponderações discutidas em relação ao contexto, à cultura, ao tempo e à individualidade."}, {"title": "Necessidades podem competir entre si", "body": "A discussão também mostra que as pessoas precisam administrar diferentes necessidades simultaneamente.\n\nAtender uma necessidade própria pode significar, em determinado momento, não atender imediatamente à necessidade apresentada por outra pessoa.\n\nIsso não significa necessariamente rejeição ou falta de consideração. Pode representar simplesmente uma priorização de necessidades.\n\nEsse ponto reforça que a motivação não pode ser compreendida apenas pela existência de uma lista universal de necessidades. É necessário observar como cada pessoa organiza, prioriza e atribui intensidade às próprias necessidades em determinado contexto."}, {"title": "Autoeficácia e modelagem", "body": "Na sequência, o professor introduz a teoria da autoeficácia e da modelagem.\n\nA discussão da aula concentra-se principalmente na modelagem.\n\nModelagem\n\nÉ apresentada como o processo de observar aquilo que outra pessoa faz e reproduzir seus comportamentos, estratégias ou formas de agir buscando alcançar resultados semelhantes.\n\nA lógica pode ser representada assim:\n\n“Se essa pessoa faz determinadas coisas e alcança determinado resultado, posso fazer o mesmo para tentar alcançar resultado semelhante.”\n\nA modelagem vai além de uma imitação momentânea e superficial. Na explicação do professor, ela pode chegar à tentativa de reproduzir também maneiras de pensar e organizar o comportamento."}, {"title": "Os riscos da modelagem", "body": "O professor apresenta uma visão crítica sobre o uso indiscriminado da modelagem, principalmente quando alguém promete que basta reproduzir seus comportamentos para alcançar os mesmos resultados.\n\nO problema central é que:\n\nPessoas diferentes não necessariamente alcançarão os mesmos resultados executando exatamente as mesmas ações.\n\nExis
