dades podem afetar a vida familiar, assim como situações pessoais podem repercutir na experiência profissional.\n\nLimites entre os Papéis:\nA definição de limites pode contribuir para a relação entre trabalho e vida pessoal, mas essa separação nem sempre acontece de maneira simples. Diferentes papéis, vínculos e experiências coexistem na vida do trabalhador.\n\nConflito Trabalho–Família:\nO foco não está em investigar a qualidade do relacionamento familiar do trabalhador, mas em compreender como as exigências profissionais interferem nessa relação. Horários imprevisíveis, necessidade de continuar trabalhando em casa ou dificuldade para se desligar das atividades profissionais são exemplos dessa interferência.\n\nVálvula de Escape:\nEm determinadas situações, o trabalho também pode funcionar como um espaço de alívio diante de dificuldades existentes em outros contextos da vida. A pessoa pode encontrar na atividade profissional um lugar de concentração, pertencimento ou afastamento temporário de outras situações difíceis.\n\nPor isso, compreender a saúde mental relacionada ao trabalho exige considerar diferentes dimensões da experiência, sem reduzir aquilo que a pessoa vive a apenas um fator.","check":null},{"title":"Bloco 3: COPSOQ como Instrumento Multidimensional","sub":"","body":"O COPSOQ diferencia-se de modelos quantitativos mais específicos por realizar uma avaliação multidimensional dos riscos psicossociais.\n\nEnquanto o Modelo Demanda–Controle concentra-se principalmente na relação entre exigências e autonomia e o Modelo Esforço–Recompensa analisa a relação entre aquilo que o trabalhador investe e aquilo que recebe em retorno, o COPSOQ procura abranger um conjunto maior de dimensões.\n\nExigências Quantitativas e Emocionais:\nAvalia aspectos relacionados à quantidade e à intensidade das demandas, incluindo exigências emocionais presentes na atividade.\n\nAutonomia e Controle:\nConsidera a possibilidade de participação e decisão do trabalhador sobre sua própria atividade.\n\nQualidade da Liderança:\nInvestiga aspectos relacionados à atuação das lideranças e à maneira como essa relação ocorre no ambiente profissional.\n\nApoio Social:\nConsidera o suporte existente nas relações estabelecidas no trabalho.\n\nReconhecimento:\nAvalia elementos relacionados à valorização percebida pelo trabalhador.\n\nClareza de Papéis:\nObserva se responsabilidades, funções e expectativas estão suficientemente definidas.\n\nConflito Trabalho–Família:\nInvestiga a interferência das exigências profissionais na vida familiar e pessoal.\n\nInsegurança no Emprego:\nConsidera aspectos relacionados à estabilidade e à percepção de segurança profissional.\n\nSaúde e Bem-Estar:\nInclui elementos relacionados ao estresse e ao esgotamento.\n\nO instrumento possui diferentes extensões, incluindo versões mais reduzidas e versões mais amplas. A versão escolhida depende das necessidades da avaliação.\n\nAs perguntas do instrumento são previamente estruturadas. Portanto, não se trata de criar livremente questões diferentes para cada tipo de empresa.","check":null},{"title":"Bloco 4: Anonimato, Resultados e Plano de Ação","sub":"","body":"Uma característica importante na aplicação do COPSOQ é a possibilidade de preservar o anonimato dos trabalhadores.\n\nEm vez de identificar nominalmente cada pessoa, podem ser coletadas informações que permitam compreender os resultados por grupos, como o setor ou departamento em que o trabalhador atua.\n\nIsso permite realizar o mapeamento dos riscos sem transformar o processo em uma identificação individual dos funcionários.\n\nResultados por Dimensão:\nO instrumento permite analisar diferentes dimensões separadamente. Dessa forma, um mesmo setor pode apresentar uma condição favorável em determinado aspecto e maior risco em outro.\n\nVerde:\nRepresenta uma condição mais favorável na dimensão avaliada.\n\nAmarelo:\nIndica uma situação que exige atenção.\n\nVermelho:\nIndica maior nível de risco e necessidade de intervenção.\n\nA classificação ajuda a estabelecer prioridades para o plano de ação. Se um setor apresenta apoio social favorável, mas risco elevado em exigências emocionais e conflito trabalho–família, as intervenções devem ser direcionadas principalmente às dimensões que apresentaram maior necessidade.\n\nEm avaliações com muitos trabalhadores, sistemas podem auxiliar na organização das respostas, cálculo dos resultados e geração de gráficos. Entretanto, a ferramenta não substitui a análise profissional.\n\nOs resultados quantitativos precisam ser compreendidos dentro do contexto da organização. Quando necessário, a investigação pode avançar para métodos qualitativos, permitindo compreender com maior profundidade aquilo que os trabalhadores estão vivenciando.\n\nAssim, o questionário funciona como uma ferramenta de mapeamento, mas a avaliação da saúde mental no trabalho exige uma compreensão mais ampla da relação entre as pessoas e a organização.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: Entre o Trabalho e a Vida Pessoal\n\nUma empresa aplica o COPSOQ e identifica que determinado setor apresenta resultados favoráveis em apoio social, mas níveis elevados de exigências emocionais e conflito trabalho–família. Os trabalhadores não são identificados individualmente, mas os resultados do setor mostram que as demandas frequentemente continuam após o expediente e dificultam o desligamento do trabalho durante o tempo destinado à vida pessoal.\n\nPergunta Avaliativa\n\nConsiderando o caráter multidimensional do COPSOQ, explique por que os resultados devem ser analisados por dimensão e como essa análise pode orientar a definição das prioridades de intervenção.","criteria":[],"expected":""}},{"title":"Aula 7 — Saúde e Segurança do Trabalho e Riscos Psicossociais","steps":[{"title":"Bloco 1: Saúde e Segurança do Trabalho","sub":"","body":"A Saúde e Segurança do Trabalho (SST) tem como objetivo proteger a integridade do trabalhador. Para compreender sua atuação, duas palavras são fundamentais: prevenir e promover.\n\nPrevenção:\nBusca prevenir acidentes, lesões e doenças relacionadas ao trabalho, identificando condições que possam representar riscos antes que produzam consequências para os trabalhadores.\n\nPromoção:\nBusca promover condições de trabalho capazes de preservar a saúde e a integridade do trabalhador.\n\nIntegridade Física e Psíquica:\nA proteção não envolve apenas o corpo e a prevenção de acidentes. A saúde do trabalhador também inclui sua dimensão psíquica e os processos de adoecimento relacionados às condições e à organização do trabalho.\n\nHistoricamente, essa proteção foi sendo ampliada.\n\nCLT:\nA Consolidação das Leis do Trabalho regulamenta as relações formais de trabalho no Brasil e estabelece direitos e deveres relacionados aos trabalhadores e empregadores.\n\nNormas Regulamentadoras (NRs):\nAs Normas Regulamentadoras passaram a estabelecer regras específicas relacionadas à saúde e à segurança no trabalho. Cada NR aborda determinados aspectos da atividade profissional.\n\nNR-1:\nEstá relacionada às disposições gerais e ao gerenciamento dos riscos ocupacionais.\n\nNR-6:\nEstá relacionada aos Equipamentos de Proteção Individual (EPIs).\n\nNR-12:\nEstabelece aspectos de segurança relacionados a máquinas e equipamentos.\n\nNR-35:\nEstá relacionada ao trabalho em altura.\n\nA evolução da Saúde e Segurança do Trabalho demonstra uma ampliação progressiva do olhar sobre aquilo que pode ameaçar a integridade do trabalhador.","check":null},{"title":"Bloco 2: Riscos Psicossociais no Trabalho","sub":"","body":"Durante muito tempo, a atenção aos riscos ocupacionais esteve fortemente direcionada aos aspectos físicos, químicos e biológicos, como vibração de máquinas, exposição a produtos tóxicos e riscos de acidentes.\n\nA consideração dos riscos psicossociais amplia essa compreensão ao incluir fatores relacionados à maneira como o trabalho é organizado, às relações estabelecidas dentro da organização e às possibilidades de autonomia do trabalhador.\n\nSituações como sobrecarga, metas excessivas, assédio e jornadas exaustivas passam a integrar esse olhar sobre os riscos presentes no trabalho.\n\nOs riscos psicossociais podem ser organizados em três grandes dimensões:\n\nOrganização e Carga de Trabalho:\nRelaciona-se às demandas, ao volume de trabalho, às metas, à definição das responsabilidades e às condições existentes para realizar a atividade.\n\nRelacionamentos e Gestão:\nEnvolve as relações entre trabalhadores, colegas e lideranças, incluindo suporte, comunicação, conflitos, reconhecimento e condutas abusivas.\n\nAutonomia e Controle:\nRelaciona-se à possibilidade de o trabalhador participar das decisões que afetam sua atividade e possuir algum grau de liberdade sobre a maneira como realiza seu trabalho.\n\nOs modelos e instrumentos estudados anteriormente ajudam a compreender essas dimensões. O modelo Demanda–Controle observa especialmente a relação entre demandas e controle/autonomia; o modelo Esforço–Recompensa analisa a relação entre aquilo que o trabalhador investe e a recompensa recebida; enquanto o COPSOQ possui caráter multidimensional e procura abranger diferentes fatores psicossociais.","check":null},{"title":"Bloco 3: Organização e Carga de Trabalho","sub":"","body":"A maneira como as atividades são organizadas pode produzir diferentes riscos psicossociais.\n\nSobrecarga de Trabalho:\nEstá relacionada a um volume desproporcional de atividades, prazos curtos ou demandas excessivas. Situações de alta demanda associadas a pouca autonomia podem produzir maior desgaste para o trabalhador.\n\nBaixa Demanda:\nA existência de poucas atividades também pode representar um problema. Quando prolongada, pode produzir sensação de inutilidade e desmotivação. Esse aspecto nem sempre aparece com a mesma intensidade nos resultados quantitativos e pode exigir investigação qualitativa.\n\nAmbiguidade ou Falta de Clareza de Papel:\nO trabalhador precisa compreender suas responsabilidades, tarefas e limites. Quando não sabe exatamente o que deve realizar ou o que a organização espera de sua função, podem surgir insegurança e confusão.\n\nMetas Inatingíveis:\nCobranças por resultados que não correspondem aos recursos disponíveis também constituem um fator que precisa ser observado.\n\nO mapeamento desses fatores pode utilizar instrumentos quantitativos, mas os resultados não devem ser compreendidos isoladamente. A investigação qualitativa permite conversar com os trabalhadores e compreender como essas condições aparecem na experiência cotidiana.\n\nAssim, questionários podem indicar onde existem possíveis problemas, enquanto entrevistas e grupos permitem aprofundar a compreensão daquela realidade.","check":null},{"title":"Bloco 4: Relacionamentos, Gestão, Autonomia e Intervenção","sub":"","body":"Os riscos psicossociais também podem surgir das relações estabelecidas dentro da organização e da maneira como o trabalhador participa de sua própria atividade.\n\nAssédio e Condutas Abusivas:\nIncluem condutas abusivas de diferentes naturezas, entre elas situações de assédio moral e sexual.\n\nFalta de Suporte:\nCorresponde à ausência de apoio prático ou emocional por parte das lideranças ou dos próprios colegas.\n\nConflitos Interpessoais:\nPodem aparecer por meio de relações deterioradas, atritos constantes e comunicação agressiva dentro das equipes.\n\nComunicação:\nVai além da maneira como as pessoas falam umas com as outras. Envolve clareza de papéis, estabelecimento de limites, capacidade de escutar e ser ouvido e comunicação entre trabalhadores, equipes, lideranças e diferentes setores.\n\nBaixo Reconhecimento:\nPode ocorrer quando existe desequilíbrio entre o esforço empregado pelo trabalhador e a valorização recebida.\n\nFalta de Participação:\nOcorre quando o trabalhador possui pouca ou nenhuma possibilidade de participar das decisões relacionadas à própria rotina de trabalho.\n\nMicrogerenciamento:\nRepresenta o controle excessivo sobre a maneira exata como as tarefas devem ser executadas, reduzindo o espaço de autonomia do trabalhador.\n\nInsegurança no Emprego:\nPode estar relacionada ao medo constante de demissão ou à instabilidade contratual. Essa insegurança pode inclusive fazer com que o trabalhador aceite atividades que não correspondem claramente ao seu papel por receio de se posicionar.\n\nAutonomia não significa ausência de regras. Ela envolve a possibilidade de o trabalhador possuir algum espaço para decidir, opinar e organizar aspectos de sua atividade dentro dos limites de sua função.\n\nO mapeamento dos riscos deve conduzir a um plano de ação. Mesmo resultados intermediários precisam ser observados, pois podem indicar condições que necessitam de intervenção antes que se tornem mais graves.\n\nA atuação do psicólogo também exige cuidado com as informações obtidas nas entrevistas e grupos. O conteúdo individual das conversas deve ser preservado, enquanto os problemas identificados podem fundamentar propostas de mudanças na organização.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: O Setor Comercial\n\nUma empresa identifica aumento do desgaste entre os trabalhadores do setor comercial. Os funcionários relatam excesso de demandas, metas difíceis de alcançar, pouca clareza sobre suas responsabilidades, comunicação agressiva da liderança e controle excessivo sobre a execução das tarefas. Um questionário indica níveis elevados de risco em algumas dimensões e resultados intermediários em outras, levando a organização a realizar também entrevistas e grupos para compreender melhor a realidade do setor.\n\nPergunta Avaliativa\n\nIdentifique os riscos psicossociais presentes no caso, classifique-os entre organização e carga de trabalho, relacionamentos e gestão e autonomia e controle, e explique por que o mapeamento quantitativo deve ser complementado pela investigação qualitativa.","criteria":[],"expected":""}},{"title":"Aula 8 — Saúde e Segurança do Trabalho: Gestão dos Riscos e Hierarquia de Prevenção","steps":[{"title":"Bloco 1: Programas e Estruturas da Saúde e Segurança do Trabalho","sub":"","body":"A gestão da Saúde e Segurança do Trabalho envolve diferentes estruturas e programas que atuam de maneira articulada na identificação, prevenção, acompanhamento e gerenciamento dos riscos presentes nas organizações.\n\nSESMT — Serviço Especializado em Engenharia de Segurança e em Medicina do Trabalho:\nÉ uma equipe multidisciplinar relacionada à saúde e à segurança do trabalho. Tradicionalmente, envolve profissionais como engenheiros de segurança, técnicos de segurança e médicos do trabalho. Com a ampliação da atenção aos riscos psicossociais, o psicólogo também passa a participar dessa atuação, especialmente no diagnóstico, prevenção, intervenção e acompanhamento desses riscos.\n\nCIPA — Comissão Interna de Prevenção de Acidentes:\nÉ formada com a participação dos próprios trabalhadores da organização. Por estarem inseridos no cotidiano da empresa, esses trabalhadores podem identificar situações de risco e propor melhorias relacionadas às condições de trabalho e à prevenção.\n\nPCMSO — Programa de Controle Médico de Saúde Ocupacional:\nEstá relacionado ao acompanhamento médico da saúde dos trabalhadores. Organiza os exames necessários durante o vínculo empregatício, incluindo exames admissionais, periódicos e demissionais.\n\nPGR — Programa de Gerenciamento de Riscos:\nÉ o programa no qual os riscos ocupacionais são identificados e avaliados, juntamente com o planejamento das ações necessárias para seu gerenciamento. Os riscos psicossociais identificados e seus respectivos planos de ação também passam a integrar esse processo.\n\nEssas estruturas não funcionam de maneira isolada. O gerenciamento dos riscos depende da articulação entre diferentes profissionais, programas e trabalhadores da própria organização.","check":null},{"title":"Bloco 2: As Cinco Dimensões dos Riscos no Trabalho","sub":"","body":"Os riscos presentes no ambiente de trabalho podem possuir diferentes naturezas. A análise deve considerar tanto riscos mais diretamente relacionados às condições físicas do ambiente quanto aqueles relacionados à organização e às relações de trabalho.\n\nRiscos Físicos:\nEnvolvem exposições como ruídos excessivos, vibrações, radiação e temperaturas extremas.\n\nRiscos Químicos:\nEstão relacionados à exposição a materiais e substâncias, como poeiras, gases industriais, vapores e substâncias tóxicas.\n\nRiscos Biológicos:\nEnvolvem a exposição a agentes biológicos, como vírus, bactérias e parasitas. Podem aparecer, por exemplo, em atividades realizadas em hospitais e serviços de saneamento.\n\nRiscos Ergonômicos:\nPodem envolver postura inadequada, levantamento de peso, mobiliário, movimentos repetitivos e outras características da atividade. Esse olhar também pode considerar aspectos relacionados às exigências cognitivas, jornadas prolongadas, controle rígido da produtividade e ritmos excessivos de trabalho.\n\nRiscos Psicossociais:\nEstão especialmente relacionados à organização, à gestão e às relações de trabalho. Entre os exemplos estão sobrecarga crônica, metas excessivas, assédio moral, violência no trabalho, falta de autonomia, insegurança no emprego e desequilíbrio entre esforço e recompensa.\n\nOs riscos psicossociais ampliam a análise para aspectos menos visíveis da atividade. A fonte do risco pode estar na cultura da organização, na liderança, na maneira como as tarefas são organizadas, nas metas estabelecidas ou nas relações existentes no trabalho.\n\nEnquanto alguns riscos tradicionais podem produzir acidentes e lesões mais imediatas, os psicossociais podem estar relacionados a processos de adoecimento que se desenvolvem ao longo do tempo.","check":null},{"title":"Bloco 3: Avaliação, Matriz de Risco e Atuação do Psicólogo","sub":"","body":"O gerenciamento dos riscos exige primeiro identificar aquilo que está acontecendo na organização. Nos riscos psicossociais, podem ser utilizados os instrumentos quantitativos e qualitativos estudados anteriormente, como Demanda–Controle, Esforço–Recompensa, COPSOQ e processos de escuta.\n\nDiagnóstico:\nO psicólogo pode participar da aplicação e interpretação dos instrumentos utilizados para identificar os riscos psicossociais presentes na organização.\n\nMatriz de Risco:\nOs riscos identificados podem ser classificados considerando elementos como sua probabilidade e severidade. Dessa forma, torna-se possível estabelecer quais situações necessitam de maior prioridade de intervenção.\n\nUm risco considerado crítico exige maior urgência. Entretanto, situações intermediárias também precisam ser acompanhadas para evitar seu agravamento.\n\nPor exemplo, uma avaliação pode identificar como risco mais elevado a presença de metas inatingíveis associadas à insegurança no emprego, enquanto problemas de comunicação e conflitos de papel aparecem em nível intermediário. Esses resultados orientam a construção do plano de ação.\n\nPrevenção e Redesenho:\nA atuação não termina na identificação do problema. A partir dos riscos encontrados, devem ser propostas mudanças capazes de prevenir seu agravamento e reorganizar aspectos do trabalho que estejam contribuindo para sua ocorrência.\n\nMonitoramento:\nDepois das intervenções, os indicadores precisam continuar sendo acompanhados. Novos mapeamentos, avaliações e outros indicadores organizacionais podem ajudar a observar se as ações realizadas produziram mudanças.\n\nApoio Direto:\nO psicólogo também pode realizar escuta, orientação e, quando necessário, encaminhamento para serviços especializados. Entretanto, esse apoio individual não substitui a intervenção sobre as condições organizacionais que estão produzindo ou mantendo os riscos.","check":null},{"title":"Bloco 4: Hierarquia de Prevenção e Intervenção na Fonte do Risco","sub":"","body":"Depois que um risco é identificado, o plano de ação precisa estabelecer como ele será enfrentado. A lógica da hierarquia de prevenção prioriza intervenções direcionadas à própria fonte do risco.\n\nEliminação:\nÉ a primeira possibilidade e a mais importante. Busca retirar a própria fonte que está produzindo o risco. Se rankings abusivos de desempenho, por exemplo, estão produzindo pressão e sofrimento, deve-se considerar a eliminação dessa prática.\n\nSubstituição:\nQuando não é possível eliminar completamente determinada condição, busca-se substituir a prática ou o método por outro que produza menor risco.\n\nControles de Engenharia:\nBuscam criar condições ou barreiras capazes de reduzir a exposição ao risco quando ele não pode ser completamente eliminado ou substituído.\n\nControles Administrativos:\nEnvolvem mudanças na organização do trabalho. Podem incluir reorganização de tarefas, implementação de pausas, mudanças nos turnos, rodízios, revisão de metas, horários e outras práticas organizacionais.\n\nProteção e Ações Individuais:\nIntervenções direcionadas diretamente ao trabalhador aparecem no nível mais baixo da hierarquia. Podem envolver ações voltadas ao manejo individual, como atividades de relaxamento, resiliência, meditação ou outras estratégias de cuidado.\n\nEssas ações individuais podem produzir benefícios, mas não devem ocupar o lugar principal quando a fonte do problema está na própria organização do trabalho. Se o trabalhador recebe demandas durante a noite, enfrenta metas excessivas, comunicação inadequada e pressão constante, ensinar técnicas de relaxamento não elimina essas condições.\n\nPor isso, a intervenção deve priorizar a empresa e a fonte do risco, e não responsabilizar exclusivamente o trabalhador pelo sofrimento apresentado. O apoio individual permanece importante, mas precisa estar articulado às mudanças organizacionais necessárias.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Central de Vendas\n\nUma empresa identifica, por meio do mapeamento dos riscos psicossociais, metas inatingíveis, ameaças relacionadas à demissão, demandas enviadas fora do horário de trabalho e conflitos frequentes de comunicação. Como resposta inicial, a gestão propõe oferecer aos funcionários atividades de relaxamento e um workshop sobre resiliência, sem modificar as metas, os horários ou as práticas de gestão que apareceram como fontes dos riscos.\n\nPergunta Avaliativa\n\nConsiderando a hierarquia de prevenção, explique por que as ações propostas pela empresa não devem constituir a principal intervenção e indique onde o plano de ação deveria concentrar seus esforços.","criteria":[],"expected":""}},{"title":"Aula 9 — Gênero e Relações Organizacionais: Divisão Sexual do Trabalho, Segregação e Desigualdades","steps":[{"title":"Bloco 1: Gênero como Construção Social nas Relações de Trabalho","sub":"","body":"Quando determinadas profissões são percebidas como “trabalho de homem” ou “trabalho de mulher”, essa divisão não pode ser compreendida apenas a partir das características das atividades. Ela também está relacionada a construções sociais e culturais sobre gênero e trabalho.\n\nAo longo da história, profissões passaram por mudanças importantes. O secretariado, por exemplo, já foi uma atividade predominantemente masculina e posteriormente tornou-se fortemente associado às mulheres. A Medicina também esteve historicamente mais restrita aos homens, enquanto atualmente apresenta maior participação feminina. A Enfermagem, por sua vez, também passou por transformações em sua composição ao longo do tempo.\n\nEssas mudanças ajudam a perceber que a associação entre determinada profissão e um gênero não é necessariamente fixa.\n\nSexo e Gênero:\nNo contexto institucional, informações relacionadas ao sexo podem aparecer como dados cadastrais. O conceito de gênero, entretanto, é mais amplo e envolve papéis, expectativas e normas sociais construídos em determinada sociedade e cultura.\n\nPapéis de Gênero:\nExistem expectativas sociais sobre comportamentos e funções consideradas mais adequadas para homens e mulheres. Essas expectativas podem influenciar quem é percebido como alguém que deve liderar, cuidar, exercer autoridade ou assumir determinadas responsabilidades.\n\nGênero e Relações de Poder:\nAs relações de gênero também participam da organização das relações de poder. Dessa forma, podem influenciar quem ocupa determinados espaços, quem assume posições de liderança e quais comportamentos são esperados de diferentes pessoas dentro das organizações.\n\nPor isso, compreender gênero nas relações organizacionais exige considerar que as organizações também estão inseridas em uma cultura e podem reproduzir expectativas e estereótipos existentes na própria sociedade.","check":null},{"title":"Bloco 2: Trabalho Produtivo, Trabalho Reprodutivo e Responsabilidade de Cuidado","sub":"","body":"Uma distinção importante para compreender as desigualdades de gênero é aquela existente entre trabalho produtivo e trabalho reprodutivo.\n\nTrabalho Produtivo:\nÉ o trabalho formalmente reconhecido e remunerado. Está relacionado ao emprego, aos cargos, aos salários e às atividades realizadas no mercado de trabalho.\n\nTrabalho Reprodutivo:\nEstá relacionado à manutenção e à reprodução da vida. Envolve atividades como cuidar da casa, preparar alimentos, realizar tarefas domésticas e cuidar de crianças, idosos ou pessoas que necessitam de assistência.\n\nO trabalho reprodutivo é necessário para que o próprio trabalho produtivo aconteça. Para que uma pessoa consiga sair de casa e cumprir sua jornada profissional, diversas atividades relacionadas à alimentação, higiene, organização da casa e cuidado precisam ser realizadas.\n\nEntretanto, quando essas atividades são realizadas dentro da própria família, muitas vezes não são reconhecidas socialmente como trabalho. Quando são terceirizadas, passam a aparecer de maneira mais evidente como uma atividade profissional, como ocorre com diaristas e babás.\n\nResponsabilidade de Cuidado:\nAs responsabilidades relacionadas ao cuidado ainda são fortemente associadas às mulheres. Dessa forma, uma trabalhadora pode cumprir sua jornada profissional e, ao encerrá-la, iniciar uma segunda jornada relacionada às atividades domésticas e familiares.\n\nDupla Jornada:\nA combinação entre trabalho remunerado e responsabilidades domésticas e de cuidado pode produzir jornadas extensas e aumentar as exigências vivenciadas pelas trabalhadoras.\n\nRede de Apoio:\nA experiência de uma pessoa que possui responsabilidades de cuidado pode ser muito diferente dependendo da existência ou não de uma rede de apoio. Sem essa rede, atividades relacionadas aos filhos, à casa ou ao cuidado de familiares precisam ser conciliadas diretamente com as demandas profissionais.\n\nEssa sobreposição de jornadas também pode representar uma condição importante para a compreensão dos riscos psicossociais e do esgotamento.","check":null},{"title":"Bloco 3: Segregação Horizontal e Segregação Vertical","sub":"","body":"As desigualdades de gênero no mercado de trabalho também podem aparecer na forma como homens e mulheres estão distribuídos entre profissões, setores e posições hierárquicas.\n\nSegregação Horizontal:\nOcorre quando existe concentração de homens e mulheres em ocupações e setores diferentes.\n\nAlgumas atividades relacionadas à educação básica, Educação Infantil, Enfermagem, Serviço Social, secretariado e cuidados pessoais são fortemente associadas ao público feminino.\n\nOutras atividades, como construção civil, transporte, manutenção e determinadas áreas da Engenharia, aparecem mais associadas ao público masculino.\n\nEssa divisão não significa necessariamente que homens ou mulheres não possuam capacidade para realizar determinada atividade. Ela está relacionada também aos estereótipos e construções culturais existentes sobre aquilo que seria considerado trabalho masculino ou feminino.\n\nSegregação Vertical:\nRefere-se à distribuição desigual de homens e mulheres nos diferentes níveis hierárquicos das organizações.\n\nMesmo com o crescimento da participação feminina no mercado de trabalho e também em posições de liderança, ainda pode existir maior presença masculina nos níveis mais elevados das organizações.\n\nAssim, uma organização pode apresentar grande quantidade de mulheres em seu quadro de trabalhadores e, ao mesmo tempo, possuir predominância masculina nos cargos de maior poder e decisão.\n\nA segregação horizontal ajuda a observar onde homens e mulheres estão concentrados. A segregação vertical permite analisar quais posições hierárquicas ocupam dentro dessas estruturas.","check":null},{"title":"Bloco 4: Maternidade, Disponibilidade e Desigualdades nas Organizações","sub":"","body":"As expectativas relacionadas ao gênero também podem aparecer nos processos de seleção, desenvolvimento profissional, remuneração e acesso aos cargos de liderança.\n\nDisponibilidade para o Trabalho:\nDeterminados critérios aparentemente neutros, como exigir ampla disponibilidade de horários, podem produzir efeitos diferentes dependendo das responsabilidades existentes fora do trabalho.\n\nComo as responsabilidades de cuidado ainda são frequentemente atribuídas às mulheres, essas exigências podem interferir de maneira diferente na trajetória profissional de homens e mulheres.\n\nMaternidade e Carreira:\nA maternidade pode estar associada a interrupções ou mudanças na trajetória profissional. Mulheres com filhos também podem enfrentar expectativas relacionadas à sua disponibilidade para o trabalho, especialmente quando são consideradas as responsabilidades de cuidado.\n\nEssas expectativas podem aparecer inclusive nos processos seletivos, quando questões relacionadas a filhos, possibilidade de novas gestações ou organização dos cuidados familiares passam a interferir na maneira como uma candidata é percebida.\n\nDesigualdade Salarial:\nAs diferenças de remuneração precisam ser compreendidas considerando diferentes elementos, como concentração das mulheres em ocupações menos remuneradas, menor presença em cargos de chefia, interrupções na carreira e diferenças relacionadas a bonificações e oportunidades profissionais.\n\nIntersecção com Outras Desigualdades:\nAs desigualdades relacionadas ao gênero também podem se combinar com outras estruturas sociais. Quando se considera, por exemplo, a situação das mulheres negras, gênero e racismo podem produzir experiências diferentes daquelas vivenciadas por mulheres brancas ou homens.\n\nDessa forma, analisar gênero nas organizações não significa apenas observar quantos homens e mulheres trabalham em determinado local. É necessário compreender como as oportunidades, responsabilidades de cuidado, remuneração, distribuição das profissões e acesso às posições de poder estão organizados.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Trajetória de Renata\n\nRenata trabalha em uma grande empresa, possui dois filhos pequenos e divide seu tempo entre a jornada profissional e grande parte das responsabilidades domésticas e de cuidado. Embora mulheres sejam maioria entre os trabalhadores da empresa, os principais cargos de liderança são ocupados por homens. Ao tentar participar de um processo interno para uma função de chefia, Renata percebe que a ampla disponibilidade de horários é tratada como um dos principais critérios e começa a questionar como as responsabilidades de cuidado podem interferir nas oportunidades profissionais.\n\nPergunta Avaliativa\n\nConsiderando os conceitos de gênero, trabalho produtivo e reprodutivo, segregação horizontal e vertical e responsabilidade de cuidado, explique como as relações de gênero podem influenciar a trajetória profissional e o acesso às oportunidades dentro das organizações.","criteria":[],"expected":""}},{"title":"Aula 10 — Vieses Inconscientes, Estereótipos, Diversidade e Inclusão nas Organizações","steps":[{"title":"Bloco 1: Gênero, Cultura e Desigualdades no Trabalho","sub":"","body":"O gênero pode ser compreendido como uma construção social, formada por expectativas, papéis e normas que uma sociedade atribui às pessoas. Essas construções também aparecem nas organizações e podem influenciar a distribuição das atividades, as relações de poder e as oportunidades profissionais.\n\nA análise das relações de gênero no trabalho precisa considerar não apenas o gênero, mas também outros elementos, como raça, classe social e status, que podem se combinar na produção de diferentes experiências dentro das organizações.\n\nTrabalho Produtivo e Reprodutivo:\nO trabalho produtivo está relacionado ao espaço formal, remunerado e reconhecido profissionalmente. O trabalho reprodutivo envolve a manutenção da vida, como cuidar da casa, dos filhos, da alimentação e de outras pessoas. Quando essas responsabilidades se acumulam, podem surgir jornadas duplas ou triplas.\n\nSegregação Horizontal:\nRefere-se à concentração de homens e mulheres em diferentes profissões e setores. Áreas relacionadas ao cuidado, como Enfermagem e Educação Básica, apresentam maior concentração feminina, enquanto outras ocupações possuem maior presença masculina.\n\nSegregação Vertical:\nRefere-se à distribuição desigual entre os níveis hierárquicos. Mesmo com a ampliação da participação feminina no mercado de trabalho, as mulheres ainda aparecem em menor proporção nos níveis mais elevados de liderança e gestão.\n\nMaternidade e Trabalho:\nAs expectativas relacionadas ao cuidado também podem produzir efeitos diferentes para homens e mulheres. A maternidade pode ser associada a uma expectativa de menor disponibilidade profissional, enquanto a paternidade pode ser relacionada à ideia de responsabilidade, maturidade e necessidade de prover a família.\n\nEssas construções ajudam a compreender por que critérios aparentemente neutros podem produzir impactos diferentes dependendo das condições e responsabilidades de cada trabalhador.","check":null},{"title":"Bloco 2: Vieses Inconscientes e Estereótipos","sub":"","body":"Os vieses inconscientes estão relacionados a associações e atalhos construídos ao longo da vida. Experiências pessoais, relações familiares, cultura e informações recebidas socialmente participam da formação dessas associações.\n\nEsses processos ajudam a compreender por que determinadas características podem ser automaticamente relacionadas a certas profissões, comportamentos ou posições sociais.\n\nEstereótipos:\nSão categorizações associadas a pessoas ou grupos sociais. Ao pensar em determinadas profissões, por exemplo, uma pessoa pode automaticamente imaginar um homem ou uma mulher, mesmo que a atividade possa ser realizada por ambos.\n\nCrenças:\nAo longo da vida, diferentes crenças podem ser aprendidas por meio da família, da escola, das experiências pessoais e da própria cultura. Quando são repetidas e naturalizadas, podem passar a ser percebidas como verdades.\n\nPreconceito:\nPode surgir quando estereótipos e crenças participam da construção de julgamentos negativos sobre determinada pessoa ou grupo.\n\nOs vieses não surgem exclusivamente de características individuais. Eles também são influenciados pelas construções sociais e culturais presentes no ambiente em que a pessoa se desenvolve.\n\nPor isso, uma associação pode ocorrer antes mesmo de uma análise consciente. Ao imaginar alguém comandando um avião, ocupando uma posição de liderança ou exercendo determinada profissão, características como gênero, raça ou aparência podem interferir na imagem que surge inicialmente.\n\nA questão torna-se especialmente importante quando essas associações passam a influenciar decisões concretas dentro das organizações.","check":null},{"title":"Bloco 3: Vieses nos Processos Organizacionais","sub":"","body":"Os vieses podem interferir em diferentes decisões profissionais, especialmente quando determinados critérios não estão claramente definidos.\n\nRecrutamento e Seleção:\nAntes mesmo de iniciar uma seleção, pode existir uma imagem do perfil considerado adequado para determinada vaga. Essa expectativa pode influenciar a maneira como currículos e candidatos são avaliados.\n\nDurante uma entrevista, por exemplo, perguntas relacionadas à maternidade podem ser direcionadas às mulheres enquanto questões semelhantes relacionadas à paternidade podem não ser feitas aos homens.\n\nPerfil Esperado:\nExpressões como “encaixar no perfil da empresa” precisam ser analisadas com atenção. É importante compreender quais critérios definem esse perfil e quem estabeleceu essas características.\n\nAvaliação e Promoção:\nOs vieses também podem aparecer na maneira como trabalhadores são avaliados, reconhecidos ou considerados para novas oportunidades e posições hierárquicas.\n\nUma possibilidade para reduzir a influência desses julgamentos é estabelecer critérios objetivos relacionados às exigências reais da função.\n\nSe determinada atividade exige comunicação, por exemplo, essa competência pode ser previamente definida como um critério técnico de avaliação. Dessa forma, a análise procura se concentrar nas características necessárias ao trabalho, e não apenas na impressão produzida pelo candidato.\n\nOutra possibilidade é envolver diferentes profissionais nos processos de avaliação e seleção, evitando que todas as decisões permaneçam concentradas sempre nas mesmas pessoas.\n\nO objetivo não é imaginar que os vieses possam simplesmente desaparecer, mas desenvolver práticas capazes de favorecer decisões mais conscientes e fundamentadas nas exigências efetivas do trabalho.","check":null},{"title":"Bloco 4: Diversidade, Inclusão e Pertencimento","sub":"","body":"Diversidade e inclusão são conceitos relacionados, mas não significam a mesma coisa.\n\nDiversidade:\nEstá relacionada à multiplicidade e à variedade existente entre as pessoas. Essa diversidade pode envolver características sociais, experiências, pensamentos, ideias, habilidades e diferentes formas de compreender o mundo.\n\nNo contexto organizacional, também se discute a participação de grupos que apresentam menor representatividade em determinados espaços, especialmente nos cargos de gestão e liderança.\n\nInclusão:\nNão significa apenas permitir que pessoas diferentes estejam presentes em uma organização. É necessário considerar se elas efetivamente conseguem participar e se sentem pertencentes ao ambiente.\n\nPertencimento:\nEnvolve a percepção de fazer parte daquele espaço e poder participar das relações e atividades existentes.\n\nValorização:\nNão basta estar presente. A pessoa precisa perceber que sua contribuição pode ser considerada e que possui oportunidades de participar de projetos, decisões e discussões.\n\nRespeito:\nAs relações precisam permitir que diferentes pessoas sejam tratadas com respeito, sem que piadas, brincadeiras ou comportamentos produzam situações de exclusão.\n\nSegurança Psicológica:\nA experiência de sentir que determinado ambiente é seguro interfere na possibilidade de participação. Quando uma pessoa percebe ameaça, exclusão ou desvalorização, sua relação com aquele ambiente pode ser afetada.\n\nAssim, uma organização pode apresentar diversidade em sua composição e ainda não possuir inclusão efetiva. Trazer diferentes pessoas para dentro do ambiente organizacional representa apenas uma parte do processo. É necessário observar se elas encontram pertencimento, valorização, respeito e condições para participar.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Seleção da Horizonte\n\nA Horizonte afirma valorizar a diversidade, mas percebe que suas contratações e promoções continuam formando equipes muito semelhantes. Embora não existam critérios explícitos relacionados a gênero ou raça, os gestores afirmam frequentemente que escolhem candidatos que “combinam com o perfil da empresa”. Além disso, mulheres são questionadas sobre filhos durante algumas entrevistas, enquanto a paternidade raramente aparece nas entrevistas dos homens.\n\nPergunta Avaliativa\n\nConsiderando os conceitos de vieses inconscientes, estereótipos, diversidade e inclusão, explique como os vieses podem influenciar decisões aparentemente neutras na Horizonte e indique como critérios mais objetivos podem contribuir para os processos organizacionais.","criteria":[],"expected":""}},{"title":"Aula 11 — Segurança Psicológica nas Organizações","steps":[{"title":"Bloco 1: Segurança Psicológica e Risco Interpessoal","sub":"","body":"A segurança psicológica, conceito desenvolvido a partir dos estudos de Amy Edmondson, refere-se à crença compartilhada de que uma equipe constitui um ambiente seguro para assumir riscos interpessoais.\n\nEsses riscos aparecem quando o trabalhador decide utilizar sua voz dentro do grupo, mesmo sabendo que poderá se expor diante das outras pessoas.\n\nArriscar a Voz:\nSignifica sentir que existe espaço para perguntar, questionar, discordar, apresentar ideias, fazer sugestões, demonstrar uma dúvida ou incerteza e admitir um erro.\n\nAdmitir que Não Sabe:\nEm um ambiente com segurança psicológica, a pessoa pode reconhecer que não compreendeu uma orientação ou que não sabe realizar determinada atividade sem esperar ser ridicularizada ou desvalorizada.\n\nDiscordar:\nSegurança psicológica também envolve poder apresentar uma opinião diferente. A discordância pode existir sem que a própria pessoa passe a ser tratada como o problema.\n\nAdmitir Erros:\nO trabalhador consegue comunicar uma falha mais cedo, permitindo que ela seja analisada e, quando possível, corrigida antes que produza consequências maiores.\n\nOs estudos sobre segurança psicológica mostraram uma questão importante: equipes que relatavam mais erros não eram necessariamente aquelas que mais erravam. Em alguns casos, eram justamente aquelas em que as pessoas se sentiam mais seguras para reconhecer e comunicar as falhas.\n\nEm ambientes com baixa segurança psicológica, os erros podem continuar existindo, mas permanecer escondidos por mais tempo.\n\nAssim, o silêncio também possui consequências. Uma dúvida que não é apresentada pode posteriormente contribuir para uma falha, enquanto uma informação importante pode deixar de chegar à equipe porque a pessoa não se sente segura para falar.","check":null},{"title":"Bloco 2: O que Segurança Psicológica É — e o que Não É","sub":"","body":"Segurança psicológica não significa ausência de cobrança, conflitos, responsabilidades ou consequências. Também não significa possuir liberdade para falar qualquer coisa de qualquer maneira.\n\nNão é Ausência de Cobrança:\nUma organização pode estabelecer metas, exigir resultados e manter padrões elevados de desempenho ao mesmo tempo em que permite que as pessoas apresentem dúvidas, problemas e erros.\n\nNão é Ausência de Conflito:\nDiscordâncias podem acontecer. A diferença está na possibilidade de discutir questões relacionadas à tarefa sem transformar a divergência em ataques pessoais ou questionamentos sobre o caráter de alguém.\n\nNão é Poder Dizer Tudo:\nA liberdade de expressão dentro da equipe não representa autorização para desrespeitar, humilhar ou ridicularizar outras pessoas. A fala também envolve responsabilidade, respeito e consideração sobre a forma e o momento em que algo é apresentado.\n\nA relação entre segurança psicológica e padrão de desempenho permite compreender diferentes ambientes de trabalho.\n\nBaixa Segurança + Baixo Padrão de Desempenho:\nPode produzir um ambiente marcado pela apatia. Existem poucas exigências, mas também pouca abertura para participação e manifestação.\n\nAlta Segurança + Baixo Padrão de Desempenho:\nPode produzir uma zona de conforto. As pessoas possuem abertura para falar e participar, mas existem poucas exigências relacionadas ao desempenho.\n\nBaixa Segurança + Alto Padrão de Desempenho:\nPode produzir um ambiente marcado por ansiedade e medo. Existem cobranças elevadas, mas as pessoas não se sentem seguras para comunicar problemas, discordar ou admitir erros.\n\nAlta Segurança + Alto Padrão de Desempenho:\nRepresenta uma condição favorável ao aprendizado e ao crescimento. Existem cobranças e expectativas de desempenho, mas também abertura para perguntas, sugestões, discordâncias e comunicação das falhas.\n\nPortanto, segurança psicológica não elimina a responsabilidade profissional. O objetivo é permitir que desempenho e abertura para aprendizagem possam coexistir.","check":null},{"title":"Bloco 3: Sinais de Baixa e Alta Segurança Psicológica","sub":"","body":"A segurança psicológica pode ser percebida por comportamentos presentes no cotidiano das equipes.\n\nSinais de Baixa Segurança Psicológica:\nQuando apenas o líder fala e os demais permanecem em silêncio ou simplesmente concordam, pode existir dificuldade para apresentar opiniões diferentes. Os erros também podem aparecer somente quando já produziram consequências ou quando não podem mais ser escondidos.\n\nPerguntas podem ser interpretadas como sinal de fraqueza ou falta de conhecimento, fazendo com que trabalhadores evitem demonstrar dúvidas. Em alguns contextos, pessoas podem até deixar a organização sem apresentar os motivos reais de sua saída.\n\nO medo de errar, ser ridicularizado, desvalorizado ou sofrer consequências também pode fortalecer uma cultura do silêncio.\n\nSinais de Alta Segurança Psicológica:\nDúvidas e problemas aparecem mais cedo nas discussões da equipe. As pessoas conseguem apresentar opiniões diferentes, fazer perguntas e comunicar falhas antes que os problemas se agravem.\n\nA própria liderança também consegue reconhecer quando não sabe alguma coisa ou quando precisa de ajuda. Essa postura demonstra que admitir uma limitação não precisa ser interpretado automaticamente como incompetência.\n\nQuando ocorre um erro, a equipe pode analisar o que aconteceu, investigar o processo e pensar em possíveis soluções, em vez de concentrar toda a discussão apenas na culpabilização de uma pessoa.\n\nIsso não significa ignorar responsabilidades individuais. Dependendo da situação, podem existir consequências. Entretanto, a análise procura compreender o ocorrido sem transformar automaticamente alguém em bode expiatório para problemas que também podem envolver fatores organizacionais ou sistêmicos.\n\nA forma como uma equipe reage às primeiras perguntas, discordâncias e erros funciona como referência para os demais trabalhadores. Se alguém é ridicularizado ao apresentar uma dúvida, outras pessoas podem aprender que é mais seguro permanecer em silêncio.","check":null},{"title":"Bloco 4: Liderança, Cultura e Saúde Mental","sub":"","body":"A liderança possui papel importante na construção da segurança psicológica porque suas reações ajudam a estabelecer aquilo que é aceito ou não dentro da equipe.\n\nPostura da Liderança:\nQuando um trabalhador comunica um problema, a maneira como o líder responde pode ampliar ou reduzir a possibilidade de novas manifestações. Acolher a informação, investigar o ocorrido e buscar soluções produz uma experiência diferente de ridicularizar, humilhar ou imediatamente culpabilizar alguém.\n\nComportamentos Tolerados:\nAquilo que a liderança permite que continue acontecendo também comunica os limites existentes no grupo. Comportamentos desrespeitosos tolerados podem se tornar referências sobre aquilo que é considerado aceitável naquele ambiente.\n\nFoco na Tarefa:\nDiante de discordâncias, a discussão pode permanecer concentrada na atividade, no problema ou na questão técnica. Quando o conflito passa para ataques pessoais, a possibilidade de participação pode diminuir.\n\nSaúde Mental e Riscos Psicossociais:\nA exposição contínua a um ambiente em que a pessoa sente medo de falar, perguntar ou errar pode contribuir para ansiedade, medo, silêncio e desgaste. Situações de humilhação e desvalorização também podem constituir importantes fatores de risco psicossocial.\n\nA segurança psicológica também pode ser relacionada a aspectos de autonomia e controle. Ter alguma possibilidade de participação, expressão e manifestação sobre aquilo que acontece no trabalho interfere na experiência do trabalhador dentro da organização.\n\nEm atividades que envolvem grande responsabilidade, já pode existir naturalmente maior preocupação com as consequências de uma falha. Quando essa responsabilidade se combina com uma cultura marcada pelo medo e pela impossibilidade de comunicar dificuldades, o peso experimentado pelo trabalhador pode se tornar ainda maior.\n\nAssim, construir segurança psicológica envolve tanto a possibilidade de falar quanto a capacidade da organização e das lideranças de escutar e lidar com aquilo que é apresentado.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Equipe de Rafael\n\nRafael trabalha em uma equipe com metas elevadas e forte cobrança por resultados. Durante as reuniões, quase somente o gestor fala e os demais costumam concordar. Depois de ver uma colega ser ridicularizada por fazer uma pergunta considerada óbvia, Rafael deixou de apresentar suas próprias dúvidas. Recentemente, percebeu uma possível falha em um processo, mas decidiu permanecer em silêncio por medo de ser responsabilizado caso estivesse errado.\n\nPergunta Avaliativa\n\nConsiderando o conceito de segurança psicológica, explique como a dinâmica da equipe de Rafael pode favorecer a cultura do silêncio e por que alta cobrança associada à baixa segurança psicológica pode aumentar riscos para os trabalhadores e para a própria organização.","criteria":[],"expected":""}},{"title":"Mapa de Conceitos — Mariana • 1º Bimestre","map":true,"concepts":[{"icon":"⚙️","title":"Taylorismo","text":"Eficiência, controle do tempo e dos movimentos, padronização e separação entre planejamento e execução."},{"icon":"🏭","title":"Fordismo","text":"Linha de montagem, ritmo determinado pelo sistema produtivo e baixa autonomia do trabalhador."},{"icon":"👥","title":"Relações Humanas","text":"Amplia o olhar para pertencimento, escuta, reconhecimento e relações interpessoais."},{"icon":"📋","title":"Trabalho Prescrito × Real","text":"Prescrito é o que está previsto; real é aquilo que efetivamente acontece e exige adaptações do trabalhador."},{"icon":"🧠","title":"Psicodinâmica do Trabalho","text":"Prazer, sofrimento, reconhecimento, estratégias defensivas e escuta coletiva."},{"icon":"🛠️","title":"Clínica da Atividade","text":"Atividade, poder de agir, atividade impedida e autoconfrontação."},{"icon":"📊","title":"Demanda–Controle","text":"Analisa exigências e autonomia. Alta demanda + baixo controle corresponde ao alto desgaste."},{"icon":"⚖️","title":"Esforço–Recompensa","text":"Observa o equilíbrio entre aquilo que o trabalhador investe e as recompensas recebidas."},{"icon":"🧩","title":"COPSOQ","text":"Instrumento multidimensional para avaliação dos riscos psicossociais, com análise por diferentes dimensões."},{"icon":"🚦","title":"Verde • Amarelo • Vermelho","text":"No COPSOQ, ajudam a visualizar condições favoráveis, situações de atenção e maiores níveis de risco."},{"icon":"🏢","title":"Riscos Psicossociais","text":"Relacionam-se à organização, gestão, relações, carga de trabalho, autonomia e condições em que o trabalho acontece."},{"icon":"🦺","title":"SST","text":"Saúde e Segurança do Trabalho: prevenção e promoção da integridade física e psíquica do trabalhador."},{"icon":"📑","title":"PGR","text":"Programa de Gerenciamento de Riscos: identifica, avalia e organiza ações para gerenciamento dos riscos ocupacionais."},{"icon":"👷","title":"SESMT","text":"Equipe multidisciplinar relacionada à saúde e à segurança do trabalho."},{"icon":"🩺","title":"PCMSO","text":"Programa relacionado ao acompanhamento médico da saúde dos trabalhadores."},{"icon":"🔺","title":"Hierarquia de Prevenção","text":"Prioriza agir na fonte: eliminação, substituição, controles de engenharia, controles administrativos e, por último, ações individuais."},{"icon":"♀️♂️","title":"Gênero","text":"Construção social envolvendo papéis, expectativas e normas que também atravessam as relações organizacionais."},{"icon":"↔️","title":"Segregação Horizontal","text":"Concentração de homens e mulheres em diferentes ocupações e setores."},{"icon":"↕️","title":"Segregação Vertical","text":"Distribuição desigual entre níveis hierárquicos e posições de poder."},{"icon":"🏠","title":"Trabalho Reprodutivo","text":"Atividades de manutenção da vida, como cuidado da casa, crianças, idosos e alimentação."},{"icon":"🔍","title":"Vieses Inconscientes","text":"Associações e atalhos que podem influenciar julgamentos, recrutamento, seleção, avaliação e promoção."},{"icon":"🌐","title":"Diversidade × Inclusão","text":"Diversidade é multiplicidade; inclusão envolve pertencimento, valorização, respeito e participação."},{"icon":"💬","title":"Segurança Psicológica","text":"Crença compartilhada de que a equipe é segura para assumir riscos interpessoais, como perguntar, discordar e admitir erros."},{"icon":"🤐","title":"Cultura do Silêncio","text":"Pode surgir quando dúvidas, erros e discordâncias são associados a ridicularização, punição ou desvalorização."}],"connection":"Saúde mental e trabalho → compreender a atividade e a subjetividade → mapear riscos → aprofundar a experiência → intervir na organização → acompanhar resultados."}],"ext":[{"title":"Olhar da Psicologia Organizacional","steps":[{"title":"Antes de intervir","sub":"Compreender vem primeiro","body":"A entrada em uma organização não deve partir da missão de encontrar erros ou culpados. O primeiro compromisso é compreender como aquela realidade foi construída.","check":null},{"title":"O que é organização?","sub":"Mais que prédio e organograma","body":"Pessoas, relações, poder, comunicação, cultura, liderança e formas de organizar o trabalho compõem a experiência organizacional.","check":null},{"title":"O que observar?","sub":"Um mapa sistêmico","body":"Quem participa? Quem decide? Quem é ouvido? Como circula informação? Como aparecem reconhecimento, autonomia, sobrecarga, conflitos e pertencimento?","check":null},{"title":"Erro individual ou dinâmica coletiva?","sub":"Amplie a lente","body":"Um comportamento individual pode refletir processos, regras, relações ou condições mais amplas.","check":null},{"title":"Reciprocidade","sub":"Pessoa e organização se afetam","body":"Não basta perguntar se o trabalhador serve à organização; também é legítimo perguntar que condições a organização oferece às pessoas.","check":null},{"title":"Ética da extensão","sub":"A comunidade não é laboratório","body":"A organização oferece tempo, acesso e confiança. A intervenção deve devolver algo útil, respeitoso e tecnicamente fundamentado.","check":{"q":"Na primeira visita, a direção diz que 'o problema são os funcionários'. Qual postura inicial é mais adequada?","opts":["Aceitar a explicação e planejar treinamento.","Ouvir diferentes atores, observar o contexto e formular a demanda com evidências.","Procurar culpados discretamente.","Aplicar testes imediatamente.","Prometer resolver o problema."],"ans":1,"why":"A imersão deve compreender antes de intervir."}}],"case":{"prompt":"Uma instituição pede uma palestra porque considera a equipe 'desmotivada'. Antes de aceitar a solução proposta, que perguntas e observações ajudariam a construir um olhar organizacional?","criteria":["pessoas/relações","trabalho/processos","liderança/comunicação","evidências/demanda"],"expected":"É necessário compreender quem é afetado, como o trabalho está organizado, como funcionam liderança e comunicação, quais indicadores ou relatos sustentam a demanda e se o padrão é coletivo. A palestra é uma possibilidade posterior, não o diagnóstico."}},{"title":"Imersão e identificação da demanda","steps":[{"title":"Tema ≠ demanda","sub":"Interesse não comprova necessidade","body":"O grupo pode chegar interessado em saúde mental, comunicação ou liderança, mas a demanda real precisa emergir do contato com a organização.","check":null},{"title":"Estudo prévio","sub":"Chegue preparado","body":"Conhecer o campo e o tipo de organização melhora perguntas e evita uma escuta genérica.","check":null},{"title":"Imersão","sub":"Escutar e observar","body":"Conversas, observação de rotinas e compreensão das relações ajudam a transformar impressões em evidências.","check":null},{"title":"Delimitação","sub":"Onde está o problema?","body":"Unidade, período, público afetado, evidências iniciais e impacto ajudam a delimitar a demanda.","check":null},{"title":"Supervisão","sub":"Refinar antes de agir","body":"Achados devem ser discutidos criticamente para separar interpretação precipitada de evidência.","check":null},{"title":"Fluxo","sub":"Tema → estudo → aproximação → escuta/observação → demanda → supervisão → intervenção","body":"Essa sequência protege o projeto de soluções prontas.","check":{"q":"O grupo quer trabalhar estresse, mas a imersão mostra que a principal queixa é ambiguidade de funções. O que fazer?","opts":["Manter estresse porque já estava escolhido.","Refinar a demanda a partir das evidências e supervisão.","Ignorar a organização.","Aplicar relaxamento.","Mudar o público sem justificar."],"ans":1,"why":"A demanda deve orientar a intervenção."}}],"case":{"prompt":"A organização pede 'motivação', mas entrevistas mostram sobrecarga, funções misturadas e falhas de treinamento. Formule uma demanda mais adequada sem antecipar a solução.","criteria":["evidências","delimitação","problema organizacional","sem solução embutida"],"expected":"A demanda pode ser formulada como necessidade de compreender fatores da organização do trabalho associados à sobrecarga, ambiguidade de funções e dificuldades de execução em determinado público/período. A formulação descreve o problema e suas evidências sem afirmar previamente qual intervenção será usada."}},{"title":"Construção do pré-projeto","steps":[{"title":"Tema e título","sub":"Do amplo ao específico","body":"Tema delimita o campo; título comunica o recorte do projeto.","check":null},{"title":"Introdução","sub":"Contextualize o problema","body":"Apresente assunto, cenário e conceitos necessários para o leitor compreender a proposta.","check":null},{"title":"Justificativa","sub":"Por que agir?","body":"Use evidências da demanda e literatura para explicar relevância acadêmica, social e organizacional.","check":null},{"title":"Objetivo geral","sub":"A direção da intervenção","body":"Deve ser claro, realizável e coerente com o tempo e os recursos. Evite prometer 'eliminar' fenômenos complexos.","check":null},{"title":"Objetivos específicos","sub":"Passos para alcançar o geral","body":"Desdobram ações concretas e precisam conversar com a metodologia.","check":null},{"title":"Referencial","sub":"Base para compreender e agir","body":"A literatura sustenta conceitos e escolhas; não é coleção de citações.","check":null},{"title":"Metodologia","sub":"Como acontecerá","body":"Público, local, etapas, estratégias, materiais, responsáveis e procedimentos.","check":null},{"title":"Resultados esperados","sub":"O que se espera, não o que já aconteceu","body":"Antes da intervenção, escreva expectativas plausíveis; resultados reais só podem ser afirmados depois.","check":null},{"title":"Coerência interna","sub":"Uma parte leva à outra","body":"Demanda → justificativa → objetivo → método → resultado esperado.","check":{"q":"Qual objetivo é mais adequado para uma ação única de extensão?","opts":["Eliminar o estresse dos trabalhadores.","Curar o burnout da equipe.","Promover uma ação psicoeducativa sobre estratégias de organização e busca de apoio.","Garantir aumento de 50% do bem-estar.","Resolver conflitos definitivamente."],"ans":2,"why":"O objetivo é realizável e não promete um efeito que a ação não pode garantir."}}],"case":{"prompt":"Um pré-projeto tem objetivo 'acabar com o estresse das secretárias' e metodologia de uma palestra de 40 minutos. Identifique o problema de coerência e proponha uma reformulação.","criteria":["objetivo irreal","coerência objetivo-método","verbo adequado","resultado plausível"],"expected":"O objetivo promete uma mudança clínica/organizacional que uma ação breve não pode garantir. Pode ser reformulado para promover ação psicoeducativa, ampliar informação ou apresentar estratégias e caminhos de apoio, alinhando-se à metodologia e aos resultados esperados."}},{"title":"Fundamentação e escrita acadêmica","steps":[{"title":"Fonte real","sub":"Leia o que você cita","body":"Referência não deve entrar apenas porque aparece em outro texto. É preciso saber o que o autor efetivamente sustenta.","check":null},{"title":"Paráfrase","sub":"Escrever com compreensão","body":"Parafrasear não é trocar sinônimos: é compreender a ideia, reescrevê-la e atribuir autoria.","check":null},{"title":"Citação direta","sub":"Use quando a formulação original importa","body":"Trechos literais precisam de indicação adequada e devem ser usados com propósito.","check":null},{"title":"Citação secundária","sub":"Quando você conhece a ideia por outra fonte","body":"Não apresente como leitura direta aquilo que não foi consultado. Sempre que possível, busque o original.","check":null},{"title":"Referências","sub":"Rastreabilidade acadêmica","body":"Autores citados precisam aparecer nas referências e dados bibliográficos devem corresponder à fonte real.","check":null},{"title":"Texto integrado","sub":"Literatura serve ao argumento","body":"Introdução e justificativa precisam conectar teoria, realidade observada e necessidade do projeto.","check":{"q":"Você encontrou uma afirmação de Autor A citada dentro de Autor B, mas não acessou A. Qual cuidado é correto?","opts":["Citar A como se tivesse lido.","Inventar a referência completa de A.","Buscar o original; se não for possível, deixar claro o uso de citação secundária conforme a norma adotada.","Excluir qualquer autoria.","Usar a frase sem citação."],"ans":2,"why":"Rastreabilidade exige não simular acesso a uma fonte não consultada."}}],"case":{"prompt":"Um integrante adiciona três referências ao projeto porque 'parecem boas', mas ninguém abriu os artigos. Explique o risco acadêmico e proponha um fluxo de trabalho para fundamentação.","criteria":["fonte consultada","compreensão","atribuição","referência consistente"],"expected":"O risco é atribuir ideias que a fonte talvez não sustente e produzir referências incorretas. O fluxo deve incluir localizar a fonte, ler trechos relevantes, registrar ideia e dados bibliográficos, integrar a ideia ao argumento com atribuição e revisar correspondência entre citações e referências."}},{"title":"Planejamento e execução","steps":[{"title":"Metodologia precisa ser executável","sub":"Outra pessoa deve entender o que será feito","body":"“Realizar uma dinâmica” é insuficiente. É necessário explicar preparação, sequência, tempo, materiais e condução.","check":null},{"title":"Público","sub":"Para quem?","body":"Número de participantes, características relevantes e contexto ajudam a adequar linguagem e estratégia.","check":null},{"title":"Estratégias","sub":"Por que essa atividade?","body":"Cada dinâmica, conversa, material ou exercício precisa ter relação com um objetivo.","check":null},{"title":"Responsabilidades","sub":"Quem faz o quê?","body":"Distribuir funções reduz improviso e permite acompanhar o cronograma.","check":null},{"title":"Recursos e orçamento","sub":"Viabilidade","body":"Materiais, espaço, tecnologia e custos precisam ser previstos.","check":null},{"title":"Produto técnico","sub":"Algo pode permanecer","body":"Cartilha, guia, mural ou outro produto pode ampliar a utilidade da ação quando coerente com a demanda.","check":null},{"title":"Plano B","sub":"Realidade muda","body":"A metodologia pode prever adaptações para tempo, presença ou recursos sem perder o objetivo.","check":{"q":"Qual descrição metodológica é mais adequada?","opts":["Será feita uma dinâmica legal.","O grupo conversará sobre saúde mental.","A ação terá acolhimento de 10 min, atividade guiada de 20 min, discussão de 15 min e fechamento de 10 min, com materiais e responsáveis definidos.","Improvisaremos conforme o público.","A professora decidirá tudo no dia."],"ans":2,"why":"A metodologia precisa permitir compreensão e execução."}}],"case":{"prompt":"Uma metodologia diz apenas: 'será feita uma dinâmica e entregue uma cartilha'. Reescreva mentalmente o que precisaria ser especificado para tornar a intervenção reproduzível.","criteria":["sequência/tempo","materiais","responsáveis","relação com objetivos"],"expected":"Devem ser descritos público, local, duração, preparação, passo a passo, materiais, responsáveis, modo de condução, fechamento, entrega/uso do produto e relação de cada estratégia com os objetivos."}},{"title":"Resultados, produto técnico e publicação","steps":[{"title":"Resultados esperados","sub":"Antes da ação","body":"São efeitos ou contribuições que o projeto espera favorecer, escritos de forma plausível e sem apresentar como fato.","check":null},{"title":"Resultados observados","sub":"Depois da ação","body":"Devem se apoiar no que realmente foi registrado: participação, feedbacks, produtos, observações e dados coletados.","check":null},{"title":"Não extrapole","sub":"Sem medida, sem afirmação causal","body":"Uma ação não pode afirmar que 'melhorou a saúde mental' se isso não foi avaliado.","check":null},{"title":"Produto técnico","sub":"Continuidade","body":"Um material útil pode permanecer disponível e ampliar o alcance da ação.","check":null},{"title":"Feedback","sub":"Aprender com a comunidade","body":"A percepção dos participantes ajuda a avaliar compreensão, utilidade e pontos de melhoria.","check":null},{"title":"Do projeto ao artigo","sub":"Registrar bem facilita publicar","body":"Introdução, método, resultados e discussão organizados permitem posterior adaptação para produção científica.","check":null},{"title":"Jornada completa","sub":"Pré-projeto → imersão → intervenção → produto → resultados/feedback → trabalho final → artigo","body":"A publicação não substitui a devolutiva à comunidade.","check":{"q":"Após uma oficina, o grupo escreve 'a ação reduziu a ansiedade', mas não mediu ansiedade. Qual correção é necessária?","opts":["Manter porque parece provável.","Relatar apenas evidências observadas e evitar afirmar efeito não medido.","Inventar um questionário retrospectivo.","Retirar todos os resultados.","Usar depoimento como diagnóstico."],"ans":1,"why":"Resultados precisam corresponder às evidências realmente produzidas."}}],"case":{"prompt":"Participantes elogiaram a atividade e disseram que o material foi útil. O grupo quer concluir que houve 'melhora da saúde mental'. Diferencie feedback, resultado observado e inferência indevida.","criteria":["feedback real","resultado observado","não inferir efeito clínico","evidência"],"expected":"O elogio e a percepção de utilidade são feedbacks observados e podem ser relatados como tal. Eles não demonstram melhora clínica ou de saúde mental. Sem medida apropriada, essa conclusão extrapola as evidências."}}]}};

{lesson:5,block:3,topic:"GRO, ergonomia e atuação multiprofissional",q:"Qual situação exemplifica um risco que deve ser considerado na análise ergonômica apresentada na Aula 5?",opts:["Permanecer longos períodos em postura inadequada ou realizando movimentos repetitivos.","Ter diferentes gerações na mesma equipe, independentemente das condições de trabalho.","Utilizar critérios técnicos em processos seletivos.","Participar de ações educativas da CIPAA."],ans:0,why:"O bloco relaciona ergonomia a posturas, repetitividade, permanência prolongada sentado ou em pé, ruídos e organização dos postos de trabalho."},

{lesson:6,block:1,topic:"NR-1 e lógica da prevenção",q:"Qual ideia representa a lógica preventiva da NR-1 trabalhada na Aula 6?",opts:["A organização deve agir somente depois que ocorrer um acidente.","A ausência de acidentes anteriores comprova que não existe risco.","A organização deve reconhecer e antecipar situações capazes de produzir danos.","Somente atividades industriais precisam ser analisadas quanto a riscos."],ans:2,why:"A prevenção exige reconhecer riscos antes do dano; mesmo ambientes aparentemente seguros podem apresentar diferentes fatores de risco."},
{lesson:6,block:2,topic:"Responsabilidade compartilhada e documentação",q:"Qual é uma função importante dos registros de entrega de equipamentos, treinamentos e não conformidades?",opts:["Substituir todos os treinamentos presenciais.","Permitir acompanhar procedimentos, recorrências e medidas adotadas pela organização.","Transferir automaticamente toda responsabilidade ao trabalhador.","Registrar apenas acidentes com afastamento."],ans:1,why:"A documentação ajuda a acompanhar as medidas preventivas, identificar recorrências e demonstrar orientações e providências adotadas."},
{lesson:6,block:3,topic:"GRO, PGR e atuação integrada",q:"No conteúdo estudado, qual relação entre GRO e PGR está correta?",opts:["O GRO é um equipamento e o PGR é uma comissão.","O GRO organiza o gerenciamento dos riscos e o PGR estrutura e documenta medidas desse gerenciamento.","O PGR substitui todas as áreas envolvidas na prevenção.","GRO e PGR se aplicam apenas depois de acidentes."],ans:1,why:"O GRO corresponde à lógica de gerenciamento dos riscos, enquanto o PGR organiza e documenta medidas de reconhecimento, avaliação e controle."},
{lesson:6,block:4,topic:"Fatores de riscos psicossociais",q:"Qual é a principal mudança de perspectiva ao incluir fatores de riscos psicossociais na gestão ocupacional?",opts:["A saúde mental passa a ser considerada somente após um diagnóstico.","A organização passa a observar preventivamente condições de trabalho capazes de favorecer sofrimento e adoecimento.","Os riscos físicos deixam de fazer parte da prevenção.","Todo conflito profissional passa a ser considerado transtorno mental."],ans:1,why:"A proposta é preventiva: analisar condições como sobrecarga, pressão, assédio e conflitos antes que suas consequências se agravem."}
];
let QSTATE={pool:[],i:0,score:0,wrong:[],chosen:null};
function quizHome(){if(!requireAuth())return;M.innerHTML=`<div class="quizhub"><section class="quizhero"><span class="tag">QUIZ</span><h1>Teste o que você aprendeu</h1><p>Escolha uma aula para revisar seus quatro blocos ou faça a revisão completa de todas as aulas da professora.</p></section><section class="quizsetup"><div class="quizrow"><label>Professor / matéria<select id="qprof"><option value="juliana">Prof. Juliana</option></select></label><label>Conteúdo<select id="qlesson" onchange="updateQuizMode()"><option value="all">Todas as aulas da professora</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}">Aula ${n}</option>`).join('')}</select></label></div><div class="quizrow"><label>Tipo de revisão<select id="qcount"><option value="complete">Revisão completa — 1 questão por bloco</option><option value="5">Quiz rápido — 5 questões</option><option value="10">Quiz rápido — 10 questões</option></select></label><div><div class="call" id="qcoverage" style="margin:0"><b>Cobertura completa:</b><br>24 questões — 4 blocos × 6 aulas.</div></div></div><button class="primary" style="width:100%" onclick="beginQuiz()">Começar quiz →</button></section></div>`;updateQuizMode()}
function updateQuizMode(){let l=document.getElementById('qlesson'),box=document.getElementById('qcoverage');if(!l||!box)return;if(l.value==='all')box.innerHTML='<b>Cobertura completa:</b><br>24 questões — 1 questão de cada bloco das Aulas 1 a 6.';else box.innerHTML=`<b>Cobertura completa:</b><br>4 questões — 1 questão de cada bloco da Aula ${l.value}.`;}
function beginQuiz(){let l=document.getElementById('qlesson').value,c=document.getElementById('qcount').value;let pool=QB.filter(x=>l==='all'||x.lesson==l);if(c==='complete'){pool=[...pool].sort((a,b)=>a.lesson-b.lesson||a.block-b.block)}else{pool=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(+c,pool.length))}QSTATE={pool,i:0,score:0,wrong:[],chosen:null};renderQuiz()}
function renderQuiz(){let q=QSTATE.pool[QSTATE.i];if(!q){renderQuizResult();return}M.innerHTML=`<div class="quizhub"><button class="back" onclick="quizHome()">← Sair do quiz</button><section class="quizrun"><div class="quizprogress">Questão ${QSTATE.i+1} de ${QSTATE.pool.length} • Aula ${q.lesson} • ${q.topic}</div><div class="bar"><i style="width:${((QSTATE.i+1)/QSTATE.pool.length)*100}%"></i></div><h2 style="margin-top:22px">${q.q}</h2><div id="qopts">${q.opts.map((o,i)=>`<button class="qoption" onclick="chooseQuiz(${i},this)"><b>${String.fromCharCode(65+i)})</b> ${o}</button>`).join('')}</div><div id="qexplain"></div><button id="qnext" class="primary" style="width:100%;margin-top:14px" onclick="confirmQuiz()">Confirmar resposta</button></section></div>`}
function chooseQuiz(i,b){if(document.getElementById('qexplain').innerHTML)return;QSTATE.chosen=i;document.querySelectorAll('.qoption').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}
function confirmQuiz(){let q=QSTATE.pool[QSTATE.i];if(QSTATE.chosen===null){return}let buttons=[...document.querySelectorAll('.qoption')],ok=QSTATE.chosen===q.ans;buttons[q.ans].classList.add('ok');if(!ok){buttons[QSTATE.chosen].classList.add('no');QSTATE.wrong.push(q); }else QSTATE.score++;document.getElementById('qexplain').innerHTML=`<div class="call"><b>${ok?'✓ Correto':'✕ Revise este conceito'}</b><br>${q.why}</div>`;let n=document.getElementById('qnext');n.textContent=QSTATE.i===QSTATE.pool.length-1?'Ver resultado →':'Próxima questão →';n.onclick=()=>{QSTATE.i++;QSTATE.chosen=null;renderQuiz()}}
function renderQuizResult(){let total=QSTATE.pool.length,p=Math.round(QSTATE.score/total*100),topics=[...new Set(QSTATE.wrong.map(x=>x.topic))];M.innerHTML=`<div class="quizhub"><section class="quizhero"><span class="tag">RESULTADO</span><h1>${QSTATE.score} de ${total} questões</h1><p>${p}% de acertos. O resultado serve para direcionar sua próxima revisão.</p></section><section class="quizresult"><h2>${topics.length?'Conceitos para revisar':'Ótimo — nenhuma lacuna apareceu nesta rodada'}</h2>${topics.length?topics.map(t=>`<span class="review-chip">${t}</span>`).join(''):'<p class="mut">Você acertou todas as questões desta seleção.</p>'}<div class="actions"><button class="ghost" onclick="quizHome()">Novo quiz</button><button class="primary" onclick="home()">Voltar ao início</button></div></section></div>`}
