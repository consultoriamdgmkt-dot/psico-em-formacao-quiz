 confunda","sub":"Delegar ≠ abandonar","body":"Autonomia madura possui objetivos, suporte, responsabilidade e feedback.","check":{"q":"Todos concordam rapidamente com o líder; alguns veem riscos, mas ficam calados para evitar conflito. Qual fenômeno?","opts":["Loafing social","Groupthink","Autonomia","Eficácia","Feedback 360°"],"ans":1,"why":"A pista é supressão da discordância e falsa unanimidade."}}],"case":{"prompt":"Seis trabalhadores respondem coletivamente por uma entrega. Com o tempo, dois reduzem esforço porque sabem que os colegas concluirão a tarefa. A avaliação considera apenas o resultado do grupo. Identifique o fenômeno e proponha medidas sem destruir a cooperação.","criteria":["loafing social","visibilidade da contribuição","responsabilidade","cooperação"],"expected":"O fenômeno é loafing social. A intervenção pode tornar papéis e contribuições mais claros, criar acompanhamento e feedback e equilibrar responsabilidade individual e coletiva, sem transformar a equipe em competição permanente."}},{"title":"Desempenho, produtividade, eficiência e eficácia","steps":[{"title":"Desempenho","sub":"Como a atividade é realizada","body":"Desempenho envolve execução e alcance de resultados e é influenciado por pessoa, tarefa, recursos, liderança, relações e contexto.","check":null},{"title":"Produtividade","sub":"Resultado em relação aos recursos","body":"Produtividade observa a relação entre aquilo que é produzido e os recursos utilizados.","check":null},{"title":"Eficiência","sub":"Uso de recursos","body":"Ser eficiente envolve realizar com uso adequado de tempo e recursos.","check":null},{"title":"Eficácia","sub":"Alcançar o objetivo","body":"É possível ser eficiente em uma atividade que não atinge o objetivo certo; por isso, eficiência e eficácia não são sinônimos.","check":null},{"title":"Capacidade + motivação + oportunidade","sub":"Desempenho precisa de condições","body":"Uma pessoa capaz e motivada pode ter baixo desempenho se sistema, recursos ou oportunidade impedem a execução.","check":null},{"title":"Não individualize","sub":"Produtividade não pertence apenas ao trabalhador","body":"Processos, equipamentos, demanda e organização participam do resultado.","check":{"q":"Um funcionário está engajado, mas o sistema fica indisponível horas por dia. Qual conclusão é mais adequada?","opts":["Baixa produtividade prova baixa motivação.","Recursos e oportunidade precisam entrar na análise do desempenho.","Engajamento elimina limitações técnicas.","A solução é aumentar metas.","Somente a competência importa."],"ans":1,"why":"Desempenho depende também das condições que permitem agir."}}],"case":{"prompt":"A produção de um setor cai 20%. Trabalhadores mantêm presença e esforço, mas há falhas de sistema e falta de matéria-prima. Diferencie desempenho e produtividade e explique por que culpar a motivação é inadequado.","criteria":["desempenho","produtividade","recursos/oportunidade","não individualização"],"expected":"A produtividade pode cair pela relação entre resultados e recursos disponíveis, sem que isso prove queda de motivação. O desempenho precisa ser analisado considerando recursos, tarefa, sistemas e oportunidade. Falhas técnicas e falta de insumos são fatores objetivos que limitam resultados."}},{"title":"Aula 9 — Grupos, Equipes e Dinâmicas de Funcionamento nas Organizações","steps":[{"title":"Bloco 1: Grupos e Equipes de Trabalho","sub":"","body":"As organizações trabalham com grupos porque muitas atividades são complexas demais para depender exclusivamente de uma única pessoa. Entretanto, trabalhar em grupo não garante automaticamente melhores resultados.\n\nGrupo de Trabalho:\nPode apresentar predominância de objetivos individuais e responsabilidades principalmente individuais. A interação entre os membros pode ser limitada e os resultados podem representar apenas a soma das contribuições de cada pessoa.\n\nEquipe de Trabalho:\nExiste um objetivo coletivo claramente compartilhado. Embora cada integrante possua responsabilidades individuais, também existe responsabilidade coletiva pelos resultados. Há maior interdependência, integração das competências e cooperação entre os membros.\n\nAssim, toda equipe é um grupo, mas nem todo grupo funciona efetivamente como equipe. A equipe se diferencia principalmente pela cooperação, interdependência, integração e existência de objetivos compartilhados.","check":null},{"title":"Bloco 2: Papéis, Normas e Coesão nos Grupos","sub":"","body":"O comportamento de um grupo não depende apenas da competência técnica de seus integrantes.\n\nPapéis Formais:\nSão estabelecidos pela própria organização e estão relacionados às posições ocupadas pelas pessoas.\n\nPapéis Informais:\nSurgem espontaneamente durante as relações entre os integrantes.\n\nConflito de Papéis:\nPode ocorrer quando existem expectativas contraditórias sobre aquilo que o trabalhador deve fazer.\n\nNormas do Grupo:\nSão padrões de comportamento considerados aceitáveis dentro do grupo. Podem ser formais ou informais, explícitas ou implícitas.\n\nCoesão:\nRefere-se ao grau de vínculo, união e identificação existente entre os integrantes. Pode favorecer cooperação, confiança, apoio e comprometimento. Entretanto, coesão elevada não significa necessariamente bom desempenho.","check":null},{"title":"Bloco 3: Pensamento Grupal e Preguiça Social","sub":"","body":"Pensamento Grupal:\nOcorre quando a busca por consenso e harmonia se torna tão forte que os integrantes deixam de avaliar criticamente as decisões. Pode envolver medo de discordar, autocensura, pressão por concordância, ausência de análise de alternativas e uma falsa sensação de unanimidade.\n\nUma boa equipe não é aquela em que ninguém discorda. É aquela em que existe segurança para discordar de maneira respeitosa, apresentar diferentes pontos de vista e analisar criticamente as decisões.\n\nPreguiça Social:\nÉ a tendência de algumas pessoas reduzirem seu esforço individual quando trabalham coletivamente. Pode ocorrer principalmente quando a contribuição de cada integrante não está claramente definida ou o trabalhador acredita que outras pessoas realizarão a tarefa por ele.\n\nUma forma de reduzir esse fenômeno é estabelecer responsabilidades claras para cada integrante.","check":null},{"title":"Bloco 4: Comunicação, Influência do Grupo e Funcionamento das Equipes","sub":"","body":"As pessoas não atuam de maneira completamente isolada dentro das organizações. O comportamento dos colegas, as relações estabelecidas e as características do ambiente podem influenciar motivação, participação e formas de agir.\n\nComunicação nas Equipes:\nUma comunicação adequada exige clareza, escuta, possibilidade de reflexão, circulação de informações, feedback e redução de ruídos.\n\nPapel da Liderança:\nA liderança contribui para organizar o funcionamento da equipe, esclarecer objetivos, distribuir responsabilidades e comunicar aquilo que precisa ser realizado.\n\nAssim, compreender o funcionamento dos grupos exige observar não apenas as características individuais dos trabalhadores, mas também papéis, normas, coesão, comunicação, liderança, influência social, conflitos, tomada de decisão e distribuição das responsabilidades.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Equipe da Conecta\n\nEm um setor da Conecta, dez trabalhadores possuem competências técnicas semelhantes, mas apresentam dificuldades para atuar como equipe. Alguns se preocupam apenas com suas próprias metas, enquanto outros reduzem o esforço porque sabem que os colegas concluirão as tarefas. Nas reuniões, os funcionários percebem problemas nas decisões do gestor, mas evitam discordar. Além disso, um novo colaborador começa a reproduzir esses comportamentos para conseguir se integrar ao grupo.\n\nPergunta Avaliativa\n\nConsiderando os conceitos de grupo, equipe, normas, coesão, pensamento grupal e preguiça social, explique os principais problemas presentes na Conecta e como essas dinâmicas podem interferir no desempenho coletivo.","criteria":["grupo e equipe","normas e coesão","pensamento grupal","preguiça social"],"expected":"A resposta deve diferenciar grupo e equipe e identificar a baixa responsabilidade coletiva, a influência das normas e da coesão, o pensamento grupal pela ausência de discordância e a preguiça social pela redução do esforço individual. Deve relacionar esses fenômenos ao prejuízo do desempenho coletivo."}},{"title":"Aula 10 — Conflitos e Equipes Autogerenciáveis","steps":[{"title":"Bloco 1: Conflitos nas Equipes de Trabalho","sub":"","body":"Os conflitos podem surgir nas organizações por diferenças de interesses, valores, objetivos, percepções e recursos. O problema não é simplesmente a existência do conflito, mas a maneira como ele é administrado.\n\nConflito Produtivo:\nOcorre quando as pessoas apresentam perspectivas diferentes, mas conseguem discutir suas ideias de maneira respeitosa e direcionada ao problema.\n\nConflito Destrutivo:\nSurge quando a divergência deixa de estar direcionada à situação e passa a envolver ataques pessoais, agressividade, desrespeito ou dificuldades que prejudicam as relações e o funcionamento da equipe.\n\nUma equipe saudável não é aquela em que todos concordam o tempo inteiro.","check":null},{"title":"Bloco 2: Equipes Autogerenciáveis e Autonomia","sub":"","body":"As equipes autogerenciáveis recebem maior autonomia para organizar e controlar aspectos do próprio trabalho.\n\nModelo Tradicional:\nO líder concentra as decisões, distribui as tarefas e supervisiona aquilo que foi executado.\n\nEquipe Autogerenciável:\nExiste maior participação dos trabalhadores na organização do trabalho e na tomada de decisões.\n\nAutonomia, entretanto, não significa ausência de liderança ou de gestão.\n\nLiderança Facilitadora:\nO líder orienta, desenvolve pessoas, articula recursos, facilita decisões, remove obstáculos e acompanha os resultados.","check":null},{"title":"Bloco 3: Condições, Vantagens e Desafios das Equipes Autogerenciáveis","sub":"","body":"Uma organização não transforma uma equipe em autogerenciável apenas comunicando que os trabalhadores passaram a possuir autonomia.\n\nCondições para o Autogerenciamento:\nObjetivos claros, definição das responsabilidades, competências técnicas, confiança, comunicação assertiva, cooperação, capacidade de decisão, cultura de feedback e acompanhamento dos resultados.\n\nVantagens:\nMaior autonomia e participação, rapidez na solução de problemas, desenvolvimento de competências, maior responsabilidade, flexibilidade e comprometimento.\n\nDesafios e Riscos:\nDificuldades na divisão das responsabilidades, conflitos, resistência à autonomia, disputa por liderança informal, sobrecarga, falhas de comunicação, preguiça social, pensamento grupal, decisões inadequadas e dificuldades de responsabilização.","check":null},{"title":"Bloco 4: Fenômenos Grupais nas Equipes Autogerenciáveis","sub":"","body":"A autonomia não impede que fenômenos grupais prejudiquem o funcionamento da equipe.\n\nPreguiça Social:\nOcorre quando uma pessoa reduz seu esforço individual porque acredita que outros integrantes realizarão aquilo que precisa ser feito.\n\nPensamento Grupal:\nAcontece quando a busca por consenso e harmonia se torna tão forte que os integrantes deixam de avaliar criticamente as decisões.\n\nLiderança Informal:\nDeterminado integrante pode começar a exercer influência sobre o grupo mesmo sem ocupar formalmente uma posição de liderança.\n\nCoesão e Resistência às Mudanças:\nUma equipe muito unida pode rejeitar ideias diferentes, inclusive quando poderiam melhorar o trabalho.\n\nClareza de Papéis e Responsabilidades:\nAutonomia precisa estar acompanhada de clareza sobre aquilo que cada integrante deve realizar.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Equipe Autônoma da Integra\n\nUma empresa retirou a supervisão direta de um setor e concedeu maior autonomia aos trabalhadores. Nos primeiros meses, os resultados foram positivos, mas posteriormente surgiram divergências sobre prioridades e divisão das tarefas. Alguns integrantes passaram a reduzir sua participação porque acreditavam que os colegas concluiriam o trabalho, enquanto outros evitavam discordar das decisões do grupo. Sem clareza sobre responsabilidades e sobre os limites da autonomia, os conflitos aumentaram e a produtividade começou a cair.\n\nPergunta Avaliativa\n\nConsiderando os conceitos de equipes autogerenciáveis, autonomia, conflitos, preguiça social e pensamento grupal, explique por que conceder autonomia não é suficiente para garantir o bom funcionamento de uma equipe e apresente quais condições são necessárias para que o autogerenciamento funcione adequadamente.","criteria":["autonomia","clareza de responsabilidades","preguiça social","pensamento grupal"],"expected":"A resposta deve mostrar que autonomia exige objetivos, limites, papéis e responsabilidades claros, além de comunicação, confiança, competência, feedback e acompanhamento. Deve relacionar a falta dessas condições aos conflitos, à preguiça social e ao pensamento grupal."}},{"title":"Aula 11 — Comportamento Organizacional, Produtividade e Comprometimento","steps":[{"title":"Bloco 1: Comportamento Organizacional e seus Três Níveis de Análise","sub":"","body":"O comportamento organizacional estuda as ações, atitudes e relações das pessoas no contexto de trabalho.\n\nNível Individual:\nTem como foco a pessoa e considera personalidade, percepção, aprendizagem, emoções, motivação, satisfação, atitudes e habilidades.\n\nNível Grupal:\nConcentra-se nas relações estabelecidas entre as pessoas e envolve comunicação, liderança, conflitos, poder, cooperação, normas grupais e tomada de decisão.\n\nNível Organizacional:\nConsidera cultura, clima, estrutura, políticas da empresa, práticas de gestão e condições oferecidas no ambiente de trabalho.\n\nQuando um trabalhador apresenta baixa produtividade, é necessário investigar os três níveis e buscar evidências antes de estabelecer uma explicação.","check":null},{"title":"Bloco 2: Produtividade, Desempenho, Eficiência e Eficácia","sub":"","body":"A produtividade está relacionada à capacidade de gerar resultados a partir dos recursos disponíveis. Não significa simplesmente fazer mais em menos tempo.\n\nDesempenho:\nRefere-se à maneira como o trabalhador executa suas atividades e alcança os resultados esperados.\n\nProdutividade:\nRefere-se à relação entre aquilo que é produzido e os recursos utilizados.\n\nEficiência:\nConsiste em realizar uma atividade utilizando adequadamente o tempo e os recursos disponíveis.\n\nEficácia:\nConsiste em alcançar o objetivo ou resultado esperado.\n\nNem todo problema de produtividade depende da vontade do trabalhador. Recursos, metas, liderança, carga de trabalho, comunicação e treinamento também precisam ser analisados.","check":null},{"title":"Bloco 3: Determinantes do Desempenho, Motivação e Satisfação","sub":"","body":"O desempenho resulta da interação entre diferentes elementos.\n\nCapacidade:\nO trabalhador precisa possuir conhecimentos e habilidades e receber treinamento adequado.\n\nMotivação:\nEstá relacionada aos processos que direcionam, intensificam e mantêm o comportamento em direção a determinados objetivos.\n\nOportunidade:\nA organização precisa oferecer recursos, materiais, informações e condições adequadas.\n\nA motivação não garante produtividade. O desempenho depende da combinação de diferentes fatores.\n\nSatisfação no Trabalho:\nRelaciona-se à avaliação que o trabalhador faz de sua experiência profissional e pode envolver remuneração, relações, ambiente, liderança, atividades, crescimento, reconhecimento e condições de trabalho.","check":null},{"title":"Bloco 4: Comprometimento Organizacional e Relação com a Empresa","sub":"","body":"O comprometimento organizacional refere-se ao vínculo estabelecido entre o trabalhador e a organização.\n\nIntegração:\nA forma como o trabalhador é recebido e inserido na empresa pode influenciar sua relação inicial com a organização.\n\nIdentificação com a Organização:\nA identificação com objetivos, práticas e características do ambiente pode favorecer maior envolvimento.\n\nOportunidades de Crescimento:\nPlanos de cargos, salários e carreira permitem compreender possibilidades de desenvolvimento.\n\nReconhecimento:\nPode ocorrer por feedbacks positivos, benefícios e outras formas de valorização, não apenas por recompensas financeiras.\n\nCondições de Trabalho:\nRecursos, estrutura e equipamentos também influenciam a experiência profissional.\n\nPermanência na empresa não significa necessariamente satisfação ou comprometimento.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Produtividade na Conecta\n\nA Conecta percebeu queda na produtividade de uma equipe e atribuiu inicialmente o problema à falta de motivação dos trabalhadores. Durante a análise, porém, foram identificadas metas difíceis de alcançar, equipamentos inadequados, ausência de treinamento para novos funcionários, falhas na comunicação da liderança e poucas oportunidades de reconhecimento e crescimento. Alguns colaboradores continuavam motivados, mas relatavam dificuldade para executar adequadamente suas atividades.\n\nPergunta Avaliativa\n\nConsiderando os três níveis do comportamento organizacional, produtividade, desempenho, motivação e satisfação, explique por que a baixa produtividade da Conecta não deve ser atribuída exclusivamente aos trabalhadores e indique quais fatores precisam ser analisados antes de propor uma intervenção.","criteria":["três níveis","produtividade e desempenho","motivação","condições organizacionais"],"expected":"A resposta deve analisar fatores individuais, grupais e organizacionais, distinguir produtividade de desempenho e explicar que motivação isolada não garante resultado. Deve considerar recursos, treinamento, liderança, metas, reconhecimento e condições de trabalho."}},{"title":"Aula 12 — Fenômenos Grupais, Funcionamento das Equipes e Intervenção Organizacional","steps":[{"title":"Bloco 1: Pensamento Grupal e Qualidade das Decisões","sub":"","body":"Pensamento Grupal:\nOcorre quando a busca pela concordância e pela harmonia do grupo reduz a manifestação de opiniões divergentes e prejudica a análise crítica das decisões.\n\nUnanimidade Aparente:\nA ausência de questionamentos não significa necessariamente que todos considerem a decisão adequada.\n\nComunicação Verticalizada:\nQuando as ideias e decisões partem principalmente da liderança para os demais integrantes, a equipe perde oportunidades de analisar diferentes perspectivas.\n\nSegurança para Discordar:\nÉ importante que os integrantes tenham segurança para discordar de maneira respeitosa e fundamentada. A divergência pode ampliar alternativas, identificar riscos e melhorar a qualidade das decisões.","check":null},{"title":"Bloco 2: Coesão, Resistência à Mudança e Participação","sub":"","body":"Coesão Grupal:\nIntegrantes que trabalham juntos há muito tempo podem desenvolver vínculos fortes e formas compartilhadas de executar as atividades.\n\nResistência à Mudança:\nNovas propostas podem ser rejeitadas mesmo quando apresentam possibilidades de melhoria.\n\nNormas Grupais:\nOs grupos desenvolvem padrões que orientam o comportamento de seus integrantes.\n\nParticipação:\nQuando contribuições são constantemente rejeitadas ou ignoradas, o trabalhador pode deixar de compartilhar novas ideias.\n\nA coesão não deve impedir a análise crítica.","check":null},{"title":"Bloco 3: Preguiça Social, Equidade e Responsabilidade Individual","sub":"","body":"Preguiça Social:\nOcorre quando uma pessoa reduz sua participação ou esforço porque sabe que outros integrantes poderão realizar aquilo que precisa ser feito.\n\nEquidade:\nQuando alguns trabalhadores assumem grande parte das atividades enquanto outros participam pouco, pode surgir percepção de injustiça.\n\nSobrecarga:\nNo curto prazo, os mais comprometidos podem compensar a baixa participação dos demais, mas a continuidade pode produzir sobrecarga, desmotivação e conflitos.\n\nContribuição Individual:\nTornar as responsabilidades claras e acompanhar as contribuições individuais ajuda a reduzir a acomodação.","check":null},{"title":"Bloco 4: Autonomia, Clareza das Funções e Acompanhamento","sub":"","body":"Autonomia:\nPermite que os trabalhadores participem da organização das atividades e das decisões, mas não significa agir individualmente sem considerar os objetivos da equipe.\n\nClareza das Funções:\nQuando as responsabilidades não estão definidas, podem ocorrer duplicidade, omissões e dificuldades de acompanhamento.\n\nResponsabilidade Compartilhada:\nObjetivos comuns não eliminam responsabilidades individuais.\n\nAcompanhamento:\nReuniões breves, feedbacks periódicos, critérios objetivos de avaliação e acompanhamento das atividades podem apoiar a autonomia sem transformá-la em microgerenciamento.\n\nO Psicólogo Organizacional pode diagnosticar o funcionamento, observar reuniões, ouvir trabalhadores, analisar clima e comunicação, esclarecer papéis, trabalhar conflitos e acompanhar mudanças.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Equipe da Evolução Projetos\n\nA Evolução Projetos concedeu maior autonomia a uma equipe experiente, mas começaram a surgir dificuldades: alguns trabalhadores assumem grande parte das tarefas, outros participam pouco, determinadas responsabilidades não estão claras e os integrantes raramente questionam as propostas apresentadas pelo coordenador. Apesar de a equipe ainda alcançar suas metas, alguns trabalhadores relatam sobrecarga, sensação de injustiça e receio de apresentar opiniões diferentes.\n\nPergunta Avaliativa\n\nConsiderando os conceitos de pensamento grupal, coesão, preguiça social, equidade, autonomia e clareza das funções, analise os problemas existentes na equipe da Evolução Projetos e apresente intervenções que o Psicólogo Organizacional poderia propor para melhorar seu funcionamento.","criteria":["pensamento grupal","preguiça social e equidade","autonomia e papéis","intervenção organizacional"],"expected":"A resposta deve identificar silêncio e unanimidade aparente, desigualdade na participação e sobrecarga, falta de clareza das responsabilidades e necessidade de acompanhamento. As intervenções podem envolver diagnóstico, comunicação, redefinição de papéis, espaços seguros de participação, feedback e monitoramento."}},{"title":"Aula 13 — Desempenho Individual, Equipes de Alta Performance e Intervenção Organizacional","steps":[{"title":"Bloco 1: Desempenho no Trabalho e Análise do Contexto","sub":"","body":"O desempenho no trabalho não significa apenas produzir mais. Ele envolve a forma como o trabalhador realiza suas atividades e contribui para os objetivos da organização.\n\nQualidade da Entrega:\nNão basta concluir uma atividade se o resultado apresenta erros ou exige retrabalho.\n\nPrazos e Responsabilidade:\nCumprir prazos e assumir responsabilidade pelas próprias atividades fazem parte do desempenho.\n\nIniciativa e Resolução de Problemas:\nA capacidade de agir diante das demandas e buscar soluções também contribui para o desempenho.\n\nCooperação e Relacionamento Interpessoal:\nA capacidade de cooperar, comunicar-se e estabelecer relações profissionais interfere no funcionamento da organização.\n\nAdaptação às Mudanças:\nMudanças nos processos, tecnologias e formas de trabalho exigem adaptação e aprendizagem.\n\nO desempenho não depende exclusivamente da pessoa. Devem ser analisadas a pessoa, o trabalho e a organização.","check":null},{"title":"Bloco 2: Do Desempenho Individual ao Resultado Coletivo","sub":"","body":"Uma equipe não corresponde apenas à soma de profissionais competentes. A competência individual é importante, mas não é suficiente para garantir bons resultados coletivos.\n\nComunicação Clara:\nContribui para reduzir erros e retrabalho.\n\nConfiança:\nFavorece a cooperação.\n\nPapéis Bem Definidos:\nDiminuem sobreposição ou omissão de tarefas.\n\nFeedback:\nPermite acompanhar o desempenho e identificar aspectos que precisam ser desenvolvidos.\n\nCooperação:\nO resultado coletivo depende da articulação entre as atividades dos integrantes.\n\nPossuir profissionais individualmente competentes não garante, por si só, uma equipe eficiente.","check":null},{"title":"Bloco 3: Equipes de Alta Performance e Autogestão","sub":"","body":"As equipes de alta performance sustentam bons resultados sem depender apenas do esforço individual de alguns integrantes.\n\nObjetivos Claros e Compartilhados:\nOs integrantes compreendem aquilo que a equipe pretende alcançar.\n\nPapéis Bem Definidos:\nCada integrante compreende suas responsabilidades.\n\nComunicação Aberta:\nExiste espaço para compartilhar informações, opiniões e dúvidas.\n\nConfiança e Cooperação:\nFavorecem colaboração e responsabilidade compartilhada.\n\nAprendizagem:\nA equipe aprende com os erros e ajusta seus processos.\n\nResultados Sustentáveis:\nAlta performance significa trabalhar melhor, de maneira coordenada, saudável e sustentável.\n\nEquipe autogerenciada e equipe de alta performance não são sinônimos. A autogestão pode contribuir para a alta performance, mas não a garante.","check":null},{"title":"Bloco 4: Conflitos, Sinais de Baixo Desempenho e Necessidade de Intervenção","sub":"","body":"Uma equipe de alta performance não é uma equipe sem conflitos.\n\nConflitos Funcionais:\nPodem contribuir para melhorar ideias, questionar alternativas e favorecer decisões mais adequadas.\n\nConflitos Disfuncionais:\nEnvolvem ataques pessoais, hostilidade ou competição destrutiva.\n\nMetas não Alcançadas com Frequência:\nSinalizam necessidade de investigação.\n\nErros, Retrabalho e Atrasos:\nPodem indicar dificuldades nos processos, comunicação, recursos ou organização das atividades.\n\nCompetição Excessiva e Falta de Cooperação:\nPodem prejudicar a responsabilidade coletiva.\n\nClima Ruim:\nPode interferir no funcionamento da equipe.\n\nPapéis Confusos e Responsabilidades Mal Definidas:\nPodem favorecer omissões, sobreposição de tarefas e conflitos.\n\nAbsenteísmo, Rotatividade e Desmotivação:\nQuando recorrentes, também precisam ser investigados.\n\nEsses sinais indicam necessidade de investigação e intervenção, não uma causa automática.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Equipe da Conecta\n\nA Conecta possui profissionais tecnicamente competentes, mas sua equipe começou a apresentar atrasos, retrabalho e metas não alcançadas. Os trabalhadores recebem demandas contraditórias, alguns não sabem exatamente quais são suas responsabilidades e surgiram conflitos sobre prioridades. Apesar disso, a gestão atribui a queda de desempenho à falta de esforço dos funcionários e afirma que uma equipe de alta performance deveria simplesmente “produzir mais”.\n\nPergunta Avaliativa\n\nConsiderando os conceitos de desempenho no trabalho e equipes de alta performance, explique por que a queda nos resultados da Conecta não deve ser atribuída apenas aos trabalhadores e identifique quais aspectos precisam ser investigados antes de uma intervenção.","criteria":["desempenho contextual","resultado coletivo","alta performance","investigação antes da intervenção"],"expected":"A resposta deve mostrar que o desempenho depende da interação entre pessoa, trabalho e organização, e que competência individual não basta. Deve considerar comunicação, papéis, recursos, liderança, cooperação, conflitos e condições de trabalho antes de responsabilizar os trabalhadores."}},{"title":"Mapa de Conceitos — Patrícia • 1º Bimestre","map":true,"concepts":[{"icon":"👤","tag":"Análise organizacional","title":"Nível Individual","text":"Foco na pessoa: personalidade, percepção, emoções, motivação, satisfação, atitudes, habilidades e aprendizagem."},{"icon":"👥","tag":"Análise organizacional","title":"Nível Grupal","text":"Foco nas relações: comunicação, liderança, conflitos, poder, cooperação, normas e tomada de decisão."},{"icon":"🏢","tag":"Análise organizacional","title":"Nível Organizacional","text":"Foco no contexto: cultura, clima, estrutura, políticas, práticas de gestão e condições de trabalho."},{"icon":"🤝","tag":"Grupos e equipes","title":"Equipe de Trabalho","text":"Possui objetivo coletivo compartilhado, interdependência, cooperação e responsabilidade também coletiva pelos resultados."},{"icon":"🎭","tag":"Grupos e equipes","title":"Papéis Formais e Informais","text":"Papéis formais são definidos pela organização; papéis informais surgem espontaneamente nas relações do grupo."},{"icon":"📏","tag":"Grupos e equipes","title":"Normas Grupais","text":"Padrões formais ou informais que orientam quais comportamentos são considerados aceitáveis no grupo."},{"icon":"🔗","tag":"Grupos e equipes","title":"Coesão","text":"Grau de vínculo, união e identificação entre os integrantes. Pode favorecer cooperação, mas coesão elevada não garante bom desempenho."},{"icon":"🤐","tag":"Fenômenos grupais","title":"Pensamento Grupal","text":"Busca por consenso e harmonia que reduz discordâncias e análise crítica, podendo criar unanimidade apenas aparente."},{"icon":"🛋️","tag":"Fenômenos grupais","title":"Preguiça Social","text":"Redução do esforço individual quando a pessoa acredita que outros integrantes realizarão o trabalho necessário."},{"icon":"⚖️","tag":"Fenômenos grupais","title":"Equidade","text":"Percepção de justiça na distribuição de esforço, responsabilidades e carga de trabalho entre os integrantes."},{"icon":"💬","tag":"Relações","title":"Conflito Produtivo","text":"Divergência direcionada ao problema, discutida com respeito, que pode ampliar alternativas e melhorar decisões."},{"icon":"🔥","tag":"Relações","title":"Conflito Destrutivo","text":"Divergência marcada por ataques pessoais, hostilidade ou competição que prejudica relações e resultados."},{"icon":"🧭","tag":"Autonomia","title":"Equipe Autogerenciável","text":"Equipe com maior autonomia para organizar tarefas e participar de decisões. Autonomia não significa ausência de liderança, limites ou acompanhamento."},{"icon":"🧑‍🏫","tag":"Autonomia","title":"Liderança Facilitadora","text":"Orienta, desenvolve pessoas, articula recursos, facilita decisões, remove obstáculos e acompanha resultados."},{"icon":"📈","tag":"Desempenho","title":"Produtividade","text":"Relação entre resultados obtidos e recursos utilizados; não significa simplesmente produzir mais em menos tempo."},{"icon":"🎯","tag":"Desempenho","title":"Desempenho","text":"Forma como o trabalhador executa suas atividades e contribui para os resultados esperados."},{"icon":"⏱️","tag":"Desempenho","title":"Eficiência","text":"Realizar a atividade utilizando adequadamente tempo e recursos."},{"icon":"✅","tag":"Desempenho","title":"Eficácia","text":"Alcançar o objetivo ou resultado esperado."},{"icon":"⚡","tag":"Desempenho","title":"Motivação","text":"Processos que direcionam, intensificam e mantêm o comportamento em direção a objetivos. Motivação isolada não garante produtividade."},{"icon":"❤️","tag":"Vínculo","title":"Satisfação no Trabalho","text":"Avaliação que o trabalhador faz de sua experiência profissional, envolvendo diferentes dimensões além do salário."},{"icon":"🪢","tag":"Vínculo","title":"Comprometimento Organizacional","text":"Vínculo entre trabalhador e organização, relacionado a envolvimento, cooperação, dedicação e identificação com objetivos organizacionais."},{"icon":"🚀","tag":"Equipes","title":"Alta Performance","text":"Funcionamento que sustenta bons resultados com objetivos claros, papéis definidos, comunicação aberta, confiança, cooperação, aprendizagem e sustentabilidade."},{"icon":"🔄","tag":"Equipes","title":"Autogestão ≠ Alta Performance","text":"A autogestão pode contribuir para a alta performance, mas não é sinônimo dela. Uma equipe de alta performance pode ter liderança formal e estrutura definida."},{"icon":"🧠","tag":"Intervenção","title":"Análise Baseada em Evidências","text":"Antes de responsabilizar o trabalhador, é necessário investigar pessoa, trabalho, grupo e organização e compreender o contexto do desempenho."}],"connection":"<b>Pessoa + grupo + organização</b> ajudam a explicar o comportamento no trabalho. <b>Autonomia</b> precisa de papéis claros, responsabilidade e acompanhamento. <b>Coesão</b> pode favorecer cooperação, mas também resistência e pensamento grupal. <b>Motivação</b> não garante produtividade sem capacidade, oportunidade e condições adequadas. <b>Alta performance</b> depende de coordenação, confiança, comunicação, aprendizagem e resultados sustentáveis."}],"mariana":[{"title":"Aula 1 — Abordagens Teórico-Metodológicas em Saúde Mental e Trabalho","steps":[{"title":"Bloco 1: Taylorismo e a Administração Científica do Trabalho","sub":"","body":"O Taylorismo, também conhecido como Administração Científica, está relacionado às transformações da organização do trabalho industrial e teve como principal referência Frederick Taylor. Seu foco estava no aumento da eficiência e da produtividade por meio da análise e do controle das atividades realizadas pelos trabalhadores.\n\nControle do Tempo e dos Movimentos:\nO trabalho era analisado de maneira detalhada, inclusive com o uso do cronômetro, para identificar quanto tempo o trabalhador levava para executar determinada atividade. Movimentos considerados desnecessários ou desperdícios de tempo deveriam ser eliminados, buscando tornar a produção cada vez mais eficiente.\n\nPadronização das Atividades:\nAs tarefas eram divididas e organizadas para que cada trabalhador realizasse movimentos específicos e repetitivos. O trabalhador não precisava compreender todo o processo produtivo, mas executar corretamente a atividade que lhe havia sido atribuída.\n\nSeparação entre Planejamento e Execução:\nO conhecimento e o planejamento do processo ficavam concentrados nos engenheiros e gerentes. Aos trabalhadores responsáveis pela execução cabia principalmente realizar aquilo que havia sido previamente determinado.\n\nNesse modelo, o trabalhador era considerado principalmente a partir de sua capacidade de execução. Questões relacionadas à saúde mental, emoções, sofrimento e sentido atribuído ao trabalho não constituíam uma preocupação central.\n\nO trabalho, portanto, era organizado a partir de uma lógica predominantemente mecanicista: buscava-se adaptar os movimentos humanos às necessidades da produção.","check":null},{"title":"Bloco 2: Fordismo e Psicologia Industrial","sub":"","body":"O Fordismo, associado a Henry Ford, aprofundou princípios presentes no Taylorismo e introduziu a linha de montagem, intensificando a padronização e o controle do ritmo de produção.\n\nLinha de Montagem:\nOs trabalhadores permaneciam em postos fixos enquanto os produtos se deslocavam pela esteira. Cada pessoa executava uma parte específica do processo, repetindo continuamente determinados movimentos.\n\nRitmo de Trabalho:\nA velocidade da produção era determinada pela própria linha de montagem. Em vez de o trabalhador estabelecer seu ritmo, ele precisava adaptar-se ao ritmo imposto pela esteira.\n\nBaixa Autonomia:\nHavia pouco espaço para que o trabalhador decidisse como organizar ou executar sua atividade. A tarefa já estava previamente determinada e deveria ser realizada de acordo com o funcionamento do sistema produtivo.\n\nNesse contexto, a Psicologia Industrial começou a participar dos processos organizacionais, mas ainda inserida na lógica da eficiência produtiva.\n\nSeleção Psicométrica:\nOs testes psicométricos eram utilizados para identificar trabalhadores considerados mais aptos para determinadas atividades. O objetivo estava relacionado à seleção e à adaptação das pessoas às exigências do sistema produtivo.\n\nA Psicologia, nesse momento, não estava prioritariamente direcionada à compreensão do sofrimento ou das necessidades emocionais dos trabalhadores. Sua atuação contribuía principalmente para identificar quem apresentava características consideradas adequadas às funções existentes.\n\nAssim, tanto no Taylorismo quanto no Fordismo predominava uma concepção em que o trabalhador precisava adaptar-se à organização do trabalho, enquanto suas experiências subjetivas recebiam pouca atenção.","check":null},{"title":"Bloco 3: Experiência de Hawthorne e Escola das Relações Humanas","sub":"","body":"Um importante deslocamento nessa compreensão ocorreu com a Experiência de Hawthorne, realizada nos Estados Unidos e associada aos estudos liderados por Elton Mayo. As pesquisas buscavam compreender fatores capazes de influenciar a produtividade dos trabalhadores.\n\nInicialmente, foram consideradas diferentes condições relacionadas ao ambiente e à organização do trabalho, como iluminação, pausas e períodos de descanso. Entretanto, os estudos contribuíram para direcionar a atenção também às relações sociais e à maneira como os trabalhadores se percebiam dentro da organização.\n\nSentimento de Pertencimento:\nA experiência de fazer parte de um grupo e perceber-se integrado ao ambiente de trabalho passou a ser considerada importante para compreender o comportamento dos trabalhadores.\n\nEscuta e Reconhecimento:\nA percepção de estar sendo ouvido, considerado e reconhecido também passou a receber atenção. O trabalhador deixou de ser observado exclusivamente como alguém que executava movimentos e passou a ser compreendido como uma pessoa que sente e se relaciona.\n\nRelações Interpessoais:\nOs vínculos estabelecidos no ambiente de trabalho passaram a integrar a análise da produtividade e do comportamento organizacional.\n\nEssas mudanças contribuíram para o desenvolvimento da Escola das Relações Humanas, que ampliou a compreensão sobre o trabalhador ao reconhecer a importância dos aspectos sociais e emocionais.\n\nA Experiência de Hawthorne recebeu posteriormente questionamentos relacionados ao rigor de sua metodologia. Apesar dessas críticas, seu legado foi importante para o desenvolvimento de uma perspectiva que passou a considerar elementos anteriormente pouco observados na organização do trabalho.","check":null},{"title":"Bloco 4: Da Eficiência Produtiva à Consideração da Subjetividade","sub":"","body":"A evolução das formas de compreender o trabalho permite observar uma mudança progressiva na maneira como o trabalhador passou a ser considerado pelas organizações e pela própria Psicologia.\n\nTaylorismo:\nO trabalhador era compreendido principalmente como executor. O foco estava na eliminação de movimentos considerados desnecessários e no aumento da eficiência.\n\nFordismo:\nO trabalhador funcionava como parte de uma engrenagem produtiva. A linha de montagem determinava o ritmo das atividades, e a Psicologia Industrial contribuía para selecionar pessoas consideradas adequadas às exigências desse sistema.\n\nRelações Humanas:\nO trabalhador começa a ser reconhecido também como um ser social e emocional. Pertencimento, escuta, vínculos e reconhecimento passam a ser considerados na compreensão do comportamento e da produtividade.\n\nEssa transformação ajuda a compreender o caminho percorrido pela Psicologia até o desenvolvimento de abordagens voltadas à relação entre saúde mental e trabalho. Gradualmente, aspectos subjetivos passam a integrar a análise das experiências profissionais.\n\nEntretanto, elementos associados às antigas formas de organização do trabalho ainda podem ser encontrados em contextos atuais. Padronização rígida, controle do tempo, monitoramento do desempenho e atividades repetitivas aparecem, por exemplo, em determinadas linhas de produção, serviços de telemarketing, centros de distribuição e outros trabalhos altamente organizados por processos.\n\nAo mesmo tempo, simplesmente ouvir os trabalhadores não é suficiente. Quando uma organização realiza uma pesquisa de clima ou cria espaços de escuta, mas não desenvolve ações diante dos problemas identificados, os trabalhadores podem deixar de acreditar nesses instrumentos.\n\nAssim, a consideração da subjetividade envolve reconhecer que o trabalhador não é apenas responsável por executar uma tarefa. Ele é um sujeito que sente, estabelece vínculos, atribui sentido ao trabalho e pode vivenciar tanto realização quanto sofrimento.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Central de Atendimento\n\nUma empresa de atendimento controla rigidamente o tempo de cada ligação, estabelece falas padronizadas e acompanha constantemente o desempenho dos trabalhadores. Diante do aumento do desgaste e da rotatividade, cria uma pesquisa de clima para ouvir os funcionários. Os trabalhadores relatam cobrança excessiva, pouca autonomia e sofrimento relacionado ao trabalho, mas percebem que nenhuma mudança ocorre após a pesquisa e começam a deixar de participar das avaliações.\n\nPergunta Avaliativa\n\nConsiderando Taylorismo, Fordismo, Psicologia Industrial e Escola das Relações Humanas, explique como as diferentes concepções sobre o trabalhador aparecem no caso e por que apenas criar espaços de escuta não garante que os aspectos subjetivos e a saúde mental sejam efetivamente considerados.","criteria":[],"expected":""}},{"title":"Aula 2 — Psicodinâmica do Trabalho e Clínica da Atividade","steps":[{"title":"Bloco 1: Trabalho Prescrito e Trabalho Real","sub":"","body":"Uma das questões importantes para compreender a relação entre saúde mental e trabalho é a diferença entre aquilo que está previsto para uma atividade e aquilo que efetivamente acontece durante sua realização.\n\nTrabalho Prescrito:\nCorresponde ao que está previamente estabelecido para o trabalhador: tarefas, normas, procedimentos, protocolos e responsabilidades que definem aquilo que ele deveria realizar.\n\nTrabalho Real:\nCorresponde àquilo que efetivamente acontece durante a atividade. Na prática, surgem situações imprevistas, dificuldades, conflitos e necessidades que exigem que o trabalhador faça adaptações e tome decisões que não estavam descritas inicialmente.\n\nUma pessoa responsável pela recepção em um serviço de saúde, por exemplo, pode ter como atividade prescrita receber pacientes, seguir um roteiro de perguntas e realizar encaminhamentos. Entretanto, no cotidiano, também pode precisar acalmar pessoas ansiosas, administrar conflitos de agenda e encontrar maneiras de lidar com falhas do sistema.\n\nExiste, portanto, uma distância entre o trabalho prescrito e o trabalho real. O trabalhador precisa mobilizar habilidades e encontrar formas de agir diante de situações que não poderiam ser totalmente previstas anteriormente.\n\nTanto a Psicodinâmica do Trabalho quanto a Clínica da Atividade consideram essa distância. Entretanto, cada abordagem direciona seu olhar para aspectos diferentes da relação entre o trabalhador e sua atividade.","check":null},{"title":"Bloco 2: Psicodinâmica do Trabalho — Prazer, Sofrimento e Reconhecimento","sub":"","body":"A Psicodinâmica do Trabalho, associada aos estudos de Christophe Dejours, parte da compreensão de que o trabalho nunca é neutro. Ele pode constituir uma fonte de prazer e desenvolvimento, mas também pode produzir sofrimento e contribuir para processos de adoecimento.\n\nDiante da distância entre aquilo que foi prescrito e aquilo que acontece na realidade, o trabalhador precisa encontrar maneiras de responder às situações concretas. Nesse processo, pode desenvolver habilidades, criatividade e novas formas de lidar com as demandas. Entretanto, dependendo de como o trabalho está organizado, essa experiência também pode produzir sofrimento.\n\nPrazer no Trabalho:\nPode estar relacionado à possibilidade de desenvolver habilidades, perceber sentido naquilo que se faz, possuir autonomia e construir relações positivas no ambiente profissional.\n\nSofrimento no Trabalho:\nPode surgir quando a organização do trabalho produz situações que dificultam a realização da atividade, restringem a autonomia ou fazem com que as exigências se tornem difíceis de sustentar.\n\nAutonomia:\nA possibilidade de possuir algum grau de liberdade para lidar com as situações reais do trabalho pode interferir na maneira como o trabalhador vivencia sua atividade.\n\nRelações e Vínculos:\nA qualidade das relações estabelecidas no ambiente profissional também participa da experiência de prazer ou sofrimento.\n\nRitmo de Trabalho:\nAs exigências relacionadas ao ritmo e às demandas da atividade podem interferir na experiência do trabalhador e precisam ser consideradas na análise da organização do trabalho.\n\nReconhecimento:\nPossui papel especialmente importante na Psicodinâmica do Trabalho. Além da retribuição financeira, existe uma dimensão simbólica relacionada ao reconhecimento do esforço realizado pelo trabalhador.\n\nQuando uma pessoa precisa fazer muito mais do que aquilo que aparece formalmente na descrição de sua função, o reconhecimento pode permitir que esse esforço deixe de permanecer invisível. Uma liderança que percebe e reconhece como determinado trabalhador conseguiu administrar situações difíceis, por exemplo, oferece uma forma de retribuição simbólica pelo trabalho realizado.\n\nO reconhecimento também se relaciona à experiência de prazer e à construção da identidade. Dessa maneira, a Psicodinâmica procura compreender como a organização do trabalho interfere na experiência subjetiva das pessoas.","check":null},{"title":"Bloco 3: Estratégias Defensivas e Escuta Coletiva","sub":"","body":"Quando o trabalho produz sofrimento e o trabalhador não encontra possibilidades de transformação daquela realidade, podem surgir estratégias defensivas utilizadas para tornar a situação mais suportável.\n\nNegação:\nO trabalhador ou o grupo pode negar determinados riscos ou aspectos do sofrimento presente na atividade.\n\nMinimização:\nO sofrimento pode ser diminuído ou tratado como algo normal, mesmo quando existem situações que estão produzindo desgaste.\n\nEssas estratégias podem aparecer individualmente, mas também podem ser construídas coletivamente. Expressões como “é assim mesmo” ou “não adianta falar” podem demonstrar formas pelas quais o próprio grupo procura conviver com uma situação difícil, minimizando aquilo que está acontecendo.\n\nNa Psicodinâmica do Trabalho, a compreensão dessas experiências ocorre principalmente por meio da escuta coletiva.\n\nPalavra Compartilhada:\nA conversa com os trabalhadores permite compreender como eles vivenciam o trabalho, quais sentidos atribuem à atividade e como percebem sua organização.\n\nCompreensão da Realidade do Grupo:\nA proposta não está direcionada à generalização estatística. Busca-se uma compreensão aprofundada daquela realidade e das experiências vivenciadas por aquele coletivo de trabalhadores.\n\nPor meio da escuta, podem aparecer questões relacionadas ao sofrimento, prazer, reconhecimento, autonomia, relações, organização do trabalho e estratégias defensivas.\n\nA abordagem possui, portanto, caráter qualitativo. Em contextos organizacionais, essa investigação também pode ser articulada a métodos quantitativos. Um levantamento mais amplo pode identificar determinados problemas e, posteriormente, grupos menores podem participar de uma investigação qualitativa mais aprofundada.\n\nA partir daquilo que é identificado, podem ser consideradas intervenções relacionadas à própria organização do trabalho, como reorganização de demandas e, quando pertinente, possibilidades de remanejamento de funções.","check":null},{"title":"Bloco 4: Clínica da Atividade e Poder de Agir","sub":"","body":"A Clínica da Atividade, associada a Yves Clot, também considera a distância entre trabalho prescrito e trabalho real, mas direciona especial atenção para a atividade e o poder de agir do trabalhador.\n\nO sofrimento não está relacionado somente a fazer demais. Também pode surgir quando a pessoa não consegue realizar aquilo que gostaria de fazer ou não consegue trabalhar da maneira que considera adequada.\n\nUm profissional pode saber como determinada atividade poderia ser realizada com maior qualidade, mas encontrar obstáculos organizacionais, limitações concretas, exigências de tempo ou outras condições que impedem essa realização.\n\nPoder de Agir:\nRefere-se à possibilidade de o trabalhador agir sobre sua própria atividade e encontrar formas de realizar seu trabalho. Quando essa possibilidade é bloqueada por entraves organizacionais ou condições concretas, podem surgir sofrimento e dificuldades na relação com o trabalho.\n\nAtividade Impedida:\nO trabalhador pode desejar realizar determinada ação ou executar sua atividade de uma maneira que considera adequada, mas não conseguir devido às condições existentes.\n\nUm professor, por exemplo, pode desejar promover discussões e interagir com os estudantes, mas encontrar limitações de tempo ou situações imprevistas que dificultem aquilo que pretendia realizar. Se essa impossibilidade passa a fazer parte de sua experiência cotidiana, pode produzir sofrimento relacionado à atividade.\n\nAutoconfrontação:\nUma das ferramentas apresentadas na Clínica da Atividade envolve o registro em vídeo da realização do trabalho. Posteriormente, o trabalhador observa sua própria atividade junto ao profissional responsável pela análise e pode refletir sobre aquilo que fez, as dificuldades encontradas e outras possibilidades de ação.\n\nAutoconfrontação com os Pares:\nEm outro momento, a atividade também pode ser analisada com colegas de trabalho. Os pares podem discutir diferentes maneiras de realizar aquela atividade, apresentar outras possibilidades e refletir conjuntamente sobre o trabalho.\n\nO objetivo não é simplesmente avaliar se o trabalhador realizou sua tarefa corretamente. A análise busca favorecer a reflexão sobre a atividade e ampliar as possibilidades de ação diante das situações concretas do trabalho.\n\nAssim, enquanto a Psicodinâmica do Trabalho direciona especial atenção às experiências de prazer, sofrimento, reconhecimento e estratégias defensivas, a Clínica da Atividade enfatiza a atividade realizada e o poder de agir do trabalhador.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: O Atendimento de Helena\n\nHelena trabalha na recepção de um serviço de saúde. Formalmente, deve receber pacientes, seguir um roteiro de perguntas e realizar encaminhamentos, mas diariamente também precisa acalmar pessoas ansiosas, resolver conflitos de agenda e lidar com falhas do sistema. Ela sente que grande parte desse esforço não é reconhecida e, devido à pressão de tempo, frequentemente não consegue atender as pessoas da maneira que considera adequada. Entre os colegas, tornou-se comum dizer que “é assim mesmo” e que não adianta discutir as dificuldades.\n\nPergunta Avaliativa\n\nConsiderando os conceitos de trabalho prescrito e trabalho real, Psicodinâmica do Trabalho e Clínica da Atividade, explique como o caso de Helena pode ser analisado pelas duas abordagens, identificando elementos relacionados ao reconhecimento, às estratégias defensivas e ao poder de agir.","criteria":[],"expected":""}},{"title":"Aula 3 — Abordagens Teórico-Metodológicas para Avaliação da Saúde Mental no Trabalho","steps":[{"title":"Bloco 1: Diferentes Métodos para Compreender a Relação entre Saúde e Trabalho","sub":"","body":"A saúde mental no trabalho pode ser investigada por diferentes abordagens teórico-metodológicas. Cada uma utiliza ferramentas específicas e permite observar determinados aspectos da relação entre o trabalhador, sua atividade e a organização.\n\nEssas abordagens podem ser utilizadas para identificar, compreender, intervir e prevenir situações relacionadas à saúde dos trabalhadores.\n\nPsicodinâmica do Trabalho:\nÉ uma abordagem clínico-qualitativa que utiliza principalmente a escuta dos trabalhadores, individualmente ou em pequenos coletivos. Busca compreender em profundidade a experiência subjetiva relacionada ao trabalho, incluindo sofrimento, prazer, reconhecimento, sentido atribuído ao trabalho e estratégias defensivas.\n\nClínica da Atividade:\nTambém possui caráter qualitativo e direciona atenção para a atividade realizada e para o poder de agir do trabalhador. Entre suas ferramentas está a autoconfrontação, na qual registros da atividade podem ser analisados com o próprio trabalhador e posteriormente com seus pares.\n\nErgonomia da Atividade:\nAnalisa a atividade em seu contexto real, considerando diferentes aspectos envolvidos na realização do trabalho. O profissional observa o trabalhador durante sua atividade e pode analisar elementos como posturas, movimentos, fluxo de informações, aspectos cognitivos e características da organização do trabalho.\n\nApós a observação, pode ocorrer uma entrevista de explicitação, buscando compreender as ações observadas, as estratégias utilizadas pelo trabalhador e os motivos relacionados às decisões tomadas durante a atividade.\n\nA Ergonomia da Atividade pode contribuir, por exemplo, para identificar necessidades de adaptação, reorganização ou redesenho do trabalho.\n\nEssas abordagens qualitativas permitem uma compreensão aprofundada da experiência do trabalhador. Entretanto, quando uma organização possui um número elevado de trabalhadores, investigar inicialmente cada pessoa ou pequeno grupo pode exigir muito tempo. Nesse contexto, métodos quantitativos podem funcionar como uma primeira etapa de investigação.","check":null},{"title":"Bloco 2: Abordagens Quantitativas e Modelo Demanda–Controle","sub":"","body":"As abordagens quantitativas utilizam principalmente questionários e escalas para identificar fatores relacionados aos riscos psicossociais no trabalho.\n\nEsses instrumentos permitem realizar levantamentos com grupos maiores de trabalhadores e identificar setores ou contextos que podem necessitar de investigação e intervenção mais aprofundadas.\n\nUm dos modelos utilizados é o Modelo Demanda–Controle, associado a Karasek.\n\nDemanda:\nBusca identificar o nível de exigência presente no trabalho. Pode envolver aspectos como ritmo, quantidade de tarefas, necessidade de concentração, esforço mental e exigências relacionadas à realização das atividades.\n\nControle:\nRefere-se ao grau de autonomia e possibilidade de decisão que o trabalhador possui sobre sua atividade. Pode envolver liberdade para decidir como realizar o trabalho, possibilidade de utilizar e desenvolver habilidades e influência sobre aquilo que acontece em sua atividade.\n\nApoio Social:\nTambém pode ser considerado na avaliação, observando aspectos relacionados ao apoio recebido de colegas e superiores no ambiente de trabalho.\n\nA combinação entre demanda e controle permite compreender diferentes situações de trabalho.\n\nAlta Demanda + Baixo Controle — Alto Desgaste:\nO trabalhador enfrenta muitas exigências e possui pouca autonomia para lidar com elas. Essa combinação representa uma situação de maior risco.\n\nAlta Demanda + Alto Controle — Trabalho Ativo:\nExistem muitas exigências, mas o trabalhador também possui autonomia e possibilidades de ação. Pode constituir um trabalho estimulante e favorecer aprendizagem e desenvolvimento.\n\nBaixa Demanda + Baixo Controle — Trabalho Passivo:\nExistem poucas exigências e pouca possibilidade de participação ou decisão. A longo prazo, essa situação pode reduzir possibilidades de utilização e desenvolvimento das habilidades.\n\nBaixa Demanda + Alto Controle — Baixo Desgaste:\nO trabalhador possui autonomia diante de um nível menor de exigências, representando uma combinação associada a menor desgaste.\n\nEntretanto, a classificação quantitativa não permite compreender sozinha toda a experiência subjetiva do trabalhador. Os resultados indicam características do contexto e podem orientar uma investigação qualitativa posterior.","check":null},{"title":"Bloco 3: Modelo Esforço–Recompensa e Mapeamento dos Riscos","sub":"","body":"Outra possibilidade de avaliação quantitativa é o Modelo Esforço–Recompensa, que busca compreender a relação entre aquilo que o trabalhador investe em sua atividade e aquilo que recebe em retorno.\n\nEsforço:\nPode envolver ritmo intenso, pressão relacionada ao tempo, responsabilidades, exigências físicas ou mentais, interrupções frequentes e outras demandas presentes na realização do trabalho.\n\nRecompensa:\nNão se limita ao salário. Também pode envolver reconhecimento, respeito, prestígio, estabilidade e segurança relacionada ao trabalho.\n\nQuando existe um desequilíbrio importante entre esforço e recompensa, essa relação pode indicar uma condição relevante para a compreensão dos riscos presentes no ambiente profissional.\n\nAlém desses modelos, instrumentos mais amplos podem ser utilizados para investigar diferentes dimensões dos riscos psicossociais.\n\nCOPSOQ:\nÉ apresentado como um questionário mais abrangente, capaz de investigar diferentes fatores psicossociais relacionados ao trabalho. Pode incluir aspectos relacionados às demandas, relações de trabalho, violência e outras dimensões da organização.\n\nEsses questionários podem ser aplicados a grupos maiores de trabalhadores e seus resultados analisados por setores ou grupos. O objetivo não é simplesmente produzir uma pontuação, mas utilizar os resultados para identificar fatores de risco e orientar prioridades de intervenção e prevenção.\n\nAs informações individuais dos trabalhadores não precisam ser apresentadas à gestão. Os resultados podem ser comunicados de maneira coletiva, indicando, por exemplo, que determinado setor apresentou maior exposição a determinados fatores e necessita de investigação ou intervenção.","check":null},{"title":"Bloco 4: Integração entre Métodos Quantitativos e Qualitativos","sub":"","body":"Os métodos quantitativos e qualitativos não precisam ser compreendidos como abordagens concorrentes. Na prática, podem ser utilizados de maneira complementar.\n\nPrimeira Etapa — Mapeamento Quantitativo:\nQuestionários e escalas podem funcionar como uma porta de entrada para identificar fatores de risco em grupos maiores de trabalhadores. Essa etapa permite localizar setores ou dimensões que necessitam de maior atenção.\n\nSegunda Etapa — Aprofundamento Qualitativo:\nA partir dos resultados encontrados, grupos menores podem participar de processos de escuta e investigação mais aprofundados. A Psicodinâmica do Trabalho, por exemplo, permite compreender como aqueles trabalhadores vivenciam as situações identificadas inicialmente.\n\nO quantitativo ajuda a responder onde estão os principais fatores de risco e quais dimensões precisam ser priorizadas. O qualitativo permite aprofundar como aquelas situações são vivenciadas e que sentidos assumem para os trabalhadores.\n\nEssa integração pode orientar intervenções na própria organização, como reorganização das demandas, revisão das condições de trabalho, mudanças em setores ou processos e ações de prevenção.\n\nO mapeamento também pode considerar diferentes riscos psicossociais, como sobrecarga de trabalho, metas abusivas, alta demanda, baixa autonomia, dificuldades nas relações, assédio, violência e falta de clareza dos papéis.\n\nAssim, as abordagens teórico-metodológicas funcionam como diferentes formas de investigar a saúde no trabalho. A escolha do método depende daquilo que se pretende compreender, das características da organização e das condições existentes para realizar a avaliação.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: O Mapeamento da Horizonte\n\nA Horizonte possui vários setores e percebeu aumento de afastamentos e relatos de desgaste entre os trabalhadores. A empresa pretende compreender o problema, mas entrevistar individualmente todos os funcionários seria difícil. Por isso, inicia a investigação utilizando questionários para identificar demanda, autonomia, apoio, esforço e recompensa. Os resultados apontam maior risco em dois setores e, posteriormente, pequenos grupos desses trabalhadores são convidados para uma escuta mais aprofundada sobre suas experiências e sobre a organização do trabalho.\n\nPergunta Avaliativa\n\nConsiderando as abordagens qualitativas e quantitativas, explique por que os questionários podem funcionar como uma porta de entrada para o mapeamento dos riscos e como a investigação qualitativa pode complementar os resultados encontrados.","criteria":[],"expected":""}},{"title":"Aula 4 — Integração das Abordagens Qualitativas e Quantitativas na Saúde Mental e Trabalho","steps":[{"title":"Bloco 1: Abordagens Qualitativas e Compreensão em Profundidade","sub":"","body":"A relação entre trabalho e saúde mental pode ser investigada por diferentes abordagens teórico-metodológicas. Não existe apenas uma forma de compreender o sofrimento relacionado ao trabalho. A escolha do método depende daquilo que se pretende investigar, das características da organização e da demanda apresentada.\n\nAs abordagens qualitativas, também apresentadas como abordagens clínicas qualitativas, buscam compreender em profundidade a experiência dos trabalhadores e sua relação com o trabalho.\n\nPsicodinâmica do Trabalho:\nUtiliza principalmente a escuta, que pode ocorrer individualmente ou em pequenos coletivos. Busca compreender aspectos como sofrimento, prazer, reconhecimento, sentido atribuído ao trabalho e estratégias defensivas.\n\nClínica da Atividade:\nDireciona seu olhar para a atividade e para o poder de agir do trabalhador. Pode utilizar registros em vídeo e processos de autoconfrontação para que a própria pessoa analise sua atividade e reflita sobre outras possibilidades de ação.\n\nEmbora utilizem ferramentas diferentes, as duas abordagens procuram compreender aspectos que dificilmente seriam identificados apenas por meio de uma pontuação.\n\nQuando a demanda já está concentrada em um grupo menor de trabalhadores e existe a necessidade de compreender profundamente aquilo que eles estão vivenciando, uma abordagem qualitativa pode ser utilizada diretamente.\n\nA escuta também constitui uma forma de intervenção. Durante esse processo, o Psicólogo Organizacional pode favorecer questionamentos e reflexões sobre a relação dos trabalhadores com sua atividade.\n\nEntretanto, a intervenção não deve ficar restrita aos indivíduos. Quando o sofrimento está relacionado à própria organização do trabalho, pode ser necessário modificar aspectos como demandas, metas, processos, funções ou formas de liderança.","check":null},{"title":"Bloco 2: Abordagens Quantitativas e Identificação dos Fatores de Risco","sub":"","body":"As abordagens quantitativas procuram mensurar determinadas dimensões da relação entre o trabalhador e seu trabalho. Para isso, utilizam principalmente questionários e escalas.\n\nEsses instrumentos são especialmente úteis quando existe um número maior de trabalhadores e ainda é necessário identificar quais grupos, setores ou fatores precisam receber maior atenção.\n\nModelo Demanda–Controle:\nAvalia a relação entre as exigências presentes no trabalho e o grau de controle ou autonomia disponível para o trabalhador.\n\nA situação de maior risco ocorre quando existe alta demanda e baixo controle, caracterizando uma condição de alto desgaste. O trabalhador enfrenta muitas exigências, mas possui pouca liberdade para decidir como organizar ou realizar sua atividade.\n\nModelo Esforço–Recompensa:\nAnalisa a relação entre o esforço realizado pelo trabalhador e aquilo que ele recebe em contrapartida.\n\nO esforço pode envolver ritmo, responsabilidades, pressão e diferentes exigências da atividade. A recompensa pode envolver remuneração, reconhecimento, respeito, apoio, estabilidade e outras formas de retorno relacionadas ao trabalho.\n\nQuando existe um desequilíbrio importante entre esforço e recompensa, pode haver maior risco de adoecimento.\n\nEsses instrumentos não buscam explicar sozinhos toda a experiência de uma pessoa. Seu papel é contribuir para o mapeamento dos fatores de risco, permitindo identificar onde uma investigação mais aprofundada pode ser necessária.","check":null},{"title":"Bloco 3: Riscos Psicossociais e Organização do Trabalho","sub":"","body":"Os riscos psicossociais estão relacionados às características da organização, das relações e das condições em que o trabalho é realizado. Seu mapeamento permite identificar situações que podem representar risco para a saúde dos trabalhadores.\n\nSobrecarga e Alta Demanda:\nQuantidade excessiva de atividades, ritmo intenso e exigências elevadas podem contribuir para situações de desgaste.\n\nBaixa Autonomia:\nQuando o trabalhador possui pouca liberdade ou possibilidade de decisão sobre sua atividade, pode existir uma relação desfavorável entre demanda e controle.\n\nMetas Abusivas ou Inalcançáveis:\nMetas estabelecidas de maneira rígida ou incompatíveis com as condições reais de trabalho podem constituir importantes fatores de risco.\n\nRelações de Trabalho:\nAs relações entre colegas e, especialmente, a relação com as lideranças também precisam ser consideradas. Comunicação, apoio e formas de tratamento fazem parte da experiência do trabalhador.\n\nAssédio, Abuso e Violência:\nComportamentos abusivos e diferentes formas de violência presentes nas relações profissionais também constituem fatores que precisam ser identificados.\n\nFalta de Clareza dos Papéis:\nQuando o trabalhador não compreende adequadamente suas responsabilidades ou recebe orientações contraditórias, podem surgir dificuldades na realização da atividade.\n\nO mapeamento desses fatores não deve ser utilizado para simplesmente localizar trabalhadores considerados “problemáticos”. A análise precisa considerar como o trabalho está organizado e quais características do contexto podem estar contribuindo para o risco de adoecimento.\n\nA partir dos resultados, as intervenções podem envolver mudanças na organização do trabalho, revisão de demandas e metas, reorganização de funções, desenvolvimento das lideranças e outras modificações relacionadas aos fatores identificados.","check":null},{"title":"Bloco 4: Integração dos Métodos — do Mapeamento à Intervenção","sub":"","body":"Na prática organizacional, métodos quantitativos e qualitativos podem ser utilizados de maneira complementar.\n\nQuando uma organização possui muitos trabalhadores e ainda não sabe exatamente onde estão os principais problemas, os instrumentos quantitativos podem funcionar como uma primeira etapa.\n\nMapeamento Inicial:\nQuestionários e escalas são aplicados para identificar fatores de risco e localizar grupos ou setores que apresentam maior necessidade de atenção.\n\nIdentificação das Prioridades:\nOs resultados permitem observar, por exemplo, que determinado setor apresenta alta demanda, baixo controle ou desequilíbrio entre esforço e recompensa.\n\nAprofundamento Qualitativo:\nDepois de identificar os grupos que necessitam de maior atenção, podem ser realizadas escutas individuais ou coletivas para compreender como aquelas situações estão sendo vivenciadas pelos trabalhadores.\n\nIntervenção Organizacional:\nA compreensão obtida nas diferentes etapas pode orientar mudanças na própria organização do trabalho. Dependendo da situação, podem ser necessárias ações relacionadas às lideranças, reconhecimento, acolhimento, metas, demandas, processos, autonomia ou distribuição das atividades.\n\nAssim, o método quantitativo permite realizar um mapeamento mais amplo, enquanto o qualitativo permite aprofundar a compreensão sobre a experiência dos trabalhadores.\n\nPor exemplo, uma empresa pode identificar por meio de questionários que determinado setor apresenta alto desgaste. A pontuação indica a existência de um fator de risco, mas não explica completamente por que aquela situação está acontecendo. A escuta dos trabalhadores pode revelar dificuldades relacionadas à liderança, metas, falta de autonomia, comunicação ou organização das atividades.\n\nDessa maneira, o objetivo final não é simplesmente medir o risco. O mapeamento precisa contribuir para identificação, intervenção e prevenção, considerando tanto os trabalhadores quanto as características da própria organização do trabalho.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: O Setor de Atendimento\n\nUma empresa com muitos funcionários percebe aumento dos afastamentos no setor de atendimento. Inicialmente, aplica questionários e identifica alta demanda, baixo controle e desequilíbrio entre esforço e recompensa naquele setor. Em seguida, realiza grupos de escuta e os trabalhadores relatam metas difíceis de alcançar, pouca autonomia, falta de reconhecimento e comunicação agressiva de algumas lideranças.\n\nPergunta Avaliativa\n\nConsiderando as abordagens qualitativas e quantitativas e os riscos psicossociais, explique como os dois métodos podem ser utilizados de forma complementar para compreender o problema e orientar intervenções no setor de atendimento.","criteria":[],"expected":""}},{"title":"Aula 5 — Sentido do Trabalho, Riscos Psicossociais e COPSOQ","steps":[{"title":"Bloco 1: A Relação com o Trabalho e seus Diferentes Significados","sub":"","body":"O trabalho não possui um único significado na vida das pessoas. A relação estabelecida com ele pode envolver simultaneamente necessidade, prazer, realização, pertencimento, reconhecimento, propósito, estresse e cansaço.\n\nPor isso, compreender a saúde mental relacionada ao trabalho exige um olhar amplo para aquilo que essa atividade representa para cada pessoa e para o contexto em que ela está inserida.\n\nNecessidade:\nO trabalho possui uma dimensão concreta relacionada à sobrevivência, à remuneração, às responsabilidades financeiras e à possibilidade de construir maior independência.\n\nPrazer:\nMesmo quando uma pessoa gosta daquilo que faz, o trabalho pode apresentar dificuldades, conflitos e dias mais desgastantes. A presença desses desafios não elimina necessariamente o prazer relacionado à atividade. É importante observar como essas diferentes experiências aparecem na relação cotidiana com o trabalho.\n\nSentido e Propósito:\nPerceber sentido naquilo que se realiza pode contribuir para a relação do trabalhador com sua atividade. O trabalho pode representar a possibilidade de contribuir, desenvolver alguma função considerada importante ou realizar algo coerente com aquilo que a pessoa deseja construir profissionalmente.\n\nPertencimento:\nSentir-se parte do ambiente e identificar-se com aquilo que está sendo realizado também interfere na experiência profissional. A sensação de não pertencimento pode modificar significativamente a relação com o trabalho.\n\nRealização e Reconhecimento:\nA realização pode estar relacionada ao poder de escolha, às perspectivas de crescimento, aos resultados alcançados e ao reconhecimento recebido por aquilo que é realizado.\n\nVálvula de Escape:\nEm algumas situações, o trabalho também pode funcionar como um espaço que permite à pessoa se afastar temporariamente de outras dificuldades vivenciadas em sua vida. Embora o próprio trabalho também possa gerar estresse e cansaço, ele pode representar um espaço de alívio diante de outros contextos.\n\nEssas dimensões não aparecem isoladamente. A relação com o trabalho precisa ser compreendida considerando a pessoa e os diferentes contextos nos quais ela está inserida.","check":null},{"title":"Bloco 2: Da Avaliação à Intervenção nos Riscos Psicossociais","sub":"","body":"As ferramentas utilizadas para avaliar a saúde mental no trabalho não devem ser compreendidas como um fim em si mesmas. Questionários, escalas, entrevistas e grupos fornecem informações, mas é o profissional que precisa interpretar os resultados e compreender o contexto em que eles aparecem.\n\nA escolha do método depende da demanda e daquilo que se pretende investigar.\n\nGrupos Menores e Demandas Específicas:\nQuando já existe um grupo identificado e a necessidade é compreender profundamente sua experiência, podem ser utilizadas abordagens qualitativas, como a Psicodinâmica do Trabalho. A escuta permite investigar sofrimento, relações, reconhecimento, organização do trabalho e outros elementos presentes naquela realidade.\n\nGrupos Maiores e Mapeamento Inicial:\nQuando a organização possui muitos trabalhadores e ainda não sabe onde estão os principais fatores de risco, questionários e escalas podem ajudar a realizar uma primeira filtragem.\n\nInstrumentos como o Modelo Demanda–Controle permitem observar situações de alta demanda e baixo controle, enquanto o Modelo Esforço–Recompensa permite identificar possíveis desequilíbrios entre aquilo que o trabalhador oferece e aquilo que recebe em retorno.\n\nDepois dessa identificação inicial, os resultados podem direcionar uma investigação qualitativa com determinados setores ou grupos.\n\nA intervenção também não deve se limitar ao trabalhador. Quando o problema está relacionado à organização do trabalho, podem ser necessárias mudanças nas demandas, metas, processos, funções, condições de trabalho ou formas de liderança.\n\nDessa maneira, avaliar riscos psicossociais significa construir um caminho entre identificação, compreensão e intervenção.","check":null},{"title":"Bloco 3: COPSOQ e Avaliação Multidimensional dos Riscos Psicossociais","sub":"","body":"O COPSOQ é um questionário utilizado para avaliar diferentes dimensões relacionadas aos riscos psicossociais no trabalho. Uma de suas características é justamente possuir uma abordagem multidimensional.\n\nEnquanto outros modelos concentram a avaliação em dimensões específicas, como demanda e controle ou esforço e recompensa, o COPSOQ procura abranger diferentes fatores presentes na relação entre trabalhador e organização.\n\nExigências do Trabalho:\nInclui aspectos relacionados às exigências quantitativas e emocionais presentes na atividade.\n\nAutonomia e Controle:\nAvalia elementos relacionados à possibilidade de participação, decisão e controle sobre o próprio trabalho.\n\nQualidade da Liderança:\nPermite observar características relacionadas à forma como a liderança aparece no contexto profissional.\n\nApoio Social:\nConsidera o apoio presente nas relações estabelecidas no ambiente de trabalho.\n\nReconhecimento:\nInclui a percepção de valorização e reconhecimento relacionada à atividade realizada.\n\nClareza de Papéis:\nPermite observar se as responsabilidades e expectativas relacionadas ao trabalho estão suficientemente definidas.\n\nConflito Trabalho–Família:\nAvalia a interferência das exigências profissionais sobre a vida familiar, como situações em que horários, demandas ou atividades profissionais ultrapassam os limites do período de trabalho.\n\nInsegurança no Emprego:\nConsidera aspectos relacionados à percepção de segurança ou instabilidade profissional.\n\nSaúde e Bem-Estar:\nInclui dimensões relacionadas ao estresse e ao esgotamento.\n\nO instrumento possui diferentes versões. A escolha considera as necessidades da avaliação e a extensão do questionário. As questões são estruturadas previamente, não sendo modificadas livremente conforme cada organização.\n\nO COPSOQ também pode ser aplicado de maneira digital e preservar o anonimato das respostas, favorecendo maior segurança para que os trabalhadores respondam sobre sua experiência.","check":null},{"title":"Bloco 4: Dos Resultados do COPSOQ ao Plano de Ação","sub":"","body":"A utilização do COPSOQ permite analisar os resultados por diferentes dimensões, em vez de produzir apenas uma classificação geral sobre a organização.\n\nAs respostas podem ser agrupadas considerando informações como setor ou área de trabalho, sem a necessidade de identificar nominalmente cada trabalhador. Dessa forma, é possível localizar fatores de risco mantendo o anonimato dos participantes.\n\nOs resultados podem ser apresentados por níveis que ajudam a visualizar as prioridades de intervenção.\n\nVerde:\nIndica uma condição mais favorável naquela dimensão.\n\nAmarelo:\nIndica necessidade de atenção e acompanhamento.\n\nVermelho:\nIndica uma condição de maior risco e necessidade de intervenção.\n\nEssa classificação permite direcionar o plano de ação para as dimensões que apresentaram maior necessidade.\n\nSe determinado setor apresenta resultado favorável em apoio social, mas maior risco em exigências emocionais e conflito trabalho–família, por exemplo, o plano de ação deve considerar prioritariamente os fatores identificados como problemáticos.\n\nO conflito trabalho–família não significa necessariamente investigar a relação pessoal do trabalhador com seus familiares. O foco está em compreender como o trabalho interfere nessa relação, como horários imprevisíveis, demandas que continuam fora do expediente ou atividades profissionais levadas para casa.\n\nO resultado quantitativo, entretanto, continua não sendo suficiente para compreender sozinho toda a situação. Depois de localizar os fatores e setores de maior risco, a escuta qualitativa pode ajudar a compreender como aquelas condições aparecem no cotidiano dos trabalhadores.\n\nAssim, a avaliação dos riscos psicossociais não termina com a geração de gráficos ou classificações. Os resultados precisam orientar um plano de ação, permitindo que a organização intervenha sobre os fatores identificados.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: O Mapeamento da Empresa Nexus\n\nA Nexus aplica o COPSOQ em seus diferentes setores e identifica que a equipe de tecnologia apresenta resultados favoráveis em apoio social, mas níveis elevados de exigências emocionais e conflito trabalho–família. Nas escutas posteriores, os trabalhadores relatam demandas que continuam após o expediente, dificuldade para prever o horário de encerramento das atividades e sensação de que precisam permanecer disponíveis mesmo quando estão em casa.\n\nPergunta Avaliativa\n\nConsiderando o COPSOQ e a integração entre métodos quantitativos e qualitativos, explique como os resultados da Nexus podem orientar o aprofundamento da investigação e a construção de um plano de ação.","criteria":[],"expected":""}},{"title":"Aula 6 — Sentidos do Trabalho e Avaliação Multidimensional dos Riscos Psicossociais","steps":[{"title":"Bloco 1: Trabalho, Prazer, Sentido e Pertencimento","sub":"","body":"A relação entre a pessoa e o trabalho é complexa e não pode ser compreendida apenas pela presença ou ausência de sofrimento. O trabalho pode assumir diferentes significados e reunir, ao mesmo tempo, experiências positivas e negativas.\n\nPrazer:\nO trabalho pode proporcionar satisfação e experiências positivas, mesmo que também envolva desafios, desconfortos, estresse e cansaço. Gostar daquilo que se faz não significa vivenciar apenas momentos agradáveis.\n\nSentido e Propósito:\nO trabalho pode adquirir sentido quando a pessoa percebe uma finalidade naquilo que realiza. Em determinadas profissões, por exemplo, auxiliar outras pessoas, acompanhar resultados ou perceber a contribuição da própria atividade pode fortalecer essa relação.\n\nPertencimento:\nSentir-se parte do ambiente, da profissão ou daquilo que está sendo construído também interfere na experiência profissional. A sensação de pertencimento ou de não pertencimento influencia a forma como a pessoa se relaciona com o trabalho.\n\nRealização:\nPode envolver diferentes elementos, como possibilidade de escolha, reconhecimento, resultados alcançados e perspectivas de crescimento.\n\nNecessidade:\nO trabalho também está relacionado às necessidades concretas da vida, como remuneração, responsabilidades financeiras e busca por independência.\n\nEstresse e Cansaço:\nMesmo quando existe identificação, prazer ou propósito, o trabalho continua podendo produzir desgaste. A análise precisa considerar como esses diferentes elementos aparecem na experiência do trabalhador.\n\nO mais importante, portanto, não é classificar o trabalho simplesmente como positivo ou negativo, mas compreender como está essa relação e o contexto em que ela acontece.","check":null},{"title":"Bloco 2: Trabalho, Vida Pessoal e Diferentes Contextos","sub":"","body":"A pessoa não deixa suas outras experiências fora da organização quando começa a trabalhar. Vida profissional, relações familiares e experiências pessoais podem se relacionar, tornando difícil estabelecer uma separação absoluta entre esses diferentes contextos.\n\nTrabalho e Família:\nOs dois contextos podem interferir um no outro. Horários, demandas profissionais e responsabili
