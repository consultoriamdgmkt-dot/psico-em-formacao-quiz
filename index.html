ionadas a necessidades, estímulos, recompensas e expectativas, a próxima etapa seria aprofundar perspectivas relacionadas à autodeterminação."}], "case": "Uma empresa deseja aumentar a produtividade e cria um bônus para quem superar determinada meta. Inicialmente, a equipe demonstra grande empolgação, mas, depois de algum tempo, a gestão percebe que precisa aumentar ou modificar continuamente as recompensas para manter o mesmo comportamento. Pela discussão da aula, o caso permite compreender tanto a lógica da Teoria da Expectativa — na qual o trabalhador avalia esforço, relação entre desempenho e recompensa e valor do resultado — quanto a crítica apresentada pelo professor: quando o comportamento depende predominantemente de fatores externos, sua manutenção pode exigir novos estímulos, sem necessariamente construir uma motivação intrínseca."}, "5": {"title": "Visão Sistêmica, Motivação Intrínseca e Extrínseca e Aplicação das Teorias", "blocks": [{"title": "Retomada da avaliação: não analisar um comportamento isoladamente", "body": "um problema de comportamento não deve ser analisado de maneira isolada.\n\nQuando o psicólogo se depara com determinada situação dentro de uma organização, não deve escolher imediatamente uma única teoria ou uma única causa para explicá-la.\n\nÉ necessário ampliar o olhar e compreender:\n\n- a pessoa;\n\n- o contexto;\n\n- as relações;\n\n- a liderança;\n\n- as condições de trabalho;\n\n- os processos organizacionais;\n\n- os diferentes fatores que podem estar relacionados ao comportamento observado.", "key": "um problema de comportamento não deve ser analisado de maneira isolada."}, {"title": "Visão sistêmica", "body": "O conceito central apresentado é a visão sistêmica.\n\nTer uma visão sistêmica significa compreender que determinado problema faz parte de um conjunto de relações e não pode ser entendido adequadamente quando analisado de maneira fragmentada.\n\nNo estudo, isso significa não tratar cada conteúdo como se estivesse completamente separado dos demais.\n\nNa prática profissional, significa não reduzir um problema organizacional a uma explicação única.\n\nVISÃO FOCADA/ISOLADA → observa apenas uma parte\n\nVISÃO SISTÊMICA → relaciona pessoa, contexto, processos e diferentes variáveis", "key": "O conceito central apresentado é a visão sistêmica."}, {"title": "O problema apresentado nem sempre é o problema real", "body": "A organização procura o psicólogo porque Lucas estaria:\n\n- isolando-se;\n\n- apresentando dificuldades;\n\n- sob pressão para cumprir uma meta;\n\n- aparentemente sem conseguir responder às expectativas da gestão.\n\nA direção apresenta a situação como um problema de Lucas e exige uma solução rápida.\n\nEntretanto, o psicólogo não deveria simplesmente aceitar essa definição.\n\nA pergunta passa a ser:\n\nO problema é realmente apenas de Lucas?\n\nA situação pode envolver também liderança, cobrança, metas, clima, relações interpessoais, condições organizacionais e a própria história do trabalhador.", "key": "O problema é realmente apenas de Lucas?"}, {"title": "Investigar antes de intervir", "body": "Diante de um problema organizacional, a primeira tarefa não é julgar nem apresentar imediatamente uma solução.\n\nÉ necessário investigar.\n\nDepois, outras pessoas podem ser ouvidas para ampliar a compreensão da situação.\n\nA lógica é construir gradualmente uma leitura mais ampla do problema.\n\nO psicólogo deve trabalhar com hipóteses, e não com conclusões precipitadas.\n\nPensar hipóteses → investigar → relacionar informações → compreender o contexto → intervir", "key": "Diante de um problema organizacional, a primeira tarefa não é julgar nem apresentar imediatamente uma solução."}, {"title": "Feedback positivo e construção de aliados", "body": "Em vez de dizer que o gestor está “acabando com a equipe”, a proposta é realizar um feedback positivo, reconhecendo aspectos de sua atuação e utilizando elementos trazidos pelo próprio interlocutor para conduzir a conversa.\n\nA escuta precisa ser atenta.\n\nO psicólogo pode utilizar aquilo que a própria pessoa diz para formular perguntas, produzir reflexão e ampliar a compreensão da situação.\n\nO objetivo é criar condições para que o gestor participe do processo, tornando-se um aliado na intervenção, em vez de simplesmente colocá-lo na posição de culpado.", "key": "Em vez de dizer que o gestor está “acabando com a equipe”, a proposta é realizar um feedback positivo, reconhecendo aspectos de sua atuação e utilizando elementos trazidos pelo próprio interlocutor para conduzir a conversa."}, {"title": "Sem julgamento", "body": "Outro princípio enfatizado é a necessidade de trabalhar sem julgamento.\n\nO psicólogo não deve chegar à organização procurando imediatamente:\n\n- culpados;\n\n- certos e errados;\n\n- uma causa única;\n\n- uma resposta pronta.\n\nA análise precisa considerar diferentes perspectivas.\n\nIsso é particularmente importante porque aquilo que inicialmente parece ser um problema individual pode estar relacionado a processos organizacionais mais amplos.\n\nSem julgamento não significa ausência de análise.\n\nSignifica investigar antes de concluir.", "key": "Outro princípio enfatizado é a necessidade de trabalhar sem julgamento."}, {"title": "O caso de Lucas e a motivação", "body": "Ao ampliar a análise do caso, surge a hipótese de que Lucas possa não estar intrinsecamente motivado para aquele trabalho.\n\nEntretanto, mesmo essa hipótese precisa ser investigada.\n\nAssim, uma situação aparentemente relacionada apenas à motivação pode envolver simultaneamente:\n\n- necessidades;\n\n- segurança;\n\n- contexto profissional;\n\n- liderança;\n\n- pressão;\n\n- metas;\n\n- relações;\n\n- clima organizacional.\n\nO exemplo demonstra por que as teorias precisam ser conectadas, e não utilizadas de maneira isolada.", "key": "Ao ampliar a análise do caso, surge a hipótese de que Lucas possa não estar intrinsecamente motivado para aquele trabalho."}, {"title": "Aplicação integrada das teorias", "body": "O objetivo do estudo das teorias não é simplesmente decorar autores.\n\nO mais importante é desenvolver a capacidade de identificar:\n\nEstamos diante de motivação intrínseca ou extrínseca?\n\nExiste um movimento interno ou predominam estímulos externos?\n\nO comportamento observado está relacionado somente ao indivíduo ou também ao contexto?\n\nAs teorias ajudam a construir diferentes formas de compreender uma situação, mas precisam ser interpretadas considerando o período em que foram desenvolvidas e as condições em que são aplicadas.", "key": "O objetivo do estudo das teorias não é simplesmente decorar autores."}, {"title": "Motivação intrínseca × motivação extrínseca", "body": "A distinção entre motivação intrínseca e extrínseca volta a ocupar posição central.\n\nMotivação intrínseca\n\nEstá relacionada ao movimento interno da pessoa, àquilo que estabelece conexão com sua forma de pensar, seus sentimentos, seus objetivos e sua história.\n\nMotivação extrínseca\n\nNa linguagem utilizada durante as aulas, aparece associada aos estímulos externos que procuram produzir ou manter determinado comportamento.\n\nA pergunta fundamental passa a ser:\n\n“A pessoa está realmente motivada ou está sendo estimulada?”\n\nEssa diferença é apresentada como mais importante do que simplesmente memorizar isoladamente cada teoria motivacional.", "key": "Essa diferença é apresentada como mais importante do que simplesmente memorizar isoladamente cada teoria motivacional."}, {"title": "Retomada crítica da Teoria da Expectativa", "body": "- “Meu esforço vale a pena?”\n\n- “Vou conseguir?”\n\n- “Vou receber aquilo que foi prometido?”\n\n- “Aquilo que vou receber tem valor para mim?”\n\nNa leitura apresentada em aula, essa lógica pode produzir pressão e dependência de elementos externos.\n\nPor isso, a teoria é analisada dentro da distinção maior entre motivação intrínseca e estímulos externos.", "key": "Por isso, a teoria é analisada dentro da distinção maior entre motivação intrínseca e estímulos externos."}, {"title": "Teorias precisam ser contextualizadas historicamente", "body": "As primeiras abordagens sobre comportamento e produtividade estavam inseridas em contextos marcados pela industrialização, pelo Taylorismo e pelo Fordismo.\n\nEm determinados momentos, melhorar elementos externos do ambiente de trabalho e observar seus efeitos sobre a produtividade representou uma mudança importante.\n\nAs teorias precisam ser compreendidas considerando:\n\n- a época;\n\n- o contexto;\n\n- as características das organizações;\n\n- as mudanças na compreensão do trabalhador.", "key": "As primeiras abordagens sobre comportamento e produtividade estavam inseridas em contextos marcados pela industrialização, pelo Taylorismo e pelo Fordismo."}, {"title": "Procedimento não substitui educação", "body": "Criar uma norma, estabelecer um processo ou determinar o uso de um equipamento não garante automaticamente que o comportamento esperado ocorrerá.\n\nUm trabalhador pode, por exemplo, saber que deveria utilizar determinado EPI e ainda assim não utilizá-lo.\n\nPor isso, segundo a discussão apresentada, a organização precisa desenvolver também um processo educativo.\n\nNORMA/PROCEDIMENTO → estabelece o que deve ser feito\n\nPROCESSO EDUCATIVO → trabalha a compreensão da pessoa sobre aquilo que está fazendo\n\nEssa discussão recupera a ideia apresentada desde a primeira aula: processos e pessoas precisam caminhar juntos.", "key": "NORMA/PROCEDIMENTO → estabelece o que deve ser feito"}, {"title": "Processos e pessoas", "body": "Uma organização pode:\n\n- formalizar procedimentos;\n\n- criar normas;\n\n- adquirir equipamentos;\n\n- estabelecer regras;\n\n- exigir comportamentos.\n\nEntretanto, se não trabalhar com as pessoas que executam esses processos, pode haver uma distância entre aquilo que foi estabelecido e aquilo que realmente acontece.\n\nPor isso:\n\nPROCESSOS + PESSOAS → precisam ser trabalhados conjuntamente\n\nA implementação técnica, sozinha, não garante mudança comportamental.", "key": "PROCESSOS + PESSOAS → precisam ser trabalhados conjuntamente"}, {"title": "Mudanças organizacionais e culturais", "body": "Ele relata transformações observadas ao longo do tempo em organizações, especialmente relacionadas à formalização, segurança e organização do trabalho.\n\nA ideia central é que mudanças organizacionais também envolvem mudanças culturais.\n\nQuando determinada prática ainda não faz parte da cultura de uma organização ou de um setor, sua transformação pode exigir:\n\n- tempo;\n\n- educação;\n\n- acompanhamento;\n\n- mudança de percepção;\n\n- novos processos.\n\nAssim, novamente, não basta estabelecer uma regra e esperar adesão automática.", "key": "A ideia central é que mudanças organizacionais também envolvem mudanças culturais."}, {"title": "Transição para Locke e Latham", "body": "O conteúdo é associado à discussão sobre metas.\n\nNesta transcrição, a teoria ainda não é desenvolvida em detalhes.\n\nEla aparece como conteúdo que será aprofundado na sequência.\n\nPortanto, para esta aula, o ponto seguro é:\n\nLocke e Latham → teoria relacionada ao estabelecimento de metas.\n\nNão cabe ainda acrescentar características específicas das metas que não foram desenvolvidas nesta aula.", "key": "O conteúdo é associado à discussão sobre metas."}, {"title": "Transição para Daniel Pink", "body": "Assim como Locke e Latham, Daniel Pink aparece como parte da sequência das teorias que serão organizadas e comparadas posteriormente.\n\nNesta aula, porém, seus componentes ainda não são explicados de forma suficiente para constituir um bloco conceitual próprio.", "key": "Assim como Locke e Latham, Daniel Pink aparece como parte da sequência das teorias que serão organizadas e comparadas posteriormente."}], "case": "Lucas começou a apresentar isolamento e dificuldades para cumprir uma meta, e seu gestor concluiu que ele estava desmotivado e pediu ao psicólogo que resolvesse rapidamente o problema. Uma atuação baseada na visão sistêmica não deveria aceitar imediatamente essa interpretação. O psicólogo precisaria investigar a percepção do gestor, conversar com Lucas e considerar liderança, pressão, metas, necessidades, relações, clima e condições organizacionais, trabalhando com hipóteses e evitando julgamentos. O caso demonstra que um comportamento aparentemente individual pode estar relacionado a diferentes elementos do sistema organizacional."}, "6": {"title": "Integração das Teorias de Motivação, Ecossistema de Aprendizagem e Visão Sistêmica", "blocks": [{"title": "Motivação como base para o estudo posterior da liderança", "body": "O conteúdo de motivação foi desenvolvido antes de liderança de forma intencional.\n\nPara compreender posteriormente a atuação de um líder, é necessário primeiro compreender o indivíduo e o processo motivacional.\n\nCompreender aprendizagem e motivação → compreender o indivíduo → posteriormente compreender a atuação da liderança\n\nAssim, motivação funciona como uma base conceitual para o conteúdo seguinte.", "key": "Para compreender posteriormente a atuação de um líder, é necessário primeiro compreender o indivíduo e o processo motivacional."}, {"title": "Visão sistêmica na resolução das questões", "body": "Uma situação organizacional não deve ser analisada por uma única informação.\n\nO aluno precisa observar diferentes pistas presentes no caso e estabelecer relações entre elas.\n\nIsso significa evitar respostas baseadas apenas em uma palavra-chave.\n\nA lógica esperada é:\n\nIdentificar os elementos do caso → reconhecer os conceitos relacionados → estabelecer conexões → explicar o problema\n\nO objetivo é desenvolver uma forma de raciocínio próxima daquela utilizada pelo psicólogo diante de situações organizacionais.", "key": "Isso significa evitar respostas baseadas apenas em uma palavra-chave."}, {"title": "Caso de Lucas: contrato de trabalho instável", "body": "Lucas acabou de ingressar em uma equipe sob um contrato de trabalho instável.\n\nEssa informação não aparece por acaso.\n\nNa leitura da Pirâmide de Maslow, a instabilidade do contrato está relacionada à necessidade de:\n\nSegurança\n\nPortanto:\n\nContrato instável → necessidade de segurança afetada\n\nO aluno precisa aprender a identificar essas pistas dentro do enunciado.", "key": "Contrato instável → necessidade de segurança afetada"}, {"title": "Caso de Lucas: conflitos e isolamento", "body": "Outra informação do caso é que Lucas enfrenta conflitos constantes no grupo e sente-se isolado.\n\nNovamente, essa informação deve ser relacionada à Pirâmide de Maslow.\n\nSocial / pertencimento\n\nAssim:\n\nIsolamento e conflitos → necessidade social/de pertencimento afetada\n\nLucas apresenta, portanto, dificuldades relacionadas simultaneamente à segurança e ao pertencimento social.", "key": "Outra informação do caso é que Lucas enfrenta conflitos constantes no grupo e sente-se isolado."}, {"title": "Caso de Lucas: necessidade de aprender rapidamente", "body": "Além das dificuldades anteriores, o gestor exige que Lucas aprenda rapidamente um software técnico altamente complexo para resolver um problema operacional da empresa.\n\nO caso, portanto, não deve ser respondido somente com Maslow.\n\nÉ necessário conectar:\n\nMaslow + ecossistema de aprendizagem", "key": "Além das dificuldades anteriores, o gestor exige que Lucas aprenda rapidamente um software técnico altamente complexo para resolver um problema operacional da empresa."}, {"title": "Ecossistema de aprendizagem: cognitivo e afetivo", "body": "Cognitivo\n\nEstá relacionado à forma de pensar e aos processos necessários para aprender.\n\nNo exemplo apresentado, aparecem elementos como atenção e processamento das informações necessárias para dominar o software.\n\nAfetivo\n\nEstá relacionado à dimensão emocional envolvida no processo de aprendizagem.\n\nEm sua explicação:\n\nCognição + afeto → construção interna da aprendizagem → possibilidade de motivação intrínseca", "key": "Cognição + afeto → construção interna da aprendizagem → possibilidade de motivação intrínseca"}, {"title": "Segurança e pertencimento interferindo na aprendizagem", "body": "O caso de Lucas exige justamente a integração dessas duas partes.\n\nPor um lado, Lucas enfrenta:\n\n- insegurança decorrente do contrato instável;\n\n- conflitos;\n\n- isolamento;\n\n- falta de pertencimento.\n\nPor outro, precisa aprender rapidamente um conteúdo técnico complexo.\n\nA preocupação com sua permanência no emprego e a ausência de suporte social podem prejudicar as condições afetivas e cognitivas envolvidas no processo de aprendizagem.\n\nPortanto, a resposta não termina em “Lucas está desmotivado”.\n\nÉ necessário explicar por que sua motivação e sua aprendizagem estão prejudicadas.", "key": "O caso de Lucas exige justamente a integração dessas duas partes."}, {"title": "Modelo de raciocínio esperado no caso de Lucas", "body": "A análise pode ser organizada da seguinte maneira:\n\n1. Identificar a pista: contrato instável.\n\n2. Relacionar: necessidade de segurança em Maslow.\n\n3. Identificar a pista: conflitos e isolamento.\n\n4. Relacionar: necessidade social/de pertencimento.\n\n5. Identificar a pista: precisa aprender rapidamente um software complexo.\n\n6. Relacionar: ecossistema de aprendizagem.\n\n7.\n\nIntegrar: insegurança e isolamento interferem nos componentes afetivos e cognitivos necessários ao aprendizado e, consequentemente, prejudicam a construção da motivação.\n\nEssa é a visão sistêmica aplicada à questão.", "key": "Essa é a visão sistêmica aplicada à questão."}, {"title": "Aprendizagem e motivação intrínseca", "body": "A motivação intrínseca depende de uma construção interna.\n\nNa explicação apresentada, aprender não significa apenas receber uma informação.\n\nÉ necessário que a pessoa consiga:\n\n- formar uma maneira de pensar;\n\n- incorporar aquilo à própria vida;\n\n- construir um novo paradigma;\n\n- colocar o aprendizado em prática;\n\n- estabelecer uma conexão afetiva com aquilo.\n\nQuando essa construção ocorre, o comportamento deixa de depender exclusivamente de estímulos externos.", "key": "Na explicação apresentada, aprender não significa apenas receber uma informação."}, {"title": "Conhecimento, habilidade e atitude", "body": "Conhecimento — saber.\n\nHabilidade — saber fazer.\n\nAtitude — querer fazer.\n\nA aprendizagem não se encerra no conhecimento teórico.\n\nEla envolve a capacidade de transformar aquilo que se sabe em ação e incorporar esse aprendizado ao comportamento.\n\nNa lógica apresentada em aula:\n\nConhecimento + habilidade + atitude + dimensão afetiva → aprendizagem incorporada", "key": "Conhecimento + habilidade + atitude + dimensão afetiva → aprendizagem incorporada"}, {"title": "Motivação verdadeira × empolgação e estímulo", "body": "Motivação intrínseca\n\nÉ descrita como um movimento interno, construído e incorporado pela pessoa.\n\nPor estar relacionado à aprendizagem, às formas de pensar e à dimensão afetiva, tende a permanecer.\n\nEstímulo, animação ou empolgação\n\nPodem produzir uma resposta, mas não necessariamente significam que ocorreu uma construção motivacional interna.", "key": "É descrita como um movimento interno, construído e incorporado pela pessoa."}, {"title": "Estímulos externos e produtividade", "body": "A discussão menciona experiências nas quais alterações no ambiente e nas relações de trabalho foram associadas a mudanças de produtividade.\n\nEstimular externamente determinado comportamento\n\nE\n\nConstruir uma motivação intrínseca que permaneça mesmo sem aquele estímulo.", "key": "A discussão menciona experiências nas quais alterações no ambiente e nas relações de trabalho foram associadas a mudanças de produtividade."}, {"title": "A importância de não estudar as teorias isoladamente", "body": "A questão pode fornecer uma teoria e, em seguida, apresentar uma situação que exige conexão com outro conteúdo.\n\nPor isso, estudar apenas:\n\n“Maslow = hierarquia de necessidades”\n\nNão é suficiente.\n\nÉ necessário conseguir reconhecer:\n\nContrato instável → segurança\n\nIsolamento → pertencimento/social\n\nExigência de aprendizagem → componentes cognitivos e afetivos\n\nE depois conectar esses elementos em uma explicação única.", "key": "Exigência de aprendizagem → componentes cognitivos e afetivos"}], "case": "Lucas ingressou recentemente em uma empresa com contrato instável, enfrenta conflitos constantes com sua equipe e sente-se isolado. Ao mesmo tempo, seu gestor exige que aprenda rapidamente um software complexo para solucionar um problema operacional. Uma análise sistêmica não deve reduzir a situação à afirmação de que Lucas “não está motivado”. O contrato instável relaciona-se à necessidade de segurança, enquanto o isolamento compromete a dimensão social/de pertencimento. Essas condições podem interferir nos componentes afetivos e cognitivos envolvidos na aprendizagem, dificultando a construção interna necessária para que Lucas se motive e domine o novo conhecimento."}, "7": {"title": "Teorias da Motivação: da influência externa à autodeterminação", "blocks": [{"title": "Visão sistêmica das teorias de motivação", "body": "A finalidade é construir uma visão macro e sistêmica, evitando que cada teoria seja estudada como um conteúdo isolado.\n\nAo observar a evolução dessas teorias, um eixo importante é perceber como as explicações sobre motivação passam progressivamente de uma ênfase nos fatores externos para uma compreensão maior dos processos internos do indivíduo.\n\nA questão central continua sendo:\n\nO comportamento está sendo mantido por estímulos externos ou existe uma motivação intrínseca construída internamente?", "key": "A finalidade é construir uma visão macro e sistêmica, evitando que cada teoria seja estudada como um conteúdo isolado."}, {"title": "Aprendizagem e motivação intrínseca", "body": "Aprender, nessa abordagem apresentada em aula, não significa apenas repetir uma informação.\n\nA aprendizagem envolve construir um registro interno capaz de modificar a maneira como a pessoa pensa e interpreta sua realidade.\n\nCognição\n\nEstá relacionada à forma de pensar.\n\nA aprendizagem permite construir novos paradigmas e novas maneiras de compreender determinada situação.\n\nAfetividade\n\nO conteúdo aprendido também se conecta à dimensão emocional. A pessoa atribui significado àquilo que aprendeu.\n\nQuando cognição e afetividade se integram, o aprendizado pode ser incorporado à vida da pessoa.\n\nPor isso, alguém pode continuar realizando algo mesmo diante de cansaço, dificuldades ou ausência de recompensas imediatas: existe um movimento interno sustentando aquele comportamento.", "key": "Aprender, nessa abordagem apresentada em aula, não significa apenas repetir uma informação."}, {"title": "Motivação intrínseca × estímulos externos", "body": "Motivação intrínseca\n\nÉ apresentada como um movimento interno que permanece mesmo diante de dificuldades.\n\nA pessoa incorporou determinado objetivo, construiu significado e não depende exclusivamente de recompensas externas para continuar.\n\nEstímulos externos\n\nSão elementos do ambiente capazes de influenciar o comportamento.\n\nPodem produzir respostas e aumentar momentaneamente determinados comportamentos, mas não significam necessariamente que exista motivação intrínseca.", "key": "É apresentada como um movimento interno que permanece mesmo diante de dificuldades."}, {"title": "Elton Mayo e os fatores psicológicos e sociais", "body": "A observação dos trabalhadores mostrou a importância de fatores psicológicos e sociais, como:\n\n- sentir-se observado;\n\n- sentir-se valorizado;\n\n- relações estabelecidas no ambiente;\n\n- formação de grupos;\n\n- normas criadas espontaneamente pelos próprios grupos.\n\nGrupos espontâneos\n\nOs trabalhadores formam relações e grupos que podem desenvolver suas próprias normas e influenciar o comportamento dos integrantes.", "key": "A observação dos trabalhadores mostrou a importância de fatores psicológicos e sociais, como:"}, {"title": "Maslow e a hierarquia das necessidades", "body": "A ideia central trabalhada é a existência de uma hierarquia de necessidades.\n\nA pirâmide representa essa organização porque sua base sustenta os níveis posteriores.\n\nO caso de Lucas, discutido anteriormente, exemplifica essa aplicação:\n\nContrato instável → segurança afetada\n\nIsolamento e conflitos → necessidade social/de pertencimento afetada\n\nA teoria permite, portanto, identificar quais necessidades estão comprometidas em determinada situação.", "key": "A ideia central trabalhada é a existência de uma hierarquia de necessidades."}, {"title": "Herzberg: fatores higiênicos e fatores motivacionais", "body": "Fatores higiênicos\n\nRelacionam-se às condições que cercam o trabalho.\n\nNa lógica apresentada durante a comparação das teorias, permanecem mais próximos da dimensão externa.\n\nFatores motivacionais\n\nAproximam-se da dimensão interna da motivação.", "key": "Relacionam-se às condições que cercam o trabalho."}, {"title": "Skinner: estímulo, resposta e consequências", "body": "Na sequência apresentada, Skinner aparece relacionado à influência das consequências ambientais sobre o comportamento.\n\nA ideia trabalhada é:\n\nEstímulo → resposta → consequências\n\nO comportamento pode ser moldado pelas consequências produzidas no ambiente.\n\nmodifica-se o ambiente e observa-se a resposta comportamental.", "key": "Estímulo → resposta → consequências"}, {"title": "Bandura: modelagem e autoeficácia", "body": "Modelagem\n\nA pessoa observa alguém que alcançou determinado resultado e pode utilizar esse indivíduo como modelo.\n\nO exemplo apresentado é observar alguém que conseguiu alcançar uma carreira ou posição desejada e analisar o caminho percorrido por essa pessoa.\n\nO indivíduo passa a pensar:\n\n“Se aquela pessoa conseguiu chegar até lá, como ela fez?”\n\nA observação do modelo pode orientar a construção do próprio comportamento.\n\nAutoeficácia\n\nEstá relacionada à crença da pessoa de que é capaz de realizar determinada ação ou alcançar determinado resultado.\n\nAssim, não basta simplesmente existir um modelo.\n\nA pessoa precisa desenvolver a crença de que também consegue agir em direção ao resultado pretendido.", "key": "O exemplo apresentado é observar alguém que conseguiu alcançar uma carreira ou posição desejada e analisar o caminho percorrido por essa pessoa."}, {"title": "Vroom e a Teoria da Expectativa", "body": "Expectativa × Instrumentalidade × Valência\n\nA motivação depende da relação entre esses elementos.", "key": "A motivação depende da relação entre esses elementos."}, {"title": "Expectativa: comparação", "body": "Expectativa = comparação.\n\nA pessoa observa uma situação e compara possibilidades antes de agir.\n\nEla analisa o que está diante dela e formula uma expectativa em relação à ação.\n\nExpectativa → comparar.", "key": "A pessoa observa uma situação e compara possibilidades antes de agir."}, {"title": "Instrumentalidade: caixa de ferramentas e competência", "body": "Instrumentalidade = ferramentas/competências disponíveis para realizar aquilo.\n\nA pessoa se questiona:\n\n“Eu tenho competência para fazer isso?”\n\nDentro dessa caixa estariam os conhecimentos, habilidades e recursos pessoais necessários para realizar a atividade.\n\nAssim:\n\nInstrumentalidade → instrumento → ferramentas → competência.\n\nNo exemplo de uma promoção, a pessoa pode perguntar se possui as competências exigidas para assumir a nova função ou se precisará desenvolver novas capacidades.", "key": "Instrumentalidade → instrumento → ferramentas → competência."}, {"title": "Valência: o valor da recompensa", "body": "Valência = o valor atribuído ao que será obtido.\n\nA pergunta passa a ser:\n\n“O que eu vou ganhar com isso e isso vale a pena para mim?”\n\nEsse ganho não precisa ser apenas financeiro.\n\nPode envolver:\n\n- satisfação;\n\n- aprendizagem;\n\n- experiência;\n\n- crescimento;\n\n- empregabilidade;\n\n- recursos financeiros.\n\nDuas pessoas podem receber exatamente a mesma proposta e atribuir valores diferentes a ela.\n\nPor isso, o mesmo resultado pode apresentar valências diferentes para indivíduos diferentes.\n\nValência → valor.", "key": "Valência = o valor atribuído ao que será obtido."}, {"title": "O exemplo da promoção profissional", "body": "Um funcionário recebe a possibilidade de assumir um cargo superior.\n\nEle começa a analisar:\n\nExpectativa\n\nCompara a situação atual com aquilo que poderá acontecer ao aceitar a promoção.\n\nInstrumentalidade\n\nQuestiona se possui as competências e ferramentas necessárias para exercer a nova função.\n\nValência\n\nAvalia se aquilo que receberá em troca — salário, aprendizado, experiência ou empregabilidade — possui valor suficiente.\n\nUma pessoa pode considerar que o aumento salarial não compensa o esforço necessário para adquirir novas competências.\n\nOutra pode aceitar a mesma proposta porque considera que o aprendizado adquirido aumentará sua empregabilidade futura.\n\nO contexto é o mesmo, mas o cálculo realizado pelos indivíduos é diferente.", "key": "O contexto é o mesmo, mas o cálculo realizado pelos indivíduos é diferente."}, {"title": "Vroom e a dependência dos três elementos", "body": "Expectativa × Instrumentalidade × Valência\n\nSe uma das dimensões for anulada, a motivação prevista pela teoria também é anulada.\n\nExemplo:\n\nUma pessoa pode considerar uma atividade extremamente recompensadora, mas acreditar que não possui as competências necessárias para realizá-la.\n\nNesse caso, o valor da recompensa, sozinho, não seria suficiente.\n\nDa mesma forma, alguém pode acreditar que possui todas as competências necessárias, mas não perceber qualquer valor no resultado final.\n\nPor isso, a teoria considera conjuntamente os diferentes componentes.", "key": "Se uma das dimensões for anulada, a motivação prevista pela teoria também é anulada."}, {"title": "A virada para a Teoria da Autodeterminação", "body": "Na Teoria da Autodeterminação, a análise passa a enfatizar um movimento que ocorre de dentro para fora.\n\nA motivação é apresentada como um continuum que pode avançar de condições de ausência de motivação e regulações externas até formas mais internas de regulação e motivação intrínseca.\n\nO indivíduo vai incorporando determinadas razões, ampliando sua percepção e construindo internamente o movimento para agir.", "key": "A motivação é apresentada como um continuum que pode avançar de condições de ausência de motivação e regulações externas até formas mais internas de regulação e motivação intrínseca."}, {"title": "Autonomia, competência e pertencimento", "body": "Autonomia\n\nPossibilidade de agir com maior autodeterminação e participar das próprias escolhas.\n\nCompetência\n\nPercepção e desenvolvimento da capacidade necessária para realizar determinada atividade.\n\nPertencimento\n\nConstrução de relações saudáveis e sentimento de integração.\n\nA organização e a liderança podem criar condições favoráveis a esses elementos, mas a motivação não é simplesmente “colocada” de fora para dentro.\n\nO movimento motivacional é construído pelo próprio indivíduo.", "key": "A organização e a liderança podem criar condições favoráveis a esses elementos, mas a motivação não é simplesmente “colocada” de fora para dentro."}, {"title": "Promoção não significa competência para liderar", "body": "Um funcionário pode apresentar excelente desempenho operacional durante muitos anos e, por isso, ser promovido para liderar uma equipe.\n\nEntretanto:\n\nSer competente tecnicamente não significa possuir automaticamente competência para liderar pessoas.\n\nSe a promoção ocorre apenas porque a pessoa é excelente em sua função atual, sem considerar as competências necessárias à nova função, ela pode apresentar dificuldades e posteriormente ser responsabilizada pelo fracasso.\n\nEsse exemplo reforça novamente a necessidade de uma visão sistêmica sobre comportamento, motivação, competência e contexto organizacional.\n\nElton Mayo\n\nFatores psicológicos e sociais → grupos e ambiente.\n\nMaslow\n\nHierarquia das necessidades.\n\nHerzberg\n\nFatores higiênicos × fatores motivacionais.\n\nSkinner\n\nEstímulo → resposta → consequências.\n\nBandura\n\nModelagem + autoeficácia.\n\nVroom\n\nExpectativa × Instrumentalidade × Valência.\n\nTeoria da Autodeterminação\n\nMovimento de dentro para fora → autonomia + competência + pertencimento → aproximação da motivação intrínseca.", "key": "Ser competente tecnicamente não significa possuir automaticamente competência para liderar pessoas."}], "case": "Marina apresenta excelente desempenho técnico e, por isso, recebe uma proposta para liderar sua equipe. Antes de aceitar, compara a nova função com sua situação atual, questiona se possui as competências necessárias e avalia se o aumento salarial, a aprendizagem e a experiência profissional compensam as novas responsabilidades. Ao mesmo tempo, a organização considera que seu bom desempenho técnico é suficiente para garantir sucesso como líder. Pela visão sistêmica trabalhada em aula, a situação envolve tanto o cálculo apresentado por Vroom quanto a necessidade de distinguir competência técnica das competências exigidas pela nova função."}, "8": {"title": "Liderança, Poder e Bases de Poder", "blocks": [{"title": "Liderança nas organizações e na vida social", "body": "A liderança não deve ser compreendida apenas como um cargo, função, crachá ou posição formal dentro de uma empresa.\n\nEla aparece em diferentes contextos sociais e organizacionais e está relacionada à capacidade de influenciar outras pessoas.\n\nUma organização pode possuir líderes no nível:\n\n- operacional;\n\n- tático;\n\n- estratégico.\n\nPortanto, liderança não está restrita ao nível gerencial.\n\nÉ possível encontrar pessoas exercendo influência em diferentes posições da estrutura.\n\nao estudar liderança, não se deve fazer imediatamente um juízo de valor.\n\nLiderança não deve ser automaticamente entendida como positiva ou negativa.\n\nÉ necessário observar como a influência é exercida, quais recursos de poder são utilizados, qual é o contexto e quais resultados são buscados.", "key": "É necessário observar como a influência é exercida, quais recursos de poder são utilizados, qual é o contexto e quais resultados são buscados."}, {"title": "Poder", "body": "O poder está relacionado à capacidade ou potencial de afetar o comportamento de outra pessoa, utilizando recursos formais, pessoais ou estruturais.\n\nPoder → afetar o comportamento.\n\nA pessoa que possui poder apresenta potencial para influenciar o comportamento de outra, inclusive diante de resistência.\n\nPor isso, o poder não precisa necessariamente produzir engajamento voluntário.\n\nUma pessoa pode obedecer porque existe autoridade formal, possibilidade de punição, recompensa ou algum outro recurso controlado por quem exerce o poder.", "key": "O poder está relacionado à capacidade ou potencial de afetar o comportamento de outra pessoa, utilizando recursos formais, pessoais ou estruturais."}, {"title": "Liderança", "body": "A liderança é apresentada como um processo de influência interpessoal orientado para objetivos compartilhados e engajamento voluntário.\n\nTrês elementos foram destacados:\n\nInfluência interpessoal\n\nO líder influencia outras pessoas e seus comportamentos.\n\nObjetivos compartilhados\n\nO objetivo não pertence somente ao líder.\n\nAs pessoas envolvidas reconhecem aquele objetivo como algo compartilhado pelo grupo.\n\nEngajamento voluntário\n\nA pessoa deseja participar, contribuir e caminhar com o grupo.\n\nEsse elemento diferencia a liderança da simples imposição:\n\n“Eu quero fazer parte. Eu quero caminhar com o grupo. Eu quero estar nesse time.”", "key": "A liderança é apresentada como um processo de influência interpessoal orientado para objetivos compartilhados e engajamento voluntário."}, {"title": "Poder × Liderança", "body": "Embora poder e liderança estejam relacionados, eles não são sinônimos.\n\nPoder\n\nEstá relacionado ao potencial ou capacidade de afetar o comportamento de outra pessoa.\n\nLiderança\n\nEnvolve influência interpessoal, objetivos compartilhados e engajamento voluntário.\n\nAssim, alguém pode possuir poder em razão de uma posição formal sem necessariamente conseguir produzir o engajamento característico da liderança.\n\nDa mesma forma, a análise da liderança precisa considerar qual tipo de poder está sendo utilizado e como esse poder afeta os liderados.", "key": "Embora poder e liderança estejam relacionados, eles não são sinônimos."}, {"title": "Competência técnica não garante competência para liderar", "body": "Depois de alguns meses, apresenta dificuldades para conduzir pessoas e acaba sendo desligado.\n\nO problema está em presumir que:\n\nBom desempenho técnico = capacidade para liderar.\n\nUma pessoa pode produzir excelentes resultados individualmente e não possuir, naquele momento, as competências necessárias para exercer uma função de liderança.\n\nEsse exemplo reforça a necessidade de analisar liderança, poder, motivação, competências e contexto de maneira integrada.\n\nOs três tipos de poder", "key": "Depois de alguns meses, apresenta dificuldades para conduzir pessoas e acaba sendo desligado."}, {"title": "Poder Posicional", "body": "Está relacionado à estrutura, hierarquia e autoridade formal.\n\nPalavras-chave:\n\nPosição → estrutura → hierarquia → autoridade.\n\nDentro do poder posicional estão:\n\n- poder legítimo;\n\n- poder de coerção;\n\n- poder de recompensa.", "key": "Posição → estrutura → hierarquia → autoridade."}, {"title": "Poder Pessoal", "body": "Origina-se principalmente das qualidades individuais da pessoa, como conhecimento, habilidade, competência, admiração e capacidade de tornar-se referência para os demais.\n\nDentro do poder pessoal estão:\n\n- poder de referência;\n\n- poder de especialista.", "key": "Origina-se principalmente das qualidades individuais da pessoa, como conhecimento, habilidade, competência, admiração e capacidade de tornar-se referência para os demais."}, {"title": "Poder Relacional", "body": "Está relacionado às relações, conexões e estratégias utilizadas para manter redes interpessoais.\n\nDentro do poder relacional estão:\n\n- poder de informação;\n\n- poder de conexão.\n\nA palavra-chave destacada para compreender essa categoria é:\n\nRelações/conexões.\n\nAs sete bases de poder", "key": "Está relacionado às relações, conexões e estratégias utilizadas para manter redes interpessoais."}, {"title": "Poder de Coerção", "body": "É sustentado pela possibilidade de aplicar punições, sanções ou consequências negativas.\n\nPalavra-chave:\n\nMedo.\n\nA pessoa modifica seu comportamento porque pretende evitar determinada consequência.\n\nNa discussão sobre saúde mental, a coerção foi relacionada a:\n\n- ansiedade;\n\n- hipervigilância;\n\n- clima defensivo.\n\nPortanto, pode conseguir obediência, mas não significa necessariamente que exista engajamento voluntário.", "key": "Portanto, pode conseguir obediência, mas não significa necessariamente que exista engajamento voluntário."}, {"title": "Poder de Recompensa", "body": "É sustentado pela possibilidade de oferecer algo valorizado pelo outro.\n\nPode envolver recompensas, benefícios, reconhecimento ou outros recursos controlados por quem exerce o poder.\n\nA pessoa pode apresentar determinado comportamento para conseguir a recompensa.\n\nPalavra-chave: recompensa.", "key": "É sustentado pela possibilidade de oferecer algo valorizado pelo outro."}, {"title": "Poder Legítimo", "body": "É o poder decorrente da posição formal ocupada dentro de uma estrutura.\n\nA pessoa possui autoridade porque sua posição é reconhecida institucionalmente.\n\nExemplos aparecem em estruturas hierárquicas nas quais determinado cargo possui formalmente autoridade sobre outros.\n\nPalavras-chave:\n\nPosição → hierarquia → autoridade formal.\n\nUma organização menos hierarquizada, como algumas startups mencionadas em aula, pode reduzir a importância dessa base sem eliminar a possibilidade de liderança, pois outras bases de poder podem ser utilizadas.", "key": "A pessoa possui autoridade porque sua posição é reconhecida institucionalmente."}, {"title": "Poder de Referência", "body": "Surge quando outras pessoas apresentam admiração e identificação com determinado indivíduo.\n\nA influência não depende principalmente de ameaça ou posição hierárquica.\n\nO indivíduo torna-se uma referência para os demais.\n\nPalavras-chave:\n\nAdmiração → identificação → referência.\n\n- engajamento;\n\n- coesão;\n\n- lealdade;\n\n- menor estresse.", "key": "Admiração → identificação → referência."}, {"title": "Poder de Especialista", "body": "É sustentado pelo conhecimento, habilidades e competência reconhecida.\n\nAs pessoas reconhecem que aquele indivíduo domina determinada área e, por isso, atribuem valor às suas orientações.\n\nPalavras-chave:\n\nConhecimento → habilidade → competência.\n\nNão é o cargo que constitui o elemento central: é o reconhecimento da competência da pessoa.", "key": "Conhecimento → habilidade → competência."}, {"title": "Poder de Informação", "body": "Está relacionado à posse ou ao acesso a informações relevantes ou privilegiadas.\n\nA pessoa pode exercer poder porque outros indivíduos precisam das informações que ela possui para realizar suas atividades.\n\nPalavra-chave: informação privilegiada.\n\na retenção intencional de informações pode transformar essa base em um mecanismo de manipulação.\n\nQuando alguém controla informações para produzir dependência, insegurança ou obter vantagens, podem aparecer:\n\n- insegurança psicológica;\n\n- manipulação;\n\n- chantagem;\n\n- dependência.\n\nPortanto, possuir informação relevante pode conferir poder mesmo que a pessoa não ocupe formalmente um cargo superior.", "key": "Está relacionado à posse ou ao acesso a informações relevantes ou privilegiadas."}, {"title": "Poder de Conexão", "body": "Está relacionado às relações influentes, redes interpessoais e alianças estratégicas que a pessoa consegue construir ou acessar.\n\nA influência decorre de quem a pessoa conhece e das conexões às quais possui acesso.\n\nPalavras-chave:\n\nConexões → relações → alianças estratégicas.\n\nEssas relações podem representar vantagem importante dentro de uma organização.\n\n- favoritismo;\n\n- formação de “panelinhas”.", "key": "Conexões → relações → alianças estratégicas."}, {"title": "Bases de poder e saúde mental", "body": "Também é necessário observar como elas repercutem sobre o liderado e sobre a saúde mental no trabalho.\n\nCoerção\n\nMedo → ansiedade, hipervigilância e clima defensivo.\n\nRecompensa\n\nRecompensa externa → motivação extrínseca e possibilidade de instrumentalização das relações.\n\nLegítimo\n\nAutoridade da posição → possibilidade de obediência passiva sem engajamento voluntário.\n\nReferência\n\nAdmiração e identificação → engajamento, coesão e menor estresse.\n\nEspecialista\n\nCompetência reconhecida → confiança e segurança psicológica.\n\nInformação\n\nControle de informações → pode produzir insegurança quando utilizado para manipulação.\n\nConexão\n\nRedes e alianças → podem trazer vantagens relacionais, mas apresentam risco de favoritismo e formação de grupos fechados.", "key": "Também é necessário observar como elas repercutem sobre o liderado e sobre a saúde mental no trabalho."}, {"title": "As bases pessoais e os resultados mais duradouros", "body": "Poder de Referência + Poder de Especialista\n\nEssas duas bases pertencem ao poder pessoal.\n\nNa discussão apresentada, elas aparecem associadas a resultados mais prolongados porque a influência não depende exclusivamente de posição, punição ou recompensa.\n\n- maior engajamento;\n\n- satisfação no trabalho;\n\n- comprometimento;\n\n- confiança;\n\n- resultados mais duradouros.\n\nIsso não significa que as demais bases deixem de existir.\n\nA análise depende do contexto e da forma como o poder é exercido.", "key": "Isso não significa que as demais bases deixem de existir."}, {"title": "Quadro geral para memorização", "body": "PODER POSICIONAL\n\nLegítimo → posição/hierarquia\n\nCoerção → medo/punição\n\nRecompensa → recompensa\n\nPODER PESSOAL\n\nReferência → admiração/identificação\n\nEspecialista → conhecimento/competência\n\nPODER RELACIONAL\n\nInformação → informação privilegiada\n\nConexão → relações/alianças estratégicas", "key": "Referência → admiração/identificação"}, {"title": "O psicólogo organizacional diante das relações de poder", "body": "O psicólogo organizacional também entra em contextos nos quais existem relações de poder.\n\nAo ser chamado para atuar em uma organização, geralmente existe uma demanda ou um problema.\n\nSua formação, conhecimento técnico ou até a maneira como é percebido pelas pessoas pode conferir a ele determinadas formas de influência.\n\nPor isso, não basta identificar quem possui poder.\n\nÉ necessário compreender:\n\n- qual é a fonte desse poder;\n\n- como ele é exercido;\n\n- como os liderados respondem;\n\n- quais comportamentos são produzidos;\n\n- quais impactos aparecem sobre as relações e a saúde mental;\n\n- se existe apenas obediência ou efetivo engajamento.", "key": "Sua formação, conhecimento técnico ou até a maneira como é percebido pelas pessoas pode conferir a ele determinadas formas de influência."}], "case": "Renato foi promovido porque apresentava excelente desempenho técnico. No novo cargo, começou a utilizar sua posição para exigir obediência, ameaçando funcionários com consequências quando as metas não eram cumpridas e oferecendo benefícios àqueles que seguiam suas determinações. A equipe passou a cumprir as ordens, mas surgiram ansiedade, clima defensivo e pouco engajamento. Uma funcionária sem cargo gerencial, por outro lado, tornou-se muito influente porque dominava tecnicamente o trabalho, era procurada pelos colegas para solucionar problemas e conquistou confiança do grupo. O caso demonstra que possuir uma posição formal não garante, por si só, uma liderança baseada em objetivos compartilhados e engajamento voluntário, além de evidenciar diferentes bases de poder dentro da mesma organização."}, "9": {"title": "Poder, Liderança e Integração com as Teorias da Motivação", "blocks": [{"title": "Poder e liderança: retomando a diferença", "body": "poder e liderança estão relacionados, mas não são a mesma coisa.\n\nPoder\n\nÉ a capacidade ou o potencial de afetar o comportamento de outra pessoa.\n\nDependendo de sua origem, pode acompanhar uma posição formal ou ser adquirido nas relações e nas características pessoais.\n\nLiderança\n\nTambém produz influência e mudança de comportamento, mas está ligada ao reconhecimento do líder, aos objetivos compartilhados e ao engajamento dos liderados.\n\nAssim, uma pessoa pode possuir poder sem necessariamente exercer liderança.\n\nNem todo indivíduo que possui poder é líder, mas o líder exerce determinado poder sobre seus liderados.", "key": "Nem todo indivíduo que possui poder é líder, mas o líder exerce determinado poder sobre seus liderados."}, {"title": "Poder atribuído e poder adquirido", "body": "As três tipologias de poder estudadas anteriormente ajudam a compreender de onde vem a influência.\n\nPoder Posicional\n\nEstá ligado à posição ocupada na estrutura.\n\nÉ um poder atribuído à pessoa em razão da função, hierarquia ou autoridade formal.\n\nO indivíduo não precisa conquistar inicialmente esse poder nas relações: determinadas prerrogativas acompanham o cargo.\n\nPoder Pessoal\n\nEstá relacionado às características e competências do próprio indivíduo.\n\nDiferentemente do posicional, é predominantemente adquirido.\n\nA pessoa conquista influência por aspectos como:\n\nconhecimento;\n\ncompetência;\n\nrespeito;\n\nadmiração;\n\nidentificação.\n\nPoder Relacional\n\nDepende das relações e conexões construídas pelo indivíduo.\n\nSua influência está associada à forma como a pessoa desenvolve e utiliza sua rede de relacionamentos.", "key": "Diferentemente do posicional, é predominantemente adquirido."}, {"title": "Poder pessoal e liderança", "body": "A proximidade entre liderança e poder pessoal pode ser compreendida pela forma como a influência acontece.\n\nNo poder de referência, por exemplo, a pessoa reconhece o outro como alguém que admira ou com quem se identifica.\n\nEssa referência pode modificar seu comportamento porque ela deseja acompanhar aquele líder.\n\nNo poder de especialista, conhecimento e competência também podem produzir reconhecimento e influência.\n\nNesse caso, a influência não depende exclusivamente de uma ordem formal.\n\nPoder pessoal → reconhecimento → influência → maior aproximação com a liderança.", "key": "Poder pessoal → reconhecimento → influência → maior aproximação com a liderança."}, {"title": "Cargo de chefia não garante liderança", "body": "Uma pessoa pode receber formalmente uma função de coordenação e, com ela, determinado poder posicional.\n\nIsso não significa que automaticamente se tornou uma boa líder.\n\nO exemplo retomado em aula é o profissional tecnicamente excelente que trabalha durante muitos anos na empresa e recebe uma promoção como forma de reconhecimento.\n\nA organização pensa:\n\n“Ele é um excelente técnico, portanto será um excelente coordenador.”\n\nEntretanto, a pessoa assume uma equipe:\n\nsem preparação;\n\nsem treinamento;\n\nsem acompanhamento;\n\nsem mentoria;\n\nsem desenvolvimento para lidar com pessoas.\n\nDepois, tenta fazer com que todos trabalhem exatamente como ela trabalhava.\n\nO resultado pode ser a desorganização da equipe e o fracasso na nova função.\n\nSer excelente executor não significa automaticamente saber liderar pessoas.", "key": "Isso não significa que automaticamente se tornou uma boa líder."}, {"title": "Liderar exige compreender diferenças entre as pessoas", "body": "Uma das dificuldades do profissional promovido sem preparação é esperar que seus liderados ajam exatamente como ele agia.\n\nEntretanto, as pessoas apresentam características, competências e formas de responder diferentes.\n\nPor isso, a liderança não pode ser reduzida à reprodução do comportamento do próprio líder.\n\nEssa discussão reforça que liderança envolve compreender quem está sendo liderado, e não somente aquilo que o líder sabe executar.\n\nIntegração com a Motivação", "key": "Uma das dificuldades do profissional promovido sem preparação é esperar que seus liderados ajam exatamente como ele agia."}, {"title": "Motivação como força interna", "body": "A discussão sobre liderança é conectada ao conteúdo anterior de motivação.\n\nNa perspectiva trabalhada em aula:\n\nMotivação → força interna que leva a pessoa a se mover em determinada direção.\n\nOs estímulos externos podem participar desse processo, mas diferentes teorias procuram explicar aspectos distintos do comportamento motivado.\n\nCada teórico observou determinados elementos do comportamento humano e da motivação.", "key": "A discussão sobre liderança é conectada ao conteúdo anterior de motivação."}, {"title": "As teorias observam diferentes dimensões da motivação", "body": "O ponto central é compreender que um estímulo externo pode funcionar quando está adequadamente relacionado àquilo que mobiliza o indivíduo.\n\nAssim:\n\nestímulo externo isolado não explica toda a motivação.\n\nQuando se compreende aquilo que mobiliza internamente uma pessoa, determinados estímulos podem apresentar maior aderência.", "key": "O ponto central é compreender que um estímulo externo pode funcionar quando está adequadamente relacionado àquilo que mobiliza o indivíduo."}, {"title": "Maslow e as necessidades humanas", "body": "A teoria de Maslow é retomada a partir da hierarquia das necessidades.\n\nNo topo, a autorrealização representa um nível associado ao desenvolvimento das próprias potencialidades.\n\nA discussão também destaca uma questão prática: não faz sentido falar apenas de autonomia, propósito ou desenvolvimento quando necessidades fundamentais do trabalhador permanecem comprometidas.", "key": "A teoria de Maslow é retomada a partir da hierarquia das necessidades."}, {"title": "Vroom e a expectativa", "body": "A teoria de Vroom é retomada a partir da avaliação que a pessoa realiza sobre aquilo que poderá obter por meio de seu esforço.\n\nUm ponto enfatizado na discussão é a ideia de valência:\n\n“Isso vale a pena para mim?”\n\nAssim, o comportamento envolve uma avaliação da relação entre esforço, resultado esperado e valor atribuído ao resultado.\n\nEssa lógica aproxima a teoria de elementos externos, pois aquilo que poderá ser obtido também participa da decisão de agir.", "key": "A teoria de Vroom é retomada a partir da avaliação que a pessoa realiza sobre aquilo que poderá obter por meio de seu esforço."}, {"title": "Autodeterminação: competência e autonomia", "body": "Um exemplo utilizado é o trabalhador que possui competência para resolver determinado problema e recebe autonomia para fazê-lo.\n\nO líder apresenta o problema e permite que a pessoa mobilize sua capacidade para encontrar a solução.\n\nNesse processo aparecem especialmente:\n\nCompetência\n\nA pessoa percebe que possui capacidade para realizar a atividade ou resolver o problema.\n\nAutonomia\n\nA pessoa recebe espaço para utilizar sua competência e tomar decisões relacionadas à realização da atividade.\n\nA autonomia, portanto, não significa simplesmente abandonar o trabalhador.\n\nEla aparece relacionada à possibilidade de utilizar efetivamente suas competências.", "key": "Um exemplo utilizado é o trabalhador que possui competência para resolver determinado problema e recebe autonomia para fazê-lo."}, {"title": "Daniel Pink: autonomia, domínio e propósito", "body": "Daniel Pink aparece como uma ampliação da discussão sobre motivação.\n\nAutonomia\n\nPossibilidade de participar e agir com maior autodeterminação.\n\nDomínio\n\nDesenvolvimento contínuo da competência, avançando em direção a níveis cada vez maiores de excelência.\n\nPropósito\n\nPercepção de sentido naquilo que está sendo realizado.\n\nA discussão aproxima o desenvolvimento contínuo da competência de um processo de busca de excelência.\n\nAUTONOMIA + DOMÍNIO + PROPÓSITO", "key": "Daniel Pink aparece como uma ampliação da discussão sobre motivação."}, {"title": "Locke e Latham: metas", "body": "Locke e Latham são retomados pela importância das metas.\n\nUma meta precisa oferecer direcionamento para a ação.\n\nclaras;\n\nespecíficas;\n\nadequadamente estabelecidas.\n\nQuando a pessoa não compreende claramente aquilo que deve alcançar, o direcionamento do comportamento fica prejudicado.\n\nAssim, as metas participam da mobilização do esforço porque tornam mais definido para onde a ação deve ser direcionada.", "key": "Locke e Latham são retomados pela importância das metas."}, {"title": "As teorias podem ser relacionadas", "body": "Por exemplo:\n\nMaslow → necessidades e autorrealização.\n\nAutodeterminação → autonomia e competência.\n\nDaniel Pink → autonomia, domínio e propósito.\n\nLocke e Latham → metas e direcionamento.\n\nVroom → expectativa e valor atribuído ao resultado.\n\nA ideia não é transformar todas essas teorias em uma única explicação, mas compreender que elas observam dimensões diferentes do comportamento motivado.\n\nPoder, Liderança e Motivação", "key": "Maslow → necessidades e autorrealização."}, {"title": "A forma de exercer poder interfere na motivação", "body": "A discussão retorna às tipologias de poder.\n\nUm líder pode utilizar diferentes fontes de influência, mas essas formas de poder não produzem necessariamente a mesma resposta.\n\nUma influência baseada predominantemente em imposição e posição formal é diferente daquela construída a partir de:\n\nrespeito;\n\nadmiração;\n\ncompetência;\n\nreconhecimento;\n\nautonomia;\n\nidentificação.\n\nÉ nesse ponto que poder, liderança e motivação começam a se conectar.\n\nO modo como o líder exerce influência pode favorecer ou dificultar o envolvimento das pessoas com o trabalho.", "key": "Uma influência baseada predominantemente em imposição e posição formal é diferente daquela construída a partir de:"}, {"title": "Poder pessoal e motivação", "body": "O poder pessoal apresenta uma aproximação importante com as formas de liderança discutidas em aula porque é conquistado, e não simplesmente entregue por uma posição hierárquica.\n\nQuando existe reconhecimento da competência ou identificação com o líder, a influência pode produzir maior adesão.\n\nPor isso, ao analisar um líder, não basta perguntar:\n\n“Qual cargo ele ocupa?”\n\nTambém é necessário perguntar:\n\n“Por que as pessoas aceitam sua influência?”\n\nA resposta ajuda a identificar qual base de poder está predominando.\n\nPsicologia Organizacional e Cultura", "key": "O poder pessoal apresenta uma aproximação importante com as formas de liderança discutidas em aula porque é conquistado, e não simplesmente entregue por uma posição hierárquica."}, {"title": "Saúde mental não pode existir apenas no documento", "body": "documentos;\n\nnormas;\n\nprocedimentos;\n\npalestras;\n\nmas não transforma efetivamente suas práticas.\n\nA empresa pode afirmar que valoriza a saúde mental e, ao mesmo tempo, manter práticas que não correspondem ao discurso.\n\nO mesmo raciocínio é utilizado para comparar documentos de segurança do trabalho que existem formalmente, mas não são incorporados ao cotidiano.\n\nDocumentar não significa necessariamente implementar.", "key": "O mesmo raciocínio é utilizado para comparar documentos de segurança do trabalho que existem formalmente, mas não são incorporados ao cotidiano."}, {"title": "A cultura organizacional precisa ser construída", "body": "Mudanças relacionadas à saúde mental e às relações de trabalho não acontecem apenas porque uma palestra foi realizada.\n\nA organização precisa reconhecer que a transformação exige continuidade e construção ao longo do tempo.\n\nPor isso, a Psicologia Organizacional pode participar de processos de:\n\nconstrução de cultura;\n\ndesenvolvimento de metodologias;\n\neducação organizacional;\n\ndesenvolvimento de pessoas;\n\ntransformação das relações de trabalho.\n\nNão se trata de uma intervenção isolada capaz de modificar imediatamente toda a organização.", "key": "Mudanças relacionadas à saúde mental e às relações de trabalho não acontecem apenas porque uma palestra foi realizada."}, {"title": "Psicologia Organizacional e atuação integrada", "body": "A discussão também mostra que determinadas demandas organizacionais não pertencem exclusivamente ao psicólogo.\n\nDependendo do problema, a atuação pode ocorrer em conjunto com outros profissionais e áreas.\n\nO psicólogo organizacional contribui com seu olhar sobre:\n\ncomportamento;\n\nrelações;\n\nliderança;\n\nmotivação;\n\nsaúde mental;\n\ncultura organizacional.\n\nA intervenção, porém, precisa estar vinculada às condições reais da organização e ao processo que se pretende transformar.", "key": "A discussão também mostra que determinadas demandas organizacionais não pertencem exclusivamente ao psicólogo."}, {"title": "Cultura de performance e saúde mental", "body": "Quando produzir cada vez mais se transforma no único parâmetro de sucesso, podem surgir tensões entre:\n\nresultado organizacional × saúde das pessoas.\n\nA discussão não apresenta desempenho e produtividade como necessariamente negativos.\n\nO problema aparece quando a busca por resultado ignora as condições humanas necessárias para sustentá-lo.\n\nPor isso, a análise psicológica precisa observar não apenas quanto está sendo produzido, mas também em quais condições esse resultado está sendo alcançado.", "key": "Quando produzir cada vez mais se transforma no único parâmetro de sucesso, podem surgir tensões entre:"}], "case": "Carlos trabalha há 15 anos em uma empresa e sempre foi reconhecido como excelente técnico. Como forma de premiá-lo, a direção o promoveu a coordenador, atribuindo-lhe autoridade formal sobre uma equipe. Sem treinamento ou acompanhamento, Carlos passou a exigir que todos executassem o trabalho exatamente como ele fazia. A equipe começou a apresentar conflitos e queda no engajamento. Outra funcionária, sem cargo de chefia, passou a ser procurada pelos colegas por sua competência, respeito e capacidade de ajudá-los a resolver problemas. O caso demonstra que o poder posicional pode ser atribuído pelo cargo, enquanto o poder pessoal é construído a partir de características reconhecidas pelos outros, aproximando-se mais diretamente da liderança."}, "10": {"title": "Ecossistema da Liderança: Motivação, Poder e Ações do Líder", "blocks": [{"title": "O Ecossistema da Liderança", "body": "motivação;\n\npoder e bases de poder;\n\ntipos de liderança;\n\ncaracterísticas do líder;\n\ncomportamento do líder;\n\natributos do líder.\n\nA ideia de ecossistema indica justamente que esses elementos não funcionam isoladamente.\n\nPara compreender o comportamento de um líder, é necessário observar o conjunto de fatores que interfere em suas atitudes, reações e formas de conduzir a equipe.\n\nPara a Psicologia Organizacional, isso significa olhar para uma situação concreta de trabalho e buscar compreender de onde surgem as ações do líder, o que o move e quais fontes de influência ele utiliza.", "key": "Para compreender o comportamento de um líder, é necessário observar o conjunto de fatores que interfere em suas atitudes, reações e formas de conduzir a equipe."}, {"title": "A motivação como ponto de partida", "body": "Todo o Ecossistema da Liderança começa pelo estudo da motivação.\n\nNa definição trabalhada em aula:\n\nMotivação é uma ação interna que move a pessoa na direção de alguma coisa.\n\nA motivação funciona como um motor interno que direciona o comportamento.\n\nPor isso, não é adequado afirmar simplesmente que uma pessoa “motiva” outra.\n\nO que outra pessoa pode fazer é criar estímulos que encontrem algo que já existe internamente no indivíduo.\n\nEssa distinção é importante para compreender posteriormente a ação do líder sobre seus liderados.", "key": "Motivação é uma ação interna que move a pessoa na direção de alguma coisa."}, {"title": "Motivação intrínseca e extrínseca", "body": "Motivação intrínseca\n\nÉ apresentada como o movimento que nasce internamente e permanece mesmo diante de dificuldades, conflitos ou situações desafiadoras.\n\nA pessoa pode estar cansada, contrariada ou enfrentando obstáculos e ainda assim continuar realizando determinada ação porque existe uma força interna que a direciona.\n\nMotivação extrínseca\n\nEstá associada aos estímulos externos e ao ambiente.\n\nEsses estímulos são apresentados como mais temporários, porque dependem da permanência das condições externas.\n\nQuando o ambiente ou o estímulo desaparece, sua influência também pode diminuir.\n\nINTRÍNSECA → movimento interno\n\nEXTRÍNSECA → estímulos externos e ambientais", "key": "EXTRÍNSECA → estímulos externos e ambientais"}, {"title": "O estímulo externo encontra uma disposição interna", "body": "O fato de a motivação ser compreendida a partir de um movimento interno não significa que os estímulos externos sejam inúteis.\n\nUm estímulo pode funcionar porque encontra algo que já existe internamente na pessoa.\n\nO líder pode identificar aquilo que possui importância para determinado indivíduo e utilizar um estímulo relacionado a isso.\n\nO estímulo é externo, mas sua eficácia depende daquilo que encontra no indivíduo.\n\nPor isso, duas pessoas podem reagir de formas diferentes diante do mesmo estímulo.\n\nESTÍMULO EXTERNO + DISPOSIÇÃO INTERNA → possibilidade de resposta", "key": "O fato de a motivação ser compreendida a partir de um movimento interno não significa que os estímulos externos sejam inúteis."}, {"title": "Bases de poder: as fontes da ação do líder", "body": "As bases de poder ajudam a identificar qual é a fonte utilizada pelo líder para exercer influência.\n\nNa organização apresentada em aula, essas bases são agrupadas em três tipologias:\n\nPoder Posicional\nRelaciona-se principalmente à posição formal ocupada pelo indivíduo.\n\nPoder Pessoal\nRelaciona-se às características reconhecidas na própria pessoa.\n\nPoder Relacional\nRelaciona-se às informações e conexões disponíveis ao indivíduo.\n\nAssim, é importante não confundir tipologia com base específica de poder.", "key": "As bases de poder ajudam a identificar qual é a fonte utilizada pelo líder para exercer influência."}, {"title": "Poder Posicional", "body": "O Poder Posicional está associado à posição ocupada pelo indivíduo e aparece relacionado a três bases.\n\nCoerção\n\nA influência acontece pela possibilidade de punição ou de uma consequência negativa.\n\nA lógica é:\n\n“Faça, senão haverá uma consequência.”\n\nO medo funciona como elemento importante nessa relação.\n\nRecompensa\n\nA influência ocorre pela oferta de algo desejável em troca de determinado comportamento ou resultado.\n\nPor exemplo: o trabalhador que alcançar determinada meta receberá uma bonificação.\n\nLegitimidade\n\nA influência decorre da posição formal ocupada pelo indivíduo.\n\nA pessoa possui autoridade porque ocupa determinado cargo: chefe, coordenador, gerente ou responsável pelo setor.\n\nPortanto:\n\nPODER POSICIONAL = COERÇÃO + RECOMPENSA + LEGITIMIDADE", "key": "O Poder Posicional está associado à posição ocupada pelo indivíduo e aparece relacionado a três bases."}, {"title": "Poder Posicional e elementos extrínsecos", "body": "Na coerção, existe uma consequência externa que a pessoa deseja evitar.\n\nNa recompensa, existe algo externo que ela deseja obter.\n\nNa legitimidade, existe uma estrutura organizacional que atribui autoridade ao ocupante do cargo.\n\nUm mesmo líder pode utilizar mais de uma dessas bases.\n\nEle pode utilizar sua autoridade formal, estabelecer uma consequência e, ao mesmo tempo, oferecer uma recompensa.\n\nPor isso, o objetivo é identificar qual base está presente em cada ação, e não imaginar que um líder só possa utilizar uma delas.", "key": "Por isso, o objetivo é identificar qual base está presente em cada ação, e não imaginar que um líder só possa utilizar uma delas."}, {"title": "Poder Pessoal", "body": "No Poder Pessoal, a influência está relacionada às características reconhecidas no próprio líder.\n\nDuas bases são destacadas:\n\nReferência\n\nO líder torna-se uma referência para outras pessoas.\n\nOs liderados observam seu comportamento, reconhecem-no, identificam-se com ele ou desejam segui-lo.\n\nEspecialista\n\nA influência decorre do conhecimento ou da competência reconhecida naquela pessoa.\n\nOs outros consideram sua orientação porque reconhecem que ela domina determinado assunto ou atividade.\n\nAssim:\n\nPODER PESSOAL = REFERÊNCIA + ESPECIALISTA\n\nO Poder Pessoal aproxima-se de uma influência que não depende exclusivamente da autoridade formal.\n\nO indivíduo pode ser seguido por aquilo que representa ou pelo conhecimento que possui.", "key": "No Poder Pessoal, a influência está relacionada às características reconhecidas no próprio líder."}, {"title": "Poder Relacional", "body": "O terceiro agrupamento é o Poder Relacional.\n\nEle aparece associado a duas bases:\n\nInformação\n\nA pessoa possui ou controla informações relevantes que podem influenciar determinada situação.\n\nConexão\n\nA pessoa possui contatos, relações ou acesso a outras pessoas que podem ser importantes para determinado objetivo.\n\nPortanto:\n\nPODER RELACIONAL = INFORMAÇÃO + CONEXÃO", "key": "O terceiro agrupamento é o Poder Relacional."}, {"title": "A intenção no uso do Poder Relacional", "body": "Uma pessoa pode possuir informações privilegiadas e utilizá-las para compartilhar conhecimento, construir uma ferramenta, solucionar um problema ou ajudar outras pessoas.\n\nTambém pode utilizar informações e conexões com outra intenção.\n\nAssim, informação e conexão não são classificadas automaticamente como intrínsecas ou extrínsecas.\n\nÉ necessário observar como e com qual intenção essas bases estão sendo utilizadas.\n\nO exemplo trabalhado em aula é o de alguém que possui conhecimento sobre inteligência artificial e utiliza esse conhecimento para criar uma ferramenta capaz de organizar conteúdos e compartilhá-los com os colegas.\n\nNesse caso, é necessário compreender o movimento interno que leva a pessoa a utilizar aquela informação dessa maneira.", "key": "O exemplo trabalhado em aula é o de alguém que possui conhecimento sobre inteligência artificial e utiliza esse conhecimento para criar uma ferramenta capaz de organizar conteúdos e compartilhá-los com os colegas."}, {"title": "Liderança autoritária e poder posicional", "body": "Nesse movimento aparecem elementos como:\n\ncomando;\n\nautoridade;\n\ncobrança;\n\ncontrole;\n\ncoerção;\n\nrecompensa;\n\nuso da posição formal.\n\nO objetivo da análise não é imediatamente determinar se essa pessoa é “boa” ou “ruim”.\n\nA pergunta central é:\n\nComo esse líder está exercendo influência?\n\nEssa mudança de olhar é importante para a formação do psicólogo organizacional.", "key": "O objetivo da análise não é imediatamente determinar se essa pessoa é “boa” ou “ruim”."}, {"title": "Liderança democrática e influência pessoal", "body": "Na discussão realizada em aula, a liderança democrática é aproximada de elementos mais pessoais e internos.\n\nEnquanto uma atuação fortemente posicional pode depender de autoridade, recompensa ou coerção, uma atuação pessoal pode envolver referência, conhecimento, reconhecimento e influência sobre os outros.\n\nO líder é seguido não apenas porque possui um cargo, mas porque as pessoas reconhecem algo nele.", "key": "Na discussão realizada em aula, a liderança democrática é aproximada de elementos mais pessoais e internos."}, {"title": "Compreender antes de julgar", "body": "Ao entrar em uma organização, ele pode encontrar um chefe que utiliza sua posição formal, outro que trabalha com recompensas, outro que exerce influência pelo medo e outro que é seguido porque se tornou referência técnica para a equipe.\n\nO primeiro movimento não deve ser simplesmente:\n\n“Esse líder é bom” ou “esse líder é ruim”.\n\nÉ necessário perguntar:\n\nQual base de poder está sendo utilizada?\n\nQual estímulo está presente?\n\nDe onde vem a influência desse líder?\n\nComo os trabalhadores estão respondendo a essa ação?\n\nEssa leitura transforma os conceitos teóricos em instrumentos para compreender situações reais das organizações.", "key": "Ao entrar em uma organização, ele pode encontrar um chefe que utiliza sua posição formal, outro que trabalha com recompensas, outro que exerce influência pelo medo e outro que é seguido porque se tornou referência técnica para a equipe."}, {"title": "Características predominantes e possibilidade de desenvolvimento", "body": "Isso não significa que ele seja incapaz de mudar.\n\nconhecimentos;\n\nhabilidades;\n\natitudes;\n\nvalores;\n\nestratégias.\n\nPortanto, a existência de um padrão predominante não elimina a possibilidade de aprendizagem e desenvolvimento da liderança.", "key": "Isso não significa que ele seja incapaz de mudar."}, {"title": "A situação também precisa ser considerada", "body": "O comportamento necessário em uma situação pode não ser o mesmo exigido em outra.\n\nbanco;\n\nstartup;\n\nindústria;\n\nconstrução civil.\n\nIsso introduz uma ideia importante: a ação da liderança também depende da situação.\n\nLÍDER + LIDERADOS + SITUAÇÃO", "key": "O comportamento necessário em uma situação pode não ser o mesmo exigido em outra."}, {"title": "Conexão com as teorias motivacionais", "body": "Teoria da Autodeterminação\n\nA autonomia é retomada como elemento importante.\n\nQuando a pessoa possui competência e recebe autonomia para utilizá-la, existe espaço para uma atuação menos dependente de coerção externa.\n\nDaniel Pink\n\nSão retomados os elementos:\n\nAutonomia + domínio + propósito\n\nEsses elementos são relacionados a formas de mobilização que ultrapassam uma relação baseada somente em punições e recompensas.\n\nO ponto central é perceber que as teorias motivacionais ajudam a compreender por que determinadas formas de liderança produzem respostas diferentes nas pessoas.\n\nMOTIVAÇÃO\n→ ação interna que direciona o comportamento\n↓\nINTRÍNSECA → movimento interno\nEXTRÍNSECA → estímulos ambientais\n↓\nBASES DE PODER\n↓\nPOSICIONAL → coerção + recompensa + legitimidade\nPESSOAL → referência + especialista\nRELACIONAL → informação + conexão\n↓\nAÇÃO DO LÍDER\n↓\nRESPOSTA DOS LIDERADOS\n↓\nRESULTADOS DA EQUIPE", "key": "A autonomia é retomada como elemento importante."}], "case": "Em uma empresa, um coordenador utiliza seu cargo para determinar como as atividades devem ser executadas, ameaça aplicar consequências quando as regras não são cumpridas e oferece bônus para quem supera as metas. Em outra equipe, um profissional é espontaneamente procurado pelos colegas porque possui grande conhecimento técnico e tornou-se uma referência para o grupo. Já uma terceira pessoa consegue mobilizar soluções porque possui informações importantes e boas conexões dentro da organização. O primeiro caso apresenta Poder Posicional, por meio de legitimidade, coerção e recompensa; o segundo apresenta Poder Pessoal, especialmente especialista e referência; e o terceiro apresenta Poder Relacional, por meio de informação e conexão."}, "11": {"title": "Ecossistema da Liderança: Bases de Poder, Estilos de Liderança e Formação de Times", "blocks": [{"title": "Retomada do Ecossistema da Liderança", "body": "A proposta é não memorizar conceitos isoladamente, mas compreender como motivação, poder e liderança se relacionam na prática.\n\nO esquema retomado parte de três tipologias de poder:\n\nPoder Posicional\nCoerção + Recompensa + Legitimidade.\n\nPoder Pessoal\nReferência + Especialista.\n\nPoder Relacional\nInformação + Conexão.", "key": "A proposta é não memorizar conceitos isoladamente, mas compreender como motivação, poder e liderança se relacionam na prática."}, {"title": "Poder Posicional e motivação extrínseca", "body": "O Poder Posicional está ligado à posição formal ocupada pelo líder e utiliza três bases:\n\nCoerção\n\nO líder influencia pela possibilidade de punição ou consequência negativa.\n\nRecompensa\n\nO líder utiliza algum benefício ou recompensa para estimular determinado comportamento.\n\nLegitimidade\n\nA autoridade decorre do cargo ou da posição formal ocupada.\n\nPODER POSICIONAL → COERÇÃO + RECOMPENSA + LEGITIMIDADE\n\nEsse conjunto é associado à motivação extrínseca, porque depende principalmente de elementos presentes no ambiente: autoridade, punições, recompensas e condições externas.", "key": "PODER POSICIONAL → COERÇÃO + RECOMPENSA + LEGITIMIDADE"}, {"title": "Poder Posicional e liderança autocrática", "body": "Nesse estilo, o poder de decisão permanece concentrado no líder.\n\nEle utiliza a autoridade que possui para determinar aquilo que deve ser feito e buscar os resultados esperados.\n\nIsso não significa que ele utilize somente coerção. O líder pode transitar entre as três bases posicionais:\n\ndeterminar uma ação pela autoridade do cargo;\n\nestabelecer consequências;\n\noferecer recompensas.\n\nA característica central continua sendo a predominância da posição e da autoridade formal como fonte de influência.", "key": "Isso não significa que ele utilize somente coerção. O líder pode transitar entre as três bases posicionais:"}, {"title": "Poder Pessoal e motivação intrínseca", "body": "O Poder Pessoal é formado pelas bases:\n\nReferência\n\nA pessoa é reconhecida como alguém que inspira ou representa uma referência para os outros.\n\nEspecialista\n\nA influência decorre do conhecimento, da competência ou da especialidade reconhecida naquela pessoa.\n\nAssim:\n\nPODER PESSOAL → REFERÊNCIA + ESPECIALISTA", "key": "O Poder Pessoal é formado pelas bases:"}, {"title": "Autodeterminação e Motivação 3.0", "body": "Teoria da Autodeterminação\n\nSão retomados os elementos:\n\nautonomia;\n\ncompetência;\n\npertencimento.\n\nA autonomia ganha destaque porque o líder reconhece a competência da pessoa e permite que ela tenha espaço para agir.\n\nDaniel Pink — Motivação 3.0\n\nSão retomados:\n\nautonomia;\n\ndomínio;\n\npropósito.\n\nEsses elementos ajudam a compreender uma forma de atuação menos dependente de coerção e controle externo.", "key": "A autonomia ganha destaque porque o líder reconhece a competência da pessoa e permite que ela tenha espaço para agir."}, {"title": "Poder Relacional: informação e conexão", "body": "O Poder Relacional aparece novamente constituído por:\n\nInformação\n\nA influência decorre da posse ou do acesso a informações relevantes.\n\nConexão\n\nA influência decorre das relações, contatos e redes às quais a pessoa possui acesso.\n\nPortanto:\n\nPODER RELACIONAL → INFORMAÇÃO + CONEXÃO", "key": "PODER RELACIONAL → INFORMAÇÃO + CONEXÃO"}, {"title": "A intenção no uso da informação e da conexão", "body": "Informação e conexão podem ser utilizadas de maneiras diferentes.\n\nUm líder pode compartilhar informações e mobilizar sua rede de contatos para favorecer o trabalho coletivo e alcançar resultados.\n\nTambém pode utilizar informações de forma estratégica para controlar outras pessoas, ocultar partes importantes ou criar dependência.\n\nPor isso, no Poder Relacional, é necessário perguntar:\n\nQual é a intenção do líder ao utilizar aquilo que sabe e as conexões que possui?\n\nQuando utilizadas de maneira perversa ou manipulativa, revelam outro movimento na relação de poder.", "key": "Por isso, no Poder Relacional, é necessário perguntar:"}, {"title": "Liderança democrática", "body": "A liderança democrática aparece associada ao compartilhamento.\n\nEnquanto o autocrático concentra a decisão, o democrático abre espaço para participação dos liderados e compartilha decisões.\n\nNesse movimento, ganham importância:\n\nparticipação;\n\ndiálogo;\n\nautonomia;\n\nreconhecimento da competência;\n\ncompartilhamento;\n\nconfiança.\n\nEssa atuação se aproxima especialmente das bases pessoais de poder, porque a influência não depende exclusivamente da autoridade formal.", "key": "A liderança democrática aparece associada ao compartilhamento."}, {"title": "Liderança liberal: não confundir com autonomia estratégica", "body": "Líder liberal\n\nNa explicação do professor, é aquele que deixa as coisas acontecerem sem acompanhamento efetivo.\n\nEle se afasta e não retorna adequadamente para acompanhar os resultados.\n\nLíder que concede autonomia\n\nPode organizar o trabalho, definir:\n\ntarefas;\n\ndiretrizes;\n\nobjetivos;\n\nmetas;\n\nindicadores;\n\ne depois se afastar para permitir que uma equipe competente execute suas atividades.\n\nPosteriormente, ele retorna para verificar os resultados e oferecer feedback.\n\nPortanto:\n\nAFASTAMENTO + PLANEJAMENTO + AUTONOMIA + ACOMPANHAMENTO ≠ LIDERANÇA LIBERAL\n\nDar autonomia não significa abandonar a equipe.", "key": "Na explicação do professor, é aquele que deixa as coisas acontecerem sem acompanhamento efetivo."}, {"title": "Segurança do líder e microgerenciamento", "body": "Um líder que conhece a competência de sua equipe pode se afastar sem precisar controlar continuamente cada ação.\n\nEle não necessita realizar microgerenciamento.\n\no líder possui segurança suficiente para permitir que as pessoas utilizem suas próprias competências.\n\nEm contraste, a dependência constante da autoridade pode aparecer associada à insegurança e à necessidade de controle.", "key": "Um líder que conhece a competência de sua equipe pode se afastar sem precisar controlar continuamente cada ação."}, {"title": "Líder Servidor", "body": "O Líder Servidor é apresentado como alguém que utiliza fortemente as bases do Poder Pessoal, especialmente:\n\nReferência + Especialista\n\nEle conduz a equipe de maneira:\n\ndemocrática;\n\naberta;\n\nparticipativa;\n\ncompartilhada.\n\nO líder servidor escuta a equipe, participa e procura conhecer as pessoas que lidera.", "key": "O Líder Servidor é apresentado como alguém que utiliza fortemente as bases do Poder Pessoal, especialmente:"}, {"title": "In
