<script>
const D={"subjects":[{"id":"juliana","name":"Saúde, Trabalho e Riscos Psicossociais","prof":"Juliana"},{"id":"cesar","name":"Motivação, Liderança e Comportamento Organizacional","prof":"César"},{"id":"patricia","name":"Grupos e Processos Organizacionais","prof":"Patrícia"},{"id":"mariana","name":"Saúde Mental, Trabalho e Relações Organizacionais","prof":"Mariana"},{"id":"ext","name":"Projeto de Extensão","prof":"Edna"},{"id":"estagio","name":"Estágio Básico","prof":"","status":"Aguardando início das aulas"}],"journeys":{"juliana":[{"title":"Aula 1 — Psicologia Organizacional, Diversidade e Relações de Trabalho","steps":[{"title":"Bloco 1: O Cenário Contemporâneo do Trabalho e as Dinâmicas Geracionais","sub":"","body":"Para compreender o comportamento humano dentro das organizações atuais, precisamos analisar como o sentido do trabalho se transformou ao longo das últimas décadas. Durante muito tempo, predominou no mercado uma lógica de permanência a qualquer custo. Existia um receio constante em relação a registros desfavoráveis na carteira profissional, o que levava os trabalhadores a tolerarem jornadas abusivas, chefias autoritárias e desvios contínuos de função apenas pela manutenção da estabilidade financeira. O perfil valorizado pelas empresas tradicionais era o colaborador estritamente generalista: aquele profissional que executava qualquer demanda operacional alheia ao seu contrato para demonstrar comprometimento.\n\nO mercado atual, contudo, passa por uma ruptura significativa. A modernização documental, a carteira de trabalho digital e o acesso facilitado a novas oportunidades desmistificaram a ideia da permanência forçada. Os novos colaboradores ingressam no ambiente de trabalho munidos de postura reflexiva e pensamento crítico, competências amplamente incentivadas pelas transformações educacionais contemporâneas. Essa geração rejeita a sobrecarga desordenada e reivindica contratos transparentes, com atribuições e escopos bem delineados. Quando submetida a desvios funcionais ou a relações desumanizadas, sua resposta imediata tem sido o desligamento voluntário, gerando altos índices de rotatividade precoce (turnover).\n\nEssa transformação resulta em evidentes tensões interpessoais. De um lado, encontram-se lideranças formadas sob a égide da submissão hierárquica e do cumprimento irrestrito de ordens sem questionamento. Do outro, jovens que não aceitam abrir mão de sua dignidade ou saúde emocional. Ao mesmo tempo, colaboradores experientes e de faixas etárias mais elevadas enfrentam barreiras severas com o avanço acelerado de sistemas digitais e ferramentas automatizadas. Sem um processo estruturado de acolhimento e treinamento técnico continuado, esses profissionais acabam alvos de estigmas e isolamento, revelando a urgência de uma gestão que saiba integrar diferentes saberes sem desvalorizar a trajetória de nenhuma geração.","check":null},{"title":"Bloco 2: Diversidade versus Inclusão nas Organizações","sub":"","body":"Um dos equívocos mais recorrentes na gestão de pessoas reside na confusão conceitual entre diversidade e inclusão. A diversidade corresponde à dimensão demográfica, representativa e quantitativa da instituição. Ela se refere à presença no quadro funcional de pessoas portadoras de diferentes marcadores sociais e identitários, tais como gênero, raça e etnia, faixa etária, deficiências, orientação sexual, crenças religiosas, cultura e origem social. Trata-se, portanto, do ato de compor a equipe com perfis heterogêneos.\n\nA inclusão, por sua vez, constitui uma dimensão relacional, qualitativa e profundamente cultural. Ela não ocorre de forma espontânea, mas demanda um conjunto articulado e permanente de práticas institucionais desenhadas para garantir quatro pilares fundamentais: o sentimento autêntico de pertencimento, o respeito às singularidades, a participação ativa nas decisões cotidianas e a igualdade real de oportunidades de desenvolvimento e promoção.\n\nPor essa razão, o simples cumprimento de cotas legais — como a contratação obrigatória de pessoas com deficiência prevista na Lei nº 8.213/1991 — não assegura que a organização seja inclusiva. Uma empresa pode apresentar um quadro amplamente diverso em seus registros e continuar operando de forma excludente na prática. Ações isoladas e meramente promocionais, como expor publicamente trabalhadores neurodivergentes em solenidades corporativas sem seu consentimento expresso, exemplificam o falso discurso inclusivo: ferem a dignidade individual, provocam constrangimento e violam a segurança psicológica do colaborador.","check":null},{"title":"Bloco 3: Barreiras Culturais, Vieses e Riscos à Saúde Mental","sub":"","body":"A convivência cotidiana nas empresas é frequentemente atravessada por barreiras atitudinais e vieses inconscientes. Esses vieses consistem em preconceitos implícitos e julgamentos automáticos que levam gestores e equipes a desvalorizarem determinados grupos de forma sutil. Tais atitudes manifestam-se no etarismo contra trabalhadores maduros, na desqualificação de jovens críticos ou no capacitismo direcionado a pessoas com deficiência. Essas distorções operam silenciosamente nos processos de contratação, na distribuição de tarefas e nas oportunidades de ascensão funcional.\n\nParalelamente, a aceleração das exigências produtivas e a mecanização desprovida de suporte humano agravam o adoecimento coletivo. Quando as organizações priorizam metas inatingíveis, desconsiderando as necessidades básicas de descanso, diálogo e adaptação, o ambiente institucional adoece. O trabalhador passa a ser tratado como mera extensão das ferramentas operacionais, em um modelo degradante que anula sua subjetividade.\n\nO resultado dessa dinâmica desestruturada é a proliferação de atestados psiquiátricos, episódios de ansiedade, crises de pânico e quadros severos de esgotamento profissional (burnout). O retorno financeiro, por si só, não neutraliza o sofrimento causado por um clima tóxico. A integridade psíquica depende de condições de trabalho seguras, relações respeitosas e lideranças preparadas para lidar com as vulnerabilidades humanas.","check":null},{"title":"Bloco 4: O Papel Técnico-Estratégico do Psicólogo Organizacional","sub":"","body":"Inserido nesse contexto desafiador, o psicólogo organizacional atua como agente estratégico de transformação das culturas corporativas. Seu campo de intervenção não se resume a atendimentos clínicos pontuais dentro da empresa, mas abrange o diagnóstico, a prevenção e a reestruturação dos processos de trabalho e das relações interpessoais.\n\nO trabalho técnico do profissional estrutura-se a partir de competências essenciais:\n• Mediação Técnica de Conflitos: Atuação focada em acolher e intervir nas disputas cotidianas decorrentes de choques geracionais, vaidades hierárquicas e disputas de poder, desfazendo mal-entendidos e identificando raízes institucionais sem culpabilizar os indivíduos.\n• Promoção do Bem-Estar Psicológico: Monitoramento das rotinas laborais, identificação precoce de estressores psicossociais e implantação de práticas contínuas que assegurem um ambiente saudável e previnam o colapso emocional das equipes.\n• Desenvolvimento de Lideranças Inclusivas: Sensibilização e treinamento de gestores para que abandonem posturas autoritárias, reconheçam seus próprios vieses inconscientes e coordenem equipes plurais com respeito e equidade.\n• Processos Seletivos Justos e Políticas Transparentes: Estruturação de recrutamentos técnicos baseados em competências reais, eliminando critérios discriminatórios, além da construção de planos transparentes de cargos, funções e salários que garantam o crescimento profissional equitativo.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Operação da LogTech Varejista\n\nA LogTech Varejista automatizou seu sistema de vendas e, para atender aos índices de responsabilidade corporativa e à Lei de Cotas, admitiu três novos funcionários em sua unidade comercial: Geraldo (56 anos, com vasta experiência em vendas presenciais, mas sem domínio de ferramentas digitais), Larissa (22 anos, contratada para operar os bancos de dados do sistema de estoque) e Samuel (29 anos, diagnosticado com Transtorno do Espectro Autista, admitido na conferência física de mercadorias).\n\nEm poucas semanas, o ambiente entrou em crise. Geraldo passou a sofrer piadas e isolamento por demorar a registrar os pedidos no aplicativo, sendo chamado pelo gerente de \"ultrapassado\". Larissa, ao recusar ordens frequentes da chefia para descarregar caixas pesadas e limpar as dependências da loja, foi repreendida sob a alegação de \"não ter espírito de equipe\" e pediu demissão imediata pelo desvio de função. Simultaneamente, a diretoria submeteu Samuel a uma homenagem pública surpresa em um auditório lotado, sob ruídos excessivos e holofotes, para exibir seu cumprimento de cotas corporativas; o quadro desencadeou em Samuel uma severa crise de pânico e seu imediato afastamento médico. Diante desses eventos, a direção da LogTech limitou-se a afirmar que \"a empresa cumpriu integralmente sua obrigação ao contratar um quadro diverso e que as falhas ocorreram unicamente por falta de adaptação individual dos colaboradores\".\n\nPergunta Avaliativa\n\nCom base na distinção entre diversidade e inclusão, analise as falhas de gestão ocorridas na LogTech Varejista e explique quais intervenções técnicas imediatas o Psicólogo Organizacional deve adotar para mediar os conflitos geracionais, eliminar os vieses atitudinais e reestruturar o ambiente de trabalho.","criteria":["diversidade e inclusão","conflitos geracionais","vieses atitudinais","reestruturação do ambiente de trabalho"],"expected":"A resposta deve distinguir diversidade de inclusão, identificar o etarismo e a ausência de treinamento no caso de Geraldo, o desvio de função e a gestão inadequada no caso de Larissa e a exposição de Samuel sem considerar suas necessidades e sua segurança psicológica. As intervenções devem contemplar mediação de conflitos, desenvolvimento de lideranças inclusivas, revisão das práticas de gestão, prevenção de riscos psicossociais e construção de condições de trabalho que garantam pertencimento, respeito, participação e igualdade de oportunidades."}},{"title":"Aula 2 — Psicologia Organizacional, Relações de Trabalho e Saúde Ocupacional","steps":[{"title":"Bloco 1: O Cenário Contemporâneo do Trabalho e as Dinâmicas Geracionais","sub":"","body":"Para compreender o comportamento nas empresas de hoje, precisamos primeiro examinar como a relação com o trabalho se transformou ao longo do tempo. Durante décadas, predominou uma lógica de permanência a qualquer custo: os trabalhadores toleravam sobrecargas e ordens arbitrárias por receio de prejudicar o histórico na carteira física de trabalho. Esperava-se um perfil generalista, disposto a acumular tarefas operacionais diversas além do contrato apenas para demonstrar dedicação.\n\nO mercado atual passa por uma ruptura evidente. Com a carteira de trabalho digital e a facilidade de recolocação, a ideia de permanência forçada perdeu sentido. Os novos profissionais ingressam com postura reflexiva e crítica, exigindo limites claros e recusando desvios de função. Quando submetidos a sobrecargas ou tarefas alheias ao seu escopo, optam pelo desligamento, elevando as taxas de rotatividade precoce (turnover).\n\nAo mesmo tempo, colaboradores mais velhos enfrentam desafios severos com a digitalização acelerada dos processos. Sem treinamento formal continuado e paciência institucional, esses profissionais acabam estigmatizados, gerando choques intergeracionais com equipes mais jovens e revelando a necessidade de uma gestão que integre saberes sem desvalorizar trajetórias.","check":null},{"title":"Bloco 2: Diversidade versus Inclusão nas Organizações","sub":"","body":"Um dos maiores equívocos na gestão contemporânea é tratar diversidade e inclusão como sinônimos. A diversidade corresponde ao aspecto demográfico e quantitativo: a presença, no quadro de pessoal, de pessoas com diferentes identidades e características, abrangendo gênero, raça, etnia, idade, deficiências, religião, cultura, orientação sexual e origem social.\n\nA inclusão, por sua vez, é qualitativa e cultural. Ela exige ações deliberadas que sustentem quatro pilares essenciais: sentimento autêntico de pertencimento, respeito às singularidades, participação ativa nas decisões e igualdade real de oportunidades de desenvolvimento e promoção.\n\nPor essa razão, o simples cumprimento numérico de cotas legais — como a reserva de vagas para pessoas com deficiência prevista na Lei nº 8.213/1991 — não torna a empresa inclusiva. Ações superficiais, como expor colaboradores com deficiência ou neurodivergentes em solenidades corporativas para autopromoção da marca, violam a segurança psicológica e configuram constrangimento institucional em vez de acolhimento.","check":null},{"title":"Bloco 3: Riscos Psicossociais, Cultura de Segurança e a CIPAA","sub":"","body":"A saúde laboral ultrapassa a integridade física e envolve o equilíbrio psíquico coletivo. Sob a ótica da NR-1 e do Gerenciamento de Riscos Ocupacionais (GRO), fatores como metas inatingíveis, sobrecarga por redução de equipes, indefinição de papéis e lideranças autoritárias constituem riscos psicossociais graves, diretamente associados a crises de pânico, ansiedade e esgotamento profissional (burnout).\n\nNesse cenário atua a Comissão Interna de Prevenção de Acidentes e de Assédio (CIPAA), estruturada pela NR-5 e pela Lei nº 14.457/2022 com composição paritária: representantes indicados pelo empregador e representantes eleitos pelos empregados por voto secreto, sendo a estabilidade provisória no emprego restrita aos membros eleitos.\n\nA CIPAA foi modernizada para atuar não apenas diante de acidentes físicos ou equipamentos de proteção individual (EPIs), mas prioritariamente no combate ao assédio moral e sexual, no mapeamento de perigos e na promoção da cultura de respeito. Ela possui caráter estritamente preventivo e educativo, não devendo ser usada como comitê punitivo ou tribunal disciplinar.","check":null},{"title":"Bloco 4: O Papel Técnico-Estratégico do Psicólogo Organizacional","sub":"","body":"Diante dessas complexidades, o psicólogo organizacional atua como mediador técnico e articulador de transformações estruturais. Sua função primordial não consiste em realizar psicoterapia clínica individual dentro da empresa, mas intervir nos processos coletivos, no diagnóstico de clima e nas condições de trabalho.\n\nO trabalho técnico desse profissional organiza-se a partir de competências essenciais:\n• Mediação Técnica de Conflitos: Intervenção planejada nas disputas cotidianas decorrentes de choques geracionais e hierárquicos, tratando causas estruturais sem culpabilizar os envolvidos individualmente.\n• Desenvolvimento de Lideranças Inclusivas: Capacitação permanente de gestores para desconstruir vieses inconscientes, abandonar condutas assediadoras e liderar equipes plurais.\n• Estruturação de Processos Seletivos Justos: Implantação de seleções por competências reais — como a triagem às cegas — para mitigar o racismo institucional e preconceitos diversos, articulada a planos claros de funções e salários.\n• Promoção da Saúde e Articulação Preventiva: Mapeamento de estressores psicossociais em parceria direta com a CIPAA e a Medicina do Trabalho, garantindo segurança psicológica e dignidade no cotidiano produtivo.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: A Crise na LogTech Varejista\n\nA LogTech Varejista automatizou seu sistema e contratou três colaboradores para cumprir metas corporativas: Geraldo (56 anos, admitido no atendimento presencial sem treinamento prévio no aplicativo digital), Larissa (22 anos, contratada para suporte ao banco de dados) e Thiago (27 anos, colaborador autista contratado para o estoque).\n\nEm poucos meses, a unidade entrou em colapso: Geraldo passou a ser ridicularizado por supervisores devido à sua lentidão operacional no sistema e acabou isolado do contato com o público; Larissa pediu demissão imediata após ser repreendida como \"sem espírito de equipe\" por recusar ordens diárias para limpar banheiros e carregar caminhões, caracterizando desvio de função; e Thiago entrou em afastamento psiquiátrico por pânico agudo após ser levado de surpresa pela diretoria a um palco barulhento sob holofotes em um evento festivo para exibir o cumprimento de cotas da empresa. A direção convocou o Psicólogo Organizacional apenas para \"atender individualmente a ansiedade dos funcionários\" e dispensou a CIPAA, alegando que a comissão cuida apenas de acidentes físicos e que as crises decorrem exclusivamente da fraqueza individual dos colaboradores.\n\nPergunta Avaliativa\n\nA partir da distinção teórica entre diversidade e inclusão, aponte os equívocos de gestão cometidos pela LogTech Varejista e explique as intervenções técnicas que o Psicólogo Organizacional deve implementar, em atuação conjunta com a CIPAA, para mediar os conflitos geracionais, mitigar os riscos psicossociais e garantir a dignidade no trabalho.","criteria":["diversidade e inclusão","equívocos de gestão","riscos psicossociais","atuação conjunta com a CIPAA"],"expected":"A resposta deve demonstrar que a contratação de perfis diversos não garante inclusão, identificar etarismo, desvio de função, exposição inadequada e individualização do sofrimento, e propor intervenção sobre as condições de trabalho. O Psicólogo Organizacional deve atuar nos processos coletivos, na mediação de conflitos, no desenvolvimento das lideranças e no mapeamento dos riscos psicossociais, articulando-se com a CIPAA e a Medicina do Trabalho para construir condições mais seguras e dignas."}},{"title":"Aula 3 — Desumanização do Trabalho, Relações Raciais e Justiça Organizacional","steps":[{"title":"1. Tempos Modernos: mecanização e alienação","sub":"Linha de montagem • repetição • sofrimento","body":"Chaplin retrata a lógica da linha de montagem em que o trabalhador funciona como extensão da máquina. Ritmo acelerado, repetição e desconsideração das necessidades humanas ajudam a discutir alienação, colapso emocional e sofrimento psíquico.","check":null},{"title":"2. A esteira contemporânea","sub":"Algoritmos • trabalho sob demanda • vigilância","body":"Cobrança algorítmica, monitoramento contínuo, conectividade 24 horas e metas progressivas podem atualizar formas de controle. A análise psicológica precisa observar como esses mecanismos afetam autonomia, pausas, relações e saúde.","check":null},{"title":"3. Intervenção da POT","sub":"Processos • liderança • segurança psicológica","body":"A intervenção não se limita a ensinar o indivíduo a suportar pressão. Pode envolver revisão de fluxos, organização produtiva, desenvolvimento de lideranças e construção de ambientes com maior segurança psicológica e respeito aos limites humanos.","check":null},{"title":"4. Racismo individual","sub":"Condutas interpessoais","body":"A dimensão individual aparece em ofensas, preconceitos e comportamentos discriminatórios praticados por pessoas. É uma dimensão importante, mas não esgota a análise do racismo nas organizações.","check":null},{"title":"5. Racismo institucional","sub":"Normas • rotinas • oportunidades","body":"O racismo institucional aparece quando normas, práticas e rotinas produzem privilégios e desvantagens raciais, inclusive sem uma declaração explícita de intenção discriminatória.","check":null},{"title":"6. Racismo estrutural","sub":"Estrutura social • divisão racial do trabalho","body":"A discussão fundamentada em Silvio Almeida apresenta o racismo como componente das estruturas sociais, econômicas, jurídicas e políticas. Isso ajuda a compreender por que desigualdades podem se reproduzir mesmo quando indivíduos afirmam agir de forma neutra.","check":null},{"title":"7. Currículo às cegas","sub":"Mitigação de vieses","body":"A remoção de informações identitárias na triagem inicial é discutida como uma ferramenta possível para reduzir certos vieses e direcionar a atenção às competências. A ferramenta não substitui a revisão de todo o processo organizacional.","check":null},{"title":"8. Justiça nos processos","sub":"Mediação • clima • políticas permanentes","body":"A Psicologia busca construir pontes entre pessoas e gestão, analisar barreiras e apoiar políticas permanentes de equidade e bem-estar. A resposta não deve se limitar a ações pontuais ou exclusivamente punitivas.","check":{"q":"Todos os candidatos negros são eliminados na mesma etapa e a empresa afirma que o processo é neutro porque usa critérios técnicos. Qual é o principal cuidado analítico?","opts":["Aceitar a neutralidade declarada como prova suficiente.","Investigar critérios, resultados e possíveis mecanismos institucionais que produzam desigualdade.","Concluir automaticamente qual indivíduo é racista.","Ignorar o padrão porque não houve ofensa explícita.","Substituir seleção por sorteio."],"ans":1,"why":"Um procedimento pode ser apresentado como neutro e ainda produzir efeitos sistematicamente desiguais."}}],"case":{"prompt":"Uma empresa usa IA para monitorar pausas e digitação, aumenta metas e registra crises de pânico. No processo interno de coordenação, todos os candidatos negros são eliminados na primeira triagem, embora a diretoria afirme usar critérios “estritamente técnicos e neutros”. Analise o caso articulando desumanização e racismo institucional/estrutural.","criteria":["controle e organização do trabalho","neutralidade aparente","racismo institucional/estrutural","evidências","intervenção organizacional"],"expected":"A resposta deve questionar tanto a organização desumanizante do trabalho quanto a suposição de neutralidade do processo seletivo. O padrão racial dos resultados exige investigação dos critérios e rotinas, sem reduzir a análise à intenção consciente de uma única pessoa."}},{"title":"Aula 4 — Psicologia Organizacional, Saúde do Trabalhador e Gestão de Riscos Psicossociais","steps":[{"title":"Bloco 1: A Relação entre Pessoa, Trabalho e Organização","sub":"","body":"A Psicologia Organizacional e do Trabalho busca compreender o comportamento humano a partir da relação entre pessoa, trabalho e organização. O trabalho ocupa uma parcela significativa da vida e não representa apenas uma fonte de renda. Ele pode proporcionar identidade, pertencimento, autonomia, reconhecimento, desenvolvimento e relações sociais, tornando-se também uma importante fonte de realização e propósito.\n\nEntretanto, essa mesma relação pode produzir sofrimento. Sobrecarga, pressão excessiva, insegurança, assédio, violência, conflitos interpessoais, jornadas inadequadas, falta de autonomia e ausência de suporte podem transformar o trabalho em fonte de estresse e adoecimento. Por isso, a saúde organizacional depende da capacidade da instituição de oferecer condições que favoreçam a participação das pessoas, o reconhecimento, a segurança, os relacionamentos saudáveis e o equilíbrio entre as demandas impostas e os recursos disponíveis para realizá-las.\n\nQuando um trabalhador apresenta sofrimento psicológico, não se deve concluir automaticamente que a causa está exclusivamente nele ou, no extremo oposto, que toda manifestação emocional foi provocada pela empresa. Uma crise de ansiedade, por exemplo, pode estar relacionada a acontecimentos pessoais, familiares ou às próprias condições de trabalho. A análise técnica precisa investigar a interação entre as dimensões subjetivas, organizacionais e sociais, evitando explicações reducionistas e individualizantes.","check":null},{"title":"Bloco 2: Segurança do Trabalho, Fatores Humanos e Análise dos Acidentes","sub":"","body":"A segurança do trabalho não se limita ao uso de Equipamentos de Proteção Individual (EPIs). Embora capacetes, luvas e outros dispositivos sejam fundamentais em determinadas atividades, a prevenção também depende da organização do trabalho, da comunicação clara, de treinamentos adequados, da atuação das lideranças, da cultura organizacional, da percepção dos riscos e dos fatores humanos envolvidos na execução das tarefas.\n\nPor isso, diante de um acidente, a pergunta mais adequada não deve ser apenas “quem foi o responsável?”, mas principalmente “o que aconteceu para que esse evento fosse possível?”. Essa mudança de perspectiva permite investigar treinamento insuficiente, falta de experiência, ausência de supervisão, falhas de comunicação, fadiga, estresse, pressão por produtividade e outras condições que podem contribuir para a ocorrência.\n\nNo ambiente hospitalar, essa análise torna-se especialmente importante. Um profissional sem treinamento adequado pode sofrer acidentes com materiais perfurocortantes, expor-se a riscos biológicos ou até colocar pacientes e outros trabalhadores em risco. Entretanto, mesmo quando existe treinamento, fatores como cansaço, pressão, distração ou sofrimento emocional podem interferir na atenção e na tomada de decisão.\n\nApós um acidente, também podem surgir consequências psicológicas, como culpa, insegurança, medo de retornar ao local, alterações do sono, hipervigilância e sofrimento emocional. Nesse contexto, o Psicólogo Organizacional e do Trabalho pode atuar no acolhimento, na avaliação, no acompanhamento e na prevenção, articulando sua intervenção com a Medicina e a Segurança do Trabalho.","check":null},{"title":"Bloco 3: Riscos Psicossociais e Gerenciamento de Riscos Ocupacionais","sub":"","body":"Os riscos relacionados ao trabalho não se restringem aos agentes físicos, químicos, biológicos, ergonômicos ou aos acidentes. A análise da saúde ocupacional também precisa considerar os riscos psicossociais, compreendidos como fatores e condições relacionados à organização e às relações de trabalho capazes de produzir sofrimento e comprometer a saúde dos trabalhadores.\n\nÉ fundamental diferenciar risco psicossocial de transtorno mental. O risco psicossocial corresponde a uma condição relacionada ao trabalho, enquanto o adoecimento constitui uma possível consequência dessa exposição. A presença de um risco não significa necessariamente que o trabalhador desenvolverá um transtorno, assim como possuir diagnóstico de ansiedade ou depressão não significa automaticamente que sua origem esteja no trabalho.\n\nPor isso, diante de um funcionário que apresenta ansiedade, a intervenção não deve se limitar a ensiná-lo individualmente a “controlar” seus sintomas. É necessário investigar sua carga de trabalho, a relação com a liderança, a existência de suporte, as relações com os colegas, a jornada, a autonomia e as condições concretas em que suas atividades são realizadas.\n\nA avaliação dos riscos psicossociais pode envolver entrevistas, observação do ambiente, análise documental, escuta dos trabalhadores, grupos, questionários, análise da organização do trabalho e, quando tecnicamente apropriado, instrumentos psicológicos. Também devem ser observados indicadores organizacionais como absenteísmo, afastamentos e atestados relacionados à saúde mental, turnover, acidentes de trabalho, denúncias de assédio, queixas recorrentes e presenteísmo. Um indicador isolado não explica toda a realidade, mas a convergência de diferentes indicadores pode sinalizar a necessidade de uma investigação aprofundada.\n\nNesse processo, o Gerenciamento de Riscos Ocupacionais (GRO) e o Programa de Gerenciamento de Riscos (PGR) constituem referências importantes para a organização da prevenção. A atuação do psicólogo exige, portanto, capacidade de compreender o indivíduo, analisar a organização e suas relações, interpretar indicadores, conhecer aspectos éticos e trabalhistas e dialogar permanentemente com as áreas de Saúde Ocupacional e Segurança do Trabalho.","check":null},{"title":"Bloco 4: CIPAA e a Atuação Integrada do Psicólogo Organizacional","sub":"","body":"A Comissão Interna de Prevenção de Acidentes e de Assédio (CIPAA) é formada por representantes dos empregados e do empregador e possui papel preventivo na promoção da segurança e da saúde no ambiente de trabalho. Sua atuação não se restringe aos acidentes físicos: também envolve doenças relacionadas ao trabalho, assédio, violência, comunicação, organização do trabalho, percepção dos trabalhadores e questões relacionadas à saúde psicossocial.\n\nEntre suas funções estão identificar situações que possam oferecer riscos, contribuir para a prevenção de acidentes e doenças relacionadas ao trabalho, desenvolver ações de conscientização, acompanhar situações relacionadas à saúde e segurança, atuar na prevenção e no combate ao assédio e colaborar para a construção de ambientes de trabalho mais seguros e saudáveis.\n\nNesse cenário, o Psicólogo Organizacional e do Trabalho não atua isoladamente. Dependendo da situação, sua intervenção precisa envolver Gestão de Pessoas, Medicina do Trabalho, Segurança do Trabalho, CIPAA e as próprias lideranças. No cotidiano profissional, pode realizar acolhimentos, acompanhar trabalhadores em sofrimento, participar de processos de afastamento e retorno ao trabalho, receber demandas encaminhadas por gestores, acompanhar indicadores, desenvolver ações de promoção da saúde e contribuir para a prevenção dos riscos psicossociais.\n\nEssa atuação não corresponde necessariamente à psicoterapia continuada dentro da empresa. Em situações pontuais, o psicólogo pode realizar acolhimentos e acompanhamentos breves. Quando identifica uma demanda que exige tratamento continuado, deve orientar ou encaminhar o trabalhador para acompanhamento adequado, mantendo sua atuação organizacional sobre os fatores relacionados ao ambiente e às condições de trabalho.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: O Adoecimento no Setor Hospitalar\n\nMariana, 32 anos, trabalha há 11 anos em um hospital. Nos últimos seis meses, seu setor passou por uma redução significativa do número de funcionários, embora a demanda de trabalho tenha permanecido elevada. Desde então, Mariana relata excesso de tarefas, dificuldade para realizar pausas, mudanças frequentes em sua escala e pouca comunicação com uma liderança cada vez mais distante.\n\nNos últimos meses, começou a apresentar dificuldade para dormir, irritabilidade, crises de ansiedade e faltas recorrentes ao trabalho. Inicialmente, Mariana procurou espontaneamente o Psicólogo Organizacional da instituição. Ao ampliar a investigação, entretanto, o profissional identificou que outros trabalhadores do mesmo setor apresentavam queixas semelhantes. Também foram encontrados aumento do absenteísmo, crescimento da rotatividade, conflitos com a liderança, sobrecarga de trabalho e dificuldade para substituir os funcionários que deixavam a equipe.\n\nO caso, portanto, não pode ser analisado exclusivamente como uma demanda clínica individual. Embora Mariana necessite de acolhimento e, quando indicado, encaminhamento ou acompanhamento em saúde mental, a repetição das queixas e a convergência dos indicadores revelam a necessidade de investigar as condições organizacionais e os possíveis riscos psicossociais presentes naquele setor.\n\nPergunta Avaliativa\n\nA partir da relação entre pessoa, trabalho e organização, analise o caso de Mariana e explique por que seus sintomas não devem ser tratados exclusivamente como uma questão individual. Identifique os principais riscos psicossociais e indicadores organizacionais presentes no caso e apresente as intervenções que o Psicólogo Organizacional e do Trabalho deve desenvolver em articulação com a Gestão de Pessoas, Medicina do Trabalho, Segurança do Trabalho e CIPAA.","criteria":["pessoa, trabalho e organização","riscos psicossociais","indicadores organizacionais","atuação integrada"],"expected":"A resposta deve relacionar o sofrimento de Mariana às condições concretas do setor sem reduzir sua experiência exclusivamente à organização ou ao indivíduo. Devem ser identificados sobrecarga, dificuldade de pausas, mudanças frequentes de escala, pouca comunicação e conflitos com a liderança, além de absenteísmo, rotatividade e repetição de queixas. A intervenção deve combinar acolhimento individual quando necessário com investigação das condições de trabalho e atuação articulada entre Psicologia, Gestão de Pessoas, Medicina do Trabalho, Segurança do Trabalho e CIPAA."}},{"title":"Aula 5 — CIPAA, Segurança do Trabalho, NR-1 e Riscos Psicossociais","steps":[{"title":"1. Composição da CIPAA","sub":"Eleitos × designados • representação dos setores","body":"Representantes dos empregados são eleitos e representantes do empregador são designados. A presença de diferentes setores permite que experiências concretas dos postos de trabalho cheguem à comissão.","check":null},{"title":"2. Estabilidade provisória","sub":"Proteção da representação dos trabalhadores","body":"A aula destaca a estabilidade dos representantes eleitos pelos trabalhadores, titulares e suplentes, no período discutido em sala. Os designados pela organização não possuem a mesma garantia.","check":null},{"title":"3. Papel preventivo e limites","sub":"Antecipar riscos sem substituir outras áreas","body":"A CIPAA atua na prevenção e correção de riscos e pode trabalhar em parceria com a Psicologia. Não substitui Medicina Ocupacional, Psicologia Clínica ou Segurança do Trabalho, nem realiza diagnósticos individuais ou investigação punitiva como ouvidoria.","check":null},{"title":"4. Ergonomia e adaptação","sub":"Postos • repetitividade • LER/DORT","body":"A prevenção inclui adaptação de postos, regulagens, apoios, proteção contra ruído e pausas/atividades preventivas quando adequadas à atividade. O objetivo é pensar o trabalho antes do dano.","check":null},{"title":"5. EPI: fornecer não basta","sub":"Equipamento • orientação • fiscalização","body":"A organização deve fornecer o equipamento adequado e acompanhar seu uso. A aula trabalha a ideia de que segurança exige condições, orientação, fiscalização e registros, e não apenas entregar um EPI.","check":null},{"title":"6. Recusa ao EPI","sub":"Dimensão formativa + documental","body":"Diante da recusa, a condução técnica combina diálogo e sensibilização com registro e medidas organizacionais cabíveis. Psicologia, RH e Segurança podem contribuir de formas diferentes, evitando tanto omissão quanto reação puramente impulsiva.","check":null},{"title":"7. Evolução da NR-1","sub":"1977/78 → 2019/20 → 2022 → 2024/26","body":"A aula organiza uma linha histórica da norma, passando pela base de segurança e saúde, pela estrutura de GRO/PGR, pelas mudanças relacionadas à prevenção de assédio e pela discussão contemporânea dos fatores de riscos psicossociais.","check":null},{"title":"8. Psicologia e riscos psicossociais","sub":"Ritmo • sobrecarga • liderança • comunicação • assédio","body":"A ampliação da análise de riscos abre espaço para examinar dimensões da organização do trabalho que exigem conhecimento psicológico: pressão, ritmo, relações, comunicação, suporte, liderança e violência no trabalho.","check":{"q":"Um trabalhador recusa EPI porque “nunca aconteceu nada”. Qual resposta expressa melhor a lógica preventiva?","opts":["A ausência de acidentes prova que o EPI é dispensável.","Segurança deve antecipar o risco; é preciso orientar, fiscalizar, registrar e compreender a recusa.","A única resposta técnica é demissão imediata.","A Psicologia deve fazer psicoterapia obrigatória.","A CIPAA deve aplicar a punição diretamente."],"ans":1,"why":"A prevenção não depende de esperar o dano ocorrer e a atuação envolve responsabilidades distintas."}}],"case":{"prompt":"Um trabalhador de manipulação química recusa luvas e óculos alegando que trabalha assim há dez anos. O supervisor ameaça demissão imediata e, paralelamente, é denunciado por humilhações públicas e gritos. Analise os dois problemas e diferencie as atuações de Segurança do Trabalho e CIPAA.","criteria":["recusa ao EPI","orientação/fiscalização/documentação","risco psicossocial/assédio","limites da CIPAA","articulação"],"expected":"A recusa ao EPI exige condução técnica, orientação, fiscalização e documentação, em vez de resposta impulsiva. As denúncias de humilhação exigem prevenção e encaminhamento institucional apropriado; a CIPAA não deve ser confundida com instância punitiva ou clínica."}},{"title":"Aula 6 — Psicologia Organizacional, NR-1 e Gestão dos Riscos Psicossociais","steps":[{"title":"Bloco 1: Aplicação da NR-1 e a Lógica da Prevenção","sub":"","body":"A Norma Regulamentadora nº 1 estabelece diretrizes relacionadas à segurança e à saúde no trabalho e alcança as organizações que possuem trabalhadores contratados, observadas as situações específicas e possibilidades de tratamento diferenciado previstas nas normas. Na prática, sua aplicação exige que a organização reconheça os riscos existentes em suas atividades e desenvolva estratégias para preveni-los.\n\nUm ponto fundamental é compreender que praticamente toda atividade profissional pode apresentar algum tipo de risco. Mesmo ambientes aparentemente seguros, como escritórios, consultórios ou atividades administrativas, podem envolver riscos relacionados à ergonomia, quedas, ruídos, jornadas, relações interpessoais ou fatores psicossociais. Por isso, a análise não deve se restringir aos ambientes industriais ou às atividades tradicionalmente consideradas perigosas.\n\nA lógica da prevenção parte da ideia de que a organização não deve esperar o acidente ou o adoecimento acontecer para somente depois modificar seus procedimentos. É necessário antecipar situações que possam causar danos. A frase “sempre fiz assim e nunca aconteceu nada” não constitui uma garantia de segurança. A ausência de acidentes anteriores não significa ausência de risco.\n\nNesse processo, procedimentos claros, treinamentos, orientações e fiscalização tornam-se fundamentais. O trabalhador precisa conhecer as regras relacionadas à sua função e compreender por que determinadas medidas são necessárias. A prevenção depende, portanto, tanto da existência de normas quanto da construção de uma cultura organizacional capaz de transformar essas normas em práticas cotidianas.","check":null},{"title":"Bloco 2: Responsabilidade Compartilhada, EPIs e Documentação","sub":"","body":"A segurança no trabalho envolve responsabilidades tanto da organização quanto dos trabalhadores. A empresa precisa disponibilizar os equipamentos necessários, orientar sobre sua utilização, realizar treinamentos, fiscalizar as condições de trabalho e registrar as medidas adotadas. O trabalhador, por sua vez, precisa seguir as orientações recebidas e utilizar adequadamente os recursos de proteção disponibilizados.\n\nA resistência ao uso de Equipamentos de Proteção Individual (EPIs) constitui um desafio frequente. Trabalhadores experientes podem considerar determinados equipamentos desconfortáveis ou desnecessários por terem realizado a mesma atividade durante muitos anos sem acidentes. Entretanto, a prevenção não pode depender da sorte ou exclusivamente da experiência acumulada.\n\nPor isso, a documentação assume papel importante. Entrega de equipamentos, treinamentos, orientações, ocorrências e situações de não conformidade precisam ser registradas. Esses registros permitem acompanhar os procedimentos adotados, identificar situações recorrentes e demonstrar as medidas desenvolvidas pela organização e as orientações recebidas pelos trabalhadores.\n\nQuando ocorre um acidente, a análise também não deve se limitar à busca imediata por um culpado. É necessário investigar as circunstâncias do evento: quais equipamentos estavam disponíveis, quais orientações haviam sido fornecidas, se existiam procedimentos definidos, se o trabalhador havia sido treinado e quais condições estavam presentes naquele momento. A prevenção exige aprender com as ocorrências para impedir sua repetição.\n\nEssa responsabilidade também pode produzir impactos psicológicos sobre diferentes pessoas envolvidas. Um acidente grave não afeta somente o trabalhador diretamente atingido. Colegas, lideranças e até o próprio empregador podem experimentar culpa, medo, insegurança e sofrimento diante das consequências de um evento ocorrido no ambiente de trabalho.","check":null},{"title":"Bloco 3: Gerenciamento de Riscos Ocupacionais e Atuação Integrada","sub":"","body":"O Gerenciamento de Riscos Ocupacionais (GRO) organiza a identificação e a prevenção dos riscos presentes nas atividades profissionais. Dentro dessa perspectiva, o Programa de Gerenciamento de Riscos (PGR) permite estruturar e documentar as medidas adotadas pela organização para reconhecer, avaliar e controlar os riscos existentes.\n\nA prevenção precisa considerar as características concretas de cada ambiente. Uma obra apresenta determinadas necessidades de proteção; um laboratório possui riscos específicos; trabalhadores que permanecem diante de computadores podem estar expostos a problemas ergonômicos; atividades externas e deslocamentos profissionais também exigem cuidados próprios. O gerenciamento deve partir da realidade do trabalho realizado.\n\nA atuação preventiva, portanto, não pertence exclusivamente a um único profissional. Recursos Humanos, Departamento Pessoal, Segurança do Trabalho, Medicina do Trabalho, Psicologia Organizacional e do Trabalho, CIPAA, lideranças e, quando necessário, o setor jurídico precisam dialogar. Cada área possui responsabilidades específicas, mas todas participam da construção de condições adequadas de trabalho.\n\nNesse contexto, o Psicólogo Organizacional e do Trabalho oferece uma contribuição particular. Enquanto determinadas áreas precisam fiscalizar e cobrar o cumprimento das normas, o psicólogo pode desenvolver uma escuta diferenciada para compreender comportamentos, resistências e dificuldades. Diante de um trabalhador que insiste em não utilizar determinado equipamento, por exemplo, não basta simplesmente repetir a ordem: também pode ser necessário compreender o que sustenta aquela resistência e desenvolver estratégias de conscientização.\n\nTreinamentos, capacitações, rodas de conversa e ações educativas podem auxiliar nesse processo. A CIPAA também participa da identificação de situações de risco, da conscientização e da promoção de um ambiente organizacional mais seguro. O objetivo da atuação integrada é fortalecer uma cultura preventiva, e não simplesmente agir depois que o acidente ou o adoecimento já aconteceu.","check":null},{"title":"Bloco 4: A Inclusão dos Riscos Psicossociais na Gestão de Riscos","sub":"","body":"Uma das mudanças destacadas na atualização da NR-1 é a ampliação do olhar sobre os riscos ocupacionais. A gestão da segurança, que tradicionalmente concentrava grande atenção nos agentes físicos, químicos, biológicos, ergonômicos e nos riscos de acidentes, passa a incorporar expressamente os fatores de riscos psicossociais relacionados ao trabalho.\n\nIsso significa reconhecer que a saúde mental também integra a proteção do trabalhador. Estresse ocupacional, assédio moral, pressão excessiva, sobrecarga de trabalho e conflitos profissionais aparecem como exemplos de condições que precisam ser observadas pela organização. A empresa deve avaliar, controlar e registrar os riscos relacionados às condições em que o trabalho é organizado e desenvolvido.\n\nÉ importante compreender que o risco psicossocial não está limitado ao trabalhador que já apresenta sofrimento psicológico. A proposta preventiva consiste justamente em analisar as condições capazes de favorecer o adoecimento antes que suas consequências se tornem mais graves. Por isso, a atuação precisa voltar-se para a organização do trabalho, e não somente para a tentativa de modificar individualmente o comportamento do funcionário.\n\nA atualização publicada em 2024 já apresentava essa ampliação e houve um período posterior de adequação. Após a prorrogação, as mudanças passam a vigorar em 26 de maio de 2026, tornando ainda mais necessária a revisão dos programas de gerenciamento e a documentação das medidas relacionadas aos riscos psicossociais.\n\nEssa mudança aproxima diretamente a Psicologia Organizacional e do Trabalho da gestão de saúde e segurança. O psicólogo passa a contribuir não apenas quando alguém procura atendimento após adoecer, mas na identificação dos fatores psicossociais, na escuta dos trabalhadores, na conscientização, na construção de estratégias preventivas e na articulação com os demais profissionais responsáveis pelo gerenciamento dos riscos.","check":null}],"case":{"prompt":"Estudo de Caso Integrador: Os Riscos na Metalúrgica Horizonte\n\nA Metalúrgica Horizonte possui 85 trabalhadores distribuídos entre produção, administração e logística. A empresa fornece EPIs e realiza treinamentos periódicos, mas alguns trabalhadores mais antigos resistem ao uso dos equipamentos. Carlos, que trabalha há 18 anos na produção, costuma retirar as luvas e os óculos durante determinadas atividades, afirmando que “sempre trabalhou assim e nunca aconteceu nada”.\n\nNos últimos meses, a produção também passou a enfrentar aumento das metas e redução do número de funcionários. Trabalhadores começaram a relatar cansaço, pressão constante das lideranças, conflitos entre colegas e dificuldade para realizar pausas. O RH registrou crescimento das faltas e afastamentos, enquanto a CIPAA identificou recorrência de situações de não conformidade relacionadas ao uso dos equipamentos de segurança.\n\nA direção considera que já cumpriu sua responsabilidade porque disponibiliza os EPIs e afirma que os problemas emocionais dos funcionários não deveriam fazer parte do gerenciamento de riscos da empresa. Ao analisar a situação, entretanto, o Psicólogo Organizacional e do Trabalho identifica que existem simultaneamente questões relacionadas à segurança, ao comportamento dos trabalhadores, à organização do trabalho e a possíveis fatores de riscos psicossociais.\n\nDiante disso, o profissional propõe uma atuação articulada com a CIPAA, Recursos Humanos, Segurança e Medicina do Trabalho, envolvendo análise das condições existentes, documentação das situações identificadas, ações de conscientização e investigação dos fatores organizacionais associados às queixas dos trabalhadores.\n\nPergunta Avaliativa\n\nConsiderando o Gerenciamento de Riscos Ocupacionais (GRO), o Programa de Gerenciamento de Riscos (PGR) e a inclusão dos fatores de riscos psicossociais relacionados ao trabalho, analise a situação da Metalúrgica Horizonte e explique por que a simples disponibilização de EPIs não é suficiente para caracterizar uma atuação preventiva. Identifique os riscos presentes no caso e explique como o Psicólogo Organizacional e do Trabalho deve atuar, em articulação com a CIPAA, Recursos Humanos, Segurança e Medicina do Trabalho, na prevenção dos acidentes e dos riscos psicossociais.","criteria":["GRO e PGR","EPIs e prevenção","riscos psicossociais","atuação integrada"],"expected":"A resposta deve explicar que a prevenção não se resume à entrega de EPIs: exige orientação, treinamento, fiscalização, documentação e análise das condições concretas de trabalho. Devem ser identificados a resistência ao uso dos equipamentos, aumento de metas, redução da equipe, cansaço, pressão, conflitos, dificuldade de pausas, faltas e afastamentos. O Psicólogo Organizacional deve contribuir para compreender os fatores psicossociais e as resistências, desenvolver ações de conscientização e atuar de forma articulada com CIPAA, RH, Segurança e Medicina do Trabalho dentro do gerenciamento de riscos."}}],"cesar":[{"title":"Processos, pessoas e comportamento","steps":[{"title":"Do que uma organização é feita?","sub":"Processos precisam de pessoas","body":"Procedimentos, tarefas, máquinas, softwares e sistemas organizam o trabalho, mas são pessoas que interpretam, executam e sustentam esses processos.","check":null},{"title":"Onde entra a Psicologia?","sub":"Além do procedimento","body":"A Psicologia observa como pessoas compreendem tarefas, aprendem, sentem, se relacionam e respondem às condições organizacionais.","check":null},{"title":"Liderança como influência","sub":"Cargo não é sinônimo de liderança","body":"O cargo oferece autoridade formal; liderança é um processo de influência. Confiança, responsabilidade, exemplo, conhecimento do processo e compreensão da equipe alteram a qualidade dessa influência.","check":null},{"title":"Visão integrada","sub":"Processo + pessoa + contexto","body":"Uma falha pode envolver sistema, treinamento, comunicação, liderança, recursos ou comportamento. A análise não começa culpando um lado.","check":{"q":"Uma coordenadora diz: 'sou líder porque fui promovida'. Qual conceito melhor corrige a frase?","opts":["Liderança é sinônimo de cargo.","Poder legítimo decorre do cargo, mas liderança envolve processo de influência.","Todo cargo produz poder de referência.","Influência independe das relações.","Liderança é um traço nato."],"ans":1,"why":"O cargo fornece autoridade formal; liderança depende de como a influência é exercida."}}],"case":{"prompt":"Uma empresa instala um software novo. Os erros aumentam, e a gerência afirma que os empregados 'resistem à tecnologia'. Não houve treinamento estruturado e os supervisores também não dominam o sistema. Analise sem reduzir o problema ao indivíduo.","criteria":["processos + pessoas","treinamento","liderança/suporte","hipóteses"],"expected":"A análise deve integrar tecnologia, processo, aprendizagem e liderança. A resistência é apenas uma hipótese. Falta de treinamento, supervisores inseguros e condições de implementação podem explicar parte dos erros. É preciso investigar antes de concluir e intervir sobre aprendizagem, suporte e processo."}},{"title":"Motivação e aprendizagem","steps":[{"title":"Motivação não é empolgação","sub":"Movimento sustentado","body":"Motivação ajuda a explicar intensidade, direção e persistência do esforço. Uma reação momentânea a um prêmio ou discurso não equivale necessariamente a motivação sustentada.","check":null},{"title":"Estímulo × motivação","sub":"Dentro e fora","body":"No enquadramento didático usado nesta matéria, estímulos vêm do ambiente; a motivação envolve movimento interno da pessoa diante de necessidades, expectativas, sentido e contexto.","check":null},{"title":"Ecossistema da aprendizagem","sub":"Cognição + afetividade + motivação","body":"Aprender não depende apenas de capacidade intelectual. Emoções, segurança, interesse, percepção de competência e condições do ambiente afetam atenção e persistência.","check":null},{"title":"Pensamento, sentimento e ação","sub":"Uma cadeia útil de análise","body":"Pensamentos influenciam sentimentos; ambos podem alterar comportamento e resultados. O modelo ajuda a perguntar o que a pessoa interpreta antes de julgar sua conduta.","check":null},{"title":"Ambiente facilitador","sub":"Apoiar não é 'motivar alguém' diretamente","body":"Lideranças e organizações podem criar condições, suporte, pertencimento, autonomia e feedback que favoreçam o processo motivacional.","check":{"q":"Uma funcionária precisa aprender um sistema complexo enquanto teme perder o emprego. Qual análise é mais completa?","opts":["Se é capaz, o medo não interfere.","A aprendizagem envolve cognição, afetividade e motivação; insegurança pode ocupar atenção e reduzir desempenho.","A solução é aumentar a punição.","Motivação depende apenas de salário.","O problema prova falta de inteligência."],"ans":1,"why":"O ecossistema de aprendizagem integra aspectos cognitivos, afetivos e motivacionais."}}],"case":{"prompt":"Lucas entrou recentemente, tem contrato instável, sente-se isolado e precisa dominar um software complexo rapidamente. O gestor interpreta suas dúvidas como desmotivação. Explique por que aprendizagem e motivação podem estar comprometidas.","criteria":["insegurança","pertencimento","cognição + afetividade + motivação","não concluir desmotivação"],"expected":"A instabilidade pode ativar preocupações de segurança; o isolamento afeta pertencimento; ansiedade e preocupação podem disputar recursos de atenção necessários à aprendizagem. Portanto, o comportamento não comprova desmotivação. É preciso investigar e criar condições de suporte, integração, aprendizagem e feedback."}},{"title":"Teorias motivacionais","steps":[{"title":"Por que existem várias teorias?","sub":"Cada lente responde uma pergunta","body":"Uma teoria pode olhar necessidades, outra condições do trabalho, outra expectativas ou autonomia. O objetivo não é escolher uma teoria 'verdadeira', mas reconhecer qual explica melhor as pistas do caso.","check":null},{"title":"Maslow","sub":"Necessidades e contexto","body":"Necessidades fisiológicas, segurança, sociais, estima e autorrealização ajudam a organizar hipóteses. Não use a hierarquia mecanicamente: história e contexto importam.","check":null},{"title":"Herzberg","sub":"Higiene × motivadores","body":"Fatores higiênicos, como políticas, condições e remuneração, ajudam a evitar insatisfação. Motivadores como reconhecimento, responsabilidade, crescimento e realização favorecem satisfação e envolvimento.","check":null},{"title":"Vroom","sub":"Expectativa × instrumentalidade × valência","body":"Expectativa: esforço pode gerar desempenho? Instrumentalidade: desempenho leva a uma consequência? Valência: essa consequência tem valor? A lógica é multiplicativa.","check":null},{"title":"Locke & Latham","sub":"Metas e direção","body":"Metas claras e desafiadoras, acompanhadas de feedback e condições, podem orientar esforço. Meta sem recurso ou sem clareza não é automaticamente motivadora.","check":null},{"title":"Deci & Ryan","sub":"Autonomia, competência e pertencimento","body":"A autodeterminação destaca necessidades psicológicas de autonomia, competência e relacionamento/pertencimento.","check":null},{"title":"Daniel Pink","sub":"Autonomia, maestria e propósito","body":"No recorte estudado, Pink enfatiza autonomia, desenvolvimento de domínio/maestria e propósito, sobretudo em trabalhos menos mecânicos.","check":null},{"title":"Integração","sub":"Procure a pista do caso","body":"Segurança → Maslow; salário/condição × reconhecimento → Herzberg; esforço-consequência-valor → Vroom; metas/feedback → Locke & Latham; autonomia/competência/vínculo → Deci & Ryan; autonomia/maestria/propósito → Pink.","check":{"q":"A empresa aumenta salário e melhora móveis, mas trabalhadores continuam sem reconhecimento ou possibilidade de crescimento. Qual leitura de Herzberg é mais adequada?","opts":["Os fatores higiênicos substituem os motivadores.","As melhorias podem reduzir insatisfação, mas não garantem motivação duradoura.","Salário é sempre motivador intrínseco.","Reconhecimento é fator higiênico.","Condições físicas não importam."],"ans":1,"why":"Herzberg separa condições que evitam insatisfação de fatores ligados à satisfação/motivação."}}],"case":{"prompt":"Uma equipe recebe bônus por volume. A produção sobe, a qualidade cai e profissionais experientes dizem ter perdido autonomia e propósito. Use pelo menos duas teorias motivacionais para interpretar o caso.","criteria":["recompensa/extrínseca","Vroom ou Herzberg","autonomia/Deci-Ryan ou Pink","efeito sobre qualidade/propósito"],"expected":"O bônus pode aumentar instrumentalidade em Vroom: produzir mais se associa à recompensa. Porém, depender apenas da troca pode deslocar atenção para quantidade. Pela Autodeterminação/Pink, perda de autonomia e propósito pode reduzir motivação de melhor qualidade. Em Herzberg, recompensa externa não substitui reconhecimento, responsabilidade e crescimento."}},{"title":"Expectativa e Autodeterminação","steps":[{"title":"Expectativa","sub":"Consigo transformar esforço em desempenho?","body":"Se a pessoa acredita que, mesmo se esforçando, não conseguirá realizar a tarefa, a expectativa é baixa.","check":null},{"title":"Instrumentalidade","sub":"O desempenho produz consequência?","body":"Se bom desempenho não muda nada ou a promessa não é confiável, a instrumentalidade enfraquece.","check":null},{"title":"Valência","sub":"A consequência vale para mim?","body":"Uma recompensa só mobiliza se tiver valor para aquela pessoa.","check":null},{"title":"Autonomia","sub":"Participação responsável","body":"Autonomia é sentir possibilidade de escolha e influência compatíveis com a função, não ausência de regras.","check":null},{"title":"Competência","sub":"Sentir-se capaz de avançar","body":"Feedback, desafios adequados e oportunidades de aprender ajudam a sustentar percepção de competência.","check":null},{"title":"Pertencimento","sub":"Vínculo e conexão","body":"Relações significativas e sensação de inclusão participam da motivação.","check":null},{"title":"Não confunda","sub":"Autonomia ≠ segurança psicológica","body":"Autonomia trata de autodeterminação/possibilidade de escolha. Segurança psicológica diz respeito ao risco interpessoal de falar, perguntar, discordar ou admitir erro.","check":{"q":"Micromanagement retira todas as decisões de uma analista experiente. Qual necessidade da Autodeterminação é atingida de modo mais direto?","opts":["Pertencimento","Autonomia","Valência","Segurança fisiológica","Instrumentalidade"],"ans":1,"why":"A pista principal é perda de escolha e influência sobre o próprio trabalho."}}],"case":{"prompt":"Uma analista sabe executar a função, mas seu gestor passa a definir cada passo, revisar cada mensagem e impedir decisões simples. Ela reduz iniciativa. Analise pela Autodeterminação e diferencie autonomia de competência.","criteria":["autonomia","competência","micromanagement","iniciativa/motivação"],"expected":"A competência pode permanecer alta, pois ela sabe executar a tarefa. O elemento diretamente atingido é a autonomia: o micromanagement reduz escolha e influência. Isso pode diminuir iniciativa e qualidade da motivação mesmo sem perda de capacidade técnica."}},{"title":"Visão sistêmica","steps":[{"title":"O todo antes da sentença","sub":"Comportamento tem contexto","body":"Visão sistêmica significa investigar relações entre pessoa, tarefa, equipe, liderança, regras, recursos e ambiente antes de atribuir uma causa.","check":null},{"title":"Hipótese ≠ diagnóstico","sub":"Pergunte antes de concluir","body":"“Está desmotivado” é uma interpretação. A observação real pode ser atraso, isolamento, erro, silêncio ou queda de desempenho.","check":null},{"title":"Múltiplas fontes","sub":"Uma versão não basta","body":"Gestor, trabalhador, equipe, indicadores e observação podem revelar partes diferentes do sistema.","check":null},{"title":"Integre teorias","sub":"Teoria como lente","body":"Maslow pode iluminar segurança; Autodeterminação, autonomia e pertencimento; aprendizagem, cognição e afetividade. O caso pode exigir mais de uma lente.","check":null},{"title":"Fluxo","sub":"Observar → investigar → formular hipóteses → integrar → intervir","body":"Esse fluxo evita julgamentos prematuros e intervenções genéricas.","check":{"q":"Qual frase representa melhor uma leitura sistêmica?","opts":["Lucas erra porque não é comprometido.","O erro prova falta de motivação.","Precisamos investigar tarefa, aprendizagem, relações, liderança e contexto antes de concluir.","O contrato explica sozinho todo o caso.","A personalidade é a variável central."],"ans":2,"why":"A leitura sistêmica integra múltiplos elementos e mantém hipóteses abertas."}}],"case":{"prompt":"Um recém-contratado erra tarefas, evita reuniões e recebeu advertência. O gestor quer desligá-lo por falta de comprometimento. Que informações você buscaria antes de formular uma hipótese?","criteria":["tarefa/treinamento","relações/pertencimento","liderança/feedback","condições e indicadores"],"expected":"É necessário verificar clareza da tarefa, treinamento, recursos, feedback, relações, integração, segurança, expectativas e padrão de desempenho, além de ouvir o trabalhador e outras fontes. Só então se formulam hipóteses e ações."}},{"title":"Poder e estilos de liderança","steps":[{"title":"Poder","sub":"Potencial de influência","body":"Poder é a capacidade potencial de influenciar atitudes ou comportamentos. Ele pode vir do cargo, da recompensa, da punição, do conhecimento, da admiração, das conexões ou da informação.","check":null},{"title":"Bases posicionais","sub":"Cargo, punição e recompensa","body":"Poder legítimo decorre da posição; coercitivo usa ameaça/punição; recompensa controla recursos valorizados.","check":null},{"title":"Bases pessoais e relacionais","sub":"Saber, admiração, rede e informação","body":"Competência vem do conhecimento reconhecido; referência, da identificação/admiração; conexão, das redes; informação, do acesso e uso de dados relevantes.","check":null},{"title":"Autocrático","sub":"Centralização e controle","body":"Decisões concentradas, pouca participação e uso mais intenso de controle. Pode gerar conformidade rápida, mas também medo, silêncio e dependência.","check":null},{"title":"Democrático","sub":"Participação e escuta","body":"O líder facilita discussão, participação, feedback e corresponsabilidade.","check":null},{"title":"Liberal","sub":"Ausência de direção não é delegação madura","body":"Laissez-faire aparece no recorte da matéria como baixa direção/suporte, podendo gerar ambiguidade e desorganização.","check":null},{"title":"Base → reação","sub":"Procure causa e efeito","body":"Coerção pode produzir conformidade defensiva; recompensa, cálculo utilitário; competência, segurança técnica; informação compartilhada, clareza e protagonismo.","check":{"q":"Uma gerente ameaça demissão, centraliza decisões e usa o cargo para impor obediência. Quais pistas predominam?","opts":["Democrático + referência","Autocrático + coercitivo e legítimo","Liberal + informação","Transformacional + competência","Servidor + conexão"],"ans":1,"why":"A ameaça aponta coerção; o cargo, poder legítimo; a centralização, estilo autocrático."}}],"case":{"prompt":"Roberta estabelece prazos agressivos, decide tudo sozinha, ameaça retirar benefícios e lembra constantemente que 'a chefe sou eu'. Reações incluem silêncio, rework e queda de iniciativa. Relacione bases de poder, estilo e efeitos motivacionais.","criteria":["coercitivo","legítimo","autocrático","medo/conformidade/queda de autonomia"],"expected":"Predominam poder coercitivo, pelo uso de ameaça, e legítimo, pela autoridade do cargo, dentro de um estilo autocrático. A combinação tende a produzir conformidade defensiva e medo, podendo reduzir autonomia, iniciativa e comunicação de erros."}},{"title":"Lideranças transacional, transformacional e servidora","steps":[{"title":"Transacional","sub":"A lógica da troca","body":"Desempenho é associado a recompensas ou consequências. É útil reconhecer a pista: “se entregar X, recebe Y”.","check":null},{"title":"Transformacional","sub":"Propósito e desenvolvimento","body":"Busca mobilizar por visão, sentido, desenvolvimento e mudança.","check":null},{"title":"Os quatro Is","sub":"Mapa da transformacional","body":"Influência idealizada; motivação inspiracional; estimulação intelectual; consideração individualizada.","check":null},{"title":"Servidora","sub":"Servir para desenvolver","body":"Enfatiza humildade, responsabilidade, escuta e desenvolvimento dos outros. Servir não significa fazer tudo pela equipe.","check":null},{"title":"Humildade intelectual","sub":"Saber que não sabe tudo","body":"Liderança pode reconhecer limites, buscar perspectivas e rever posições sem perder responsabilidade.","check":null},{"title":"Comparando","sub":"Troca × transformação × serviço","body":"Transacional: troca. Transformacional: visão e desenvolvimento. Servidora: serviço e crescimento das pessoas.","check":{"q":"Um líder apresenta uma visão de futuro, estimula ideias novas e acompanha necessidades individuais. Qual modelo predomina?","opts":["Transacional","Transformacional","Autocrático","Laissez-faire","Coercitivo"],"ans":1,"why":"As pistas correspondem à motivação inspiracional, estimulação intelectual e consideração individualizada."}}],"case":{"prompt":"Uma gestora substitui bônus individuais como único recurso de liderança por reuniões de propósito, espaço para ideias e acompanhamento individual de desenvolvimento. Compare a lógica transacional com a transformacional presente na mudança.","criteria":["troca/recompensa","propósito","estimulação intelectual","consideração individualizada"],"expected":"A lógica anterior era predominantemente transacional, baseada na troca desempenho-recompensa. A nova prática incorpora elementos transformacionais: propósito compartilhado, estímulo a novas ideias e consideração individualizada, buscando comprometimento além da recompensa externa."}}],"patricia":[{"title":"Psicologia Organizacional e seus níveis","steps":[{"title":"O que a POT estuda?","sub":"Pessoa em relação com o trabalho","body":"A Psicologia Organizacional não se resume a RH. Seu objeto envolve a relação entre pessoas, trabalho e organização, buscando compreender comportamento e contribuir para bem-estar e objetivos organizacionais.","check":null},{"title":"Nível individual","sub":"A pessoa","body":"História, necessidades, competências, percepção, motivação e experiência individual.","check":null},{"title":"Nível grupal","sub":"As relações","body":"Comunicação, liderança, conflitos, normas, papéis, influência e cooperação.","check":null},{"title":"Nível organizacional","sub":"O sistema","body":"Cultura, estrutura, políticas, processos, condições de trabalho e práticas de gestão.","check":null},{"title":"Evite reducionismo","sub":"Comportamento é pista, não explicação","body":"Atrasos ou desmotivação podem ser sintomas de problemas mais profundos. A análise deve investigar os três níveis.","check":null},{"title":"Fluxo profissional","sub":"Diagnóstico → planejamento → intervenção → avaliação","body":"A atuação baseada em evidências transforma uma queixa em investigação e depois em ação.","check":{"q":"Uma equipe apresenta atrasos e turnover. Qual resposta é mais coerente com a POT?","opts":["Concluir falta de comprometimento.","Investigar fatores individuais, grupais e organizacionais antes de intervir.","Aplicar punições para testar motivação.","Fazer seleção de novos funcionários imediatamente.","Ignorar indicadores coletivos."],"ans":1,"why":"A POT trabalha com leitura multicausal e baseada em evidências."}}],"case":{"prompt":"Um gestor afirma que sua equipe é 'preguiçosa' porque há atrasos e conflitos. Explique como os níveis individual, grupal e organizacional orientariam um diagnóstico.","criteria":["individual","grupal","organizacional","evidências"],"expected":"A análise individual pode verificar necessidades, competências e experiências; a grupal, comunicação, conflitos, normas e liderança; a organizacional, carga, processos, cultura, políticas e condições. Nenhuma dessas hipóteses deve ser tomada como causa sem evidências."}},{"title":"Diagnóstico antes da intervenção","steps":[{"title":"Demanda não é diagnóstico","sub":"O pedido inicial precisa ser investigado","body":"“Faça um treinamento” é uma solicitação; ainda não sabemos se treinamento é a solução.","check":null},{"title":"Evidências","sub":"Não trabalhar por feeling","body":"Entrevistas, observação, clima, indicadores, processos e diferentes fontes ajudam a formular o problema.","check":null},{"title":"Formulação","sub":"Qual problema estamos tentando compreender?","body":"Uma boa formulação delimita onde, quando, quem é afetado, quais evidências existem e qual impacto aparece, sem antecipar a solução.","check":null},{"title":"Planejamento","sub":"Intervenção responde ao diagnóstico","body":"Depois de compreender fatores relevantes, escolhem-se objetivos, métodos, responsáveis e indicadores.","check":null},{"title":"Avaliação e acompanhamento","sub":"Intervir não encerra o trabalho","body":"É necessário verificar efeitos, ajustar ações e acompanhar mudanças.","check":{"q":"A direção pede palestra motivacional porque o turnover aumentou. Qual primeiro passo?","opts":["Preparar a palestra.","Diagnosticar fatores associados ao turnover usando evidências.","Trocar a equipe.","Aplicar teste de personalidade em todos.","Aumentar metas."],"ans":1,"why":"A intervenção não deve ser escolhida antes de compreender o problema."}}],"case":{"prompt":"Uma empresa relata queda de produtividade e pede treinamento de comprometimento. Indicadores mostram aumento de horas extras e trocas frequentes de supervisor. Estruture o raciocínio diagnóstico.","criteria":["demanda ≠ diagnóstico","indicadores","hipóteses sistêmicas","intervenção posterior"],"expected":"O pedido de treinamento não comprova falta de comprometimento. Horas extras e mudanças de supervisão são evidências que exigem investigação. Devem ser ouvidos trabalhadores e gestores, analisados processos e condições e formuladas hipóteses antes de definir intervenção."}},{"title":"Pessoa + Trabalho + Organização","steps":[{"title":"Pessoa","sub":"Quem trabalha","body":"História, recursos, necessidades, competências e formas de interpretar a experiência.","check":null},{"title":"Trabalho","sub":"O que e como se faz","body":"Tarefa, exigências, autonomia, recursos, ritmo, responsabilidades e condições concretas.","check":null},{"title":"Organização","sub":"O sistema que estrutura o trabalho","body":"Cultura, liderança, processos, políticas, comunicação e relações.","check":null},{"title":"A tríade","sub":"Nenhum eixo explica sozinho","body":"A leitura sistêmica pergunta como Pessoa + Trabalho + Organização se relacionam para produzir determinada situação.","check":null},{"title":"Da observação à hipótese","sub":"Não confunda dado com explicação","body":"“Produtividade caiu” é um dado. “As pessoas não querem trabalhar” é uma hipótese que precisa ser testada.","check":{"q":"Qual alternativa é uma hipótese e não uma observação?","opts":["O turnover subiu de 5% para 12%.","Houve 18 faltas no mês.","Os funcionários não produzem porque são descomprometidos.","Três supervisores saíram.","O setor acumulou horas extras."],"ans":2,"why":"A frase atribui uma causa psicológica sem evidência suficiente."}}],"case":{"prompt":"Um setor reduz entregas após mudança de sistema e saída de dois supervisores. A direção culpa os trabalhadores. Use Pessoa + Trabalho + Organização para construir hipóteses alternativas.","criteria":["pessoa","trabalho","organização","hipóteses não conclusivas"],"expected":"A dimensão pessoa pode investigar aprendizagem e adaptação; trabalho, mudanças de tarefa, recursos e carga; organização, transição de liderança, comunicação e suporte. Essas são hipóteses a testar, não causas presumidas."}},{"title":"Integração, treinamento e comunicação","steps":[{"title":"Contratar é o começo","sub":"Entrada precisa ser sustentada","body":"Seleção adequada não garante desempenho se a pessoa entra sem clareza, integração e recursos.","check":null},{"title":"Onboarding","sub":"Conhecer o contexto","body":"Integração apresenta organização, função, regras, equipe, processos e expectativas, reduzindo ambiguidade.","check":null},{"title":"Treinamento","sub":"Desenvolver para a tarefa real","body":"Treinamento precisa responder a necessidades identificadas, não funcionar como punição ou atividade genérica.","check":null},{"title":"Acompanhamento","sub":"Desempenho se desenvolve","body":"Integrar → orientar → treinar → acompanhar → avaliar → feedback.","check":null},{"title":"Comunicação","sub":"Mensagem enviada ≠ mensagem compreendida","body":"Comunicar envolve verificar compreensão, contexto e possibilidade de resposta.","check":{"q":"Uma empresa contrata rapidamente 120 pessoas sem integração nem descrição de cargos. Qual risco é mais coerente?","opts":["Somente falta de motivação.","Ambiguidade de papéis, falhas de aprendizagem e desempenho inconsistente.","Excesso de autonomia apenas.","Nenhum, se a seleção foi boa.","Somente conflito geracional."],"ans":1,"why":"Seleção não substitui integração, clareza e acompanhamento."}}],"case":{"prompt":"Após expansão acelerada, novos empregados recebem instruções diferentes de cada supervisor e são avaliados sem critérios claros. Proponha uma sequência de intervenção.","criteria":["integração","clareza de função","treinamento","avaliação/feedback"],"expected":"A intervenção pode estruturar onboarding, descrições e expectativas de função, treinamento técnico e comportamental conforme necessidade, alinhamento dos supervisores e avaliação com critérios claros, seguida de feedback e acompanhamento."}},{"title":"Ética, sigilo e autonomia técnica","steps":[{"title":"Para quem o psicólogo trabalha?","sub":"Contrato não elimina ética","body":"Mesmo contratado pela empresa, o psicólogo não é defensor irrestrito dos interesses da organização. Deve conciliar demandas institucionais com dignidade, direitos e princípios profissionais.","check":null},{"title":"Autonomia técnica","sub":"Método não é imposto pela chefia","body":"Escolhas técnicas, conclusões e encaminhamentos devem ser fundamentados profissionalmente.","check":null},{"title":"Sigilo","sub":"Compartilhar o necessário","body":"Informações íntimas, saúde mental, conflitos e resultados de avaliações não pertencem livremente à gestão. Compartilha-se apenas o pertinente e necessário à finalidade.","check":null},{"title":"Consentimento","sub":"Assinar não basta","body":"A pessoa precisa compreender finalidade, uso e limites das informações.","check":null},{"title":"Anonimato","sub":"Sem nome pode ainda identificar","body":"Em equipes pequenas, cargo, turno ou relato específico podem permitir reconhecimento. Proteção exige pensar no contexto.","check":null},{"title":"Documentos","sub":"Rigor e finalidade","body":"Relatórios, laudos, pareceres e registros precisam de linguagem técnica, pertinência e proteção.","check":null},{"title":"Pesquisa de clima","sub":"Escuta precisa de confiança","body":"Se anonimato foi prometido, entregar nomes de críticos à gestão viola a própria condição de participação.","check":{"q":"O diretor pede detalhes íntimos de uma avaliação para decidir demissões. Qual conduta é mais adequada?","opts":["Entregar tudo porque a empresa pagou.","Compartilhar somente informações pertinentes, necessárias e tecnicamente justificadas à finalidade.","Apagar todos os registros.","Contar informalmente sem documento.","Pedir aos colegas para decidir."],"ans":1,"why":"O vínculo com a organização não elimina sigilo, finalidade e autonomia técnica."}}],"case":{"prompt":"Uma pesquisa de clima prometeu anonimato. O diretor exige a lista de quem criticou sua liderança e ameaça cancelar o projeto. Como o psicólogo deve responder?","criteria":["anonimato","autonomia técnica","finalidade","dados coletivos/devolutiva"],"expected":"O psicólogo deve preservar o compromisso de anonimato e sua autonomia técnica. A devolutiva deve apresentar resultados pertinentes, preferencialmente agregados, sem expor participantes. A pressão da direção não justifica violar a finalidade e as condições informadas aos respondentes."}},{"title":"Grupos, equipes, papéis e conflitos","steps":[{"title":"Grupo não é apenas reunião de pessoas","sub":"Há processos sociais","body":"Normas, papéis, pertencimento, influência e comunicação surgem na vida coletiva.","check":null},{"title":"Papéis","sub":"Quem faz o quê?","body":"Clareza de papéis reduz ambiguidade; papéis informais também podem surgir e influenciar o funcionamento.","check":null},{"title":"Normas","sub":"Regras explícitas e implícitas","body":"Equipes desenvolvem expectativas sobre o que é aceito, valorizado ou punido.","check":null},{"title":"Coesão","sub":"Vínculo não é sempre positivo","body":"Coesão pode favorecer pertencimento, mas também pode sustentar silêncio ou conformidade quando discordar passa a ser malvisto.","check":null},{"title":"Conflito","sub":"Discordar não é fracassar","body":"Conflitos podem gerar aprendizagem quando tratados com respeito e foco na tarefa.","check":null},{"title":"Interdependência","sub":"Equipe precisa coordenar contribuições","body":"Quando resultados dependem de várias pessoas, comunicação e responsabilidade compartilhada tornam-se centrais.","check":{"q":"Uma equipe evita qualquer discordância para preservar 'harmonia'. Qual afirmação é mais adequada?","opts":["É necessariamente uma equipe madura.","Ausência de conflito não garante qualidade; discordância respeitosa pode melhorar decisões.","Coesão elimina riscos.","O líder deve proibir opiniões divergentes.","Conflito sempre reduz desempenho."],"ans":1,"why":"Conflito de tarefa pode ser produtivo quando manejado adequadamente."}}],"case":{"prompt":"Em uma equipe coesa, ninguém questiona decisões de um membro antigo, embora erros se repitam. Analise papéis, normas e coesão e proponha uma intervenção.","criteria":["papel informal","norma de silêncio","coesão não automaticamente positiva","comunicação/intervenção"],"expected":"Pode existir liderança informal e norma implícita de não questionamento. A coesão, nesse caso, pode proteger conformidade em vez de aprendizagem. A intervenção deve tornar papéis e critérios mais claros e criar formas seguras de discutir tarefas e erros."}},{"title":"Equipes autogerenciáveis, loafing social e groupthink","steps":[{"title":"Autogestão","sub":"Autonomia com responsabilidade","body":"Equipes autogerenciáveis assumem maior participação e responsabilidade coletiva. Isso exige competência, clareza e acompanhamento.","check":null},{"title":"Condições","sub":"O que sustenta autonomia","body":"Objetivos claros, papéis, confiança, comunicação, decisão, feedback e monitoramento.","check":null},{"title":"Loafing social","sub":"Quando o esforço individual diminui","body":"A pessoa reduz esforço porque acredita que os outros completarão a tarefa, especialmente quando contribuição individual fica pouco visível.","check":null},{"title":"Groupthink","sub":"Quando consenso vira armadilha","body":"O grupo evita discordar, suprime dúvidas e deixa de analisar alternativas para preservar unanimidade.","check":null},{"title":"Liderança informal","sub":"Influência aparece mesmo sem cargo","body":"Autogestão não elimina influência; por isso, dinâmicas de poder e participação precisam ser observadas.","check":null},{"title":"Não
