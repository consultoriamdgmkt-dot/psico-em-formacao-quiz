</main><script>
const D={"César": {"sub": "Motivação, Liderança e Comportamento Organizacional", "topics": {"1. Liderança e poder nas organizações": [["Um coordenador recém-promovido afirma que, por ocupar formalmente o cargo de chefia, automaticamente se tornou um líder eficaz. Qual análise é mais adequada?", ["O cargo garante liderança sempre que existe autoridade formal.", "Poder e liderança são nomes diferentes para o mesmo fenômeno.", "A liderança independe das relações estabelecidas no trabalho.", "O cargo pode conferir poder, mas liderança depende do processo de influência nas relações."], 3, "O material distingue poder de liderança: o cargo pode conferir poder, mas liderança é construída na interação com liderados e contexto."], ["Uma diretora possui autoridade para realocar recursos, mas não utiliza essa capacidade durante uma reunião. O conceito que melhor descreve essa capacidade disponível é:", ["Poder.", "Liderança.", "Engajamento.", "Coesão."], 0, "Poder é capacidade ou potencial de influenciar pessoas e controlar recursos, podendo existir sem ser exercido."], ["Uma equipe cumpre uma ordem porque o gerente controla recursos e pode determinar procedimentos, embora os integrantes não estejam comprometidos com a proposta. O caso evidencia principalmente:", ["Liderança, porque houve engajamento voluntário.", "Poder, porque houve capacidade de produzir obediência.", "Liderança transformacional, porque houve aceitação.", "Coesão, porque o grupo cumpriu a ordem."], 1, "O poder pode produzir obediência ou concordância; liderança busca aceitação, comprometimento e participação."], ["Uma profissional sem cargo formal mobiliza colegas em torno de um objetivo compartilhado, e eles aderem voluntariamente às ações propostas. O fenômeno descrito é principalmente:", ["Autoridade formal.", "Liderança.", "Poder coercitivo.", "Hierarquia."], 1, "Liderança é um processo de influência interpessoal orientado a objetivos compartilhados e engajamento voluntário."], ["Um gestor diz que nasceu líder e que sua liderança independe da equipe e da situação. Qual ideia do material contradiz essa afirmação?", ["Liderança é exclusivamente uma característica individual.", "Liderança é psicossocial, relacional e dinâmica.", "Liderança é equivalente à autoridade do cargo.", "Liderança existe apenas quando há punição."], 1, "A liderança é construída na interação entre líder, liderados e contexto; portanto, é psicossocial, relacional e dinâmica."], ["Duas pessoas ocupam cargos equivalentes. Uma consegue apenas obediência formal; a outra obtém participação e compromisso com objetivos comuns. Qual interpretação é mais precisa?", ["Ambas demonstram necessariamente a mesma liderança.", "A primeira não possui poder porque ocupa cargo formal.", "A segunda evidencia mais claramente liderança pelo engajamento e compromisso.", "A segunda não exerce influência porque não depende de obediência."], 2, "Engajamento, aceitação e compromisso com objetivos compartilhados caracterizam mais diretamente o processo de liderança."], ["Uma pessoa tem capacidade de influenciar decisões porque controla recursos importantes, mas ninguém precisa aderir voluntariamente aos seus objetivos. Essa descrição corresponde mais diretamente a:", ["Poder.", "Liderança.", "Satisfação.", "Aprendizagem em equipe."], 0, "A definição de poder enfatiza capacidade ou potencial de influência e controle de recursos, sem exigir engajamento voluntário."], ["Em uma organização, um chefe consegue que todos cumpram suas determinações. Qual informação adicional seria necessária para afirmar que há liderança, e não apenas exercício de poder?", ["Se o chefe possui uma sala própria.", "Se existe aceitação, participação e orientação para objetivos compartilhados.", "Se o cargo aparece no organograma.", "Se a empresa possui muitos funcionários."], 1, "A liderança envolve influência interpessoal, objetivos compartilhados e engajamento, não apenas conformidade."], ["Por que o material afirma que poder e liderança não são sinônimos?", ["Porque poder só existe fora das organizações.", "Porque liderança é cargo e poder é comportamento.", "Porque poder é capacidade de influência, enquanto liderança é um processo relacional orientado a objetivos compartilhados.", "Porque liderança não envolve influência."], 2, "Poder designa capacidade/potencial; liderança designa processo de influência interpessoal construído nas relações."], ["Um supervisor muda de equipe e percebe que estratégias que antes geravam participação já não produzem o mesmo efeito. Qual característica da liderança ajuda a compreender a situação?", ["Seu caráter fixo e independente do contexto.", "Seu caráter relacional e dinâmico.", "Sua equivalência com poder formal.", "Sua independência dos liderados."], 1, "A liderança varia conforme a interação entre líder, liderados e contexto, por isso é relacional e dinâmica."]], "2. As 7 bases de poder": [["A autoridade de uma gerente é aceita porque seu cargo lhe confere formalmente poder de decisão. Qual base está presente?", ["Legítimo.", "Especialista.", "Referência.", "Conexão."], 0, "Poder legítimo deriva do cargo e da hierarquia."], ["Um supervisor ameaça aplicar sanções caso a equipe não cumpra determinada ordem. Qual base predomina?", ["Recompensa.", "Coerção.", "Informação.", "Referência."], 1, "Coerção utiliza medo, punição ou consequências negativas."], ["Uma empresa oferece bônus para estimular determinado comportamento. Qual base de poder é utilizada?", ["Recompensa.", "Legítimo.", "Especialista.", "Conexão."], 0, "Poder de recompensa deriva da possibilidade de oferecer benefícios ou incentivos."], ["Colegas seguem a orientação de uma analista porque reconhecem seu profundo domínio técnico. Qual base aparece?", ["Referência.", "Especialista.", "Legítimo.", "Coerção."], 1, "Poder de especialista deriva de conhecimento, competência e domínio técnico."], ["Uma profissional influencia colegas porque é admirada e serve como modelo de identificação. Qual base predomina?", ["Informação.", "Referência.", "Recompensa.", "Legítimo."], 1, "Poder de referência surge de identificação, carisma e admiração."], ["Um funcionário influencia decisões porque possui acesso a dados relevantes que os demais não possuem. Qual base é descrita?", ["Informação.", "Conexão.", "Especialista.", "Coerção."], 0, "Poder de informação deriva da posse ou do acesso a informações relevantes."], ["Uma gestora amplia sua influência por meio de contatos, redes e alianças estratégicas. Qual base está presente?", ["Referência.", "Conexão.", "Legítimo.", "Recompensa."], 1, "Poder de conexão deriva de relações, contatos e alianças."], ["No esquema do professor, legítimo, coerção e recompensa formam qual categoria?", ["Pessoal.", "Relacional.", "Posicional.", "Informal."], 2, "A categoria posicional reúne legítimo, coerção e recompensa."], ["No esquema do professor, especialista e referência pertencem a qual categoria?", ["Pessoal.", "Relacional.", "Posicional.", "Coercitiva."], 0, "Poder pessoal reúne especialista e referência."], ["No esquema do professor, informação e conexão pertencem a qual categoria?", ["Pessoal.", "Posicional.", "Relacional.", "Legítima."], 2, "Poder relacional reúne informação e conexão."]], "3. Teorias e estilos de liderança": [["O líder concentra decisões e mantém alto controle, com pouca participação do grupo. Qual estilo clássico?", ["Democrático.", "Autocrático.", "Liberal.", "Transformacional."], 1, "Autocrática é marcada por centralização e controle."], ["O grupo participa das decisões e o líder atua como mediador e facilitador. Qual estilo?", ["Democrático.", "Autocrático.", "Laissez-faire.", "Transacional."], 0, "Democrática enfatiza participação."], ["O grupo recebe ampla liberdade e o líder intervém pouco. Qual estilo?", ["Autocrático.", "Democrático.", "Liberal/Laissez-faire.", "Situacional S1."], 2, "Laissez-faire envolve grande liberdade e pouca intervenção."], ["Na liderança situacional, S1 - Direcionar corresponde a:", ["Alta tarefa e baixo relacionamento.", "Alta tarefa e alto relacionamento.", "Baixa tarefa e alto relacionamento.", "Baixa tarefa e baixo relacionamento."], 0, "S1 é alta tarefa e baixo relacionamento."], ["Na liderança situacional, S2 - Orientar/Persuadir corresponde a:", ["Baixa tarefa e baixo relacionamento.", "Alta tarefa e alto relacionamento.", "Baixa tarefa e alto relacionamento.", "Alta tarefa e baixo relacionamento."], 1, "S2 combina alta tarefa e alto relacionamento."], ["Na liderança situacional, S3 - Apoiar corresponde a:", ["Alta tarefa e baixo relacionamento.", "Alta tarefa e alto relacionamento.", "Baixa tarefa e alto relacionamento.", "Baixa tarefa e baixo relacionamento."], 2, "S3 combina baixa tarefa e alto relacionamento."], ["Na liderança situacional, S4 - Delegar corresponde a:", ["Alta tarefa e baixo relacionamento.", "Alta tarefa e alto relacionamento.", "Baixa tarefa e alto relacionamento.", "Baixa tarefa e baixo relacionamento."], 3, "S4 combina baixa tarefa e baixo relacionamento."], ["Quanto mais preparado e autônomo o liderado, qual movimento é compatível com o modelo situacional estudado?", ["Aumentar necessariamente a coerção.", "Ampliar a delegação.", "Eliminar toda autonomia.", "Centralizar todas as decisões."], 1, "Maior preparo e autonomia permitem maior delegação."], ["Uma liderança opera pela lógica meta cumprida → recompensa; desempenho inadequado → cobrança. Qual tipo?", ["Transformacional.", "Transacional.", "Democrática.", "Liberal."], 1, "Transacional se baseia em troca."], ["Uma líder inspira, motiva e desenvolve os liderados, estimulando novas formas de pensar. Qual tipo?", ["Transacional.", "Transformacional.", "Autocrática.", "Coercitiva."], 1, "Transformacional envolve inspiração, desenvolvimento e estimulação intelectual."]], "4. Características, comportamentos e competências do líder": [["Aspectos individuais que podem contribuir para a atuação do líder são chamados de:", ["Características.", "Comportamentos.", "Competências.", "Autoridade."], 0, "Características são aspectos individuais."], ["Aquilo que o líder efetivamente faz na interação com a equipe corresponde a:", ["Características.", "Comportamentos.", "Cargo.", "Poder relacional."], 1, "Comportamentos são ações efetivamente realizadas."], ["Conhecimentos e capacidades utilizados para orientar pessoas e tarefas correspondem a:", ["Competências.", "Características.", "Autoridade.", "Coerção."], 0, "Competências são conhecimentos e capacidades aplicados."], ["A influência associada à posição ou ao cargo corresponde a:", ["Autoridade.", "Competência.", "Comportamento.", "Co-construção."], 0, "Autoridade está ligada à posição/cargo, mas não é sinônimo de liderança."], ["Um profissional possui cargo formal, mas não consegue mobilizar a equipe. Qual conclusão é adequada?", ["Autoridade garante liderança.", "Autoridade e liderança não são sinônimos.", "Liderança dispensa relações.", "Competência é sempre irrelevante."], 1, "A posição formal não garante liderança."], ["Um gestor adapta sua forma de agir conforme pessoas, tarefa e contexto. Isso expressa qual ideia-chave?", ["Líder eficaz mantém comportamento fixo.", "Líder eficaz adapta sua atuação.", "Cargo substitui competência.", "Características anulam contexto."], 1, "O material enfatiza adaptação às pessoas, tarefa e contexto."], ["Um líder tem conhecimento técnico, mas sua interação cotidiana é hostil. A distinção relevante é entre:", ["Competência e comportamento.", "Poder e grupo.", "Micro e macro.", "Satisfação e compromisso."], 0, "Competência diz respeito a capacidades; comportamento ao que efetivamente faz."], ["Dizer que alguém é comunicativo descreve mais diretamente um aspecto individual; observar que ele solicita feedback descreve:", ["Duas autoridades formais.", "Característica e comportamento, respectivamente.", "Dois poderes relacionais.", "Duas competências necessariamente."], 1, "O primeiro é traço/aspecto; o segundo é ação observável."], ["Por que autoridade não deve ser usada como sinônimo de liderança?", ["Porque autoridade nunca existe em cargos.", "Porque autoridade decorre da posição, enquanto liderança envolve influência construída nas relações.", "Porque liderança não influencia pessoas.", "Porque autoridade exige engajamento voluntário."], 1, "Autoridade está vinculada ao cargo; liderança é processo relacional."], ["Na análise do líder, considerar características, comportamentos e competências evita:", ["Analisar apenas um único aspecto da atuação.", "Considerar o contexto.", "Observar ações concretas.", "Distinguir cargo de liderança."], 0, "O material propõe olhar articulado, não redução a um único traço."]], "5. Ecossistema da liderança - EU, ELES e NÓS": [["Na lente EU, o foco recai principalmente sobre:", ["Liderados.", "Líder individual.", "Organização inteira.", "Mercado."], 1, "EU focaliza líder, características, comportamentos, competências e autoridade."], ["Na lente ELES, o foco recai sobre:", ["Liderados e sua participação na construção da liderança.", "Apenas o cargo do líder.", "Somente regras formais.", "Clientes."], 0, "ELES focaliza os liderados."], ["Na lente NÓS, o foco principal é:", ["Somente personalidade.", "Construção coletiva e liderança compartilhada.", "Punição.", "Hierarquia formal."], 1, "NÓS focaliza o coletivo."], ["O ecossistema da liderança propõe compreender liderança como:", ["Fenômeno isolado.", "Fenômeno integrado entre diferentes elementos.", "Sinônimo de cargo.", "Atributo exclusivamente inato."], 1, "O ecossistema articula motivação, poder, líder, liderados e dinâmica coletiva."], ["Perguntar 'o que move essa pessoa?' focaliza qual elemento do ecossistema?", ["Motivação.", "Base de poder.", "Estilo.", "Dinâmica coletiva."], 0, "Motivação focaliza energia, direção e sentido da ação."], ["Perguntar 'por que os outros atendem à sua influência?' focaliza:", ["Base de poder.", "Satisfação.", "Macro.", "Coesão."], 0, "A pergunta busca a fonte do poder."], ["Perguntar 'como o poder e a decisão são exercidos?' focaliza:", ["Estilo de liderança.", "Motivação.", "Nível macro.", "Contrato psicológico."], 0, "Estilo diz respeito à forma de condução."], ["Perguntar 'o que essa liderança produz no grupo?' focaliza:", ["Dinâmica coletiva.", "Somente características.", "Poder legítimo.", "Contrato transacional."], 0, "A dinâmica coletiva observa integração, autonomia e compromisso."], ["Uma análise que considera apenas personalidade do chefe ignora principalmente:", ["A interação entre líder, liderados e coletivo.", "A existência de características individuais.", "A possibilidade de cargo formal.", "O nível micro."], 0, "O ecossistema evita reduzir liderança ao indivíduo."], ["Qual síntese corresponde às três lentes?", ["EU=líder; ELES=liderados; NÓS=coletivo.", "EU=grupo; ELES=cargo; NÓS=punição.", "EU=macro; ELES=micro; NÓS=meso.", "EU=motivação; ELES=coerção; NÓS=recompensa."], 0, "Essa é a síntese usada no material."]], "6. Grupos, equipes e aprendizagem": [["Um conjunto de pessoas atua no mesmo contexto, mas com baixa interdependência. Isso se aproxima mais de:", ["Grupo.", "Equipe.", "Co-construção.", "Time integrado."], 0, "Grupo pode ter menor interdependência."], ["Quando há coordenação, funções articuladas, objetivo comum e tarefas interdependentes, há principalmente:", ["Equipe.", "Grupo sem integração.", "Contrato transacional.", "Poder legítimo."], 0, "Equipe envolve coordenação e interdependência."], ["Aprendizagem em equipe ocorre principalmente por:", ["Perguntas, feedback, experimentação, reflexão e compartilhamento.", "Obediência sem discussão.", "Isolamento de conhecimentos.", "Ausência de erros."], 0, "Aprendizagem coletiva envolve compartilhamento e reflexão."], ["Construção, no material, corresponde a:", ["Dar sentido e entender.", "Punir erro.", "Controlar recursos.", "Delegar cargo."], 0, "Construção é processo de produzir entendimento."], ["Co-construção corresponde a:", ["Aprimorar conjuntamente uma compreensão ou ideia.", "Trabalhar isoladamente.", "Eliminar discordâncias.", "Centralizar decisões."], 0, "Co-construção é elaboração conjunta."], ["Conflito construtivo significa:", ["Discussão respeitosa de opiniões diferentes.", "Ataque pessoal.", "Ausência de divergência.", "Punição formal."], 0, "Discordar de modo respeitoso pode apoiar aprendizagem."], ["Qual palavra-chave resume aprendizagem em equipe no material?", ["Compartilhamento.", "Coerção.", "Hierarquia.", "Isolamento."], 0, "O resumo destaca compartilhamento."], ["Uma equipe discute um erro para entender consequências e melhorar a prática. Isso exemplifica:", ["Aprendizagem em equipe.", "Poder coercitivo.", "Contrato transacional.", "Laissez-faire."], 0, "Discussão de erros e reflexão fazem parte da aprendizagem coletiva."], ["Qual afirmação diferencia grupo e equipe?", ["Equipe apresenta maior coordenação e interdependência.", "Grupo sempre possui mais integração.", "Equipe dispensa objetivo comum.", "Grupo exige tarefas interdependentes."], 0, "A equipe possui maior articulação entre tarefas e responsabilidades."], ["Compartilhar informações e responsabilidades favorece:", ["Funcionamento e aprendizagem da equipe.", "Eliminação da interdependência.", "Poder coercitivo.", "Redução necessária da autonomia."], 0, "Trocas e compartilhamento integram o funcionamento coletivo."]], "7. Níveis de análise - micro, meso e macro": [["Uma análise focaliza motivação de um trabalhador específico. Qual nível?", ["Micro.", "Meso.", "Macro.", "Relacional."], 0, "Micro é o nível individual."], ["Uma análise focaliza aprendizagem de uma equipe. Qual nível?", ["Micro.", "Meso.", "Macro.", "Externo."], 1, "Meso é o nível de grupo/equipe."], ["Uma análise focaliza políticas e cultura da organização. Qual nível?", ["Micro.", "Meso.", "Macro.", "Individual."], 2, "Macro focaliza organização e contexto mais amplo."], ["O estudo de aprendizagem das equipes trabalha principalmente em qual nível?", ["Micro.", "Meso.", "Macro.", "Clínico."], 1, "O material localiza aprendizagem de equipes principalmente no nível meso."], ["Satisfação de uma pessoa, tomada isoladamente, pertence mais diretamente ao nível:", ["Micro.", "Meso.", "Macro.", "Institucional."], 0, "Experiência individual é nível micro."], ["Padrões de interação entre integrantes de um grupo pertencem principalmente ao nível:", ["Micro.", "Meso.", "Macro.", "Legal."], 1, "Interações grupais são analisadas no meso."], ["Estrutura organizacional e políticas corporativas pertencem principalmente ao nível:", ["Micro.", "Meso.", "Macro.", "Pessoal."], 2, "São fenômenos organizacionais/contextuais."], ["Qual associação está correta?", ["Micro=indivíduo; meso=equipe/grupo; macro=organização/contexto.", "Micro=organização; meso=indivíduo; macro=equipe.", "Micro=equipe; meso=contexto; macro=indivíduo.", "Micro=cargo; meso=poder; macro=liderança."], 0, "Essa é a classificação utilizada."], ["Uma pesquisa que combina atitudes individuais e processos de equipe está articulando principalmente:", ["Micro e meso.", "Meso e macro apenas.", "Macro apenas.", "Micro e macro sem meso."], 0, "Atitudes individuais são micro; processos de equipe são meso."], ["Por que distinguir níveis de análise?", ["Para localizar onde o fenômeno está sendo observado e evitar confundir indivíduo, grupo e organização.", "Para afirmar que só o nível micro importa.", "Para eliminar relações entre níveis.", "Para transformar liderança em cargo."], 0, "A distinção organiza o foco analítico."]], "8. Relações no trabalho": [["Um vínculo baseado em trocas materiais, obrigações econômicas e prazos caracteriza contrato psicológico:", ["Transacional.", "Relacional.", "Transformacional.", "Referencial."], 0, "O contrato transacional enfatiza trocas econômicas e baixo envolvimento emocional."], ["Lealdade, suporte psicossocial, desenvolvimento e estabilidade percebida caracterizam contrato:", ["Transacional.", "Relacional.", "Coercitivo.", "Posicional."], 1, "O contrato relacional envolve vínculo de longo prazo e s
