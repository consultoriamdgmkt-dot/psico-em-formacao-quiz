ia considera conjuntamente os diferentes componentes."], "memory": "Se uma das dimensões for anulada, a motivação prevista pela teoria também é anulada."}, {"title": "A virada para a Teoria da Autodeterminação", "paras": ["Depois da discussão sobre Vroom, o professor apresenta uma mudança importante no percurso das teorias.", "Na Teoria da Autodeterminação, a análise passa a enfatizar um movimento que ocorre de dentro para fora.", "A motivação é apresentada como um continuum que pode avançar de condições de ausência de motivação e regulações externas até formas mais internas de regulação e motivação intrínseca.", "O indivíduo vai incorporando determinadas razões, ampliando sua percepção e construindo internamente o movimento para agir.", "Essa passagem representa, na leitura construída pelo professor, uma importante mudança em relação às teorias mais centradas nos estímulos externos."], "memory": "Depois da discussão sobre Vroom, o professor apresenta uma mudança importante no percurso das teorias."}, {"title": "Autonomia, competência e pertencimento", "paras": ["Na Teoria da Autodeterminação, o professor destaca três elementos:", "Autonomia", "Possibilidade de agir com maior autodeterminação e participar das próprias escolhas.", "Competência", "Percepção e desenvolvimento da capacidade necessária para realizar determinada atividade.", "Pertencimento", "Construção de relações saudáveis e sentimento de integração.", "A organização e a liderança podem criar condições favoráveis a esses elementos, mas a motivação não é simplesmente “colocada” de fora para dentro.", "O movimento motivacional é construído pelo próprio indivíduo."], "memory": "Possibilidade de agir com maior autodeterminação e participar das próprias escolhas."}, {"title": "Promoção não significa competência para liderar", "paras": ["Um exemplo organizacional para demonstrar um erro comum.", "Um funcionário pode apresentar excelente desempenho operacional durante muitos anos e, por isso, ser promovido para liderar uma equipe.", "Entretanto:", "Ser competente tecnicamente não significa possuir automaticamente competência para liderar pessoas.", "Se a promoção ocorre apenas porque a pessoa é excelente em sua função atual, sem considerar as competências necessárias à nova função, ela pode apresentar dificuldades e posteriormente ser responsabilizada pelo fracasso.", "Esse exemplo reforça novamente a necessidade de uma visão sistêmica sobre comportamento, motivação, competência e contexto organizacional.", "Mapa de evolução trabalhado na aula", "Elton Mayo", "Fatores psicológicos e sociais → grupos e ambiente.", "Maslow", "Hierarquia das necessidades.", "Herzberg", "Fatores higiênicos × fatores motivacionais.", "Skinner", "Estímulo → resposta → consequências.", "Bandura", "Modelagem + autoeficácia.", "Vroom", "Expectativa × Instrumentalidade × Valência.", "Teoria da Autodeterminação", "Movimento de dentro para fora → autonomia + competência + pertencimento → aproximação da motivação intrínseca.", "O eixo utilizado pelo professor para integrar essas teorias é observar a passagem de explicações mais centradas em condições e estímulos externos para abordagens que atribuem maior importância à construção interna da motivação."], "memory": "Um exemplo organizacional para demonstrar um erro comum."}], "case": "Marina apresenta excelente desempenho técnico e, por isso, recebe uma proposta para liderar sua equipe. Antes de aceitar, compara a nova função com sua situação atual, questiona se possui as competências necessárias e avalia se o aumento salarial, a aprendizagem e a experiência profissional compensam as novas responsabilidades. Ao mesmo tempo, a organização considera que seu bom desempenho técnico é suficiente para garantir sucesso como líder. Pela visão sistêmica trabalhada em aula, a situação envolve tanto o cálculo apresentado por Vroom quanto a necessidade de distinguir competência técnica das competências exigidas pela nova função."}, "8": {"title": "Liderança, Poder e Bases de Poder", "blocks": [{"title": "Liderança nas organizações e na vida social", "paras": ["A liderança não deve ser compreendida apenas como um cargo, função, crachá ou posição formal dentro de uma empresa. Ela aparece em diferentes contextos sociais e organizacionais e está relacionada à capacidade de influenciar outras pessoas.", "Uma organização pode possuir líderes no nível:", "- operacional;", "- tático;", "- estratégico.", "Portanto, liderança não está restrita ao nível gerencial. É possível encontrar pessoas exercendo influência em diferentes posições da estrutura.", "O professor chama atenção para outro cuidado: ao estudar liderança, não se deve fazer imediatamente um juízo de valor.", "Liderança não deve ser automaticamente entendida como positiva ou negativa.", "É necessário observar como a influência é exercida, quais recursos de poder são utilizados, qual é o contexto e quais resultados são buscados."], "memory": "Portanto, liderança não está restrita ao nível gerencial. É possível encontrar pessoas exercendo influência em diferentes posições da estrutura."}, {"title": "Poder", "paras": ["O poder está relacionado à capacidade ou potencial de afetar o comportamento de outra pessoa, utilizando recursos formais, pessoais ou estruturais.", "A palavra-chave destacada na aula é:", "Poder → afetar o comportamento.", "A pessoa que possui poder apresenta potencial para influenciar o comportamento de outra, inclusive diante de resistência.", "Por isso, o poder não precisa necessariamente produzir engajamento voluntário. Uma pessoa pode obedecer porque existe autoridade formal, possibilidade de punição, recompensa ou algum outro recurso controlado por quem exerce o poder."], "memory": "O poder está relacionado à capacidade ou potencial de afetar o comportamento de outra pessoa, utilizando recursos formais, pessoais ou estruturais."}, {"title": "Liderança", "paras": ["A liderança é apresentada como um processo de influência interpessoal orientado para objetivos compartilhados e engajamento voluntário.", "Três elementos foram destacados:", "Influência interpessoal", "O líder influencia outras pessoas e seus comportamentos.", "Objetivos compartilhados", "O objetivo não pertence somente ao líder. As pessoas envolvidas reconhecem aquele objetivo como algo compartilhado pelo grupo.", "Engajamento voluntário", "A pessoa deseja participar, contribuir e caminhar com o grupo.", "Esse elemento diferencia a liderança da simples imposição:", "“Eu quero fazer parte. Eu quero caminhar com o grupo. Eu quero estar nesse time.”"], "memory": "A liderança é apresentada como um processo de influência interpessoal orientado para objetivos compartilhados e engajamento voluntário."}, {"title": "Poder × Liderança", "paras": ["Embora poder e liderança estejam relacionados, eles não são sinônimos.", "Poder", "Está relacionado ao potencial ou capacidade de afetar o comportamento de outra pessoa.", "Liderança", "Envolve influência interpessoal, objetivos compartilhados e engajamento voluntário.", "Assim, alguém pode possuir poder em razão de uma posição formal sem necessariamente conseguir produzir o engajamento característico da liderança.", "Da mesma forma, a análise da liderança precisa considerar qual tipo de poder está sendo utilizado e como esse poder afeta os liderados."], "memory": "Embora poder e liderança estejam relacionados, eles não são sinônimos."}, {"title": "Competência técnica não garante competência para liderar", "paras": ["Um exemplo discutido novamente em sala é o funcionário que apresenta excelente desempenho técnico e, por isso, recebe uma promoção para gerenciar uma equipe.", "Depois de alguns meses, apresenta dificuldades para conduzir pessoas e acaba sendo desligado.", "O problema está em presumir que:", "Bom desempenho técnico = capacidade para liderar.", "Uma pessoa pode produzir excelentes resultados individualmente e não possuir, naquele momento, as competências necessárias para exercer uma função de liderança.", "Esse exemplo reforça a necessidade de analisar liderança, poder, motivação, competências e contexto de maneira integrada.", "Os três tipos de poder", "As bases de poder em três grandes categorias:"], "memory": "Um exemplo discutido novamente em sala é o funcionário que apresenta excelente desempenho técnico e, por isso, recebe uma promoção para gerenciar uma equipe."}, {"title": "Poder Posicional", "paras": ["Está relacionado à estrutura, hierarquia e autoridade formal.", "Palavras-chave:", "Posição → estrutura → hierarquia → autoridade.", "Dentro do poder posicional estão:", "- poder legítimo;", "- poder de coerção;", "- poder de recompensa."], "memory": "Está relacionado à estrutura, hierarquia e autoridade formal."}, {"title": "Poder Pessoal", "paras": ["Origina-se principalmente das qualidades individuais da pessoa, como conhecimento, habilidade, competência, admiração e capacidade de tornar-se referência para os demais.", "Dentro do poder pessoal estão:", "- poder de referência;", "- poder de especialista.", "A aula destaca que essas bases tendem a produzir resultados mais prolongados, associados a confiança, comprometimento e engajamento."], "memory": "Origina-se principalmente das qualidades individuais da pessoa, como conhecimento, habilidade, competência, admiração e capacidade de tornar-se referência para os demais."}, {"title": "Poder Relacional", "paras": ["Está relacionado às relações, conexões e estratégias utilizadas para manter redes interpessoais.", "Dentro do poder relacional estão:", "- poder de informação;", "- poder de conexão.", "A palavra-chave destacada para compreender essa categoria é:", "Relações/conexões.", "As sete bases de poder"], "memory": "Está relacionado às relações, conexões e estratégias utilizadas para manter redes interpessoais."}, {"title": "Poder de Coerção", "paras": ["É sustentado pela possibilidade de aplicar punições, sanções ou consequências negativas.", "Palavra-chave:", "Medo.", "A pessoa modifica seu comportamento porque pretende evitar determinada consequência.", "Na discussão sobre saúde mental, a coerção foi relacionada a:", "- ansiedade;", "- hipervigilância;", "- clima defensivo.", "Portanto, pode conseguir obediência, mas não significa necessariamente que exista engajamento voluntário."], "memory": "É sustentado pela possibilidade de aplicar punições, sanções ou consequências negativas."}, {"title": "Poder de Recompensa", "paras": ["É sustentado pela possibilidade de oferecer algo valorizado pelo outro.", "Pode envolver recompensas, benefícios, reconhecimento ou outros recursos controlados por quem exerce o poder.", "Na discussão da aula, essa base foi relacionada à motivação extrínseca e ao risco de instrumentalização das relações.", "A pessoa pode apresentar determinado comportamento para conseguir a recompensa.", "Palavra-chave: recompensa."], "memory": "É sustentado pela possibilidade de oferecer algo valorizado pelo outro."}, {"title": "Poder Legítimo", "paras": ["É o poder decorrente da posição formal ocupada dentro de uma estrutura.", "A pessoa possui autoridade porque sua posição é reconhecida institucionalmente.", "Exemplos aparecem em estruturas hierárquicas nas quais determinado cargo possui formalmente autoridade sobre outros.", "Palavras-chave:", "Posição → hierarquia → autoridade formal.", "Na discussão sobre saúde mental, o professor associa essa base à possibilidade de obediência passiva sem engajamento voluntário.", "Uma organização menos hierarquizada, como algumas startups mencionadas em aula, pode reduzir a importância dessa base sem eliminar a possibilidade de liderança, pois outras bases de poder podem ser utilizadas."], "memory": "É o poder decorrente da posição formal ocupada dentro de uma estrutura."}, {"title": "Poder de Referência", "paras": ["Surge quando outras pessoas apresentam admiração e identificação com determinado indivíduo.", "A influência não depende principalmente de ameaça ou posição hierárquica. O indivíduo torna-se uma referência para os demais.", "Palavras-chave:", "Admiração → identificação → referência.", "Na discussão realizada em sala, essa base foi associada a:", "- engajamento;", "- coesão;", "- lealdade;", "- menor estresse."], "memory": "Surge quando outras pessoas apresentam admiração e identificação com determinado indivíduo."}, {"title": "Poder de Especialista", "paras": ["É sustentado pelo conhecimento, habilidades e competência reconhecida.", "As pessoas reconhecem que aquele indivíduo domina determinada área e, por isso, atribuem valor às suas orientações.", "Palavras-chave:", "Conhecimento → habilidade → competência.", "O professor também relaciona essa base à segurança psicológica e à confiança.", "Não é o cargo que constitui o elemento central: é o reconhecimento da competência da pessoa."], "memory": "É sustentado pelo conhecimento, habilidades e competência reconhecida."}, {"title": "Poder de Informação", "paras": ["Está relacionado à posse ou ao acesso a informações relevantes ou privilegiadas.", "A pessoa pode exercer poder porque outros indivíduos precisam das informações que ela possui para realizar suas atividades.", "Palavra-chave: informação privilegiada.", "O professor chama atenção para um risco importante: a retenção intencional de informações pode transformar essa base em um mecanismo de manipulação.", "Quando alguém controla informações para produzir dependência, insegurança ou obter vantagens, podem aparecer:", "- insegurança psicológica;", "- manipulação;", "- chantagem;", "- dependência.", "Portanto, possuir informação relevante pode conferir poder mesmo que a pessoa não ocupe formalmente um cargo superior."], "memory": "Está relacionado à posse ou ao acesso a informações relevantes ou privilegiadas."}, {"title": "Poder de Conexão", "paras": ["Está relacionado às relações influentes, redes interpessoais e alianças estratégicas que a pessoa consegue construir ou acessar.", "A influência decorre de quem a pessoa conhece e das conexões às quais possui acesso.", "Palavras-chave:", "Conexões → relações → alianças estratégicas.", "Essas relações podem representar vantagem importante dentro de uma organização.", "Entretanto, a aula também aponta riscos quando essa base é utilizada inadequadamente, especialmente:", "- favoritismo;", "- formação de “panelinhas”."], "memory": "Está relacionado às relações influentes, redes interpessoais e alianças estratégicas que a pessoa consegue construir ou acessar."}, {"title": "Bases de poder e saúde mental", "paras": ["Um aspecto enfatizado pelo professor é que as bases de poder não devem ser analisadas apenas pela capacidade de produzir determinado comportamento.", "Também é necessário observar como elas repercutem sobre o liderado e sobre a saúde mental no trabalho.", "Coerção", "Medo → ansiedade, hipervigilância e clima defensivo.", "Recompensa", "Recompensa externa → motivação extrínseca e possibilidade de instrumentalização das relações.", "Legítimo", "Autoridade da posição → possibilidade de obediência passiva sem engajamento voluntário.", "Referência", "Admiração e identificação → engajamento, coesão e menor estresse.", "Especialista", "Competência reconhecida → confiança e segurança psicológica.", "Informação", "Controle de informações → pode produzir insegurança quando utilizado para manipulação.", "Conexão", "Redes e alianças → podem trazer vantagens relacionais, mas apresentam risco de favoritismo e formação de grupos fechados."], "memory": "Um aspecto enfatizado pelo professor é que as bases de poder não devem ser analisadas apenas pela capacidade de produzir determinado comportamento."}, {"title": "As bases pessoais e os resultados mais duradouros", "paras": ["Ao comparar as primeiras bases estudadas, o professor destaca especialmente:", "Poder de Referência + Poder de Especialista", "Essas duas bases pertencem ao poder pessoal.", "Na discussão apresentada, elas aparecem associadas a resultados mais prolongados porque a influência não depende exclusivamente de posição, punição ou recompensa.", "A aula relaciona o poder pessoal a:", "- maior engajamento;", "- satisfação no trabalho;", "- comprometimento;", "- confiança;", "- resultados mais duradouros.", "Isso não significa que as demais bases deixem de existir. A análise depende do contexto e da forma como o poder é exercido."], "memory": "Na discussão apresentada, elas aparecem associadas a resultados mais prolongados porque a influência não depende exclusivamente de posição, punição ou recompensa."}, {"title": "Quadro geral para memorização", "paras": ["PODER POSICIONAL", "Legítimo → posição/hierarquia", "Coerção → medo/punição", "Recompensa → recompensa", "PODER PESSOAL", "Referência → admiração/identificação", "Especialista → conhecimento/competência", "PODER RELACIONAL", "Informação → informação privilegiada", "Conexão → relações/alianças estratégicas"], "memory": "Compreenda quadro geral para memorização e observe como esse conceito aparece nas situações de trabalho."}, {"title": "O psicólogo organizacional diante das relações de poder", "paras": ["O psicólogo organizacional também entra em contextos nos quais existem relações de poder.", "Ao ser chamado para atuar em uma organização, geralmente existe uma demanda ou um problema. Sua formação, conhecimento técnico ou até a maneira como é percebido pelas pessoas pode conferir a ele determinadas formas de influência.", "Por isso, não basta identificar quem possui poder.", "É necessário compreender:", "- qual é a fonte desse poder;", "- como ele é exercido;", "- como os liderados respondem;", "- quais comportamentos são produzidos;", "- quais impactos aparecem sobre as relações e a saúde mental;", "- se existe apenas obediência ou efetivo engajamento."], "memory": "O psicólogo organizacional também entra em contextos nos quais existem relações de poder."}], "case": "Renato foi promovido porque apresentava excelente desempenho técnico. No novo cargo, começou a utilizar sua posição para exigir obediência, ameaçando funcionários com consequências quando as metas não eram cumpridas e oferecendo benefícios àqueles que seguiam suas determinações. A equipe passou a cumprir as ordens, mas surgiram ansiedade, clima defensivo e pouco engajamento. Uma funcionária sem cargo gerencial, por outro lado, tornou-se muito influente porque dominava tecnicamente o trabalho, era procurada pelos colegas para solucionar problemas e conquistou confiança do grupo. O caso demonstra que possuir uma posição formal não garante, por si só, uma liderança baseada em objetivos compartilhados e engajamento voluntário, além de evidenciar diferentes bases de poder dentro da mesma organização."}, "9": {"title": "Poder, Liderança e Integração com as Teorias da Motivação", "blocks": [{"title": "Introdução", "paras": ["1. Poder e liderança: retomando a diferença", "Uma distinção central: poder e liderança estão relacionados, mas não são a mesma coisa.", "Poder", "É a capacidade ou o potencial de afetar o comportamento de outra pessoa. Dependendo de sua origem, pode acompanhar uma posição formal ou ser adquirido nas relações e nas características pessoais.", "Liderança", "Também produz influência e mudança de comportamento, mas está ligada ao reconhecimento do líder, aos objetivos compartilhados e ao engajamento dos liderados.", "Assim, uma pessoa pode possuir poder sem necessariamente exercer liderança.", "Nem todo indivíduo que possui poder é líder, mas o líder exerce determinado poder sobre seus liderados.", "2. Poder atribuído e poder adquirido", "As três tipologias de poder estudadas anteriormente ajudam a compreender de onde vem a influência.", "Poder Posicional", "Está ligado à posição ocupada na estrutura. É um poder atribuído à pessoa em razão da função, hierarquia ou autoridade formal.", "O indivíduo não precisa conquistar inicialmente esse poder nas relações: determinadas prerrogativas acompanham o cargo.", "Poder Pessoal", "Está relacionado às características e competências do próprio indivíduo. Diferentemente do posicional, é predominantemente adquirido.", "A pessoa conquista influência por aspectos como:", "conhecimento;", "competência;", "respeito;", "admiração;", "identificação.", "Por essa razão, o poder pessoal é apresentado na aula como a tipologia mais diretamente conectada à liderança.", "Poder Relacional", "Depende das relações e conexões construídas pelo indivíduo. Sua influência está associada à forma como a pessoa desenvolve e utiliza sua rede de relacionamentos.", "3. Poder pessoal e liderança", "A proximidade entre liderança e poder pessoal pode ser compreendida pela forma como a influência acontece.", "No poder de referência, por exemplo, a pessoa reconhece o outro como alguém que admira ou com quem se identifica. Essa referência pode modificar seu comportamento porque ela deseja acompanhar aquele líder.", "No poder de especialista, conhecimento e competência também podem produzir reconhecimento e influência.", "Nesse caso, a influência não depende exclusivamente de uma ordem formal.", "Poder pessoal → reconhecimento → influência → maior aproximação com a liderança.", "4. Cargo de chefia não garante liderança", "Uma pessoa pode receber formalmente uma função de coordenação e, com ela, determinado poder posicional.", "Isso não significa que automaticamente se tornou uma boa líder.", "O exemplo retomado em aula é o profissional tecnicamente excelente que trabalha durante muitos anos na empresa e recebe uma promoção como forma de reconhecimento.", "A organização pensa:", "“Ele é um excelente técnico, portanto será um excelente coordenador.”", "Entretanto, a pessoa assume uma equipe:", "sem preparação;", "sem treinamento;", "sem acompanhamento;", "sem mentoria;", "sem desenvolvimento para lidar com pessoas.", "Depois, tenta fazer com que todos trabalhem exatamente como ela trabalhava.", "O resultado pode ser a desorganização da equipe e o fracasso na nova função.", "Ser excelente executor não significa automaticamente saber liderar pessoas.", "5. Liderar exige compreender diferenças entre as pessoas", "Uma das dificuldades do profissional promovido sem preparação é esperar que seus liderados ajam exatamente como ele agia.", "Entretanto, as pessoas apresentam características, competências e formas de responder diferentes.", "Por isso, a liderança não pode ser reduzida à reprodução do comportamento do próprio líder.", "Essa discussão reforça que liderança envolve compreender quem está sendo liderado, e não somente aquilo que o líder sabe executar.", "Integração com a Motivação", "6. Motivação como força interna", "A discussão sobre liderança é conectada ao conteúdo anterior de motivação.", "Na perspectiva trabalhada em aula:", "Motivação → força interna que leva a pessoa a se mover em determinada direção.", "Os estímulos externos podem participar desse processo, mas diferentes teorias procuram explicar aspectos distintos do comportamento motivado.", "Por isso, o professor reforça que as teorias não precisam ser entendidas como explicações que simplesmente anulam umas às outras.", "Cada teórico observou determinados elementos do comportamento humano e da motivação.", "7. As teorias observam diferentes dimensões da motivação", "Que algumas explicações enfatizam mais os estímulos externos, enquanto outras avançam sobre elementos internos e sobre as necessidades das pessoas.", "O ponto central é compreender que um estímulo externo pode funcionar quando está adequadamente relacionado àquilo que mobiliza o indivíduo.", "Assim:", "estímulo externo isolado não explica toda a motivação.", "Quando se compreende aquilo que mobiliza internamente uma pessoa, determinados estímulos podem apresentar maior aderência.", "8. Maslow e as necessidades humanas", "A teoria de Maslow é retomada a partir da hierarquia das necessidades.", "Na discussão da aula, as necessidades mais básicas aparecem como condições importantes para que o indivíduo possa avançar em direção a níveis superiores.", "No topo, a autorrealização representa um nível associado ao desenvolvimento das próprias potencialidades.", "A discussão também destaca uma questão prática: não faz sentido falar apenas de autonomia, propósito ou desenvolvimento quando necessidades fundamentais do trabalhador permanecem comprometidas.", "9. Vroom e a expectativa", "A teoria de Vroom é retomada a partir da avaliação que a pessoa realiza sobre aquilo que poderá obter por meio de seu esforço.", "Um ponto enfatizado na discussão é a ideia de valência:", "“Isso vale a pena para mim?”", "Assim, o comportamento envolve uma avaliação da relação entre esforço, resultado esperado e valor atribuído ao resultado.", "Essa lógica aproxima a teoria de elementos externos, pois aquilo que poderá ser obtido também participa da decisão de agir.", "10. Autodeterminação: competência e autonomia", "A aula também retoma a Teoria da Autodeterminação.", "Um exemplo utilizado é o trabalhador que possui competência para resolver determinado problema e recebe autonomia para fazê-lo.", "O líder apresenta o problema e permite que a pessoa mobilize sua capacidade para encontrar a solução.", "Nesse processo aparecem especialmente:", "Competência", "A pessoa percebe que possui capacidade para realizar a atividade ou resolver o problema.", "Autonomia", "A pessoa recebe espaço para utilizar sua competência e tomar decisões relacionadas à realização da atividade.", "A autonomia, portanto, não significa simplesmente abandonar o trabalhador. Ela aparece relacionada à possibilidade de utilizar efetivamente suas competências.", "11. Daniel Pink: autonomia, domínio e propósito", "Daniel Pink aparece como uma ampliação da discussão sobre motivação.", "A aula destaca três elementos:", "Autonomia", "Possibilidade de participar e agir com maior autodeterminação.", "Domínio", "Desenvolvimento contínuo da competência, avançando em direção a níveis cada vez maiores de excelência.", "Propósito", "Percepção de sentido naquilo que está sendo realizado.", "A discussão aproxima o desenvolvimento contínuo da competência de um processo de busca de excelência.", "AUTONOMIA + DOMÍNIO + PROPÓSITO", "12. Locke e Latham: metas", "Locke e Latham são retomados pela importância das metas.", "Uma meta precisa oferecer direcionamento para a ação.", "Na discussão da aula, ganha destaque a necessidade de que as metas sejam:", "claras;", "específicas;", "adequadamente estabelecidas.", "Quando a pessoa não compreende claramente aquilo que deve alcançar, o direcionamento do comportamento fica prejudicado.", "Assim, as metas participam da mobilização do esforço porque tornam mais definido para onde a ação deve ser direcionada.", "13. As teorias podem ser relacionadas", "A aula propõe observar conexões entre diferentes explicações da motivação.", "Por exemplo:", "Maslow → necessidades e autorrealização.", "Autodeterminação → autonomia e competência.", "Daniel Pink → autonomia, domínio e propósito.", "Locke e Latham → metas e direcionamento.", "Vroom → expectativa e valor atribuído ao resultado.", "A ideia não é transformar todas essas teorias em uma única explicação, mas compreender que elas observam dimensões diferentes do comportamento motivado.", "Poder, Liderança e Motivação", "14. A forma de exercer poder interfere na motivação", "A discussão retorna às tipologias de poder.", "Um líder pode utilizar diferentes fontes de influência, mas essas formas de poder não produzem necessariamente a mesma resposta.", "Uma influência baseada predominantemente em imposição e posição formal é diferente daquela construída a partir de:", "respeito;", "admiração;", "competência;", "reconhecimento;", "autonomia;", "identificação.", "É nesse ponto que poder, liderança e motivação começam a se conectar.", "O modo como o líder exerce influência pode favorecer ou dificultar o envolvimento das pessoas com o trabalho.", "15. Poder pessoal e motivação", "O poder pessoal apresenta uma aproximação importante com as formas de liderança discutidas em aula porque é conquistado, e não simplesmente entregue por uma posição hierárquica.", "Quando existe reconhecimento da competência ou identificação com o líder, a influência pode produzir maior adesão.", "Por isso, ao analisar um líder, não basta perguntar:", "“Qual cargo ele ocupa?”", "Também é necessário perguntar:", "“Por que as pessoas aceitam sua influência?”", "A resposta ajuda a identificar qual base de poder está predominando.", "Psicologia Organizacional e Cultura", "16. Saúde mental não pode existir apenas no documento", "Na parte final da aula, a discussão se desloca para a atuação organizacional.", "O professor critica situações nas quais a organização produz:", "documentos;", "normas;", "procedimentos;", "palestras;", "mas não transforma efetivamente suas práticas.", "A empresa pode afirmar que valoriza a saúde mental e, ao mesmo tempo, manter práticas que não correspondem ao discurso.", "O mesmo raciocínio é utilizado para comparar documentos de segurança do trabalho que existem formalmente, mas não são incorporados ao cotidiano.", "Documentar não significa necessariamente implementar.", "17. A cultura organizacional precisa ser construída", "Mudanças relacionadas à saúde mental e às relações de trabalho não acontecem apenas porque uma palestra foi realizada.", "Esse processo como educativo e cultural.", "A organização precisa reconhecer que a transformação exige continuidade e construção ao longo do tempo.", "Por isso, a Psicologia Organizacional pode participar de processos de:", "construção de cultura;", "desenvolvimento de metodologias;", "educação organizacional;", "desenvolvimento de pessoas;", "transformação das relações de trabalho.", "Não se trata de uma intervenção isolada capaz de modificar imediatamente toda a organização.", "18. Psicologia Organizacional e atuação integrada", "A discussão também mostra que determinadas demandas organizacionais não pertencem exclusivamente ao psicólogo.", "Dependendo do problema, a atuação pode ocorrer em conjunto com outros profissionais e áreas.", "O psicólogo organizacional contribui com seu olhar sobre:", "comportamento;", "relações;", "liderança;", "motivação;", "saúde mental;", "cultura organizacional.", "A intervenção, porém, precisa estar vinculada às condições reais da organização e ao processo que se pretende transformar.", "19. Cultura de performance e saúde mental", "A aula também problematiza a valorização excessiva da performance.", "Quando produzir cada vez mais se transforma no único parâmetro de sucesso, podem surgir tensões entre:", "resultado organizacional × saúde das pessoas.", "A discussão não apresenta desempenho e produtividade como necessariamente negativos. O problema aparece quando a busca por resultado ignora as condições humanas necessárias para sustentá-lo.", "Por isso, a análise psicológica precisa observar não apenas quanto está sendo produzido, mas também em quais condições esse resultado está sendo alcançado."], "memory": "Uma distinção central: poder e liderança estão relacionados, mas não são a mesma coisa."}], "case": "Carlos trabalha há 15 anos em uma empresa e sempre foi reconhecido como excelente técnico. Como forma de premiá-lo, a direção o promoveu a coordenador, atribuindo-lhe autoridade formal sobre uma equipe. Sem treinamento ou acompanhamento, Carlos passou a exigir que todos executassem o trabalho exatamente como ele fazia. A equipe começou a apresentar conflitos e queda no engajamento. Outra funcionária, sem cargo de chefia, passou a ser procurada pelos colegas por sua competência, respeito e capacidade de ajudá-los a resolver problemas. O caso demonstra que o poder posicional pode ser atribuído pelo cargo, enquanto o poder pessoal é construído a partir de características reconhecidas pelos outros, aproximando-se mais diretamente da liderança."}, "10": {"title": "Ecossistema da Liderança: Motivação, Poder e Ações do Líder", "blocks": [{"title": "O Ecossistema da Liderança", "paras": ["O professor reúne sob o nome Ecossistema da Liderança um conjunto de conteúdos que precisam ser compreendidos de forma conectada:", "motivação;", "poder e bases de poder;", "tipos de liderança;", "características do líder;", "comportamento do líder;", "atributos do líder.", "A ideia de ecossistema indica justamente que esses elementos não funcionam isoladamente. Para compreender o comportamento de um líder, é necessário observar o conjunto de fatores que interfere em suas atitudes, reações e formas de conduzir a equipe.", "Para a Psicologia Organizacional, isso significa olhar para uma situação concreta de trabalho e buscar compreender de onde surgem as ações do líder, o que o move e quais fontes de influência ele utiliza."], "memory": "Para a Psicologia Organizacional, isso significa olhar para uma situação concreta de trabalho e buscar compreender de onde surgem as ações do líder, o que o move e quais fontes de influência ele utiliza."}, {"title": "A motivação como ponto de partida", "paras": ["Todo o Ecossistema da Liderança começa pelo estudo da motivação.", "Na definição trabalhada em aula:", "Motivação é uma ação interna que move a pessoa na direção de alguma coisa.", "A motivação funciona como um motor interno que direciona o comportamento. Por isso, não é adequado afirmar simplesmente que uma pessoa “motiva” outra. O que outra pessoa pode fazer é criar estímulos que encontrem algo que já existe internamente no indivíduo.", "Essa distinção é importante para compreender posteriormente a ação do líder sobre seus liderados."], "memory": "Todo o Ecossistema da Liderança começa pelo estudo da motivação."}, {"title": "Motivação intrínseca e extrínseca", "paras": ["Motivação intrínseca", "É apresentada como o movimento que nasce internamente e permanece mesmo diante de dificuldades, conflitos ou situações desafiadoras.", "A pessoa pode estar cansada, contrariada ou enfrentando obstáculos e ainda assim continuar realizando determinada ação porque existe uma força interna que a direciona.", "Motivação extrínseca", "Está associada aos estímulos externos e ao ambiente.", "Esses estímulos são apresentados como mais temporários, porque dependem da permanência das condições externas. Quando o ambiente ou o estímulo desaparece, sua influência também pode diminuir.", "A relação trabalhada na aula pode ser resumida assim:", "INTRÍNSECA → movimento interno", "EXTRÍNSECA → estímulos externos e ambientais"], "memory": "É apresentada como o movimento que nasce internamente e permanece mesmo diante de dificuldades, conflitos ou situações desafiadoras."}, {"title": "O estímulo externo encontra uma disposição interna", "paras": ["O fato de a motivação ser compreendida a partir de um movimento interno não significa que os estímulos externos sejam inúteis.", "Um estímulo pode funcionar porque encontra algo que já existe internamente na pessoa.", "O líder pode identificar aquilo que possui importância para determinado indivíduo e utilizar um estímulo relacionado a isso. O estímulo é externo, mas sua eficácia depende daquilo que encontra no indivíduo.", "Por isso, duas pessoas podem reagir de formas diferentes diante do mesmo estímulo.", "ESTÍMULO EXTERNO + DISPOSIÇÃO INTERNA → possibilidade de resposta"], "memory": "O fato de a motivação ser compreendida a partir de um movimento interno não significa que os estímulos externos sejam inúteis."}, {"title": "Bases de poder: as fontes da ação do líder", "paras": ["A partir da motivação, a aula passa para as bases de poder.", "As bases de poder ajudam a identificar qual é a fonte utilizada pelo líder para exercer influência.", "Na organização apresentada em aula, essas bases são agrupadas em três tipologias:", "Poder Posicional\nRelaciona-se principalmente à posição formal ocupada pelo indivíduo.", "Poder Pessoal\nRelaciona-se às características reconhecidas na própria pessoa.", "Poder Relacional\nRelaciona-se às informações e conexões disponíveis ao indivíduo.", "Assim, é importante não confundir tipologia com base específica de poder."], "memory": "A partir da motivação, a aula passa para as bases de poder."}, {"title": "Poder Posicional", "paras": ["O Poder Posicional está associado à posição ocupada pelo indivíduo e aparece relacionado a três bases.", "Coerção", "A influência acontece pela possibilidade de punição ou de uma consequência negativa.", "A lógica é:", "“Faça, senão haverá uma consequência.”", "O medo funciona como elemento importante nessa relação.", "Recompensa", "A influência ocorre pela oferta de algo desejável em troca de determinado comportamento ou resultado.", "Por exemplo: o trabalhador que alcançar determinada meta receberá uma bonificação.", "Legitimidade", "A influência decorre da posição formal ocupada pelo indivíduo.", "A pessoa possui autoridade porque ocupa determinado cargo: chefe, coordenador, gerente ou responsável pelo setor.", "Portanto:", "PODER POSICIONAL = COERÇÃO + RECOMPENSA + LEGITIMIDADE"], "memory": "O Poder Posicional está associado à posição ocupada pelo indivíduo e aparece relacionado a três bases."}, {"title": "Poder Posicional e elementos extrínsecos", "paras": ["Na relação construída pelo professor, as bases posicionais apresentam forte conexão com elementos extrínsecos, porque dependem de fatores externos ao indivíduo.", "Na coerção, existe uma consequência externa que a pessoa deseja evitar.", "Na recompensa, existe algo externo que ela deseja obter.", "Na legitimidade, existe uma estrutura organizacional que atribui autoridade ao ocupante do cargo.", "Um mesmo líder pode utilizar mais de uma dessas bases. Ele pode utilizar sua autoridade formal, estabelecer uma consequência e, ao mesmo tempo, oferecer uma recompensa.", "Por isso, o objetivo é identificar qual base está presente em cada ação, e não imaginar que um líder só possa utilizar uma delas."], "memory": "Na relação construída pelo professor, as bases posicionais apresentam forte conexão com elementos extrínsecos, porque dependem de fatores externos ao indivíduo."}, {"title": "Poder Pessoal", "paras": ["No Poder Pessoal, a influência está relacionada às características reconhecidas no próprio líder.", "Duas bases são destacadas:", "Referência", "O líder torna-se uma referência para outras pessoas. Os liderados observam seu comportamento, reconhecem-no, identificam-se com ele ou desejam segui-lo.", "Especialista", "A influência decorre do conhecimento ou da competência reconhecida naquela pessoa.", "Os outros consideram sua orientação porque reconhecem que ela domina determinado assunto ou atividade.", "Assim:", "PODER PESSOAL = REFERÊNCIA + ESPECIALISTA", "O Poder Pessoal aproxima-se de uma influência que não depende exclusivamente da autoridade formal. O indivíduo pode ser seguido por aquilo que representa ou pelo conhecimento que possui."], "memory": "No Poder Pessoal, a influência está relacionada às características reconhecidas no próprio líder."}, {"title": "Poder Relacional", "paras": ["O terceiro agrupamento é o Poder Relacional.", "Ele aparece associado a duas bases:", "Informação", "A pessoa possui ou controla informações relevantes que podem influenciar determinada situação.", "Conexão", "A pessoa possui contatos, relações ou acesso a outras pessoas que podem ser importantes para determinado objetivo.", "Portanto:", "PODER RELACIONAL = INFORMAÇÃO + CONEXÃO"], "memory": "A pessoa possui ou controla informações relevantes que podem influenciar determinada situação."}, {"title": "A intenção no uso do Poder Relacional", "paras": ["No Poder Relacional, o professor destaca a importância da intenção.", "Uma pessoa pode possuir informações privilegiadas e utilizá-las para compartilhar conhecimento, construir uma ferramenta, solucionar um problema ou ajudar outras pessoas.", "Também pode utilizar informações e conexões com outra intenção.", "Assim, informação e conexão não são classificadas automaticamente como intrínsecas ou extrínsecas. É necessário observar como e com qual intenção essas bases estão sendo utilizadas.", "O exemplo trabalhado em aula é o de alguém que possui conhecimento sobre inteligência artificial e utiliza esse conhecimento para criar uma ferramenta capaz de organizar conteúdos e compartilhá-los com os colegas. Nesse caso, é necessário compreender o movimento interno que leva a pessoa a utilizar aquela informação dessa maneira."], "memory": "No Poder Relacional, o professor destaca a importância da intenção."}, {"title": "Liderança autoritária e poder posicional", "paras": ["A aula relaciona o exercício predominantemente posicional à liderança autoritária.", "Nesse movimento aparecem elementos como:", "comando;", "autoridade;", "cobrança;", "controle;", "coerção;", "recompensa;", "uso da posição formal.", "O objetivo da análise não é imediatamente determinar se essa pessoa é “boa” ou “ruim”.", "A pergunta central é:", "Como esse líder está exercendo influência?", "Essa mudança de olhar é importante para a formação do psicólogo organizacional."], "memory": "A aula relaciona o exercício predominantemente posicional à liderança autoritária."}, {"title": "Liderança democrática e influência pessoal", "paras": ["Na discussão realizada em aula, a liderança democrática é aproximada de elementos mais pessoais e internos.", "Enquanto uma atuação fortemente posicional pode depender de autoridade, recompensa ou coerção, uma atuação pessoal pode envolver referência, conhecimento, reconhecimento e influência sobre os outros.", "O líder é seguido não apenas porque possui um cargo, mas porque as pessoas reconhecem algo nele."], "memory": "Na discussão realizada em aula, a liderança democrática é aproximada de elementos mais pessoais e internos."}, {"title": "Compreender antes de julgar", "paras": ["O professor enfatiza que o psicólogo organizacional precisa aprender a ler uma situação de trabalho.", "Ao entrar em uma organização, ele pode encontrar um chefe que utiliza sua posição formal, outro que trabalha com recompensas, outro que exerce influência pelo medo e outro que é seguido porque se tornou referência técnica para a equipe.", "O primeiro movimento não deve ser simplesmente:", "“Esse líder é bom” ou “esse líder é ruim”.", "É necessário perguntar:", "Qual base de poder está sendo utilizada?", "Qual estímulo está presente?", "De onde vem a influência desse líder?", "Como os trabalhadores estão respondendo a essa ação?", "Essa leitura transforma os conceitos teóricos em instrumentos para compreender situações reais das organizações."], "memory": "O professor enfatiza que o psicólogo organizacional precisa aprender a ler uma situação de trabalho."}, {"title": "Características predominantes e possibilidade de desenvolvimento", "paras": ["A aula trabalha a ideia de que o líder pode apresentar uma característica predominante em sua maneira de agir.", "Isso não significa que ele seja incapaz de mudar.", "Que a pessoa pode aprender e desenvolver:", "conhecimentos;", "habilidades;", "atitudes;", "valores;", "estratégias.", "Portanto, a existência de um padrão predominante não elimina a possibilidade de aprendizagem e desenvolvimento da liderança."], "memory": "A aula trabalha a ideia de que o líder pode apresentar uma característica predominante em sua maneira de agir."}, {"title": "A situação também precisa ser considerada", "paras": ["O comportamento necessário em uma situação pode não ser o mesmo exigido em outra.", "Exemplos de diferentes contextos, como:", "banco;", "startup;", "indústria;", "construção civil.", "Isso introduz uma ideia importante: a ação da liderança também depende da situação.", "O conteúdo de liderança situacional ainda não é desenvolvido neste momento da aula, mas começa a aparecer a necessidade de considerar conjuntamente:", "LÍDER + LIDERADOS + SITUAÇÃO"], "memory": "O comportamento necessário em uma situação pode não ser o mesmo exigido em outra."}, {"title": "Conexão com as teorias motivacionais", "paras": ["Teorias já estudadas para mostrar que o Ecossistema da Liderança precisa ser compreendido de maneira integrada.", "Teoria da Autodeterminação", "A autonomia é retomada como elemento importante. Quando a pessoa possui competência e recebe autonomia para utilizá-la, existe espaço para uma atuação menos dependente de coerção externa.", "Daniel Pink", "São retomados os elementos:", "Autonomia + domínio + propósito", "Esses elementos são relacionados a formas de mobilização que ultrapassam uma relação baseada somente em punições e recompensas.", "O ponto central é perceber que as teorias motivacionais ajudam a compreender por que determinadas formas de liderança produzem respostas diferentes nas pessoas.", "Mapa da Aula 10", "MOTIVAÇÃO\n→ ação interna que direciona o comportamento\n↓\nINTRÍNSECA → movimento interno\nEXTRÍNSECA → estímulos ambientais\n↓\nBASES DE PODER\n↓\nPOSICIONAL → coerção + recompensa + legitimidade\nPESSOAL → referência + especialista\nRELACIONAL → informação + conexão\n↓\nAÇÃO DO LÍDER\n↓\nRESPOSTA DOS LIDERADOS\n↓\nRESULTADOS DA EQUIPE", "O conjunto dessas relações constitui o Ecossistema da Liderança trabalhado na aula."], "memory": "Teorias já estudadas para mostrar que o Ecossistema da Liderança precisa ser compreendido de maneira integrada."}], "case": "Em uma empresa, um coordenador utiliza seu cargo para determinar como as atividades devem ser executadas, ameaça aplicar consequências quando as regras não são cumpridas e oferece bônus para quem supera as metas. Em outra equipe, um profissional é espontaneamente procurado pelos colegas porque possui grande conhecimento técnico e tornou-se uma referência para o grupo. Já uma terceira pessoa consegue mobilizar soluções porque possui informações importantes e boas conexões dentro da organização. O primeiro caso apresenta Poder Posicional, por meio de legitimidade, coerção e recompensa; o segundo apresenta Poder Pessoal, especialmente especialista e referência; e o terceiro apresenta Poder Relacional, por meio de informação e conexão."}, "11": {"title": "Ecossistema da Liderança: Bases de Poder, Estilos de Liderança e Formação de Times", "blocks": [{"title": "Retomada do Ecossistema da Liderança", "paras": ["A aula começa retomando o Ecossistema da Liderança, conectando os conteúdos já estudados. A proposta é não memorizar conceitos isoladamente, mas compreender como motivação, poder e liderança se relacionam na prática.", "O esquema retomado parte de três tipologias de poder:", "Poder Posicional\nCoerção + Recompensa + Legitimidade.", "Poder Pessoal\nReferência + Especialista.", "Poder Relacional\nInformação + Conexão.", "A partir dessas tipologias, o professor relaciona as bases de poder às matrizes motivacionais e aos estilos de liderança."], "memory": "A aula começa retomando o Ecossistema da Liderança, conectando os conteúdos já estudados. A proposta é não memorizar conceitos isoladamente, mas compreender como motivação, poder e liderança se relacionam na prática."}, {"title": "Poder Posicional e motivação extrínseca", "paras": ["O Poder Posicional está ligado à posição formal ocupada pelo líder e utiliza três bases:", "Coerção", "O líder influencia pela possibilidade de punição ou consequência negativa.", "Recompensa", "O líder utiliza algum benefício ou recompensa para estimular determinado comportamento.", "Legitimidade", "A autoridade decorre do cargo ou da posição formal ocupada.", "Na organização apresentada na aula:", "PODER POSICIONAL → COERÇÃO + RECOMPENSA + LEGITIMIDADE", "Esse conjunto é associado à motivação extrínseca, porque depende principalmente de elementos presentes no ambiente: autoridade, punições, recompensas e condições externas."], "memory": "O líder influencia pela possibilidade de punição ou consequência negativa."}, {"title": "Poder Posicional e liderança autocrática", "paras": ["Predominantemente o Poder Posicional ao estilo autocrático.", "Nesse estilo, o poder de decisão permanece concentrado no líder. Ele utiliza a autoridade que possui para determinar aquilo que deve ser feito e buscar os resultados esperados.", "Isso não significa que ele utilize somente coerção. O líder pode transitar entre as três bases posicionais:", "determinar uma ação pela autoridade do cargo;", "estabelecer consequências;", "oferecer recompensas.", "A característica central continua sendo a predominância da posição e da autoridade formal como fonte de influência."], "memory": "Predominantemente o Poder Posicional ao estilo autocrático."}, {"title": "Poder Pessoal e motivação intrínseca", "paras": ["O Poder Pessoal é formado pelas bases:", "Referência", "A pessoa é reconhecida como alguém que inspira ou representa uma referência para os outros.", "Especialista", "A influência decorre do conhecimento, da competência ou da especialidade reconhecida naquela pessoa.", "Assim:", "PODER PESSOAL → REFERÊNCIA + ESPECIALISTA", "Na organização feita pelo professor, essa tipologia aproxima-se das matrizes motivacionais intrínsecas e contemporâneas, especialmente da Autodeterminação e da Motivação 3.0."], "memory": "A pessoa é reconhecida como alguém que inspira ou representa uma referência para os outros."}, {"title": "Autodeterminação e Motivação 3.0", "paras": ["As teorias motivacionais para conectá-las à liderança.", "Teoria da Autodeterminação", "São retomados os elementos:", "autonomia;", "competência;", "pertencimento.", "A autonomia ganha destaque porque o líder reconhece a competência da pessoa e permite que ela tenha espaço para agir.", "Daniel Pink — Motivação 3.0", "São retomados:", "autonomia;", "domínio;", "propósito.", "Esses elementos ajudam a compreender uma forma de atuação menos dependente de coerção e controle externo."], "memory": "As teorias motivacionais para conectá-las à liderança."}, {"title": "Poder Relacional: informação e conexão", "paras": ["O Poder Relacional aparece novamente constituído por:", "Informação", "A influência decorre da posse ou do acesso a informações relevantes.", "Conexão", "A influência decorre das relações, contatos e redes às quais a pessoa possui acesso.", "Portanto:", "PODER RELACIONAL → INFORMAÇÃO + CONEXÃO", "Nesse caso, o professor destaca que a análise depende especialmente da intenção com que essas bases são utilizadas."], "memory": "A influência decorre da posse ou do acesso a informações relevantes."}, {"title": "A intenção no uso da informação e da conexão", "paras": ["Informação e conexão podem ser utilizadas de maneiras diferentes.", "Um líder pode compartilhar informações e mobilizar sua rede de contatos para favorecer o trabalho coletivo e alcançar resultados.", "Também pode utilizar informações de forma estratégica para controlar outras pessoas, ocultar partes importantes ou criar dependência.", "Por isso, no Poder Relacional, é necessário perguntar:", "Qual é a intenção do líder ao utilizar aquilo que sabe e as conexões que possui?", "Na perspectiva apresentada na aula, quando informação e conexão são utilizadas positivamente para favorecer resultados coletivos, representam uma atuação estratégica. Quando utilizadas de maneira perversa ou manipulativa, revelam outro movimento na relação de poder."], "memory": "Informação e conexão podem ser utilizadas de maneiras diferentes."}, {"title": "Liderança democrática", "paras": ["A liderança democrática aparece associada ao compartilhamento.", "Enquanto o autocrático concentra a decisão, o democrático abre espaço para participação dos liderados e compartilha decisões.", "Nesse movimento, ganham importância:", "participação;", "diálogo;", "autonomia;", "reconhecimento da competência;", "compartilhamento;", "confiança.", "Essa atuação se aproxima especialmente das bases pessoais de poder, porque a influência não depende exclusivamente da autoridade formal."], "memory": "A liderança democrática aparece associada ao compartilhamento."}, {"title": "Liderança liberal: não confundir com autonomia estratégica", "paras": ["A aula faz uma distinção importante entre liderança liberal e um líder que estrategicamente se afasta para dar autonomia à equipe.", "Líder liberal", "Na explicação do professor, é aquele que deixa as coisas acontecerem sem acompanhamento efetivo. Ele se afasta e não retorna adequadamente para acompanhar os resultados.", "Líder que concede autonomia", "Pode organizar o trabalho, definir:", "tarefas;", "diretrizes;", "objetivos;", "metas;", "indicadores;", "e depois se afastar para permitir que uma equipe competente execute suas atividades.", "Posteriormente, ele retorna para verificar os resultados e oferecer feedback.", "Portanto:", "AFASTAMENTO + PLANEJAMENTO + AUTONOMIA + ACOMPANHAMENTO ≠ LIDERANÇA LIBERAL", "Dar autonomia não significa abandonar a equipe."], "memory": "A aula faz uma distinção importante entre liderança liberal e um líder que estrategicamente se afasta para dar autonomia à equipe."}, {"title": "Segurança do líder e microgerenciamento", "paras": ["O professor relaciona a capacidade de conceder autonomia à segurança do próprio líder.", "Um líder que conhece a competência de sua equipe pode se afastar sem precisar controlar continuamente cada ação.", "Ele não necessita realizar microgerenciamento.", "Na aula, essa postura é aproximada do Poder Pessoal: o líder possui segurança suficiente para permitir que as pessoas utilizem suas próprias competências.", "Em contraste, a dependência constante da autoridade pode aparecer associada à insegurança e à necessidade de controle."], "memory": "O professor relaciona a capacidade de conceder autonomia à segurança do próprio líder."}, {"title": "Líder Servidor", "paras": ["O Líder Servidor é apresentado como alguém que utiliza fortemente as bases do Poder Pessoal, especialmente:", "Referência + Especialista", "Ele conduz a equipe de maneira:", "democrática;", "aberta;", "participativa;", "compartilhada.", "O líder servidor escuta a equipe, participa e procura conhecer as pessoas que lidera."], "memory": "O líder servidor escuta a equipe, participa e procura conhecer as pessoas que lidera."}, {"title": "Individuação na liderança servidora", "paras": ["Um aspecto destacado é que o líder servidor conhece as especificidades de cada integrante.", "Ele não trata necessariamente todos de maneira idêntica. Procura compreender como cada pessoa funciona e quais são suas necessidades dentro da equipe.", "A aula chama esse movimento de individuação.", "Assim, o líder consegue:", "aproximar-se quando a pessoa precisa de apoio;", "afastar-se quando ela precisa de autonomia;", "reconhecer competências;", "adaptar sua interação às especificidades de cada integrante.", "O foco não está simplesmente em “tratar todos igualmente”, mas em compreender cada pessoa dentro do coletivo."], "memory": "Um aspecto destacado é que o líder servidor conhece as especificidades de cada integrante."}, {"title": "O compromisso ético do Líder Servidor", "paras": ["Na caracterização estudada, o Líder Servidor possui um forte compromisso ético interno.", "Sua liderança tende a ser reconhecida naturalmente pelas pessoas, em vez de depender exclusivamente da imposição de um cargo.", "A equipe reconhece sua liderança pela maneira como ele se relaciona, participa e serve ao coletivo.", "Esse tipo de liderança favorece uma conexão mais profunda entre seus integrantes."], "memory": "Na caracterização estudada, o Líder Servidor possui um forte compromisso ético interno."}, {"title": "Grupo, Equipe e Time", "paras": ["A aula diferencia três formas de organização coletiva.", "Grupo", "Existe um conjunto de pessoas, mas com menor integração entre seus objetivos e ações.", "Equipe", "As pessoas possuem um objetivo comum e trabalham para alcançá-lo.", "Time", "Existe uma integração ainda maior. O objetivo coletivo passa a ser incorporado pelos integrantes como parte de seus próprios objetivos.", "A diferença central apresentada entre equipe e time está na integralidade dos objetivos.", "EQUIPE → todos trabalham para o mesmo objetivo.", "TIME → o objetivo do coletivo passa a ser também um objetivo pessoal de seus integrantes."], "memory": "A aula diferencia três formas de organização coletiva."}, {"title": "A interdependência no Time", "paras": ["No time, o integrante não considera seu trabalho concluído apenas porque alcançou sua própria meta.", "Ele reconhece que seu resultado está ligado ao resultado dos demais.", "O exemplo de vendas.", "Em uma equipe, um vendedor pode atingir sua meta individual e considerar sua tarefa concluída.", "Em um time, ao atingir sua meta, ele procura quem ainda não alcançou o resultado e oferece apoio, contatos ou oportunidades para que o objetivo coletivo também seja atingido.", "Assim:", "“EU ATINGI MINHA META” → equipe", "“NÓS PRECISAMOS ATINGIR NOSSA META” → time", "O time apresenta maior integração e interdependência."], "memory": "No time, o integrante não considera seu trabalho concluído apenas porque alcançou sua própria meta."}, {"title": "Líder Transformacional", "paras": ["O Líder Transformacional é caracterizado pela capacidade de produzir transformação nas pessoas e no coletivo.", "Na formulação trabalhada na aula, ele pode:", "transformar pessoas → transformar grupos em equipes → transformar equipes em times.", "Sua atuação não se limita à manutenção da estrutura existente. Ele desenvolve pessoas e amplia a integração do coletivo."], "memory": "O Líder Transformacional é caracterizado pela capacidade de produzir transformação nas pessoas e no coletivo."}, {"title": "Liderança Transformacional e Liderança Matricial", "paras": ["O professor relaciona o Líder Transformacional à capacidade de atuar em uma liderança matricial.", "Nesse modelo, pessoas de diferentes áreas podem ser reunidas para trabalhar em torno de um projeto.", "Por exemplo:", "financeiro;", "marketing;", "operação;", "outras áreas organizacionais.", "Essas pessoas possuem conhecimentos e características diferentes, mas precisam ser integradas em torno de um mesmo projeto.", "O líder transformacional é apresentado como alguém capaz de agregar essas diferenças e conduzir pessoas de diferentes departamentos em direção ao objetivo coletivo."], "memory": "O professor relaciona o Líder Transformacional à capacidade de atuar em uma liderança matricial."}, {"title": "O motor ético e moral da liderança transformacional", "paras": ["Na explicação do professor, a liderança transformacional apresenta como importante motor motivacional o nível moral e ético.", "Isso ajuda a diferenciá-la de uma liderança orientada exclusivamente por recompensas, punições ou trocas.", "O transformacional busca desenvolver e transformar o liderado e o próprio coletivo."], "memory": "Na explicação do professor, a liderança transformacional apresenta como importante motor motivacional o nível moral e ético."}, {"title": "Líder Transacional", "paras": ["O Líder Transacional atua principalmente pela lógica da troca.", "A relação pode ser resumida como:", "RESULTADO ↔ RECOMPENSA", "Existe negociação: determinada entrega está associada a determinada contrapartida.", "Que o Líder Transacional pode realizar ações positivas, mas existe uma relação de troca presente em sua maneira de conduzir.", "Portanto:", "TRANSACIONAL = TROCA / NEGOCIAÇÃO", "TRANSFORMACIONAL = TRANSFORMAÇÃO / DESENVOLVIMENTO", "Essa diferença é central para não confundir os dois conceitos.", "Mapa da Aula 11", "PODER POSICIONAL\n→ Coerção + Recompensa + Legitimidade\n→ elementos extrínsecos\n→ concentração da autoridade\n→ aproximação com liderança autocrática", "PODER PESSOAL\n→ Referência + Especialista\n→ aproximação com motivação intrínseca\n→ Autodeterminação / Motivação 3.0\n→ autonomia e competência\n→ liderança democrática / servidora", "PODER RELACIONAL\n→ Informação + Conexão\n→ análise depende da intenção de uso", "LÍDER SERVIDOR\n→ serve + escuta + conhece cada integrante\n→ autonomia quando possível + proximidade quando necessária\n→ individuação", "GRUPO → EQUIPE → TIME\n→ aumento da integração\n→ objetivo comum\n→ interdependência", "LÍDER TRANSACIONAL\n→ troca e negociação", "LÍDER TRANSFORMACIONAL\n→ transforma pessoas e coletivos\n→ grupo → equipe → time\n→ pode integrar diferentes áreas\n→ dimensão ética e moral"], "memory": "O Líder Transacional atua principalmente pela lógica da troca."}], "case": "Uma gerente coordena profissionais de diferentes setores em um projeto. Ela conhece as competências de cada integrante, estabelece objetivos claros e concede autonomia para a execução, sem realizar microgerenciamento. Quando um integrante termina sua parte, é incentivado a apoiar os demais, pois o resultado só é considerado alcançado quando todo o coletivo chega ao objetivo. A gerente também utiliza seu conhecimento como referência e procura desenvolver os profissionais para que assumam responsabilidades cada vez maiores. Na lógica trabalhada na aula, essa situação apresenta elementos de Poder Pessoal, autonomia, formação de time e características de uma liderança servidora e transformacional."}, "12": {"title": "Liderança Situacional: Tarefa, Relacionamento, Competência e Delegação", "blocks": [{"title": "O princípio da Liderança Situacional", "paras": ["A Liderança Situacional parte da análise da relação entre líder, liderado e tarefa. O líder não deve agir da mesma maneira em todas as circunstâncias. Antes de definir seu comportamento, precisa compreender a situação em que aquele liderado se encontra.", "Para isso, observa elementos como:", "- a competência do liderado;", "- sua autonomia;", "- seu envolvimento com a tarefa;", "- sua situação motivacional naquele momento;", "- a tarefa ou missão que precisa ser realizada;", "- o contexto em que essa tarefa será executada.", "A ideia central é que o comportamento do líder deve ser ajustado à situação encontrada.", "LIDERADO + TAREFA + SITUAÇÃO → COMPORTAMENTO DO LÍDER"], "memory": "A ideia central é que o comportamento do líder deve ser ajustado à situação encontrada."}, {"title": "Perspectiva e expectativa", "paras": ["A diferença entre perspectiva e expectativa para orientar a leitura do modelo.", "Expectativa", "É aquilo que se espera que aconteça. Na explicação utilizada em aula, corresponde a um olhar direcionado “para fora”, para algo que ainda é esperado.", "Perspectiva", "Corresponde a olhar “para dentro” da situação, procurando compreender os elementos que já estão presentes e como eles se relacionam.", "Ao estudar o gráfico da Liderança Situacional, a proposta é desenvolver uma perspectiva: analisar aquilo que o modelo mostra e compreender a relação entre tarefa, relacionamento e situação do liderado."], "memory": "A diferença entre perspectiva e expectativa para orientar a leitura do modelo."}, {"title": "Os dois eixos da Liderança Situacional", "paras": ["O gráfico trabalhado em aula utiliza dois elementos fundamentais:", "Tarefa", "Representa aquilo que precisa ser realizado: o fazer, a missão, a atividade ou o resultado esperado.", "O comportamento de tarefa pode ser:", "Alto → o líder precisa fornecer maior direcionamento sobre o que deve ser feito;", "Baixo → o liderado já domina a tarefa e exige menor direcionamento.", "Relacionamento", "Representa o nível de proximidade e acompanhamento necessário entre líder e liderado.", "Pode ser:", "Alto → o líder mantém maior proximidade, conversa, acompanha, orienta ou apoia;", "Baixo → a necessidade dessa proximidade é menor.", "A combinação desses dois eixos origina os quatro comportamentos estudados:", "S1 — Direcionador", "Tarefa alta + relacionamento baixo.", "S2 — Orientador", "Tarefa alta + relacionamento alto.", "S3 — Apoiador", "Tarefa baixa + relacionamento alto.", "S4 — Delegador", "Tarefa baixa + relacionamento baixo."], "memory": "Representa aquilo que precisa ser realizado: o fazer, a missão, a atividade ou o resultado esperado."}, {"title": "S1: Perfil Direcionador", "paras": ["No perfil direcionador, a principal preocupação do líder está na tarefa.", "TAREFA ALTA + RELACIONAMENTO BAIXO", "O liderado pode estar chegando naquele contexto e ainda não conhece suficientemente:", "- as regras;", "- os procedimentos;", "- as diretrizes;", "- os objetivos;", "- os padrões esperados;", "- a maneira específica de realizar aquela atividade.", "Por isso, o líder precisa fornecer direcionamento.", "Nesse momento, a prioridade não é construir uma relação intensa, mas garantir que o liderado compreenda aquilo que precisa executar."], "memory": "No perfil direcionador, a principal preocupação do líder está na tarefa."}, {"title": "O exemplo do marceneiro", "paras": ["O exemplo de um marceneiro experiente.", "Ele já sabe fabricar cadeiras e possui competência profissional. Entretanto, acabou de chegar a uma nova empresa e ainda não sabe produzir o modelo específico de cadeira daquela organização.", "O líder já sabe que ele é marceneiro e possui conhecimento técnico, mas ainda precisa apresentar:", "- os projetos utilizados;", "- os padrões da empresa;", "- os objetivos;", "- as diretrizes;", "- a forma como aquela tarefa deve ser executada naquele contexto.", "Portanto, possuir competência profissional não significa automaticamente dominar uma tarefa específica em uma nova organização.", "Nesse primeiro momento:", "O líder direciona porque o liderado precisa conhecer como aquela tarefa deve ser executada naquele contexto."], "memory": "Ele já sabe fabricar cadeiras e possui competência profissional. Entretanto, acabou de chegar a uma nova empresa e ainda não sabe produzir o modelo específico de cadeira daquela organização."}, {"title": "S2: Perfil Orientador", "paras": ["Depois que o liderado avança, o comportamento do líder também pode mudar.", "No perfil orientador:", "TAREFA ALTA + RELACIONAMENTO ALTO", "O líder ainda acompanha a execução da tarefa porque ela continua exigindo atenção, mas já existe uma relação maior com o liderado.", "Ele pode perguntar:", "- Como está realizando a atividade?", "- Está utilizando os equipamentos corretamente?", "- Encontrou alguma dificuldade?", "- O resultado está dentro do esperado?", "Agora não existe apenas direcionamento. Existe também maior interação.", "O líder continua preocupado com a execução, mas passa a orientar e acompanhar mais proximamente o desenvolvimento do liderado."], "memory": "Depois que o liderado avança, o comportamento do líder também pode mudar."}, {"title": "S3: Perfil Apoiador", "paras": ["No perfil apoiador, ocorre uma mudança importante:", "TAREFA BAIXA + RELACIONAMENTO ALTO", "Nesse momento, o líder já sabe que o liderado conhece a tarefa.", "Ele já demonstrou anteriormente que possui competência para realizá-la. Por isso, o líder não precisa permanecer explicando continuamente como fazer.", "A necessidade maior passa para o relacionamento.", "O líder procura:", "- permanecer próximo;", "- apoiar;", "- oferecer feedback;", "- perceber inseguranças;", "- acompanhar o estado motivacional;", "- ajudar diante de alguma dificuldade.", "A preocupação deixa de estar concentrada na execução técnica e passa para o apoio ao liderado.", "Ele já sabe fazer → não preciso ensinar novamente → preciso apoiá-lo quando necessário."], "memory": "Nesse momento, o líder já sabe que o liderado conhece a tarefa."}, {"title": "Competência não elimina momentos de insegurança", "paras": ["Mesmo uma pessoa competente pode apresentar insegurança ou passar por uma dificuldade.", "Isso não significa automaticamente que ela deixou de saber executar a tarefa.", "Como exemplo uma situação em que algo dá errado. Como o líder já possui evidências anteriores de que o profissional sabe realizar aquela atividade, sua resposta pode ser oferecer feedback e apoio, acompanhando temporariamente a situação.", "Portanto, é necessário distinguir:", "Não saber fazer", "De", "Saber fazer, mas precisar de apoio naquele momento.", "Essa leitura é importante para escolher o comportamento de liderança adequado."], "memory": "Mesmo uma pessoa competente pode apresentar insegurança ou passar por uma dificuldade."}, {"title": "S4: Perfil Delegador", "paras": ["O último comportamento apresentado é o delegador.", "TAREFA BAIXA + RELACIONAMENTO BAIXO", "Nesse estágio, o liderado:", "- conhece a tarefa;", "- possui competência;", "- apresenta autonomia;", "- já percorreu um processo de desenvolvimento;", "- não necessita de acompanhamento constante.", "O líder pode entregar a missão e permitir que o trabalho seja realizado com autonomia.", "Isso não significa desaparecer completamente. O líder ainda pode verificar indicadores e acompanhar os resultados, mas não precisa permanecer constantemente ao lado do liderado."], "memory": "O último comportamento apresentado é o delegador."}, {"title": "Delegar não é “delargar”", "paras": ["A aula enfatiza uma distinção:", "DELEGAR ≠ “DELARGAR”", "Dois extremos encontrados nas organizações.", "Líder que não delega", "Centraliza tudo porque não consegue confiar ou permitir que outras pessoas assumam responsabilidades.", "Líder que “delarga”", "Entrega atividades sem ter realizado anteriormente o processo necessário de direcionamento, orientação e apoio.", "Nesse segundo caso, o líder chama sua atitude de delegação, mas o liderado pode não estar preparado para assumir aquela responsabilidade.", "A delegação adequada aparece depois de um processo:", "DIRECIONAR → ORIENTAR → APOIAR → DELEGAR"], "memory": "Centraliza tudo porque não consegue confiar ou permitir que outras pessoas assumam responsabilidades."}, {"title": "O exemplo das 400 cadeiras", "paras": ["O contexto da marcenaria.", "Imagine que a equipe receba uma encomenda de 400 cadeiras para serem produzidas em 10 dias.", "Se os profissionais já conhecem:", "- o modelo;", "- o processo;", "- a organização;", "- suas responsabilidades;", "- a maneira de executar o trabalho;", "O líder não precisa explicar novamente cada etapa.", "Ele pode apresentar a missão, combinar a meta e permitir que a equipe execute.", "Depois, acompanha pontualmente:", "“Como está nossa meta?”", "“Estamos conseguindo produzir a quantidade diária necessária?”", "Esse acompanhamento não elimina a delegação. O líder apenas não realiza microgerenciamento porque a equipe já possui condições para trabalhar com autonomia."], "memory": "Imagine que a equipe receba uma encomenda de 400 cadeiras para serem produzidas em 10 dias."}, {"title": "A Liderança Situacional exige leitura individualizada", "paras": ["Um dos pontos centrais da aula é que o líder precisa possuir habilidade para realizar uma leitura correta da situação.", "Não existe uma única resposta adequada para todos os liderados.", "A mesma pessoa pode inclusive necessitar de comportamentos diferentes do líder conforme:", "- a tarefa;", "- sua competência naquela atividade;", "- sua autonomia;", "- seu envolvimento;", "- seu momento motivacional.", "Por isso, a Liderança Situacional exige uma análise individualizada.", "Não se escolhe S1, S2, S3 ou S4 apenas pela personalidade do líder.", "O comportamento deve ser escolhido a partir da situação entre liderado e tarefa."], "memory": "Um dos pontos centrais da aula é que o líder precisa possuir habilidade para realizar uma leitura correta da situação."}, {"title": "Competência e autonomia modificam a atuação do líder", "paras": ["À medida que aumentam a competência e a autonomia do liderado, diminui a necessidade de direcionamento constante.", "O caminho apresentado na aula pode ser compreendido como um desenvolvimento progressivo:", "S1 — Direcionar", "“Vou mostrar o que precisa ser feito.”", "S2 — Orientar", "“Você já avançou, mas ainda vou acompanhar e orientar.”", "S3 — Apoiar", "“Você sabe fazer; agora meu papel principal é apoiá-lo.”", "S4 — Delegar", "“Você possui competência e autonomia para assumir essa responsabilidade.”", "O objetivo é que o líder reconheça em qual situação o liderado está antes de decidir como agir."], "memory": "À medida que aumentam a competência e a autonomia do liderado, diminui a necessidade de direcionamento constante."}, {"title": "Liderança Situacional e os estilos estudados anteriormente", "paras": ["A aula também conecta a Liderança Situacional aos conteúdos anteriores.", "Um líder pode apresentar uma tendência predominante — democrática, autocrática, servidora ou transformacional — e, ao mesmo tempo, demonstrar determinado comportamento dentro da Liderança Situacional.", "Por exemplo, o exercício realizado em sala mostrou pessoas classificadas como democráticas, mas com tendência direcionadora diante de determinadas situações.", "Isso significa que os conceitos não devem ser confundidos.", "Estilo predominante do líder e comportamento situacional diante de uma tarefa/liderado são leituras diferentes.", "Uma pessoa pode ter características democráticas e, diante de alguém que precisa de muito direcionamento, utilizar S1."], "memory": "A aula também conecta a Liderança Situacional aos conteúdos anteriores."}, {"title": "Liderança Transformacional e o perfil Apoiador", "paras": ["Ao discutir os resultados do exercício, o professor aproxima características transformacionais do comportamento apoiador.", "O líder transformacional foi retomado como aquele que:", "- inspira;", "- compartilha;", "- agrega;", "- acompanha;", "- observa o estado motivacional;", "- permanece próximo das pessoas.", "Quando a tarefa já é dominada pelo liderado, essas características podem aparecer em uma atuação mais próxima do S3 — Apoiador, com menor preocupação em ensinar a tarefa e maior atenção à relação.", "Isso não significa que “transformacional = apoiador” em todas as situações. A atividade mostra como uma tendência de liderança pode aparecer na forma como a pessoa prefere agir diante dos liderados."], "memory": "Ao discutir os resultados do exercício, o professor aproxima características transformacionais do comportamento apoiador."}, {"title": "Autoconhecimento e tendência de liderança", "paras": ["A atividade realizada em sala também teve como objetivo fazer cada estudante observar suas próprias tendências.", "O professor chama atenção para um possível problema ao responder instrumentos de autoavaliação: a pessoa pode escolher aquilo que gostaria de ser, em vez daquilo que realmente costuma fazer.", "Por isso, é necessário responder considerando o comportamento efetivo:", "“Como eu realmente ajo nessa situação?”", "E não:", "“Qual seria a resposta que parece mais correta?”", "O exercício de autoconhecimento ajuda a identificar tendências, mas a Liderança Situacional exige que o líder consiga ir além de sua preferência pessoal e faça a leitura da situação.", "Mapa da Aula 12", "LIDERANÇA SITUACIONAL", "→ analisar liderado + tarefa + situação", "→ competência", "→ autonomia", "→ envolvimento/motivação", "→ necessidade de direcionamento e relacionamento", "S1 — DIRECIONADOR", "→ tarefa alta", "→ relacionamento baixo", "→ fornecer diretrizes", "S2 — ORIENTADOR", "→ tarefa alta", "→ relacionamento alto", "→ orientar + acompanhar", "S3 — APOIADOR", "→ tarefa baixa", "→ relacionamento alto", "→ apoiar + feedback + proximidade", "S4 — DELEGADOR", "→ tarefa baixa", "→ relacionamento baixo", "→ autonomia + acompanhamento pontual", "CAMINHO TRABALHADO NA AULA", "DIRECIONAR → ORIENTAR → APOIAR → DELEGAR", "REGRA CENTRAL", "Delegar não é abandonar.", "A delegação pressupõe que o liderado tenha condições para assumir aquela responsabilidade."], "memory": "A atividade realizada em sala também teve como objetivo fazer cada estudante observar suas próprias tendências."}], "case": "Uma empresa contrata Rafael, marceneiro com vários anos de experiência. Embora saiba fabricar móveis, ele nunca trabalhou com os modelos utilizados pela nova empresa. Inicialmente, o líder apresenta projetos, padrões e procedimentos e acompanha sua execução. Depois de algum tempo, Rafael já conhece o processo, mas ainda recebe orientação e acompanhamento. Mais tarde, demonstra domínio completo da tarefa, embora em determinado período apresente insegurança e precise de apoio e feedback. Após consolidar sua autonomia, recebe sozinho a responsabilidade por novas encomendas, enquanto o líder acompanha apenas metas e resultados. O caso representa a lógica da Liderança Situacional: S1 Direcionar → S2 Orientar → S3 Apoiar → S4 Delegar, conforme mudam a competência, a autonomia e as necessidades do liderado diante da tarefa."}, "13": {"title": "Revisão do Ecossistema da Liderança: Poder, Estilos e Modelos de Liderança", "blocks": [{"title": "O ecossistema da liderança", "paras": ["Os principais conteúdos que formam o ecossistema da liderança. A proposta é compreender os conceitos de maneira integrada, conectando motivação, poder e formas de atuação do líder.", "Nesse conjunto aparecem:", "- conceito de líder e poder;", "- matrizes de motivação;", "- bases e tipologias de poder;", "- relação entre poder e motivação;", "- liderança autocrática, democrática e liberal;", "- liderança transacional;", "- liderança transformacional;", "- liderança servidora;", "- liderança situacional.", "O objetivo não é apenas reconhecer os nomes, mas compreender de onde vem a influência do líder, como ele exerce essa influência e quais comportamentos aparecem na relação com os liderados."], "memory": "Os principais conteúdos que formam o ecossistema da liderança. A proposta é compreender os conceitos de maneira integrada, conectando motivação, poder e formas de atuação do líder."}, {"title": "Bases de poder e comportamento de liderança", "paras": ["A posição formal ocupada por uma pessoa não determina, sozinha, a maneira como ela irá liderar.", "Um profissional pode possuir poder legítimo porque ocupa formalmente determinado cargo e, mesmo assim, adotar uma atuação democrática.", "Por isso, é necessário distinguir:", "Base de poder", "→ indica de onde vem a possibilidade de influência.", "Estilo ou modelo de liderança", "→ indica como o líder atua diante das pessoas e das situações.", "Essa distinção permite compreender por que dois gestores que ocupam cargos semelhantes podem liderar de maneiras completamente diferentes."], "memory": "A posição formal ocupada por uma pessoa não determina, sozinha, a maneira como ela irá liderar."}, {"title": "Liderança Autocrática", "paras": ["Na liderança autocrática, o poder permanece fortemente centralizado no líder.", "O poder legítimo aparece com destaque porque a autoridade está relacionada à posição ocupada na estrutura organizacional.", "O líder utiliza sua autoridade para manter a centralização das decisões e exercer controle sobre a execução.", "Entre as características retomadas na aula estão:", "- centralização;", "- autoridade;", "- controle;", "- baixa tolerância;", "- preocupação com a execução;", "- microgerenciamento.", "O líder tende a decidir e determinar aquilo que deverá ser realizado.", "AUTOCRÁTICO → centralização + autoridade + controle"], "memory": "Na liderança autocrática, o poder permanece fortemente centralizado no líder."}, {"title": "Poder legítimo não significa necessariamente liderança autocrática", "paras": ["Um ponto importante da revisão é que possuir poder legítimo não transforma automaticamente alguém em líder autocrático.", "Uma pessoa pode ter sido:", "- promovida;", "- contratada para uma função de gestão;", "- formalmente colocada naquela posição.", "Consequentemente, possui autoridade decorrente do cargo.", "Entretanto, na prática, pode ouvir sua equipe, compartilhar decisões e incentivar a participação.", "Nesse caso, existe poder legítimo decorrente da posição, mas o comportamento pode ser democrático.", "Portanto:", "CARGO ≠ ESTILO DE LIDERANÇA"], "memory": "Um ponto importante da revisão é que possuir poder legítimo não transforma automaticamente alguém em líder autocrático."}, {"title": "Liderança Democrática", "paras": ["O líder democrático trabalha de maneira mais participativa e compartilhada.", "Ele procura incluir outras pessoas nas discussões e decisões, atuando como moderador dos debates e favorecendo a construção de consenso.", "Entre os atributos destacados na aula aparecem:", "- escuta ativa;", "- participação;", "- empatia;", "- flexibilidade;", "- tolerância à pluralidade;", "- compartilhamento das decisões;", "- abertura a diferentes pontos de vista.", "O professor sintetiza essa postura pela ideia de que “um ponto de vista é
