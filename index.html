const D2={"juliana": [{"title": "Aula 1 — Gestão de Pessoas e Métodos de Aplicação", "sections": [["1. Transição para o novo núcleo formativo", "No primeiro bimestre, o núcleo formativo esteve voltado à Psicologia, Saúde e Bem-Estar do Trabalhador, abordando temas como riscos psicossociais, GRO, inclusão, Lei de Cotas, racismo estrutural e condições de trabalho.\n\nNo segundo bimestre, inicia-se o núcleo Gestão de Pessoas e Métodos de Aplicação. A proposta passa a aprofundar como as organizações administram, desenvolvem e acompanham as pessoas e como a Psicologia participa desses processos."], ["2. Gestão de Pessoas", "A Gestão de Pessoas pode ser compreendida como um conjunto de estratégias, práticas e processos destinados a atrair, desenvolver, engajar e reter profissionais dentro de uma organização.\n\nEmbora muitas dessas atividades estejam associadas ao setor de Recursos Humanos, a Gestão de Pessoas ultrapassa as funções administrativas e assume uma dimensão estratégica.\n\nIsso ocorre porque são as pessoas que executam as atividades, produzem conhecimento e contribuem diretamente para os objetivos da organização.\n\nGerir pessoas não significa apenas contratar funcionários, organizar documentos ou administrar salários. A organização precisa pensar em como desenvolver competências técnicas e comportamentais e criar condições para que os profissionais desempenhem adequadamente suas funções.\n\nA Gestão de Pessoas procura estabelecer uma relação de equilíbrio entre os objetivos da organização e as necessidades dos trabalhadores.\n\nUma gestão inadequada pode contribuir para: desmotivação; conflitos; baixa produtividade; problemas de comunicação; rotatividade de profissionais.\n\nPor outro lado, práticas estruturadas de gestão podem favorecer o desenvolvimento profissional, o envolvimento dos trabalhadores, a inovação e a permanência de talentos."], ["3. Gestão de Pessoas, resultados e Cultura Organizacional", "A Gestão de Pessoas funciona como uma conexão entre pessoas e resultados. Não basta buscar produtividade. É necessário compreender quais condições favorecem o desempenho e como a organização pode proporcionar um ambiente no qual os profissionais tenham condições de contribuir efetivamente.\n\nA Gestão de Pessoas interfere diretamente na Cultura Organizacional.\n\nDecisões relacionadas à contratação, liderança, reconhecimento, comunicação e desenvolvimento mostram aos trabalhadores aquilo que a organização realmente valoriza.\n\nPor isso, a cultura não é formada apenas pelo que a empresa declara formalmente. Ela também é construída pelas experiências concretas vivenciadas pelos trabalhadores.\n\nMissão, valores e práticas da organização estão relacionados a essa cultura."], ["4. Recrutamento, Seleção e Desenvolvimento", "O recrutamento e a seleção buscam identificar profissionais que apresentem características compatíveis com as exigências do cargo e com a cultura da organização.\n\nUma seleção adequada não deve considerar apenas conhecimentos técnicos. Também podem ser analisados aspectos como competências comportamentais, capacidade de relacionamento, potencial de desenvolvimento e alinhamento com os valores organizacionais.\n\nPor isso, um processo seletivo pode utilizar diferentes recursos, como entrevistas e testes, buscando compreender o candidato de maneira mais ampla.\n\nA Gestão de Pessoas não termina na contratação. O profissional precisa ser acompanhado e ter possibilidades de desenvolvimento.\n\nNesse processo, o feedback assume importância especial. Não é adequado permitir que o trabalhador descubra somente no final de um processo que seu desempenho estava abaixo do esperado.\n\nA devolutiva permite que ele compreenda o que está adequado, o que precisa ser modificado e como pode melhorar seu desempenho.\n\nA professora também destaca a importância da atuação técnica da Psicologia nesses processos, inclusive diante de situações delicadas de avaliação e acompanhamento profissional."], ["5. Motivação, Reconhecimento e Engajamento", "Motivar profissionais não significa apenas oferecer recompensas financeiras.\n\nO salário continua importante, mas outros elementos também interferem na relação do trabalhador com seu trabalho, como reconhecimento, possibilidade de desenvolvimento, autonomia, qualidade das relações e sentimento de pertencimento.\n\nReconhecimento também pode ocorrer quando alguém recebe uma devolutiva positiva sobre aquilo que realizou adequadamente.\n\nA professora enfatiza que uma pessoa pode inclusive preferir determinadas condições de trabalho a um salário maior quando encontra um ambiente no qual se sente melhor e consegue desempenhar suas atividades com maior tranquilidade.\n\nO engajamento está relacionado à disposição do trabalhador para participar ativamente da organização e contribuir para seus objetivos.\n\nPara favorecê-lo, é importante que a pessoa perceba significado em seu trabalho e que suas contribuições sejam reconhecidas.\n\nPolíticas de reconhecimento, planos de carreira, oportunidades de aprendizagem e benefícios podem fortalecer o vínculo entre trabalhador e organização. A ausência de reconhecimento, por outro lado, pode contribuir para a perda de profissionais."], ["6. Clima Organizacional × Cultura Organizacional", "Clima Organizacional está relacionado à percepção dos colaboradores sobre o ambiente de trabalho, envolvendo relacionamentos, liderança, comunicação, crescimento e condições de trabalho. O clima pode apresentar mudanças mais rápidas, por exemplo, quando ocorrem alterações na liderança, comunicação ou condições de trabalho.\n\nCultura Organizacional envolve valores, crenças, práticas e padrões compartilhados que orientam como as pessoas agem dentro da organização. É mais profunda e está relacionada à identidade construída pela organização ao longo do tempo.\n\n🧠 Clima = como as pessoas percebem e vivenciam o ambiente naquele contexto.\n🧠 Cultura = valores, crenças e padrões construídos ao longo do tempo.\n\nOs dois conceitos são relacionados, mas não são sinônimos."], ["7. Papel do Psicólogo na Gestão de Pessoas", "A atuação do psicólogo organizacional exige considerar simultaneamente a pessoa, o trabalho e a organização.\n\nA professora reforça a necessidade de uma postura profissional e técnica. Mesmo quando o psicólogo conhece pessoalmente os envolvidos em determinado conflito, sua atuação não deve se transformar simplesmente em julgamento de quem está “certo” ou “errado”.\n\nAlém disso, modificar práticas organizacionais pode ser difícil porque determinados padrões de liderança e de funcionamento podem estar consolidados há muito tempo.\n\nAssim, o psicólogo pode atuar em processos como seleção, desenvolvimento, avaliação, feedback e análise das relações e das condições organizacionais, mantendo um olhar técnico sobre os processos de Gestão de Pessoas."]], "case": "Uma empresa apresenta alta rotatividade e queda no desempenho. Os trabalhadores relatam que recebem ordens sem possibilidade de diálogo, raramente recebem feedback, não sabem claramente o que precisam melhorar e afirmam que bons resultados quase nunca são reconhecidos. Apesar de a empresa declarar oficialmente que “as pessoas são seu maior valor”, essas experiências fazem parte da rotina dos funcionários. A situação demonstra que a Gestão de Pessoas não pode ficar restrita às funções administrativas: é necessário analisar comunicação, liderança, reconhecimento, desenvolvimento, clima e as próprias práticas que concretizam a cultura da organização.", "question": "Uma organização percebe aumento da rotatividade e decide oferecer um bônus financeiro aos funcionários. Entretanto, os trabalhadores continuam relatando ausência de reconhecimento, poucas oportunidades de desenvolvimento, dificuldades na relação com a liderança e problemas de comunicação. Considerando o conteúdo da aula, qual interpretação é mais adequada?", "options": ["A) Reforçar o bônus e acompanhar seus efeitos, pois a recompensa financeira pode ampliar o envolvimento e reduzir a saída de profissionais.", "B) Rever também reconhecimento, desenvolvimento, liderança e comunicação, pois esses elementos interferem no vínculo e no engajamento profissional.", "C) Ajustar o recrutamento e a seleção, buscando profissionais com perfil mais compatível com as exigências e práticas atuais da organização.", "D) Concentrar a análise na cultura organizacional, verificando se os valores declarados estão alinhados às expectativas dos trabalhadores."], "answer": "B"}], "cesar": [{"title": "Aula 2 — Mercado de Trabalho na Atualidade", "sections": [["1. O trabalho contemporâneo e suas transformações", "O mercado de trabalho atual não pode ser compreendido apenas como uma relação entre trabalhador e emprego. Para a Psicologia Organizacional e do Trabalho, o trabalho participa da construção da identidade, do sentimento de utilidade e do pertencimento coletivo.\n\nO modelo tradicional, marcado por contratos mais estáveis, trajetórias profissionais previsíveis e separação mais definida entre trabalho e vida pessoal, vem sendo transformado. Surgem relações mais flexíveis, novas formas de contratação, mudanças tecnológicas e maior responsabilização do próprio trabalhador pela manutenção de sua empregabilidade.\n\nNesse contexto, a Psicologia precisa analisar não somente as características individuais, mas também as condições concretas e sociais em que o trabalho ocorre."], ["2. Plataformização, tecnologia e gestão algorítmica", "A expansão de aplicativos, plataformas digitais, inteligência artificial e da chamada gig economy modifica as relações de trabalho.\n\nAs plataformas não funcionam apenas como intermediárias. Elas podem organizar e controlar o trabalho por meio de algoritmos, avaliações, métricas e mecanismos de acompanhamento do desempenho.\n\nO controle que anteriormente poderia ocorrer diretamente por uma chefia passa a ser realizado também por sistemas digitais. Métricas, avaliações automatizadas e mecanismos pouco transparentes podem determinar ritmo, acesso às atividades e avaliação do trabalhador. Isso pode favorecer vigilância algorítmica, isolamento e redução do apoio entre trabalhadores.\n\nA tecnologia também modifica as competências exigidas pelo mercado. A introdução de inteligência artificial e automação não significa simplesmente o desaparecimento do trabalho humano. Novas tecnologias alteram funções e criam a necessidade de aprendizagem e qualificação.\n\nA discussão realizada em sala enfatiza, portanto, a importância de saber utilizar essas ferramentas de maneira adequada, compreender suas possibilidades e desenvolver competências para acompanhar as transformações do trabalho."], ["3. Micro, Pequenas e Médias Empresas — MPMEs", "As Micro, Pequenas e Médias Empresas possuem características organizacionais próprias e não devem ser analisadas exatamente da mesma maneira que grandes organizações.\n\nEm empresas familiares, vínculos pessoais e de parentesco podem se misturar aos critérios técnicos da organização. Isso pode gerar dificuldades em situações como promoção, definição de funções, tomada de decisão e resolução de conflitos. O psicólogo precisa compreender simultaneamente os aspectos técnicos, relacionais e institucionais presentes nessas organizações.\n\nEm estruturas menores, é comum que uma mesma pessoa desempenhe diversas funções. Nem sempre existem setores especializados e sistemas formais de Recursos Humanos. Essa realidade pode produzir sobrecarga de papéis e exige do psicólogo uma leitura adequada ao tamanho e às condições reais da organização.\n\nAlém disso, quando o contato com proprietários e fundadores é muito direto, características da própria liderança podem influenciar fortemente o clima organizacional."], ["4. Empreendedorismo de oportunidade × empreendedorismo de sobrevivência", "Empreendedorismo de oportunidade ocorre quando há planejamento, identificação de uma oportunidade ou nicho e busca deliberada por maior autonomia e realização.\n\nEmpreendedorismo de sobrevivência pode surgir da ausência de alternativas no emprego formal e da necessidade imediata de obtenção de renda. Nesse caso, o trabalhador pode enfrentar jornadas extensas, ausência de descanso remunerado, instabilidade financeira, isolamento e dificuldade de separar trabalho e vida pessoal.\n\nA aula chama atenção para o risco de interpretar toda forma de empreendedorismo como sinônimo automático de liberdade e autonomia. A condição concreta em que a atividade ocorre precisa ser analisada."], ["5. Trabalho no Serviço Público", "O serviço público constitui um campo específico de atuação profissional e apresenta diferentes contextos nos âmbitos municipal, estadual e federal.\n\nA estabilidade funcional pode oferecer proteção contra determinadas formas de desligamento, mas não significa ausência de sofrimento no trabalho.\n\nO trabalhador pode experimentar dificuldades relacionadas à burocracia, rigidez organizacional, pouca possibilidade de mudança, conflitos institucionais, desgaste emocional e sensação de aprisionamento profissional.\n\nA discussão realizada em sala também destacou que uma rotina extremamente repetitiva ou a percepção de poucas possibilidades de mudança podem afetar a relação da pessoa com o próprio trabalho.\n\nAssim, a Psicologia não deve partir da ideia de que estabilidade profissional é sinônimo de bem-estar psicológico."], ["6. Trabalho presencial, remoto e híbrido", "Trabalho presencial favorece contato direto, interação espontânea e construção cotidiana das relações, mas pode envolver deslocamentos cansativos, menor flexibilidade e dificuldades de conciliação entre vida pessoal e profissional.\n\nTrabalho remoto pode eliminar deslocamentos e proporcionar maior flexibilidade, porém também pode provocar diluição dos limites entre trabalho e vida pessoal, isolamento e dificuldade de desconexão.\n\nTrabalho híbrido combina características do presencial e do remoto. Pode proporcionar maior equilíbrio, mas também pode gerar dificuldades de comunicação, agendas fragmentadas e necessidade constante de adaptação.\n\nDireito à desconexão: celulares, plataformas e sistemas corporativos permitem que o trabalho ultrapasse facilmente o horário formal. Mensagens, notificações e demandas podem alcançar o trabalhador durante períodos destinados ao descanso. Por isso, a desconexão é importante para a recuperação física e psicológica."], ["7. Contrato psicológico e novas carreiras", "Contrato psicológico é o conjunto de expectativas e percepções sobre aquilo que trabalhador e organização esperam um do outro, envolvendo crenças sobre obrigações recíprocas entre empregado e empregador. Quando essas expectativas são rompidas, podem ocorrer mudanças na relação entre a pessoa e a organização.\n\nCarreira Proteana: a carreira passa a ser conduzida principalmente pelo próprio indivíduo, orientada por seus valores e pela percepção pessoal de sucesso.\n\nCarreira sem Fronteiras: a trajetória profissional não precisa permanecer vinculada a uma única organização. Pode envolver diferentes empresas, funções, áreas e competências transferíveis entre contextos.\n\nAssim, as carreiras contemporâneas podem apresentar trajetórias menos lineares e maior mobilidade profissional."], ["8. Saúde mental e adoecimento relacionado ao trabalho", "Burnout é apresentado como fenômeno ocupacional relacionado ao estresse crônico no trabalho e trabalha três dimensões: Exaustão emocional — esgotamento da energia psíquica; Despersonalização/cinismo — distanciamento, frieza e postura defensiva em relação ao trabalho e às pessoas; Baixa realização profissional — percepção negativa sobre a própria atuação e perda do sentido atribuído ao trabalho.\n\nA discussão não deve reduzir o adoecimento a uma fragilidade individual. É necessário analisar as condições e a organização do trabalho.\n\nQuiet Quitting: o material relaciona a “demissão silenciosa” à recusa de realizar atividades além daquilo que está previsto no contrato, como uma forma de autopreservação.\n\nGreat Resignation: refere-se ao movimento de desligamento voluntário de organizações consideradas abusivas ou tóxicas.\n\nBusca por propósito: aparece a procura por trabalhos mais compatíveis com valores pessoais, saúde e sentido atribuído à atividade profissional."], ["9. Gerações e Segurança Psicológica", "O ambiente de trabalho contemporâneo reúne diferentes gerações, que podem apresentar expectativas distintas em relação à autoridade, carreira, estabilidade, propósito e comunicação. A aula apresenta a convivência entre Baby Boomers, Geração X, Millennials/Geração Y e Geração Z.\n\nEssas diferenças podem produzir tensões, mas não devem ser tratadas simplesmente como defeitos individuais. A gestão precisa compreender diferentes expectativas e desenvolver formas adequadas de comunicação e liderança.\n\nSegurança psicológica corresponde a um ambiente no qual as pessoas se sentem livres para falar, fazer perguntas, assumir riscos interpessoais e apontar erros sem medo de punição, ridicularização ou represálias.\n\nQuando existe uma cultura de medo, os trabalhadores podem esconder problemas e deixar de comunicar erros importantes. Assim, o erro pode ser utilizado como oportunidade de aprendizagem quando existe um ambiente que permite sua discussão de maneira segura."], ["10. O papel diagnóstico e ético da Psicologia Organizacional", "Um ponto central do material é evitar a psicologização das carências estruturais.\n\nIsso significa que problemas produzidos pelas condições de trabalho não devem ser automaticamente explicados como fragilidades psicológicas individuais.\n\nMetas desumanas, sobrecarga, assédio e conflitos organizacionais não devem ser tratados apenas com estratégias destinadas a fazer o trabalhador “suportar melhor” a situação.\n\nO psicólogo deve analisar indicadores como absenteísmo, presenteísmo e rotatividade como possíveis sinais de problemas organizacionais e investigar as condições que estão produzindo esses fenômenos.\n\nA atuação psicológica deve, portanto, contribuir para transformar os processos de trabalho e preservar a dignidade humana."]], "case": "Uma pequena empresa familiar adota novas ferramentas de inteligência artificial e sistemas digitais para aumentar a produtividade. Como não possui um setor formal de RH, alguns trabalhadores acumulam funções, recebem mensagens fora do expediente e são avaliados continuamente por indicadores digitais. A direção interpreta o aumento da rotatividade e do esgotamento como falta de adaptação dos funcionários às novas tecnologias. A análise da Psicologia Organizacional, entretanto, exige observar conjuntamente a estrutura da empresa, o acúmulo de funções, a gestão tecnológica, os limites entre trabalho e descanso, o clima organizacional e os indicadores de sofrimento, evitando transformar problemas das condições de trabalho em supostas fragilidades individuais.", "question": "Uma organização apresenta aumento simultâneo de afastamentos, rotatividade e relatos de esgotamento. A direção propõe oferecer aos trabalhadores uma palestra sobre “resiliência”, sem modificar metas, jornadas ou práticas de gestão. Considerando a perspectiva apresentada no material, qual deve ser a análise do psicólogo organizacional?", "options": ["A) Desenvolver recursos individuais de enfrentamento e observar se a maior capacidade de adaptação reduz os afastamentos e o esgotamento.", "B) Investigar metas, jornadas e práticas de gestão, tratando os indicadores como possíveis sinais relacionados às condições de trabalho.", "C) Avaliar a adaptação dos profissionais às exigências atuais e direcionar ações de capacitação para aqueles com maior dificuldade.", "D) Examinar motivação e reconhecimento das equipes, priorizando intervenções que fortaleçam o envolvimento dos trabalhadores com a organização."], "answer": "B"}], "patricia": [], "mariana": []};

const AUTH_KEY='psicoUserV1', NOTES_KEY='psicoNotesV1';

function createLocalAccount(){
 const name=document.getElementById('authName').value.trim(),email=document.getElementById('authEmail').value.trim(),birth=document.getElementById('authBirth').value,p=document.getElementById('authPass').value,p2=document.getElementById('authPass2').value,msg=document.getElementById('authMsg');
 if(!name||!email||!birth||!p){msg.textContent='Preencha todos os campos.';return}
 if(p.length<6){msg.textContent='Use uma senha com pelo menos 6 caracteres.';return}
 if(p!==p2){msg.textContent='As senhas não coincidem.';return}
 // Protótipo local: não persiste a senha. Autenticação real será ligada ao backend na hospedagem.

 if(!u){msg.textContent='Ainda não há uma conta criada neste navegador.';return}

 u.logged=true;localStorage.setItem(AUTH_KEY,JSON.stringify(u));updateUserChip();setAuthLocked(false);home();

function noteFromStudy(title,concept,meta='Conteúdo de estudo'){
 const safeTitle=String(title||'Conceito'),safeConcept=String(concept||'');
 const id='note-'+Date.now();
 const box=document.createElement('div');box.className='note-panel';box.id=id;
 box.innerHTML=`<b>${safeTitle}</b><div class="concept-box">${safeConcept}</div><label><b>Minha anotação</b></label><textarea placeholder="Escreva o que você quer lembrar sobre este conceito..."></textarea><div class="note-actions"><button class="primary">Salvar anotação</button><button class="note-btn">Cancelar</button></div>`;
 const host=document.querySelector('.step,.lesson,.card,.content')||M;host.appendChild(box);
 const buttons=box.querySelectorAll('button');
 buttons[0].onclick=()=>{const txt=box.querySelector('textarea').value.trim();if(!txt)return;const a=getNotes();a.unshift({id:Date.now(),title:safeTitle,concept:safeConcept,text:txt,meta,date:new Date().toLocaleDateString('pt-BR')});saveNotes(a);box.innerHTML='<b>✓ Anotação salva no Caderno</b>'};
 buttons[1].onclick=()=>box.remove();
 box.scrollIntoView({behavior:'smooth',block:'center'});
}

  const p=getStudyProfile();
  if(!p){
    M.innerHTML=`<div class="home-shell"><div class="home-welcome"><div><h1>Seu espaço de estudo</h1><p>Organize o que você está estudando e transforme isso em uma rotina.</p></div></div>
    <div class="empty-state"><div style="font-size:36px">🧠</div><h2>Monte sua Home</h2><p>Selecione o núcleo formativo, o bimestre e os professores que fazem parte do seu momento atual. Depois, defina os dias e o tempo que pretende estudar.</p><button class="primary" onclick="studySetup()">Configurar meus estudos</button></div></div>`;
    return;
  }
  const routine=routineItems(p);
  const profText=p.profs.join(', ');
  M.innerHTML=`<div class="home-shell">
    <div class="home-welcome"><div><h1>Minha rotina de estudos</h1><p>A Home mostra apenas o que você escolheu estudar neste período.</p></div><button class="mini-btn" onclick="studySetup()">✎ Alterar seleção</button></div>
    <section class="home-focus"><div class="home-focus-head"><h2>O que estou estudando agora</h2><span class="badge">FOCO ATUAL</span></div>
      <div class="focus-grid"><div class="focus-box"><small>Núcleo formativo</small><b>${p.nucleus}</b></div><div class="focus-box"><small>Bimestre</small><b>${p.bimester}º Bimestre</b></div><div class="focus-box"><small>Professores</small><b>${profText}</b></div></div>
    </section>
    <div class="home-grid">
      <section class="dash-card"><h2>Minha rotina</h2>${routine.length?routine.map(r=>`<div class="today-item"><span class="today-dot"></span><span class="time-pill">${r.time}</span><div class="today-main"><b>${r.name}</b><small>${r.min} minutos de estudo</small></div><span class="status-chip">${p.bimester}º bim.</span></div>`).join(''):`<div class="empty-state" style="padding:18px"><p>Você ainda não escolheu dias de estudo.</p><button class="mini-btn" onclick="studySetup()">Montar rotina</button></div>`}</section>
      <section class="dash-card"><h2>Acesso rápido</h2><div class="quick-actions">
        <button class="quick" onclick="openBimester(${p.bimester})"><b>▶ Continuar estudando</b><small>Abrir ${p.bimester}º Bimestre</small></button>
        <button class="quick" onclick="plannerHome()"><b>▣ Meu Planner</b><small>Ver minha semana</small></button>
        ${p.bimester===1?`<button class="quick" onclick="quizHome()"><b>✓ Fazer quiz</b><small>Revisar o 1º Bimestre</small></button>`:''}
        <button class="quick" onclick="comingSoon('Cronograma')"><b>◷ Cronograma</b><small>Provas e entregas</small></button>
      </div></section>
      <section class="dash-card"><h2>Meu progresso neste foco</h2><p class="mut">O progresso será construído conforme você concluir jornadas e quizzes do conteúdo selecionado.</p><div class="progress-line"><i style="width:0%"></i></div><small class="mut">Comece uma jornada para registrar seu avanço.</small></section>
      <section class="dash-card"><h2>Meu foco</h2><p class="mut">Sua Home não mistura todos os bimestres. Ela acompanha apenas <b>${p.nucleus} • ${p.bimester}º Bimestre</b> e os professores selecionados.</p><button class="mini-btn" onclick="studySetup()">Ajustar foco</button></section>
    </div>
  </div>`;
}
function plannerHome(){if(!requireAuth())return;
  const p=getStudyProfile();
  if(!p){studySetup();return}
  const routine=routineItems(p);
  M.innerHTML=`<div class="setup"><button class="back" onclick="home()">← Home</button><section class="hero"><span class="tag">PLANNER DE ESTUDOS</span><h1>Minha semana</h1><p>Sua rotina foi montada a partir dos dias e tempos escolhidos na Home.</p></section>
  <div class="planner-week">${routine.length?routine.map(r=>`<article class="day-card"><h3>${r.name}</h3><p><b>${r.time}</b> • ${r.min} minutos</p><p>${p.nucleus} • ${p.bimester}º Bimestre</p><span class="badge">${p.profs.join(' • ')}</span></article>`).join(''):`<div class="empty-state"><h2>Rotina ainda vazia</h2><p>Escolha os dias e horários em que pretende estudar.</p><button class="primary" onclick="studySetup()">Montar rotina</button></div>`}</div></div>`;
}
function comingSoon(name){if(!requireAuth())return;
  M.innerHTML=`<div class="setup"><button class="back" onclick="home()">← Home</button><section class="hero"><span class="tag">PSICO EM FORMAÇÃO</span><h1>${name}</h1><p>Esta área já está posicionada na estrutura do site e será desenvolvida sem duplicar funções do Núcleo Formativo ou do Planner.</p></section></div>`;
}

function openSubject(id){if(!requireAuth())return;let s=D.subjects.find(x=>x.id===id),js=D.journeys[id]||[];M.innerHTML=`<button class="back" onclick="openBimester(1)">← 1º Bimestre</button><h1>${s.name}</h1><p class="mut">${s.prof?'Prof. '+s.prof+' • ':''}Escolha uma jornada.</p>${js.length?js.map((j,i)=>`<div class="topic" onclick="start('${id}',${i})"><div><b>${j.title}</b><div class="mut">${j.map?'Revisão visual • conceitos-chave do bimestre':j.steps.length+1+' etapas • teoria + objetiva + estudo de caso'}</div></div><b>→</b></div>`).join(''):`<div class="card"><b>${s.status}</b></div>`}`}
function start(sid,ji){if(!requireAuth())return;cur={sid,ji,si:0};let j=D.journeys[sid][ji];if(j.map){showMap(j);return}show()}
function showMap(j){if(!requireAuth())return;let s=D.subjects.find(x=>x.id===cur.sid);M.innerHTML=`<div class="concept-wrap"><button class="back" onclick="openSubject('${cur.sid}')">← Jornadas</button><section class="concept-head"><span class="tag">MAPA DE REVISÃO</span><h1>${j.title}</h1><p>Conceitos-chave das aulas deste bimestre. Este mapa cresce junto com as próximas aulas da Prof. ${s.prof}.</p></section><div class="concept-grid">${j.concepts.map(c=>`<article class="concept-card"><div class="concept-icon">${c.icon}</div><span class="concept-tag">${c.tag}</span><h3>${c.title}</h3><p>${c.text}</p>${c.extra?`<p><b>Psicólogo:</b> ${c.extra}</p>`:''}</article>`).join('')}<section class="concept-link"><h3>🔗 Conexão para lembrar</h3><p>${j.connection||'<b>GRO</b> é o processo de gerenciamento; <b>PGR</b> organiza e documenta esse gerenciamento. <b>CIPAA</b> participa da prevenção; <b>Psicologia Organizacional e do Trabalho</b> pode atuar junto à comissão nas dimensões humanas, relacionais e psicossociais.'}</p></p><p><b>Risco psicossocial</b> é uma condição de trabalho; <b>adoecimento</b> é uma possível consequência — não são a mesma coisa.</p></section></div></div>`}
function formatBody(body){
  const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const parts=[];
  body.split(/\n/).forEach(line=>{
    const t=line.trim();
    if(!t){ parts.push('<div class="study-gap"></div>'); return; }
    if(/^•\s+/.test(t)){
      const txt=t.replace(/^•\s+/,"");
      const m=txt.match(/^([^:]{2,160}):\s*(.*)$/);
      if(m){
        parts.push(`<div class="study-topic"><strong>• ${esc(m[1])}:</strong>${m[2]?`<div>${esc(m[2])}</div>`:''}</div>`);
      } else {
        parts.push(`<div class="study-topic"><strong>• ${esc(txt)}</strong></div>`);
      }
    } else {
      parts.push(`<p>${esc(t)}</p>`);
    }
  });
  return parts.join("");
}
function show(){if(!requireAuth())return;setTimeout(addNoteButtons,0);let s=D.subjects.find(x=>x.id===cur.sid),j=D.journeys[cur.sid][cur.ji],total=j.steps.length+1,isCase=cur.si===j.steps.length,pct=Math.round((cur.si+1)/total*100);let content;if(isCase){content=caseHTML(j)}else{let x=j.steps[cur.si];content=`<div class="body">${formatBody(x.body)}</div>${x.check?quizHTML(x.check):''}`}M.innerHTML=`<div class="journey"><button class="back" onclick="openSubject('${cur.sid}')">← Jornadas</button><div class="pmeta"><span>Etapa ${cur.si+1} de ${total}</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div><article class="lesson"><span class="prof">${s.prof?'Prof. '+s.prof:'Jornada guiada'}</span><h1>${isCase?'Estudo de caso':j.steps[cur.si].title}</h1><div class="sub">${isCase?'Aplicação integrada no padrão de avaliação':j.steps[cur.si].sub}</div>${content}${!isCase?`<div class="actions"><button class="ghost" onclick="prev()">← Voltar</button><button class="primary" onclick="next()">Continuar →</button></div>`:''}</article></div>`}
function quizHTML(q){return `<div class="quiz"><b>Checagem objetiva</b><p>${q.q}</p>${q.opts.map((o,i)=>`<button onclick="answerMC(this,${i},${q.ans},${JSON.stringify(q.why).replace(/"/g,'&quot;')})">${String.fromCharCode(65+i)}) ${o}</button>`).join('')}<div class="qfeed"></div></div>`}
function answerMC(btn,i,ans,why){let box=btn.parentElement;box.querySelectorAll('button').forEach(b=>b.classList.remove('ok','no'));btn.classList.add(i===ans?'ok':'no');box.querySelector('.qfeed').innerHTML=i===ans?`✓ <b>Correto.</b> ${why}`:`✕ <b>Não é a melhor alternativa.</b> ${why}`}
function caseHTML(j){return `<div class="case"><b>Cenário / tarefa</b><p>${j.case.prompt}</p></div><h3>Sua resposta</h3><textarea id="answer" placeholder="Responda antes de liberar a correção..."></textarea><button class="primary" style="width:100%;margin-top:12px" onclick="correctCase()">Corrigir minha resposta</button><div id="feedback"></div><div class="actions"><button class="ghost" onclick="prev()">← Voltar</button></div>`}
function correctCase(){let j=D.journeys[cur.sid][cur.ji],a=document.getElementById('answer'),f=document.getElementById('feedback');if(!a.value.trim()){f.innerHTML='<div class="feedback"><b>Escreva sua tentativa primeiro.</b><p>A resposta esperada só aparece depois que você se compromete com uma resposta.</p></div>';return}let r=a.value.toLowerCase();let found=j.case.criteria.map(c=>{let words=c.toLowerCase().split(/[^a-záàâãéêíóôõúç]+/).filter(w=>w.length>4);return [c,words.some(w=>r.includes(w))]});f.innerHTML=`<div class="feedback"><h3>Correção orientada</h3><p>Use os critérios abaixo para comparar sua construção. A checagem automática é apenas um apoio; o mais importante é verificar se o raciocínio aparece de forma explícita.</p><div class="crit">${found.map(x=>`<span>${x[1]?'✓':'○'} ${x[0]}</span>`).join('')}</div><h3>Resposta esperada</h3><p>${j.case.expected}</p><button class="primary" onclick="finish()">Concluir jornada</button></div>`;f.scrollIntoView({behavior:'smooth',block:'start'})}
function finish(){alert('Jornada concluída. Esta tentativa poderá futuramente alimentar seu progresso e suas lacunas de revisão.');openSubject(cur.sid)}
function next(){cur.si++;show()}function prev(){if(cur.si>0){cur.si--;show()}else openSubject(cur.sid)}updateUserChip();
const __u=getUser();
if(!__u||!__u.logged){setAuthLocked(true);authScreen('login')}else{setAuthLocked(false);home()}
</script></body></html>
