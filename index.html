tem diferenças relacionadas a:\n\n- história;\n\n- experiência;\n\n- preparação;\n\n- características individuais;\n\n- tempo de desenvolvimento;\n\n- condições disponíveis.\n\nO exemplo utilizado é o de dois corredores. Um atleta pode treinar durante muitas horas porque desenvolveu essa capacidade ao longo de anos. Uma pessoa que está começando não necessariamente poderá reproduzir imediatamente a mesma rotina e obter o mesmo resultado.\n\nAssim:\n\nMODELAR ≠ GARANTIR O MESMO RESULTADO"}, {"title": "Modelagem nas organizações", "body": "A modelagem também pode aparecer dentro das organizações.\n\nUm profissional recém-chegado pode observar alguém que apresenta bons resultados e tentar reproduzir:\n\n- sua rotina;\n\n- seus métodos;\n\n- suas estratégias;\n\n- seus comportamentos;\n\n- suas formas de trabalhar.\n\nIsso pode ser utilizado como referência, mas se torna problemático quando a organização ignora as diferenças entre as pessoas.\n\nA aula cita situações em equipes comerciais nas quais profissionais que não conseguem atingir metas tentam reproduzir exatamente o comportamento de colegas de alto desempenho.\n\nNesses casos, a liderança precisa investigar o que está acontecendo em vez de simplesmente concluir que todos deveriam agir da mesma maneira."}, {"title": "Modelagem, metas, mérito e recompensa", "body": "A discussão aproxima a modelagem de contextos organizacionais baseados em:\n\nREGRAS → METAS/OBJETIVOS → RESULTADOS → MÉRITO → RECOMPENSA\n\nQuando a organização estabelece metas e associa seu cumprimento a bônus ou outras recompensas, alguns trabalhadores podem tentar modelar profissionais considerados bem-sucedidos para alcançar o mesmo resultado.\n\nA modelagem passa, então, a funcionar como uma possível estratégia para atingir o desempenho esperado e obter a recompensa.\n\nO professor ressalta novamente que isso exige cuidado: reproduzir o comportamento de outra pessoa não garante que o resultado também será reproduzido."}, {"title": "Da modelagem para a próxima teoria", "body": "Ao final da aula, o professor propõe que a turma reflita sobre as teorias estudadas e faça comparações entre elas.\n\nSão retomados:\n\n- Maslow;\n\n- Herzberg;\n\n- estímulo e resposta;\n\n- modelagem.\n\nO professor também anuncia como próxima discussão a teoria de Vroom, deixando-a como tema para reflexão e continuidade da disciplina.\n\nPortanto, nesta aula, Vroom é apenas introduzido como próximo conteúdo; a teoria ainda não é desenvolvida conceitualmente na transcrição enviada."}], "case": "Uma empresa possui um vendedor que supera constantemente suas metas. A liderança decide orientar todos os novos vendedores a reproduzirem exatamente sua rotina, sua forma de abordar clientes e seus hábitos, prometendo que assim alcançarão os mesmos resultados. Alguns profissionais melhoram, enquanto outros apresentam queda de desempenho e frustração. Pela discussão da aula, a modelagem pode oferecer referências, mas não garante resultados idênticos, pois cada trabalhador possui características, experiências, condições e formas próprias de construir sua motivação. A liderança precisa compreender essas diferenças em vez de pressupor que reproduzir um modelo produzirá necessariamente o mesmo resultado."}, "4": {"title": "Teoria da Expectativa, Motivação Intrínseca e Limites dos Incentivos Externos", "blocks": [{"title": "Retomada: motivação interna × fatores externos", "body": "A aula retoma a distinção construída anteriormente entre motivação intrínseca e fatores externos.\n\nNa perspectiva defendida pelo professor, fatores externos podem:\n\nestimular;\n\ninspirar;\n\ncriar condições;\n\noferecer oportunidades;\n\nfavorecer determinado comportamento.\n\nEntretanto, eles não substituem o movimento interno da pessoa.\n\nO professor reforça, portanto, a ideia:\n\n“Ninguém motiva ninguém.”\n\nIsso não significa que outras pessoas ou o ambiente não tenham influência. Um professor, líder ou psicólogo pode estimular, inspirar, criar caminhos e construir um ambiente favorável. Porém, a pessoa precisa encontrar internamente uma conexão com sua história, seus pensamentos, seus sentimentos e seus objetivos."}, {"title": "Aprendizado e motivação intrínseca", "body": "O aprendizado volta a aparecer como parte importante desse processo.\n\nQuando existe uma conexão interna com aquilo que está sendo realizado, a pessoa não depende exclusivamente de recompensas externas para continuar agindo.\n\nEla consegue relacionar sua ação a:\n\num objetivo;\n\num propósito;\n\nsua história;\n\nsua forma de pensar;\n\nseus sentimentos.\n\nNa aula, isso é exemplificado pelo estudante que recebe determinado material e, por iniciativa própria, decide pesquisar e aprofundar o assunto.\n\nO professor pode ter apresentado o conteúdo, mas foi o próprio estudante que realizou o movimento de buscar mais.\n\nEsse movimento é utilizado como exemplo de motivação intrínseca."}, {"title": "Cultura organizacional como ambiente favorável", "body": "Nas organizações, o desafio não é simplesmente encontrar uma recompensa diferente para cada trabalhador.\n\nO professor apresenta a importância de construir uma cultura organizacional favorável, capaz de oferecer condições para que as pessoas estabeleçam uma conexão com aquilo que fazem.\n\nBenefícios, recompensas, comissões e outras vantagens podem ser positivos. Entretanto, a organização não deveria depender continuamente deles para conseguir envolvimento.\n\nQuanto maior a dependência de incentivos externos, maior pode ser a necessidade de continuar oferecendo novos estímulos para sustentar determinados comportamentos.\n\nPor isso, a aula direciona a atenção para a construção de condições organizacionais que favoreçam a conexão interna do trabalhador com aquilo que realiza."}, {"title": "Motivação não é empolgação", "body": "Outro ponto destacado é a diferença entre motivação e empolgação.\n\nUma pessoa pode ficar momentaneamente animada diante de:\n\numa recompensa;\n\numa novidade;\n\num aumento salarial;\n\numa promessa;\n\num benefício.\n\nEssa reação imediata não significa necessariamente que exista uma motivação interna consolidada.\n\nEmpolgação\n\nPode surgir como resposta momentânea a determinado estímulo.\n\nMotivação\n\nNa perspectiva desenvolvida nas aulas, envolve uma conexão interna mais profunda com aquilo que movimenta a pessoa.\n\nAssim:\n\nEMPOLGAÇÃO MOMENTÂNEA ≠ MOTIVAÇÃO INTRÍNSECA"}, {"title": "Teoria da Expectativa de Vroom", "body": "A aula entra na Teoria da Expectativa de Vroom, que havia sido anunciada ao final da aula anterior.\n\nNa forma apresentada pelo professor, a teoria relaciona três elementos:\n\nExpectativa\n\nA pessoa avalia se seu esforço poderá produzir o desempenho necessário.\n\nA questão pode ser representada por:\n\n“Meu esforço vale a pena? Eu consigo realizar isso?”\n\nInstrumentalidade\n\nA pessoa avalia se o desempenho alcançado realmente produzirá determinado resultado ou recompensa.\n\nA questão é:\n\n“Se eu alcançar o desempenho esperado, receberei aquilo que foi prometido?”\n\nValência\n\nRefere-se ao valor que a pessoa atribui ao resultado ou à recompensa.\n\nA questão é:\n\n“Aquilo que vou receber possui valor para mim?”"}, {"title": "A lógica multiplicativa de Vroom", "body": "A aula chama atenção para uma característica importante da teoria: os três componentes aparecem relacionados de maneira multiplicativa.\n\nA lógica trabalhada pode ser representada como:\n\nMOTIVAÇÃO = EXPECTATIVA × INSTRUMENTALIDADE × VALÊNCIA\n\nIsso significa que os elementos não aparecem simplesmente somados.\n\nSe um deles assumir valor zero, o resultado da multiplicação também será zero.\n\nPor exemplo, uma recompensa pode ser muito desejada, mas, se o trabalhador acreditar que seu esforço não permitirá atingir o desempenho exigido, a relação proposta pela teoria é comprometida.\n\nDa mesma forma, a pessoa pode acreditar que consegue atingir a meta, mas não enxergar valor na recompensa oferecida."}, {"title": "A crítica do professor à Teoria de Vroom", "body": "A aula não apresenta Vroom apenas de maneira descritiva. O professor faz uma leitura crítica da teoria.\n\nSua principal provocação é que os componentes utilizados pela teoria podem fazer com que a ação fique muito dependente de fatores externos:\n\n“Vale a pena meu esforço?”\n“O que eu ganho se fizer isso?”\n“A recompensa possui valor?”\n\nNa interpretação desenvolvida em aula, isso se aproxima mais da lógica dos estímulos externos do que da concepção de motivação intrínseca defendida pelo professor.\n\nPor isso, é importante separar duas coisas ao estudar:\n\nVroom propõe:\nExpectativa × Instrumentalidade × Valência.\n\nO professor problematiza:\nUma explicação muito dependente desses elementos pode deixar a ação condicionada à existência de estímulos e recompensas externas."}, {"title": "A “cenourinha”: recompensa e manutenção do comportamento", "body": "Para explicar sua crítica, o professor utiliza a analogia da “cenourinha”.\n\nQuando o comportamento depende de uma recompensa continuamente colocada à frente da pessoa, surge uma questão:\n\no que acontece quando a recompensa desaparece?\n\nA aula aproxima essa discussão da relação entre estímulo e resposta. Quando a manutenção de determinado comportamento depende do estímulo, retirar o estímulo pode enfraquecer a resposta.\n\nNas organizações, isso pode se tornar particularmente desafiador porque seria necessário sustentar continuamente diferentes estímulos para diferentes trabalhadores."}, {"title": "O exemplo do aumento salarial", "body": "O aumento salarial aparece como exemplo de um fator externo que pode produzir uma reação positiva imediata.\n\nO trabalhador recebe o aumento e pode ficar satisfeito ou empolgado naquele momento. Entretanto, segundo a discussão realizada em aula, essa reação não significa necessariamente uma mudança motivacional interna permanente.\n\nDepois de algum tempo, o novo salário pode passar a fazer parte da realidade cotidiana.\n\nO exemplo é utilizado para reforçar que:\n\num benefício externo pode produzir efeitos importantes sem necessariamente construir, sozinho, uma motivação intrínseca duradoura."}, {"title": "Benefício aparente × problema real", "body": "A aula apresenta um caso organizacional no qual o proprietário acreditava estar ajudando seus trabalhadores ao emprestar dinheiro sempre que eles precisavam.\n\nPosteriormente, os valores eram descontados gradualmente do salário.\n\nÀ primeira vista, a prática poderia ser interpretada como benefício ou ajuda. Entretanto, alguns trabalhadores chegavam ao final do mês com poucos recursos disponíveis porque parte do salário já estava comprometida.\n\nO caso demonstra que uma intervenção não deve ser avaliada apenas pela intenção de quem a oferece.\n\nÉ necessário investigar:\n\na situação concreta do trabalhador;\n\nseus gastos;\n\nsuas dívidas;\n\no contexto familiar;\n\nos efeitos da prática;\n\na história que está produzindo aquele comportamento."}, {"title": "Investigar antes de simplesmente oferecer estímulos", "body": "Diante do problema dos empréstimos, a solução proposta não foi simplesmente continuar fornecendo dinheiro.\n\nA organização passou a investigar a situação e trabalhar aspectos relacionados à educação financeira.\n\nIsso envolvia compreender:\n\nquais eram as contas do trabalhador;\n\ncomo ele utilizava seu dinheiro;\n\nquais dívidas já existiam;\n\ncomo estava organizada sua vida financeira.\n\nA proposta passou a envolver acompanhamento e aprendizagem, inclusive com participação familiar em determinadas situações.\n\nO ponto central é que resolver momentaneamente uma necessidade não significa necessariamente atuar sobre aquilo que produz o problema."}, {"title": "Educação como construção de autonomia", "body": "O exemplo financeiro também recupera a importância do aprendizado discutido nas aulas anteriores.\n\nEm vez de apenas entregar um recurso externo, a proposta passa a ser ajudar o trabalhador a desenvolver condições para compreender e reorganizar sua própria situação.\n\nA aula apresenta isso como uma forma de educar e construir um caminho, e não simplesmente manter uma relação contínua de dependência.\n\nEssa lógica se conecta à concepção de motivação que vem sendo construída:\n\nESTÍMULO ISOLADO → pode resolver momentaneamente\n\nAPRENDIZADO + CONDIÇÕES + CONEXÃO INTERNA → favorecem construção mais consistente"}, {"title": "Condições financeiras, insatisfação e trabalho", "body": "A discussão também mostra que problemas financeiros podem repercutir na relação do trabalhador com a organização.\n\nQuando uma pessoa trabalha durante todo o mês e praticamente não possui recursos disponíveis ao receber o salário, podem surgir:\n\ninsatisfação;\n\npreocupação;\n\ndesgaste;\n\ndificuldades familiares;\n\nperda de concentração.\n\nA aula relaciona esse contexto inclusive ao trabalho operacional com máquinas e equipamentos, chamando atenção para possíveis consequências de uma pessoa emocionalmente preocupada ou desconcentrada durante a execução de atividades.\n\nPortanto, compreender o trabalhador exige olhar além do comportamento imediatamente visível e investigar as condições relacionadas a ele."}, {"title": "O cuidado com a ideia de “ajudar”", "body": "Os exemplos discutidos produzem uma questão importante para a atuação organizacional:\n\naquilo que a empresa considera ajuda realmente ajuda o trabalhador?\n\nUma prática pode ter uma intenção positiva e, ao mesmo tempo, produzir consequências diferentes das esperadas.\n\nPor isso, a intervenção exige compreender o contexto e os efeitos concretos daquilo que está sendo feito.\n\nEssa lógica também se aplica ao uso de:\n\nrecompensas;\n\nbenefícios;\n\nbônus;\n\ncomissões;\n\nincentivos.\n\nEles podem ser úteis, mas precisam ser analisados dentro de uma compreensão mais ampla da pessoa e da organização."}, {"title": "Transição para autodeterminação e Motivação 3.0", "body": "Ao final da aula, o professor indica uma mudança de direção no estudo das teorias motivacionais.\n\nDepois de discutir teorias e abordagens fortemente relacionadas a necessidades, estímulos, recompensas e expectativas, a próxima etapa seria aprofundar perspectivas relacionadas à autodeterminação.\n\nO professor também anuncia que essa discussão permitirá avançar posteriormente para Daniel Pink e a Motivação 3.0.\n\nNesta aula, porém, esses conteúdos são apenas indicados como continuidade.\n\nAutodeterminação e Daniel Pink ainda não são desenvolvidos conceitualmente nesta transcrição."}], "case": "Uma empresa deseja aumentar a produtividade e cria um bônus para quem superar determinada meta. Inicialmente, a equipe demonstra grande empolgação, mas, depois de algum tempo, a gestão percebe que precisa aumentar ou modificar continuamente as recompensas para manter o mesmo comportamento. Pela discussão da aula, o caso permite compreender tanto a lógica da Teoria da Expectativa — na qual o trabalhador avalia esforço, relação entre desempenho e recompensa e valor do resultado — quanto a crítica apresentada pelo professor: quando o comportamento depende predominantemente de fatores externos, sua manutenção pode exigir novos estímulos, sem necessariamente construir uma motivação intrínseca."}, "5": {"title": "Visão Sistêmica, Motivação Intrínseca e Extrínseca e Aplicação das Teorias", "blocks": [{"title": "Retomada da avaliação: não analisar um comportamento isoladamente", "body": "A aula começa com uma retomada da avaliação e das dificuldades encontradas pelos alunos ao interpretar uma situação envolvendo motivação.\n\nA partir disso, o professor destaca um princípio importante para a Psicologia Organizacional: um problema de comportamento não deve ser analisado de maneira isolada.\n\nQuando o psicólogo se depara com determinada situação dentro de uma organização, não deve escolher imediatamente uma única teoria ou uma única causa para explicá-la.\n\nÉ necessário ampliar o olhar e compreender:\n\n- a pessoa;\n\n- o contexto;\n\n- as relações;\n\n- a liderança;\n\n- as condições de trabalho;\n\n- os processos organizacionais;\n\n- os diferentes fatores que podem estar relacionados ao comportamento observado."}, {"title": "Visão sistêmica", "body": "O conceito central apresentado é a visão sistêmica.\n\nTer uma visão sistêmica significa compreender que determinado problema faz parte de um conjunto de relações e não pode ser entendido adequadamente quando analisado de maneira fragmentada.\n\nO professor cita como referência a ideia apresentada em A Quinta Disciplina, de Peter Senge, associando-a à necessidade de enxergar as relações existentes entre diferentes elementos de uma situação.\n\nNo estudo, isso significa não tratar cada conteúdo como se estivesse completamente separado dos demais.\n\nNa prática profissional, significa não reduzir um problema organizacional a uma explicação única.\n\nVISÃO FOCADA/ISOLADA → observa apenas uma parte\n\nVISÃO SISTÊMICA → relaciona pessoa, contexto, processos e diferentes variáveis"}, {"title": "O problema apresentado nem sempre é o problema real", "body": "Para demonstrar a visão sistêmica, o professor apresenta uma situação hipotética envolvendo um trabalhador chamado Lucas.\n\nA organização procura o psicólogo porque Lucas estaria:\n\n- isolando-se;\n\n- apresentando dificuldades;\n\n- sob pressão para cumprir uma meta;\n\n- aparentemente sem conseguir responder às expectativas da gestão.\n\nA direção apresenta a situação como um problema de Lucas e exige uma solução rápida.\n\nEntretanto, o psicólogo não deveria simplesmente aceitar essa definição.\n\nA pergunta passa a ser:\n\nO problema é realmente apenas de Lucas?\n\nA situação pode envolver também liderança, cobrança, metas, clima, relações interpessoais, condições organizacionais e a própria história do trabalhador."}, {"title": "Investigar antes de intervir", "body": "Diante de um problema organizacional, a primeira tarefa não é julgar nem apresentar imediatamente uma solução.\n\nÉ necessário investigar.\n\nNo caso apresentado, o professor propõe conversar inicialmente com o gestor para compreender sua percepção e também reduzir a pressão exercida sobre o trabalhador.\n\nDepois, outras pessoas podem ser ouvidas para ampliar a compreensão da situação.\n\nA lógica é construir gradualmente uma leitura mais ampla do problema.\n\nO psicólogo deve trabalhar com hipóteses, e não com conclusões precipitadas.\n\nPor isso, o professor reforça:\n\nPensar hipóteses → investigar → relacionar informações → compreender o contexto → intervir"}, {"title": "Feedback positivo e construção de aliados", "body": "Ao conversar com o gestor, o professor orienta que o psicólogo não inicie a interação atacando ou culpabilizando a liderança.\n\nEm vez de dizer que o gestor está “acabando com a equipe”, a proposta é realizar um feedback positivo, reconhecendo aspectos de sua atuação e utilizando elementos trazidos pelo próprio interlocutor para conduzir a conversa.\n\nA escuta precisa ser atenta.\n\nO psicólogo pode utilizar aquilo que a própria pessoa diz para formular perguntas, produzir reflexão e ampliar a compreensão da situação.\n\nO objetivo é criar condições para que o gestor participe do processo, tornando-se um aliado na intervenção, em vez de simplesmente colocá-lo na posição de culpado."}, {"title": "Sem julgamento", "body": "Outro princípio enfatizado é a necessidade de trabalhar sem julgamento.\n\nO psicólogo não deve chegar à organização procurando imediatamente:\n\n- culpados;\n\n- certos e errados;\n\n- uma causa única;\n\n- uma resposta pronta.\n\nA análise precisa considerar diferentes perspectivas.\n\nIsso é particularmente importante porque aquilo que inicialmente parece ser um problema individual pode estar relacionado a processos organizacionais mais amplos.\n\nSem julgamento não significa ausência de análise.\n\nSignifica investigar antes de concluir."}, {"title": "O caso de Lucas e a motivação", "body": "Ao ampliar a análise do caso, surge a hipótese de que Lucas possa não estar intrinsecamente motivado para aquele trabalho.\n\nEntretanto, mesmo essa hipótese precisa ser investigada.\n\nO professor levanta a possibilidade de Lucas ter procurado o emprego inicialmente para atender uma necessidade de segurança, retomando a teoria de Maslow trabalhada nas aulas anteriores.\n\nAssim, uma situação aparentemente relacionada apenas à motivação pode envolver simultaneamente:\n\n- necessidades;\n\n- segurança;\n\n- contexto profissional;\n\n- liderança;\n\n- pressão;\n\n- metas;\n\n- relações;\n\n- clima organizacional.\n\nO exemplo demonstra por que as teorias precisam ser conectadas, e não utilizadas de maneira isolada."}, {"title": "Aplicação integrada das teorias", "body": "O objetivo do estudo das teorias não é simplesmente decorar autores.\n\nO professor afirma que não pretende aprofundar todas as teorias separadamente como se cada uma fosse uma explicação completa da realidade.\n\nO mais importante é desenvolver a capacidade de identificar:\n\nEstamos diante de motivação intrínseca ou extrínseca?\n\nExiste um movimento interno ou predominam estímulos externos?\n\nO comportamento observado está relacionado somente ao indivíduo ou também ao contexto?\n\nAs teorias ajudam a construir diferentes formas de compreender uma situação, mas precisam ser interpretadas considerando o período em que foram desenvolvidas e as condições em que são aplicadas."}, {"title": "Motivação intrínseca × motivação extrínseca", "body": "A distinção entre motivação intrínseca e extrínseca volta a ocupar posição central.\n\nMotivação intrínseca\n\nEstá relacionada ao movimento interno da pessoa, àquilo que estabelece conexão com sua forma de pensar, seus sentimentos, seus objetivos e sua história.\n\nMotivação extrínseca\n\nNa linguagem utilizada durante as aulas, aparece associada aos estímulos externos que procuram produzir ou manter determinado comportamento.\n\nA pergunta fundamental passa a ser:\n\n“A pessoa está realmente motivada ou está sendo estimulada?”\n\nEssa diferença é apresentada como mais importante do que simplesmente memorizar isoladamente cada teoria motivacional."}, {"title": "Retomada crítica da Teoria da Expectativa", "body": "A Teoria da Expectativa, trabalhada na aula anterior, volta a ser discutida.\n\nO professor retoma sua crítica de que a relação entre expectativa, instrumentalidade e valência pode produzir uma situação em que a pessoa esteja continuamente avaliando fatores externos:\n\n- “Meu esforço vale a pena?”\n\n- “Vou conseguir?”\n\n- “Vou receber aquilo que foi prometido?”\n\n- “Aquilo que vou receber tem valor para mim?”\n\nNa leitura apresentada em aula, essa lógica pode produzir pressão e dependência de elementos externos.\n\nPor isso, a teoria é analisada dentro da distinção maior entre motivação intrínseca e estímulos externos."}, {"title": "Teorias precisam ser contextualizadas historicamente", "body": "O professor também chama atenção para o momento histórico em que determinadas teorias foram construídas.\n\nAs primeiras abordagens sobre comportamento e produtividade estavam inseridas em contextos marcados pela industrialização, pelo Taylorismo e pelo Fordismo.\n\nEm determinados momentos, melhorar elementos externos do ambiente de trabalho e observar seus efeitos sobre a produtividade representou uma mudança importante.\n\nEntretanto, o professor alerta que não é possível simplesmente permanecer preso a essas explicações.\n\nAs teorias precisam ser compreendidas considerando:\n\n- a época;\n\n- o contexto;\n\n- as características das organizações;\n\n- as mudanças na compreensão do trabalhador."}, {"title": "Procedimento não substitui educação", "body": "A aula amplia essa discussão para situações relacionadas à saúde e segurança no trabalho.\n\nO professor utiliza o exemplo da implementação de normas e procedimentos.\n\nCriar uma norma, estabelecer um processo ou determinar o uso de um equipamento não garante automaticamente que o comportamento esperado ocorrerá.\n\nUm trabalhador pode, por exemplo, saber que deveria utilizar determinado EPI e ainda assim não utilizá-lo.\n\nPor isso, segundo a discussão apresentada, a organização precisa desenvolver também um processo educativo.\n\nNORMA/PROCEDIMENTO → estabelece o que deve ser feito\n\nPROCESSO EDUCATIVO → trabalha a compreensão da pessoa sobre aquilo que está fazendo\n\nEssa discussão recupera a ideia apresentada desde a primeira aula: processos e pessoas precisam caminhar juntos."}, {"title": "Processos e pessoas", "body": "A discussão sobre segurança retoma diretamente um dos princípios apresentados pelo professor desde o início do bimestre.\n\nUma organização pode:\n\n- formalizar procedimentos;\n\n- criar normas;\n\n- adquirir equipamentos;\n\n- estabelecer regras;\n\n- exigir comportamentos.\n\nEntretanto, se não trabalhar com as pessoas que executam esses processos, pode haver uma distância entre aquilo que foi estabelecido e aquilo que realmente acontece.\n\nPor isso:\n\nPROCESSOS + PESSOAS → precisam ser trabalhados conjuntamente\n\nA implementação técnica, sozinha, não garante mudança comportamental."}, {"title": "Mudanças organizacionais e culturais", "body": "O professor utiliza sua experiência com empresas para mostrar que determinadas mudanças não acontecem de maneira imediata.\n\nEle relata transformações observadas ao longo do tempo em organizações, especialmente relacionadas à formalização, segurança e organização do trabalho.\n\nA ideia central é que mudanças organizacionais também envolvem mudanças culturais.\n\nQuando determinada prática ainda não faz parte da cultura de uma organização ou de um setor, sua transformação pode exigir:\n\n- tempo;\n\n- educação;\n\n- acompanhamento;\n\n- mudança de percepção;\n\n- novos processos.\n\nAssim, novamente, não basta estabelecer uma regra e esperar adesão automática."}, {"title": "Transição para Locke e Latham", "body": "Ao final da aula, o professor anuncia a continuidade das teorias motivacionais e destaca que os alunos devem observar especialmente a teoria de Locke e Latham.\n\nO conteúdo é associado à discussão sobre metas.\n\nO professor também menciona a ferramenta SMART, mas indica que o foco naquele momento deveria estar principalmente na teoria de Locke e Latham.\n\nNesta transcrição, a teoria ainda não é desenvolvida em detalhes. Ela aparece como conteúdo que será aprofundado na sequência.\n\nPortanto, para esta aula, o ponto seguro é:\n\nLocke e Latham → teoria relacionada ao estabelecimento de metas.\n\nNão cabe ainda acrescentar características específicas das metas que não foram desenvolvidas nesta aula."}, {"title": "Transição para Daniel Pink", "body": "O professor também menciona Daniel Pink, retomando a continuidade anunciada na aula anterior.\n\nAssim como Locke e Latham, Daniel Pink aparece como parte da sequência das teorias que serão organizadas e comparadas posteriormente.\n\nNesta aula, porém, seus componentes ainda não são explicados de forma suficiente para constituir um bloco conceitual próprio.\n\nO professor indica que pretende posteriormente reunir as teorias em um quadro para permitir uma compreensão integrada."}], "case": "Lucas começou a apresentar isolamento e dificuldades para cumprir uma meta, e seu gestor concluiu que ele estava desmotivado e pediu ao psicólogo que resolvesse rapidamente o problema. Uma atuação baseada na visão sistêmica não deveria aceitar imediatamente essa interpretação. O psicólogo precisaria investigar a percepção do gestor, conversar com Lucas e considerar liderança, pressão, metas, necessidades, relações, clima e condições organizacionais, trabalhando com hipóteses e evitando julgamentos. O caso demonstra que um comportamento aparentemente individual pode estar relacionado a diferentes elementos do sistema organizacional."}, "6": {"title": "Integração das Teorias de Motivação, Ecossistema de Aprendizagem e Visão Sistêmica", "blocks": [{"title": "Delimitação do conteúdo da avaliação", "body": "O professor esclarece que, na parte dele, a avaliação será centrada em motivação. Liderança e poder não entram nesse momento.\n\nA estrutura informada para sua parte da avaliação é:\n\n- 2 questões discursivas;\n\n- 1 questão objetiva;\n\n- as três construídas a partir de estudos de caso.\n\nA proposta não é simplesmente perguntar a definição de uma teoria. O aluno deverá reconhecer elementos presentes no caso, relacioná-los aos conceitos estudados e explicar o comportamento apresentado.\n\nO professor reforça que as questões serão semelhantes, em estrutura, ao caso de Lucas discutido em sala."}, {"title": "Motivação como base para o estudo posterior da liderança", "body": "O conteúdo de motivação foi desenvolvido antes de liderança de forma intencional.\n\nPara compreender posteriormente a atuação de um líder, é necessário primeiro compreender o indivíduo e o processo motivacional.\n\nA sequência construída pelo professor é:\n\nCompreender aprendizagem e motivação → compreender o indivíduo → posteriormente compreender a atuação da liderança\n\nAssim, motivação funciona como uma base conceitual para o conteúdo seguinte."}, {"title": "Visão sistêmica na resolução das questões", "body": "O professor retoma a visão sistêmica, trabalhada anteriormente.\n\nUma situação organizacional não deve ser analisada por uma única informação. O aluno precisa observar diferentes pistas presentes no caso e estabelecer relações entre elas.\n\nIsso significa evitar respostas baseadas apenas em uma palavra-chave.\n\nA lógica esperada é:\n\nIdentificar os elementos do caso → reconhecer os conceitos relacionados → estabelecer conexões → explicar o problema\n\nO objetivo é desenvolver uma forma de raciocínio próxima daquela utilizada pelo psicólogo diante de situações organizacionais."}, {"title": "Caso de Lucas: contrato de trabalho instável", "body": "O professor apresenta novamente o caso de Lucas para demonstrar como as questões devem ser interpretadas.\n\nLucas acabou de ingressar em uma equipe sob um contrato de trabalho instável.\n\nEssa informação não aparece por acaso.\n\nNa leitura da Pirâmide de Maslow, a instabilidade do contrato está relacionada à necessidade de:\n\nSegurança\n\nPortanto:\n\nContrato instável → necessidade de segurança afetada\n\nO aluno precisa aprender a identificar essas pistas dentro do enunciado."}, {"title": "Caso de Lucas: conflitos e isolamento", "body": "Outra informação do caso é que Lucas enfrenta conflitos constantes no grupo e sente-se isolado.\n\nNovamente, essa informação deve ser relacionada à Pirâmide de Maslow.\n\nNesse caso, o professor associa o isolamento e as dificuldades de integração à dimensão:\n\nSocial / pertencimento\n\nAssim:\n\nIsolamento e conflitos → necessidade social/de pertencimento afetada\n\nLucas apresenta, portanto, dificuldades relacionadas simultaneamente à segurança e ao pertencimento social."}, {"title": "Caso de Lucas: necessidade de aprender rapidamente", "body": "Além das dificuldades anteriores, o gestor exige que Lucas aprenda rapidamente um software técnico altamente complexo para resolver um problema operacional da empresa.\n\nA palavra “aprenda” introduz outro conjunto de conceitos: o ecossistema de aprendizagem trabalhado pelo professor.\n\nO caso, portanto, não deve ser respondido somente com Maslow.\n\nÉ necessário conectar:\n\nMaslow + ecossistema de aprendizagem\n\nEsse é exatamente o tipo de integração que o professor pretende avaliar."}, {"title": "Ecossistema de aprendizagem: cognitivo e afetivo", "body": "Na explicação apresentada em sala, o professor destaca especialmente dois componentes relacionados à aprendizagem:\n\nCognitivo\n\nEstá relacionado à forma de pensar e aos processos necessários para aprender. No exemplo apresentado, aparecem elementos como atenção e processamento das informações necessárias para dominar o software.\n\nAfetivo\n\nEstá relacionado à dimensão emocional envolvida no processo de aprendizagem.\n\nO professor associa aprendizagem e motivação à necessidade de uma conexão entre essas dimensões.\n\nEm sua explicação:\n\nCognição + afeto → construção interna da aprendizagem → possibilidade de motivação intrínseca"}, {"title": "Segurança e pertencimento interferindo na aprendizagem", "body": "O caso de Lucas exige justamente a integração dessas duas partes.\n\nPor um lado, Lucas enfrenta:\n\n- insegurança decorrente do contrato instável;\n\n- conflitos;\n\n- isolamento;\n\n- falta de pertencimento.\n\nPor outro, precisa aprender rapidamente um conteúdo técnico complexo.\n\nA preocupação com sua permanência no emprego e a ausência de suporte social podem prejudicar as condições afetivas e cognitivas envolvidas no processo de aprendizagem.\n\nNa formulação apresentada pelo professor, a preocupação com a “sobrevivência” no cargo pode ocupar o foco atencional e o processamento de informações necessários à aprendizagem.\n\nPortanto, a resposta não termina em “Lucas está desmotivado”.\n\nÉ necessário explicar por que sua motivação e sua aprendizagem estão prejudicadas."}, {"title": "Modelo de raciocínio esperado no caso de Lucas", "body": "A análise pode ser organizada da seguinte maneira:\n\n1. Identificar a pista: contrato instável.\n\n2. Relacionar: necessidade de segurança em Maslow.\n\n3. Identificar a pista: conflitos e isolamento.\n\n4. Relacionar: necessidade social/de pertencimento.\n\n5. Identificar a pista: precisa aprender rapidamente um software complexo.\n\n6. Relacionar: ecossistema de aprendizagem.\n\n7. Integrar: insegurança e isolamento interferem nos componentes afetivos e cognitivos necessários ao aprendizado e, consequentemente, prejudicam a construção da motivação.\n\nEssa é a visão sistêmica aplicada à questão."}, {"title": "Aprendizagem e motivação intrínseca", "body": "O professor retoma uma ideia central desenvolvida ao longo das aulas:\n\nA motivação intrínseca depende de uma construção interna.\n\nNa explicação apresentada, aprender não significa apenas receber uma informação.\n\nÉ necessário que a pessoa consiga:\n\n- formar uma maneira de pensar;\n\n- incorporar aquilo à própria vida;\n\n- construir um novo paradigma;\n\n- colocar o aprendizado em prática;\n\n- estabelecer uma conexão afetiva com aquilo.\n\nQuando essa construção ocorre, o comportamento deixa de depender exclusivamente de estímulos externos."}, {"title": "Conhecimento, habilidade e atitude", "body": "Ao explicar quando o aprendizado se consolida, o professor utiliza três elementos:\n\nConhecimento — saber.\n\nHabilidade — saber fazer.\n\nAtitude — querer fazer.\n\nA aprendizagem não se encerra no conhecimento teórico. Ela envolve a capacidade de transformar aquilo que se sabe em ação e incorporar esse aprendizado ao comportamento.\n\nNa lógica apresentada em aula:\n\nConhecimento + habilidade + atitude + dimensão afetiva → aprendizagem incorporada"}, {"title": "Motivação verdadeira × empolgação e estímulo", "body": "O professor estabelece uma distinção importante entre motivação intrínseca e estados produzidos externamente.\n\nMotivação intrínseca\n\nÉ descrita como um movimento interno, construído e incorporado pela pessoa. Por estar relacionado à aprendizagem, às formas de pensar e à dimensão afetiva, tende a permanecer.\n\nEstímulo, animação ou empolgação\n\nPodem produzir uma resposta, mas não necessariamente significam que ocorreu uma construção motivacional interna.\n\nO professor sintetiza essa diferença mostrando que a pessoa pode continuar fazendo algo mesmo quando o estímulo externo deixa de existir, porque aquele comportamento já possui um registro interno para ela."}, {"title": "Estímulos externos e produtividade", "body": "O professor retoma teorias anteriores para mostrar como os estudos sobre comportamento passaram por diferentes explicações.\n\nA discussão menciona experiências nas quais alterações no ambiente e nas relações de trabalho foram associadas a mudanças de produtividade.\n\nA aula recupera, portanto, a diferença entre:\n\nEstimular externamente determinado comportamento\n\nE\n\nConstruir uma motivação intrínseca que permaneça mesmo sem aquele estímulo.\n\nO professor utiliza essa distinção como eixo para compreender criticamente as diferentes teorias motivacionais."}, {"title": "A importância de não estudar as teorias isoladamente", "body": "O professor deixa claro que a avaliação não pretende verificar apenas se o aluno decorou uma definição.\n\nA questão pode fornecer uma teoria e, em seguida, apresentar uma situação que exige conexão com outro conteúdo.\n\nPor isso, estudar apenas:\n\n“Maslow = hierarquia de necessidades”\n\nNão é suficiente.\n\nÉ necessário conseguir reconhecer:\n\nContrato instável → segurança\n\nIsolamento → pertencimento/social\n\nExigência de aprendizagem → componentes cognitivos e afetivos\n\nE depois conectar esses elementos em uma explicação única."}, {"title": "Resposta simples × resposta técnica", "body": "Ao analisar o caso de Lucas, o professor mostra que não pretende exigir uma formulação excessivamente técnica.\n\nUma resposta simples, mas conceitualmente correta, pode demonstrar compreensão.\n\nPor exemplo:\n\nResposta simples:\n\nLucas está inseguro com o trabalho e não se sente integrado à equipe. Essas condições dificultam sua motivação e também sua capacidade de se concentrar no aprendizado exigido.\n\nUma resposta mais técnica poderia aprofundar:\n\nResposta técnica:\n\nO contrato instável compromete a necessidade de segurança e os conflitos e o isolamento prejudicam a necessidade social/de pertencimento. Essas condições interferem nos fatores afetivos e cognitivos envolvidos na aprendizagem, dificultando a construção da motivação necessária para que Lucas aprenda o novo software.\n\nO essencial é que exista relação entre os conceitos e o caso."}], "case": "Lucas ingressou recentemente em uma empresa com contrato instável, enfrenta conflitos constantes com sua equipe e sente-se isolado. Ao mesmo tempo, seu gestor exige que aprenda rapidamente um software complexo para solucionar um problema operacional. Uma análise sistêmica não deve reduzir a situação à afirmação de que Lucas “não está motivado”. O contrato instável relaciona-se à necessidade de segurança, enquanto o isolamento compromete a dimensão social/de pertencimento. Essas condições podem interferir nos componentes afetivos e cognitivos envolvidos na aprendizagem, dificultando a construção interna necessária para que Lucas se motive e domine o novo conhecimento."}, "7": {"title": "Teorias da Motivação: da influência externa à autodeterminação", "blocks": [{"title": "Visão sistêmica das teorias de motivação", "body": "O professor retoma a tabela utilizada para reunir as diferentes teorias de motivação. A finalidade é construir uma visão macro e sistêmica, evitando que cada teoria seja estudada como um conteúdo isolado.\n\nAo observar a evolução dessas teorias, um eixo importante é perceber como as explicações sobre motivação passam progressivamente de uma ênfase nos fatores externos para uma compreensão maior dos processos internos do indivíduo.\n\nA questão central continua sendo:\n\nO comportamento está sendo mantido por estímulos externos ou existe uma motivação intrínseca construída internamente?"}, {"title": "Aprendizagem e motivação intrínseca", "body": "O professor reforça a conexão entre aprendizagem e motivação.\n\nAprender, nessa abordagem apresentada em aula, não significa apenas repetir uma informação. A aprendizagem envolve construir um registro interno capaz de modificar a maneira como a pessoa pensa e interpreta sua realidade.\n\nCognição\n\nEstá relacionada à forma de pensar. A aprendizagem permite construir novos paradigmas e novas maneiras de compreender determinada situação.\n\nAfetividade\n\nO conteúdo aprendido também se conecta à dimensão emocional. A pessoa atribui significado àquilo que aprendeu.\n\nQuando cognição e afetividade se integram, o aprendizado pode ser incorporado à vida da pessoa.\n\nPor isso, alguém pode continuar realizando algo mesmo diante de cansaço, dificuldades ou ausência de recompensas imediatas: existe um movimento interno sustentando aquele comportamento.\n\nEsse movimento é relacionado pelo professor à motivação intrínseca."}, {"title": "Motivação intrínseca × estímulos externos", "body": "Motivação intrínseca\n\nÉ apresentada como um movimento interno que permanece mesmo diante de dificuldades. A pessoa incorporou determinado objetivo, construiu significado e não depende exclusivamente de recompensas externas para continuar.\n\nEstímulos externos\n\nSão elementos do ambiente capazes de influenciar o comportamento. Podem produzir respostas e aumentar momentaneamente determinados comportamentos, mas não significam necessariamente que exista motivação intrínseca.\n\nEssa distinção acompanha a análise das diferentes teorias apresentadas na aula."}, {"title": "Elton Mayo e os fatores psicológicos e sociais", "body": "Na reconstrução histórica apresentada pelo professor, Elton Mayo aparece ligado às experiências de Hawthorne e à percepção de que o comportamento e a produtividade não dependem somente das condições físicas de trabalho.\n\nA observação dos trabalhadores mostrou a importância de fatores psicológicos e sociais, como:\n\n- sentir-se observado;\n\n- sentir-se valorizado;\n\n- relações estabelecidas no ambiente;\n\n- formação de grupos;\n\n- normas criadas espontaneamente pelos próprios grupos.\n\nGrupos espontâneos\n\nOs trabalhadores formam relações e grupos que podem desenvolver suas próprias normas e influenciar o comportamento dos integrantes.\n\nA contribuição apresentada marca um avanço em relação a uma compreensão exclusivamente mecânica da produtividade, embora o professor ainda situe essa abordagem predominantemente na influência exercida pelo ambiente sobre o comportamento."}, {"title": "Maslow e a hierarquia das necessidades", "body": "Na sequência histórica, o professor apresenta Abraham Maslow e sua compreensão das necessidades humanas.\n\nA ideia central trabalhada é a existência de uma hierarquia de necessidades.\n\nA pirâmide representa essa organização porque sua base sustenta os níveis posteriores. Na explicação da aula, necessidades mais básicas precisam ser atendidas para permitir o avanço para necessidades superiores.\n\nO professor chama atenção especialmente para a diferença entre necessidades mais ligadas às condições externas e aquelas relacionadas ao desenvolvimento interno do indivíduo.\n\nO caso de Lucas, discutido anteriormente, exemplifica essa aplicação:\n\nContrato instável → segurança afetada\n\nIsolamento e conflitos → necessidade social/de pertencimento afetada\n\nA teoria permite, portanto, identificar quais necessidades estão comprometidas em determinada situação."}, {"title": "Herzberg: fatores higiênicos e fatores motivacionais", "body": "O professor aproxima Herzberg da discussão sobre fatores externos e internos.\n\nFatores higiênicos\n\nRelacionam-se às condições que cercam o trabalho. Na lógica apresentada durante a comparação das teorias, permanecem mais próximos da dimensão externa.\n\nFatores motivacionais\n\nAproximam-se da dimensão interna da motivação.\n\nO ponto principal da comparação realizada em sala é perceber que oferecer condições externas não equivale automaticamente a construir uma motivação intrínseca duradoura.\n\nAssim, salário, benefícios ou outras condições externas podem exercer influência, mas o professor alerta para não confundir essa influência com a motivação interna propriamente dita."}, {"title": "Skinner: estímulo, resposta e consequências", "body": "Na sequência apresentada, Skinner aparece relacionado à influência das consequências ambientais sobre o comportamento.\n\nA ideia trabalhada é:\n\nEstímulo → resposta → consequências\n\nO comportamento pode ser moldado pelas consequências produzidas no ambiente.\n\nA motivação é discutida, nesse momento da aula, ainda sob forte influência de elementos externos: modifica-se o ambiente e observa-se a resposta comportamental.\n\nO professor utiliza Skinner para reforçar a evolução histórica das teorias e mostrar como, durante um longo período, grande parte das explicações ainda procurava compreender o que acontece ao redor da pessoa para modificar seu comportamento."}, {"title": "Bandura: modelagem e autoeficácia", "body": "Na discussão de Bandura, o professor destaca dois elementos.\n\nModelagem\n\nA pessoa observa alguém que alcançou determinado resultado e pode utilizar esse indivíduo como modelo.\n\nO exemplo apresentado é observar alguém que conseguiu alcançar uma carreira ou posição desejada e analisar o caminho percorrido por essa pessoa.\n\nO indivíduo passa a pensar:\n\n“Se aquela pessoa conseguiu chegar até lá, como ela fez?”\n\nA observação do modelo pode orientar a construção do próprio comportamento.\n\nAutoeficácia\n\nEstá relacionada à crença da pessoa de que é capaz de realizar determinada ação ou alcançar determinado resultado.\n\nAssim, não basta simplesmente existir um modelo. A pessoa precisa desenvolver a crença de que também consegue agir em direção ao resultado pretendido."}, {"title": "Vroom e a Teoria da Expectativa", "body": "O professor apresenta Victor Vroom como um momento importante da discussão, porque o indivíduo passa a realizar um cálculo diante da situação.\n\nNa formulação trabalhada em sala:\n\nExpectativa × Instrumentalidade × Valência\n\nA motivação depende da relação entre esses elementos.\n\nO professor enfatiza que, se um deles for anulado, a motivação prevista pela teoria também é comprometida."}, {"title": "Expectativa: comparação", "body": "Na explicação específica dada pelo professor nesta aula:\n\nExpectativa = comparação.\n\nA pessoa observa uma situação e compara possibilidades antes de agir.\n\nEla analisa o que está diante dela e formula uma expectativa em relação à ação.\n\nO professor utiliza diferentes exemplos para demonstrar esse raciocínio, como aceitar um desafio profissional, realizar uma atividade ou avaliar uma oportunidade.\n\nMacete utilizado na aula:\n\nExpectativa → comparar."}, {"title": "Instrumentalidade: caixa de ferramentas e competência", "body": "Na formulação utilizada pelo professor:\n\nInstrumentalidade = ferramentas/competências disponíveis para realizar aquilo.\n\nA pessoa se questiona:\n\n“Eu tenho competência para fazer isso?”\n\nO professor utiliza a metáfora de uma caixa de ferramentas.\n\nDentro dessa caixa estariam os conhecimentos, habilidades e recursos pessoais necessários para realizar a atividade.\n\nAssim:\n\nInstrumentalidade → instrumento → ferramentas → competência.\n\nNo exemplo de uma promoção, a pessoa pode perguntar se possui as competências exigidas para assumir a nova função ou se precisará desenvolver novas capacidades."}, {"title": "Valência: o valor da recompensa", "body": "Na explicação da aula:\n\nValência = o valor atribuído ao que será obtido.\n\nA pergunta passa a ser:\n\n“O que eu vou ganhar com isso e isso vale a pena para mim?”\n\nEsse ganho não precisa ser apenas financeiro.\n\nPode envolver:\n\n- satisfação;\n\n- aprendizagem;\n\n- experiência;\n\n- crescimento;\n\n- empregabilidade;\n\n- recursos financeiros.\n\nDuas pessoas podem receber exatamente a mesma proposta e atribuir valores diferentes a ela.\n\nPor isso, o mesmo resultado pode apresentar valências diferentes para indivíduos diferentes.\n\nMacete utilizado na aula:\n\nValência → valor."}, {"title": "O exemplo da promoção profissional", "body": "O professor utiliza uma promoção para demonstrar como diferentes pessoas podem raciocinar diante da mesma situação.\n\nUm funcionário recebe a possibilidade de assumir um cargo superior.\n\nEle começa a analisar:\n\nExpectativa\n\nCompara a situação atual com aquilo que poderá acontecer ao aceitar a promoção.\n\nInstrumentalidade\n\nQuestiona se possui as competências e ferramentas necessárias para exercer a nova função.\n\nValência\n\nAvalia se aquilo que receberá em troca — salário, aprendizado, experiência ou empregabilidade — possui valor suficiente.\n\nUma pessoa pode considerar que o aumento salarial não compensa o esforço necessário para adquirir novas competências.\n\nOutra pode aceitar a mesma proposta porque considera que o aprendizado adquirido aumentará sua empregabilidade futura.\n\nO contexto é o mesmo, mas o cálculo realizado pelos indivíduos é diferente."}, {"title": "Vroom e a dependência dos três elementos", "body": "A aula reforça a relação multiplicativa entre os componentes apresentados:\n\nExpectativa × Instrumentalidade × Valência\n\nSe uma das dimensões for anulada, a motivação prevista pela teoria também é anulada.\n\nExemplo:\n\nUma pessoa pode considerar uma atividade extremamente recompensadora, mas acreditar que não possui as competências necessárias para realizá-la.\n\nNesse caso, o valor da recompensa, sozinho, não seria suficiente.\n\nDa mesma forma, alguém pode acreditar que possui todas as competências necessárias, mas não perceber qualquer valor no resultado final.\n\nPor isso, a teoria considera conjuntamente os diferentes componentes."}, {"title": "A virada para a Teoria da Autodeterminação", "body": "Depois da discussão sobre Vroom, o professor apresenta uma mudança importante no percurso das teorias.\n\nNa Teoria da Autodeterminação, a análise passa a enfatizar um movimento que ocorre de dentro para fora.\n\nA motivação é apresentada como um continuum que pode avançar de condições de ausência de motivação e regulações externas até formas mais internas de regulação e motivação intrínseca.\n\nO indivíduo vai incorporando determinadas razões, ampliando sua percepção e construindo internamente o movimento para agir.\n\nEssa passagem representa, na leitura construída pelo professor, uma importante mudança em relação às teorias mais centradas nos estímulos externos."}, {"title": "Autonomia, competência e pertencimento", "body": "Na Teoria da Autodeterminação, o professor destaca três elementos:\n\nAutonomia\n\nPossibilidade de agir com maior autodeterminação e participar das próprias escolhas.\n\nCompetência\n\nPercepção e desenvolvimento da capacidade necessária para realizar determinada atividade.\n\nPertencimento\n\nConstrução de relações saudáveis e sentimento de integração.\n\nA organização e a liderança podem criar condições favoráveis a esses elementos, mas a motivação não é simplesmente “colocada” de fora para dentro.\n\nO movimento motivacional é construído pelo próprio indivíduo."}, {"title": "Promoção não significa competência para liderar", "body": "O professor utiliza um exemplo organizacional para demonstrar um erro comum.\n\nUm funcionário pode apresentar excelente desempenho operacional durante muitos anos e, por isso, ser promovido para liderar uma equipe.\n\nEntretanto:\n\nSer competente tecnicamente não significa possuir automaticamente competência para liderar pessoas.\n\nSe a promoção ocorre apenas porque a pessoa é excelente em sua função atual, sem considerar as competências necessárias à nova função, ela pode apresentar dificuldades e posteriormente ser responsabilizada pelo fracasso.\n\nEsse exemplo reforça novamente a necessidade de uma visão sistêmica sobre comportamento, motivação, competência e contexto organizacional.\n\nMapa de evolução trabalhado na aula\n\nElton Mayo\n\nFatores psicológicos e sociais → grupos e ambiente.\n\nMaslow\n\nHierarquia das necessidades.\n\nHerzberg\n\nFatores higiênicos × fatores motivacionais.\n\nSkinner\n\nEstímulo → resposta → consequências.\n\nBandura\n\nModelagem + autoeficácia.\n\nVroom\n\nExpectativa × Instrumentalidade × Valência.\n\nTeoria da Autodeterminação\n\nMovimento de dentro para fora → autonomia + competência + pertencimento → aproximação da motivação intrínseca.\n\nO eixo utilizado pelo professor para integrar essas teorias é observar a passagem de explicações mais centradas em condições e estímulos externos para abordagens que atribuem maior importância à construção interna da motivação."}], "case": "Marina apresenta excelente desempenho técnico e, por isso, recebe uma proposta para liderar sua equipe. Antes de aceitar, compara a nova função com sua situação atual, questiona se possui as competências necessárias e avalia se o aumento salarial, a aprendizagem e a experiência profissional compensam as novas responsabilidades. Ao mesmo tempo, a organização considera que seu bom desempenho técnico é suficiente para garantir sucesso como líder. Pela visão sistêmica trabalhada em aula, a situação envolve tanto o cálculo apresentado por Vroom quanto a necessidade de distinguir competência técnica das competências exigidas pela nova função."}, "8": {"title": "Liderança, Poder e Bases de Poder", "blocks": [{"title": "Liderança nas organizações e na vida social", "body": "A liderança não deve ser compreendida apenas como um cargo, função, crachá ou posição formal dentro de uma empresa. Ela aparece em diferentes contextos sociais e organizacionais e está relacionada à capacidade de influenciar outras pessoas.\n\nUma organização pode possuir líderes no nível:\n\n- operacional;\n\n- tático;\n\n- estratégico.\n\nPortanto, liderança não está restrita ao nível gerencial. É possível encontrar pessoas exercendo influência em diferentes posições da estrutura.\n\nO professor chama atenção para outro cuidado: ao estudar liderança, não se deve fazer imediatamente um juízo de valor.\n\nLiderança não deve ser automaticamente entendida como positiva ou negativa.\n\nÉ necessário observar como a influência é exercida, quais recursos de poder são utilizados, qual é o contexto e quais resultados são buscados."}, {"title": "Poder", "body": "O poder está relacionado à capacidade ou potencial de afetar o comportamento de outra pessoa, utilizando recursos formais, pessoais ou estruturais.\n\nA palavra-chave destacada na aula é:\n\nPoder → afetar o comportamento.\n\nA pessoa que possui poder apresenta potencial para influenciar o comportamento de outra, inclusive diante de resistência.\n\nPor isso, o poder não precisa necessariamente produzir engajamento voluntário. Uma pessoa pode obedecer porque existe autoridade formal, possibilidade de punição, recompensa ou algum outro recurso controlado por quem exerce o poder."}, {"title": "Liderança", "body": "A liderança é apresentada como um processo de influência interpessoal orientado para objetivos compartilhados e engajamento voluntário.\n\nTrês elementos foram destacados:\n\nInfluência interpessoal\n\nO líder influencia outras pessoas e seus comportamentos.\n\nObjetivos compartilhados\n\nO objetivo não pertence somente ao líder. As pessoas envolvidas reconhecem aquele objetivo como algo compartilhado pelo grupo.\n\nEngajamento voluntário\n\nA pessoa deseja participar, contribuir e caminhar com o grupo.\n\nEsse elemento diferencia a liderança da simples imposição:\n\n“Eu quero fazer parte. Eu quero caminhar com o grupo. Eu quero estar nesse time.”"}, {"title": "Poder × Liderança", "body": "Embora poder e liderança estejam relacionados, eles não são sinônimos.\n\nPoder\n\nEstá relacionado ao potencial ou capacidade de afetar o comportamento de outra pessoa.\n\nLiderança\n\nEnvolve influência interpessoal, objetivos compartilhados e engajamento voluntário.\n\nAssim, alguém pode possuir poder em razão de uma posição formal sem necessariamente conseguir produzir o engajamento característico da liderança.\n\nDa mesma forma, a análise da liderança precisa considerar qual tipo de poder está sendo utilizado e como esse poder afeta os liderados."}, {"title": "Competência técnica não garante competência para liderar", "body": "Um exemplo discutido novamente em sala é o funcionário que apresenta excelente desempenho técnico e, por isso, recebe uma promoção para gerenciar uma equipe.\n\nDepois de alguns meses, apresenta dificuldades para conduzir pessoas e acaba sendo desligado.\n\nO problema está em presumir que:\n\nBom desempenho técnico = capacidade para liderar.\n\nUma pessoa pode produzir excelentes resultados individualmente e não possuir, naquele momento, as competências necessárias para exercer uma função de liderança.\n\nEsse exemplo reforça a necessidade de analisar liderança, poder, motivação, competências e contexto de maneira integrada.\n\nOs três tipos de poder\n\nO professor organiza as bases de poder em três grandes categorias:"}, {"title": "Poder Posicional", "body": "Está relacionado à estrutura, hierarquia e autoridade formal.\n\nPalavras-chave:\n\nPosição → estrutura → hierarquia → autoridade.\n\nDentro do poder posicional estão:\n\n- poder legítimo;\n\n- poder de coerção;\n\n- poder de recompensa."}, {"title": "Poder Pessoal", "body": "Origina-se principalmente das qualidades individuais da pessoa, como conhecimento, habilidade, competência, admiração e capacidade de tornar-se referência para os demais.\n\nDentro do poder pessoal estão:\n\n- poder de referência;\n\n- poder de especialista.\n\nA aula destaca que essas bases tendem a produzir resultados mais prolongados, associados a confiança, comprometimento e engajamento."}, {"title": "Poder Relacional", "body": "Está relacionado às relações, conexões e estratégias utilizadas para manter redes interpessoais.\n\nDentro do poder relacional estão:\n\n- poder de informação;\n\n- poder de conexão.\n\nA palavra-chave destacada para compreender essa categoria é:\n\nRelações/conexões.\n\nAs sete bases de poder"}, {"title": "Poder de Coerção", "body": "É sustentado pela possibilidade de aplicar punições, sanções ou consequências negativas.\n\nPalavra-chave:\n\nMedo.\n\nA pessoa modifica seu comportamento porque pretende evitar determinada consequência.\n\nNa discussão sobre saúde mental, a coerção foi relacionada a:\n\n- ansiedade;\n\n- hipervigilância;\n\n- clima defensivo.\n\nPortanto, pode conseguir obediência, mas não significa necessariamente que exista engajamento voluntário."}, {"title": "Poder de Recompensa", "body": "É sustentado pela possibilidade de oferecer algo valorizado pelo outro.\n\nPode envolver recompensas, benefícios, reconhecimento ou outros recursos controlados por quem exerce o poder.\n\nNa discussão da aula, essa base foi relacionada à motivação extrínseca e ao risco de instrumentalização das relações.\n\nA pessoa pode apresentar determinado comportamento para conseguir a recompensa.\n\nPalavra-chave: recompensa."}, {"title": "Poder Legítimo", "body": "É o poder decorrente da posição formal ocupada dentro de uma estrutura.\n\nA pessoa possui autoridade porque sua posição é reconhecida institucionalmente.\n\nExemplos aparecem em estruturas hierárquicas nas quais determinado cargo possui formalmente autoridade sobre outros.\n\nPalavras-chave:\n\nPosição → hierarquia → autoridade formal.\n\nNa discussão sobre saúde mental, o professor associa essa base à possibilidade de obediência passiva sem engajamento voluntário.\n\nUma organização menos hierarquizada, como algumas startups mencionadas em aula, pode reduzir a importância dessa base sem eliminar a possibilidade de liderança, pois outras bases de poder podem ser utilizadas."}, {"title": "Poder de Referência", "body": "Surge quando outras pessoas apresentam admiração e identificação com determinado indivíduo.\n\nA influência não depende principalmente de ameaça ou posição hierárquica. O indivíduo torna-se uma referência para os demais.\n\nPalavras-chave:\n\nAdmiração → identificação → referência.\n\nNa discussão realizada em sala, essa base foi associada a:\n\n- engajamento;\n\n- coesão;\n\n- lealdade;\n\n- menor estresse."}, {"title": "Poder de Especialista", "body": "É sustentado pelo conhecimento, habilidades e competência reconhecida.\n\nAs pessoas reconhecem que aquele indivíduo domina determinada área e, por isso, atribuem valor às suas orientações.\n\nPalavras-chave:\n\nConhecimento → habilidade → competência.\n\nO professor também relaciona essa base à segurança psicológica e à confiança.\n\nNão é o cargo que constitui o elemento central: é o reconhecimento da competência da pessoa."}, {"title": "Poder de Informação", "body": "Está relacionado à posse ou ao acesso a informações relevantes ou privilegiadas.\n\nA pessoa pode exercer poder porque outros indivíduos precisam das informações que ela possui para realizar suas atividades.\n\nPalavra-chave: informação privilegiada.\n\nO professor chama atenção para um risco importante: a retenção intencional de informações pode transformar essa base em um mecanismo de manipulação.\n\nQuando alguém controla informações para produzir dependência, insegurança ou obter vantagens, podem aparecer:\n\n- insegurança psicológica;\n\n- manipulação;\n\n- chantagem;\n\n- dependência.\n\nPortanto, possuir informação relevante pode conferir poder mesmo que a pessoa não ocupe formalmente um cargo superior."}, {"title": "Poder de Conexão", "body": "Está relacionado às relações influentes, redes interpessoais e alianças estratégicas que a pessoa consegue construir ou acessar.\n\nA influência decorre de quem a pessoa conhece e das conexões às quais possui acesso.\n\nPalavras-chave:\n\nConexões → relações → alianças estratégicas.\n\nEssas relações podem representar vantagem importante dentro de uma organização.\n\nEntretanto, a aula também aponta riscos quando essa base é utilizada inadequadamente, especialmente:\n\n- favoritismo;\n\n- formação de “panelinhas”."}, {"title": "Bases de poder e saúde mental", "body": "Um aspecto enfatizado pelo professor é que as bases de poder não devem ser analisadas apenas pela capacidade de produzir determinado comportamento.\n\nTambém é necessário observar como elas repercutem sobre o liderado e sobre a saúde mental no trabalho.\n\nCoerção\n\nMedo → ansiedade, hipervigilância e clima defensivo.\n\nRecompensa\n\nRecompensa externa → motivação extrínseca e possibilidade de instrumentalização das relações.\n\nLegítimo\n\nAutoridade da posição → possibilidade de obediência passiva sem engajamento voluntário.\n\nReferência\n\nAdmiração e identificação → engajamento, coesão e menor estresse.\n\nEspecialista\n\nCompetência reconhecida → confiança e segurança psicológica.\n\nInformação\n\nControle de informações → pode produzir insegurança quando utilizado para manipulação.\n\nConexão\n\nRedes e alianças → podem trazer vantagens relacionais, mas apresentam risco de favoritismo e formação de grupos fechados."}, {"title": "As bases pessoais e os resultados mais duradouros", "body": "Ao comparar as primeiras bases estudadas, o professor destaca especialmente:\n\nPoder de Referência + Poder de Especialista\n\nEssas duas bases pertencem ao poder pessoal.\n\nNa discussão apresentada, elas aparecem associadas a resultados mais prolongados porque a influência não depende exclusivamente de posição, punição ou recompensa.\n\nA aula relaciona o poder pessoal a:\n\n- maior engajamento;\n\n- satisfação no trabalho;\n\n- comprometimento;\n\n- confiança;\n\n- resultados mais duradouros.\n\nIsso não significa que as demais bases deixem de existir. A análise depende do contexto e da forma como o poder é exercido."}, {"title": "Quadro geral para memorização", "body": "PODER POSICIONAL\n\nLegítimo → posição/hierarquia\n\nCoerção → medo/punição\n\nRecompensa → recompensa\n\nPODER PESSOAL\n\nReferência → admiração/identificação\n\nEspecialista → conhecimento/competência\n\nPODER RELACIONAL\n\nInformação → informação privilegiada\n\nConexão → relações/alianças estratégicas"}, {"title": "O psicólogo organizacional diante das relações de poder", "body": "O psicólogo organizacional também entra em contextos nos quais existem relações de poder.\n\nAo ser chamado para atuar em uma organização, geralmente existe uma demanda ou um problema. Sua formação, conhecimento técnico ou até a maneira como é percebido pelas pessoas pode conferir a ele determinadas formas de influência.\n\nPor isso, não basta identificar quem possui poder.\n\nÉ necessário compreender:\n\n- qual é a fonte desse poder;\n\n- como ele é exercido;\n\n- como os liderados respondem;\n\n- quais comportamentos são produzidos;\n\n- quais impactos aparecem sobre as relações e a saúde mental;\n\n- se existe apenas obediência ou efetivo engajamento."}], "case": "Renato foi promovido porque apresentava excelente desempenho técnico. No novo cargo, começou a utilizar sua posição para exigir obediência, ameaçando funcionários com consequências quando as metas não eram cumpridas e oferecendo benefícios àqueles que seguiam suas determinações. A equipe passou a cumprir as ordens, mas surgiram ansiedade, clima defensivo e pouco engajamento. Uma funcionária sem cargo gerencial, por outro lado, tornou-se muito influente porque dominava tecnicamente o trabalho, era procurada pelos colegas para solucionar problemas e conquistou confiança do grupo. O caso demonstra que possuir uma posição formal não garante, por si só, uma liderança baseada em objetivos compartilhados e engajamento voluntário, além de evidenciar diferentes bases de poder dentro da mesma organização."}, "9": {"title": "Poder, Liderança e Integração com as Teorias da Motivação", "blocks": [{"title": "Introdução", "body": "1. Poder e liderança: retomando a diferença\n\nA aula retoma uma distinção central: poder e liderança estão relacionados, mas não são a mesma coisa.\n\nPoder\n\nÉ a capacidade ou o potencial de afetar o comportamento de outra pessoa. Dependendo de sua origem, pode acompanhar uma posição formal ou ser adquirido nas relações e nas características pessoais.\n\nLiderança\n\nTambém produz influência e mudança de comportamento, mas está ligada ao reconhecimento do líder, aos objetivos compartilhados e ao engajamento dos liderados.\n\nAssim, uma pessoa pode possuir poder sem necessariamente exercer liderança.\n\nNem todo indivíduo que possui poder é líder, mas o líder exerce determinado poder sobre seus liderados.\n\n2. Poder atribuído e poder adquirido\n\nAs três tipologias de poder estudadas anteriormente ajudam a compreender de onde vem a influência.\n\nPoder Posicional\n\nEstá ligado à posição ocupada na estrutura. É um poder atribuído à pessoa em razão da função, hierarquia ou autoridade formal.\n\nO indivíduo não precisa conquistar inicialmente esse poder nas relações: determinadas prerrogativas acompanham o cargo.\n\nPoder Pessoal\n\nEstá relacionado às características e competências do próprio indivíduo. Diferentemente do posicional, é predominantemente adquirido.\n\nA pessoa conquista influência por aspectos como:\n\nconhecimento;\n\ncompetência;\n\nrespeito;\n\nadmiração;\n\nidentificação.\n\nPor essa razão, o poder pessoal é apresentado na aula como a tipologia mais diretamente conectada à liderança.\n\nPoder Relacional\n\nDepende das relações e conexões construídas pelo indivíduo. Sua influência está associada à forma como a pessoa desenvolve e utiliza sua rede de relacionamentos.\n\n3. Poder pessoal e liderança\n\nA proximidade entre liderança e poder pessoal pode ser compreendida pela forma como a influência acontece.\n\nNo poder de referência, por exemplo, a pessoa reconhece o outro como alguém que admira ou com quem se identifica. Essa referência pode modificar seu comportamento porque ela deseja acompanhar aquele líder.\n\nNo poder de especialista, conhecimento e competência também podem produzir reconhecimento e influência.\n\nNesse caso, a influência não depende exclusivamente de uma ordem formal.\n\nPoder pessoal → reconhecimento → influência → maior aproximação com a liderança.\n\n4. Cargo de chefia não garante liderança\n\nUma pessoa pode receber formalmente uma função de coordenação e, com ela, determinado poder posicional.\n\nIsso não significa que automaticamente se tornou uma boa líder.\n\nO exemplo retomado em aula é o profissional tecnicamente excelente que trabalha durante muitos anos na empresa e recebe uma promoção como forma de reconhecimento.\n\nA organização pensa:\n\n“Ele é um excelente técnico, portanto será um excelente coordenador.”\n\nEntretanto, a pessoa assume uma equipe:\n\nsem preparação;\n\nsem treinamento;\n\nsem acompanhamento;\n\nsem mentoria;\n\nsem desenvolvimento para lidar com pessoas.\n\nDepois, tenta fazer com que todos trabalhem exatamente como ela trabalhava.\n\nO resultado pode ser a desorganização da equipe e o fracasso na nova função.\n\nSer excelente executor não significa automaticamente saber liderar pessoas.\n\n5. Liderar exige compreender diferenças entre as pessoas\n\nUma das dificuldades do profissional promovido sem preparação é esperar que seus liderados ajam exatamente como ele agia.\n\nEntretanto, as pessoas apresentam características, competências e formas de responder diferentes.\n\nPor isso, a liderança não pode ser reduzida à reprodução do comportamento do próprio líder.\n\nEssa discussão reforça que liderança envolve compreender quem está sendo liderado, e não somente aquilo que o líder sabe executar.\n\nIntegração com a Motivação\n\n6. Motivação como força interna\n\nA discussão sobre liderança é conectada ao conteúdo anterior de motivação.\n\nNa perspectiva trabalhada em aula:\n\nMotivação → força interna que leva a pessoa a se mover em determinada direção.\n\nOs estímulos externos podem participar desse processo, mas diferentes teorias procuram explicar aspectos distintos do comportamento motivado.\n\nPor isso, o professor reforça que as teorias não precisam ser entendidas como explicações que simplesmente anulam umas às outras.\n\nCada teórico observou determinados elementos do comportamento humano e da motivação.\n\n7. As teorias observam diferentes dimensões da motivação\n\nA aula retoma que algumas explicações enfatizam mais os estímulos externos, enquanto outras avançam sobre elementos internos e sobre as necessidades das pessoas.\n\nO ponto central é compreender que um estímulo externo pode funcionar quando está adequadamente relacionado àquilo que mobiliza o indivíduo.\n\nAssim:\n\nestímulo externo isolado não explica toda a motivação.\n\nQuando se compreende aquilo que mobiliza internamente uma pessoa, determinados estímulos podem apresentar maior aderência.\n\n8. Maslow e as necessidades humanas\n\nA teoria de Maslow é retomada a partir da hierarquia das necessidades.\n\nNa discussão da aula, as necessidades mais básicas aparecem como condições importantes para que o indivíduo possa avançar em direção a níveis superiores.\n\nNo topo, a autorrealização representa um nível associado ao desenvolvimento das próprias potencialidades.\n\nA discussão também destaca uma questão prática: não faz sentido falar apenas de autonomia, propósito ou desenvolvimento quando necessidades fundamentais do trabalhador permanecem comprometidas.\n\n9. Vroom e a expectativa\n\nA teoria de Vroom é retomada a partir da avaliação que a pessoa realiza sobre aquilo que poderá obter por meio de seu esforço.\n\nUm ponto enfatizado na discussão é a ideia de valência:\n\n“Isso vale a pena para mim?”\n\nAssim, o comportamento envolve uma avaliação da relação entre esforço, resultado esperado e valor atribuído ao resultado.\n\nEssa lógica aproxima a teoria de elementos externos, pois aquilo que poderá ser obtido também participa da decisão de agir.\n\n10. Autodeterminação: competência e autonomia\n\nA aula também retoma a Teoria da Autodeterminação.\n\nUm exemplo utilizado é o trabalhador que possui competência para resolver determinado problema e recebe autonomia para fazê-lo.\n\nO líder apresenta o problema e permite que a pessoa mobilize sua capacidade para encontrar a solução.\n\nNesse processo aparecem especialmente:\n\nCompetência\n\nA pessoa percebe que possui capacidade para realizar a atividade ou resolver o problema.\n\nAutonomia\n\nA pessoa recebe espaço para utilizar sua competência e tomar decisões relacionadas à realização da atividade.\n\nA autonomia, portanto, não significa simplesmente abandonar o trabalhador. Ela aparece relacionada à possibilidade de utilizar efetivamente suas competências.\n\n11. Daniel Pink: autonomia, domínio e propósito\n\nDaniel Pink aparece como uma ampliação da discussão sobre motivação.\n\nA aula destaca três elementos:\n\nAutonomia\n\nPossibilidade de participar e agir com maior autodeterminação.\n\nDomínio\n\nDesenvolvimento contínuo da competência, avançando em direção a níveis cada vez maiores de excelência.\n\nPropósito\n\nPercepção de sentido naquilo que está sendo realizado.\n\nA discussão aproxima o desenvolvimento contínuo da competência de um processo de busca de excelência.\n\nAUTONOMIA + DOMÍNIO + PROPÓSITO\n\n12. Locke e Latham: metas\n\nLocke e Latham são retomados pela importância das metas.\n\nUma meta precisa oferecer direcionamento para a ação.\n\nNa discussão da aula, ganha destaque a necessidade de que as metas sejam:\n\nclaras;\n\nespecíficas;\n\nadequadamente estabelecidas.\n\nQuando a pessoa não compreende claramente aquilo que deve alcançar, o direcionamento do comportamento fica prejudicado.\n\nAssim, as metas participam da mobilização do esforço porque tornam mais definido para onde a ação deve ser direcionada.\n\n13. As teorias podem ser relacionadas\n\nA aula propõe observar conexões entre diferentes explicações da motivação.\n\nPor exemplo:\n\nMaslow → necessidades e autorrealização.\n\nAutodeterminação → autonomia e competência.\n\nDaniel Pink → autonomia, domínio e propósito.\n\nLocke e Latham → metas e direcionamento.\n\nVroom → expectativa e valor atribuído ao resultado.\n\nA ideia não é transformar todas essas teorias em uma única explicação, mas compreender que elas observam dimensões diferentes do comportamento motivado.\n\nPoder, Liderança e Motivação\n\n14. A forma de exercer poder interfere na motivação\n\nA discussão retorna às tipologias de poder.\n\nUm líder pode utilizar diferentes fontes de influência, mas essas formas de poder não produzem necessariamente a mesma resposta.\n\nUma influência baseada predominantemente em imposição e posição formal é diferente daquela construída a partir de:\n\nrespeito;\n\nadmiração;\n\ncompetência;\n\nreconhecimento;\n\nautonomia;\n\nidentificação.\n\nÉ nesse ponto que poder, liderança e motivação começam a se conectar.\n\nO modo como o líder exerce influência pode favorecer ou dificultar o envolvimento das pessoas com o trabalho.\n\n15. Poder pessoal e motivação\n\nO poder pessoal apresenta uma aproximação importante com as formas de liderança discutidas em aula porque é conquistado, e não simplesmente entregue por uma posição hierárquica.\n\nQuando existe reconhecimento da competência ou identificação com o líder, a influência pode produzir maior adesão.\n\nPor isso, ao analisar um líder, não basta perguntar:\n\n“Qual cargo ele ocupa?”\n\nTambém é necessário perguntar:\n\n“Por que as pessoas aceitam sua influência?”\n\nA resposta ajuda a identificar qual base de poder está predominando.\n\nPsicologia Organizacional e Cultura\n\n16. Saúde mental não pode existir apenas no documento\n\nNa parte final da aula, a discussão se desloca para a atuação organizacional.\n\nO professor critica situações nas quais a organização produz:\n\ndocumentos;\n\nnormas;\n\nprocedimentos;\n\npalestras;\n\nmas não transforma efetivamente suas práticas.\n\nA empresa pode afirmar que valoriza a saúde mental e, ao mesmo tempo, manter práticas que não correspondem ao discurso.\n\nO mesmo raciocínio é utilizado para comparar documentos de segurança do trabalho que existem formalmente, mas não são incorporados ao cotidiano.\n\nDocumentar não significa necessariamente implementar.\n\n17. A cultura organizacional precisa ser construída\n\nMudanças relacionadas à saúde mental e às relações de trabalho não acontecem apenas porque uma palestra foi realizada.\n\nA aula apresenta esse processo como educativo e cultural.\n\nA organização precisa reconhecer que a transformação exige continuidade e construção ao longo do tempo.\n\nPor isso, a Psicologia Organizacional pode participar de processos de:\n\nconstrução de cultura;\n\ndesenvolvimento de metodologias;\n\neducação organizacional;\n\ndesenvolvimento de pessoas;\n\ntransformação das relações de trabalho.\n\nNão se trata de uma intervenção isolada capaz de modificar imediatamente toda a organização.\n\n18. Psicologia Organizacional e atuação integrada\n\nA discussão também mostra que determinadas demandas organizacionais não pertencem exclusivamente ao psicólogo.\n\nDependendo do problema, a atuação pode ocorrer em conjunto com outros profissionais e áreas.\n\nO psicólogo organizacional contribui com seu olhar sobre:\n\ncomportamento;\n\nrelações;\n\nliderança;\n\nmotivação;\n\nsaúde mental;\n\ncultura organizacional.\n\nA intervenção, porém, precisa estar vinculada às condições reais da organização e ao processo que se pretende transformar.\n\n19. Cultura de performance e saúde mental\n\nA aula também problematiza a valorização excessiva da performance.\n\nQuando produzir cada vez mais se transforma no único parâmetro de sucesso, podem surgir tensões entre:\n\nresultado organizacional × saúde das pessoas.\n\nA discussão não apresenta desempenho e produtividade como necessariamente negativos. O problema aparece quando a busca por resultado ignora as condições humanas necessárias para sustentá-lo.\n\nPor isso, a análise psicológica precisa observar não apenas quanto está sendo produzido, mas também em quais condições esse resultado está sendo alcançado."}], "case": "Carlos trabalha há 15 anos em uma empresa e sempre foi reconhecido como excelente técnico. Como forma de premiá-lo, a direção o promoveu a coordenador, atribuindo-lhe autoridade formal sobre uma equipe. Sem treinamento ou acompanhamento, Carlos passou a exigir que todos executassem o trabalho exatamente como ele fazia. A equipe começou a apresentar conflitos e queda no engajamento. Outra funcionária, sem cargo de chefia, passou a ser procurada pelos colegas por sua competência, respeito e capacidade de ajudá-los a resolver problemas. O caso demonstra que o poder posicional pode ser atribuído pelo cargo, enquanto o poder pessoal é construído a partir de características reconhecidas pelos outros, aproximando-se mais diretamente da liderança."}, "10": {"title": "Ecossistema da Liderança: Motivação, Poder e Ações do Líder", "blocks": [{"title": "O Ecossistema da Liderança", "body": "O professor reúne sob o nome Ecossistema da Liderança um conjunto de conteúdos que precisam ser compreendidos de forma conectada:\n\nmotivação;\n\npoder e bases de poder;\n\ntipos de liderança;\n\ncaracterísticas do líder;\n\ncomportamento do líder;\n\natributos do líder.\n\nA ideia de ecossistema indica justamente que esses elementos não funcionam isoladamente. Para compreender o comportamento de um líder, é necessário observar o conjunto de fatores que interfere em suas atitudes, reações e formas de conduzir a equipe.\n\nPara a Psicologia Organizacional, isso significa olhar para uma situação concreta de trabalho e buscar compreender de onde surgem as ações do líder, o que o move e quais fontes de influência ele utiliza."}, {"title": "A motivação como ponto de partida", "body": "Todo o Ecossistema da Liderança começa pelo estudo da motivação.\n\nNa definição trabalhada em aula:\n\nMotivação é uma ação interna que move a pessoa na direção de alguma coisa.\n\nA motivação funciona como um motor interno que direciona o comportamento. Por isso, não é adequado afirmar simplesmente que uma pessoa “motiva” outra. O que outra pessoa pode fazer é criar estímulos que encontrem algo que já existe internamente no indivíduo.\n\nEssa distinção é importante para compreender posteriormente a ação do líder sobre seus liderados."}, {"title": "Motivação intrínseca e extrínseca", "body": "Motivação intrínseca\n\nÉ apresentada como o movimento que nasce internamente e permanece mesmo diante de dificuldades, conflitos ou situações desafiadoras.\n\nA pessoa pode estar cansada, contrariada ou enfrentando obstáculos e ainda assim continuar realizando determinada ação porque existe uma força interna que a direciona.\n\nMotivação extrínseca\n\nEstá associada aos estímulos externos e ao ambiente.\n\nEsses estímulos são apresentados como mais temporários, porque dependem da permanência das condições externas. Quando o ambiente ou o estímulo desaparece,
