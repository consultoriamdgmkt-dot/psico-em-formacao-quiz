</main><script>
const D={"César": {"sub": "Motivação, Liderança e Comportamento Organizacional", "topics": {"1. Liderança e poder nas organizações": [["Um coordenador recém-promovido afirma que, por ocupar formalmente o cargo de chefia, automaticamente se tornou um líder eficaz. Qual análise é mais adequada?", ["O cargo garante liderança sempre que existe autoridade formal.", "Poder e liderança são nomes diferentes para o mesmo fenômeno.", "A liderança independe das relações estabelecidas no trabalho.", "O cargo pode conferir poder, mas liderança depende do processo de influência nas relações."], 3, "O material distingue poder de liderança: o cargo pode conferir poder, mas liderança é construída na interação com liderados e contexto."], ["Uma diretora possui autoridade para realocar recursos, mas não utiliza essa capacidade durante uma reunião. O conceito que melhor descreve essa capacidade disponível é:", ["Poder.", "Liderança.", "Engajamento.", "Coesão."], 0, "Poder é capacidade ou potencial de influenciar pessoas e controlar recursos, podendo existir sem ser exercido."], ["Uma equipe cumpre uma ordem porque o gerente controla recursos e pode determinar procedimentos, embora os integrantes não estejam comprometidos com a proposta. O caso evidencia principalmente:", ["Liderança, porque houve engajamento voluntário.", "Poder, porque houve capacidade de produzir obediência.", "Liderança transformacional, porque houve aceitação.", "Coesão, porque o grupo cumpriu a ordem."], 1, "O poder pode produzir obediência ou concordância; liderança busca aceitação, comprometimento e participação."], ["Uma profissional sem cargo formal mobiliza colegas em torno de um objetivo compartilhado, e eles aderem voluntariamente às ações propostas. O fenômeno descrito é principalmente:", ["Autoridade formal.", "Liderança.", "Poder coercitivo.", "Hierarquia."], 1, "Liderança é um processo de influência interpessoal orientado a objetivos compartilhados e engajamento voluntário."], ["Um gestor diz que nasceu líder e que sua liderança independe da equipe e da situação. Qual ideia do material contradiz essa afirmação?", ["Liderança é exclusivamente uma característica individual.", "Liderança é psicossocial, relacional e dinâmica.", "Liderança é equivalente à autoridade do cargo.", "Liderança existe apenas quando há punição."], 1, "A liderança é construída na interação entre líder, liderados e contexto; portanto, é psicossocial, relacional e dinâmica."], ["Duas pessoas ocupam cargos equivalentes. Uma consegue apenas obediência formal; a outra obtém participação e compromisso com objetivos comuns. Qual interpretação é mais precisa?", ["Ambas demonstram necessariamente a mesma liderança.", "A primeira não possui poder porque ocupa cargo formal.", "A segunda evidencia mais claramente liderança pelo engajamento e compromisso.", "A segunda não exerce influência porque não depende de obediência."], 2, "Engajamento, aceitação e compromisso com objetivos compartilhados caracterizam mais diretamente o processo de liderança."], ["Uma pessoa tem capacidade de influenciar decisões porque controla recursos importantes, mas ninguém precisa aderir voluntariamente aos seus objetivos. Essa descrição corresponde mais diretamente a:", ["Poder.", "Liderança.", "Satisfação.", "Aprendizagem em equipe."], 0, "A definição de poder enfatiza capacidade ou potencial de influência e controle de recursos, sem exigir engajamento voluntário."], ["Em uma organização, um chefe consegue que todos cumpram suas determinações. Qual informação adicional seria necessária para afirmar que há liderança, e não apenas exercício de poder?", ["Se o chefe possui uma sala própria.", "Se existe aceitação, participação e orientação para objetivos compartilhados.", "Se o cargo aparece no organograma.", "Se a empresa possui muitos funcionários."], 1, "A liderança envolve influência interpessoal, objetivos compartilhados e engajamento, não apenas conformidade."], ["Por que o material afirma que poder e liderança não são sinônimos?", ["Porque poder só existe fora das organizações.", "Porque liderança é cargo e poder é comportamento.", "Porque poder é capacidade de influência, enquanto liderança é um processo relacional orientado a objetivos compartilhados.", "Porque liderança não envolve influência."], 2, "Poder designa capacidade/potencial; liderança designa processo de influência interpessoal construído nas relações."], ["Um supervisor muda de equipe e percebe que estratégias que antes geravam participação já não produzem o mesmo efeito. Qual característica da liderança ajuda a compreender a situação?", ["Seu caráter fixo e independente do contexto.", "Seu caráter relacional e dinâmico.", "Sua equivalência com poder formal.", "Sua independência dos liderados."], 1, "A liderança varia conforme a interação entre líder, liderados e contexto, por isso é relacional e dinâmica."]], "2. As 7 bases de poder": [["A autoridade de uma gerente é aceita porque seu cargo lhe confere formalmente poder de decisão. Qual base está presente?", ["Legítimo.", "Especialista.", "Referência.", "Conexão."], 0, "Poder legítimo deriva do cargo e da hierarquia."], ["Um supervisor ameaça aplicar sanções caso a equipe não cumpra determinada ordem. Qual base predomina?", ["Recompensa.", "Coerção.", "Informação.", "Referência."], 1, "Coerção utiliza medo, punição ou consequências negativas."], ["Uma empresa oferece bônus para estimular determinado comportamento. Qual base de poder é utilizada?", ["Recompensa.", "Legítimo.", "Especialista.", "Conexão."], 0, "Poder de recompensa deriva da possibilidade de oferecer benefícios ou incentivos."], ["Colegas seguem a orientação de uma analista porque reconhecem seu profundo domínio técnico. Qual base aparece?", ["Referência.", "Especialista.", "Legítimo.", "Coerção."], 1, "Poder de especialista deriva de conhecimento, competência e domínio técnico."], ["Uma profissional influencia colegas porque é admirada e serve como modelo de identificação. Qual base predomina?", ["Informação.", "Referência.", "Recompensa.", "Legítimo."], 1, "Poder de referência surge de identificação, carisma e admiração."], ["Um funcionário influencia decisões porque possui acesso a dados relevantes que os demais não possuem. Qual base é descrita?", ["Informação.", "Conexão.", "Especialista.", "Coerção."], 0, "Poder de informação deriva da posse ou do acesso a informações relevantes."], ["Uma gestora amplia sua influência por meio de contatos, redes e alianças estratégicas. Qual base está presente?", ["Referência.", "Conexão.", "Legítimo.", "Recompensa."], 1, "Poder de conexão deriva de relações, contatos e alianças."], ["No esquema do professor, legítimo, coerção e recompensa formam qual categoria?", ["Pessoal.", "Relacional.", "Posicional.", "Informal."], 2, "A categoria posicional reúne legítimo, coerção e recompensa."], ["No esquema do professor, especialista e referência pertencem a qual categoria?", ["Pessoal.", "Relacional.", "Posicional.", "Coercitiva."], 0, "Poder pessoal reúne especialista e referência."], ["No esquema do professor, informação e conexão pertencem a qual categoria?", ["Pessoal.", "Posicional.", "Relacional.", "Legítima."], 2, "Poder relacional reúne informação e conexão."]], "3. Teorias e estilos de liderança": [["O líder concentra decisões e mantém alto controle, com pouca participação do grupo. Qual estilo clássico?", ["Democrático.", "Autocrático.", "Liberal.", "Transformacional."], 1, "Autocrática é marcada por centralização e controle."], ["O grupo participa das decisões e o líder atua como mediador e facilitador. Qual estilo?", ["Democrático.", "Autocrático.", "Laissez-faire.", "Transacional."], 0, "Democrática enfatiza participação."], ["O grupo recebe ampla liberdade e o líder intervém pouco. Qual estilo?", ["Autocrático.", "Democrático.", "Liberal/Laissez-faire.", "Situacional S1."], 2, "Laissez-faire envolve grande liberdade e pouca intervenção."], ["Na liderança situacional, S1 - Direcionar corresponde a:", ["Alta tarefa e baixo relacionamento.", "Alta tarefa e alto relacionamento.", "Baixa tarefa e alto relacionamento.", "Baixa tarefa e baixo relacionamento."], 0, "S1 é alta tarefa e baixo relacionamento."], ["Na liderança situacional, S2 - Orientar/Persuadir corresponde a:", ["Baixa tarefa e baixo relacionamento.", "Alta tarefa e alto relacionamento.", "Baixa tarefa e alto relacionamento.", "Alta tarefa e baixo relacionamento."], 1, "S2 combina alta tarefa e alto relacionamento."], ["Na liderança situacional, S3 - Apoiar corresponde a:", ["Alta tarefa e baixo relacionamento.", "Alta tarefa e alto relacionamento.", "Baixa tarefa e alto relacionamento.", "Baixa tarefa e baixo relacionamento."], 2, "S3 combina baixa tarefa e alto relacionamento."], ["Na liderança situacional, S4 - Delegar corresponde a:", ["Alta tarefa e baixo relacionamento.", "Alta tarefa e alto relacionamento.", "Baixa tarefa e alto relacionamento.", "Baixa tarefa e baixo relacionamento."], 3, "S4 combina baixa tarefa e baixo relacionamento."], ["Quanto mais preparado e autônomo o liderado, qual movimento é compatível com o modelo situacional estudado?", ["Aumentar necessariamente a coerção.", "Ampliar a delegação.", "Eliminar toda autonomia.", "Centralizar todas as decisões."], 1, "Maior preparo e autonomia permitem maior delegação."], ["Uma liderança opera pela lógica meta cumprida → recompensa; desempenho inadequado → cobrança. Qual tipo?", ["Transformacional.", "Transacional.", "Democrática.", "Liberal."], 1, "Transacional se baseia em troca."], ["Uma líder inspira, motiva e desenvolve os liderados, estimulando novas formas de pensar. Qual tipo?", ["Transacional.", "Transformacional.", "Autocrática.", "Coercitiva."], 1, "Transformacional envolve inspiração, desenvolvimento e estimulação intelectual."]], "4. Características, comportamentos e competências do líder": [["Aspectos individuais que podem contribuir para a atuação do líder são chamados de:", ["Características.", "Comportamentos.", "Competências.", "Autoridade."], 0, "Características são aspectos individuais."], ["Aquilo que o líder efetivamente faz na interação com a equipe corresponde a:", ["Características.", "Comportamentos.", "Cargo.", "Poder relacional."], 1, "Comportamentos são ações efetivamente realizadas."], ["Conhecimentos e capacidades utilizados para orientar pessoas e tarefas correspondem a:", ["Competências.", "Características.", "Autoridade.", "Coerção."], 0, "Competências são conhecimentos e capacidades aplicados."], ["A influência associada à posição ou ao cargo corresponde a:", ["Autoridade.", "Competência.", "Comportamento.", "Co-construção."], 0, "Autoridade está ligada à posição/cargo, mas não é sinônimo de liderança."], ["Um profissional possui cargo formal, mas não consegue mobilizar a equipe. Qual conclusão é adequada?", ["Autoridade garante liderança.", "Autoridade e liderança não são sinônimos.", "Liderança dispensa relações.", "Competência é sempre irrelevante."], 1, "A posição formal não garante liderança."], ["Um gestor adapta sua forma de agir conforme pessoas, tarefa e contexto. Isso expressa qual ideia-chave?", ["Líder eficaz mantém comportamento fixo.", "Líder eficaz adapta sua atuação.", "Cargo substitui competência.", "Características anulam contexto."], 1, "O material enfatiza adaptação às pessoas, tarefa e contexto."], ["Um líder tem conhecimento técnico, mas sua interação cotidiana é hostil. A distinção relevante é entre:", ["Competência e comportamento.", "Poder e grupo.", "Micro e macro.", "Satisfação e compromisso."], 0, "Competência diz respeito a capacidades; comportamento ao que efetivamente faz."], ["Dizer que alguém é comunicativo descreve mais diretamente um aspecto individual; observar que ele solicita feedback descreve:", ["Duas autoridades formais.", "Característica e comportamento, respectivamente.", "Dois poderes relacionais.", "Duas competências necessariamente."], 1, "O primeiro é traço/aspecto; o segundo é ação observável."], ["Por que autoridade não deve ser usada como sinônimo de liderança?", ["Porque autoridade nunca existe em cargos.", "Porque autoridade decorre da posição, enquanto liderança envolve influência construída nas relações.", "Porque liderança não influencia pessoas.", "Porque autoridade exige engajamento voluntário."], 1, "Autoridade está vinculada ao cargo; liderança é processo relacional."], ["Na análise do líder, considerar características, comportamentos e competências evita:", ["Analisar apenas um único aspecto da atuação.", "Considerar o contexto.", "Observar ações concretas.", "Distinguir cargo de liderança."], 0, "O material propõe olhar articulado, não redução a um único traço."]], "5. Ecossistema da liderança - EU, ELES e NÓS": [["Na lente EU, o foco recai principalmente sobre:", ["Liderados.", "Líder individual.", "Organização inteira.", "Mercado."], 1, "EU focaliza líder, características, comportamentos, competências e autoridade."], ["Na lente ELES, o foco recai sobre:", ["Liderados e sua participação na construção da liderança.", "Apenas o cargo do líder.", "Somente regras formais.", "Clientes."], 0, "ELES focaliza os liderados."], ["Na lente NÓS, o foco principal é:", ["Somente personalidade.", "Construção coletiva e liderança compartilhada.", "Punição.", "Hierarquia formal."], 1, "NÓS focaliza o coletivo."], ["O ecossistema da liderança propõe compreender liderança como:", ["Fenômeno isolado.", "Fenômeno integrado entre diferentes elementos.", "Sinônimo de cargo.", "Atributo exclusivamente inato."], 1, "O ecossistema articula motivação, poder, líder, liderados e dinâmica coletiva."], ["Perguntar 'o que move essa pessoa?' focaliza qual elemento do ecossistema?", ["Motivação.", "Base de poder.", "Estilo.", "Dinâmica coletiva."], 0, "Motivação focaliza energia, direção e sentido da ação."], ["Perguntar 'por que os outros atendem à sua influência?' focaliza:", ["Base de poder.", "Satisfação.", "Macro.", "Coesão."], 0, "A pergunta busca a fonte do poder."], ["Perguntar 'como o poder e a decisão são exercidos?' focaliza:", ["Estilo de liderança.", "Motivação.", "Nível macro.", "Contrato psicológico."], 0, "Estilo diz respeito à forma de condução."], ["Perguntar 'o que essa liderança produz no grupo?' focaliza:", ["Dinâmica coletiva.", "Somente características.", "Poder legítimo.", "Contrato transacional."], 0, "A dinâmica coletiva observa integração, autonomia e compromisso."], ["Uma análise que considera apenas personalidade do chefe ignora principalmente:", ["A interação entre líder, liderados e coletivo.", "A existência de características individuais.", "A possibilidade de cargo formal.", "O nível micro."], 0, "O ecossistema evita reduzir liderança ao indivíduo."], ["Qual síntese corresponde às três lentes?", ["EU=líder; ELES=liderados; NÓS=coletivo.", "EU=grupo; ELES=cargo; NÓS=punição.", "EU=macro; ELES=micro; NÓS=meso.", "EU=motivação; ELES=coerção; NÓS=recompensa."], 0, "Essa é a síntese usada no material."]], "6. Grupos, equipes e aprendizagem": [["Um conjunto de pessoas atua no mesmo contexto, mas com baixa interdependência. Isso se aproxima mais de:", ["Grupo.", "Equipe.", "Co-construção.", "Time integrado."], 0, "Grupo pode ter menor interdependência."], ["Quando há coordenação, funções articuladas, objetivo comum e tarefas interdependentes, há principalmente:", ["Equipe.", "Grupo sem integração.", "Contrato transacional.", "Poder legítimo."], 0, "Equipe envolve coordenação e interdependência."], ["Aprendizagem em equipe ocorre principalmente por:", ["Perguntas, feedback, experimentação, reflexão e compartilhamento.", "Obediência sem discussão.", "Isolamento de conhecimentos.", "Ausência de erros."], 0, "Aprendizagem coletiva envolve compartilhamento e reflexão."], ["Construção, no material, corresponde a:", ["Dar sentido e entender.", "Punir erro.", "Controlar recursos.", "Delegar cargo."], 0, "Construção é processo de produzir entendimento."], ["Co-construção corresponde a:", ["Aprimorar conjuntamente uma compreensão ou ideia.", "Trabalhar isoladamente.", "Eliminar discordâncias.", "Centralizar decisões."], 0, "Co-construção é elaboração conjunta."], ["Conflito construtivo significa:", ["Discussão respeitosa de opiniões diferentes.", "Ataque pessoal.", "Ausência de divergência.", "Punição formal."], 0, "Discordar de modo respeitoso pode apoiar aprendizagem."], ["Qual palavra-chave resume aprendizagem em equipe no material?", ["Compartilhamento.", "Coerção.", "Hierarquia.", "Isolamento."], 0, "O resumo destaca compartilhamento."], ["Uma equipe discute um erro para entender consequências e melhorar a prática. Isso exemplifica:", ["Aprendizagem em equipe.", "Poder coercitivo.", "Contrato transacional.", "Laissez-faire."], 0, "Discussão de erros e reflexão fazem parte da aprendizagem coletiva."], ["Qual afirmação diferencia grupo e equipe?", ["Equipe apresenta maior coordenação e interdependência.", "Grupo sempre possui mais integração.", "Equipe dispensa objetivo comum.", "Grupo exige tarefas interdependentes."], 0, "A equipe possui maior articulação entre tarefas e responsabilidades."], ["Compartilhar informações e responsabilidades favorece:", ["Funcionamento e aprendizagem da equipe.", "Eliminação da interdependência.", "Poder coercitivo.", "Redução necessária da autonomia."], 0, "Trocas e compartilhamento integram o funcionamento coletivo."]], "7. Níveis de análise - micro, meso e macro": [["Uma análise focaliza motivação de um trabalhador específico. Qual nível?", ["Micro.", "Meso.", "Macro.", "Relacional."], 0, "Micro é o nível individual."], ["Uma análise focaliza aprendizagem de uma equipe. Qual nível?", ["Micro.", "Meso.", "Macro.", "Externo."], 1, "Meso é o nível de grupo/equipe."], ["Uma análise focaliza políticas e cultura da organização. Qual nível?", ["Micro.", "Meso.", "Macro.", "Individual."], 2, "Macro focaliza organização e contexto mais amplo."], ["O estudo de aprendizagem das equipes trabalha principalmente em qual nível?", ["Micro.", "Meso.", "Macro.", "Clínico."], 1, "O material localiza aprendizagem de equipes principalmente no nível meso."], ["Satisfação de uma pessoa, tomada isoladamente, pertence mais diretamente ao nível:", ["Micro.", "Meso.", "Macro.", "Institucional."], 0, "Experiência individual é nível micro."], ["Padrões de interação entre integrantes de um grupo pertencem principalmente ao nível:", ["Micro.", "Meso.", "Macro.", "Legal."], 1, "Interações grupais são analisadas no meso."], ["Estrutura organizacional e políticas corporativas pertencem principalmente ao nível:", ["Micro.", "Meso.", "Macro.", "Pessoal."], 2, "São fenômenos organizacionais/contextuais."], ["Qual associação está correta?", ["Micro=indivíduo; meso=equipe/grupo; macro=organização/contexto.", "Micro=organização; meso=indivíduo; macro=equipe.", "Micro=equipe; meso=contexto; macro=indivíduo.", "Micro=cargo; meso=poder; macro=liderança."], 0, "Essa é a classificação utilizada."], ["Uma pesquisa que combina atitudes individuais e processos de equipe está articulando principalmente:", ["Micro e meso.", "Meso e macro apenas.", "Macro apenas.", "Micro e macro sem meso."], 0, "Atitudes individuais são micro; processos de equipe são meso."], ["Por que distinguir níveis de análise?", ["Para localizar onde o fenômeno está sendo observado e evitar confundir indivíduo, grupo e organização.", "Para afirmar que só o nível micro importa.", "Para eliminar relações entre níveis.", "Para transformar liderança em cargo."], 0, "A distinção organiza o foco analítico."]], "8. Relações no trabalho": [["Um vínculo baseado em trocas materiais, obrigações econômicas e prazos caracteriza contrato psicológico:", ["Transacional.", "Relacional.", "Transformacional.", "Referencial."], 0, "O contrato transacional enfatiza trocas econômicas e baixo envolvimento emocional."], ["Lealdade, suporte psicossocial, desenvolvimento e estabilidade percebida caracterizam contrato:", ["Transacional.", "Relacional.", "Coercitivo.", "Posicional."], 1, "O contrato relacional envolve vínculo de longo prazo e suporte."], ["Poder falar, perguntar e admitir erros sem medo de represálias descreve:", ["Segurança psicológica.", "Poder legítimo.", "Satisfação.", "Contrato transacional."], 0, "Segurança psicológica é crença compartilhada de segurança para riscos interpessoais."], ["A avaliação e experiência da pessoa em relação ao trabalho corresponde a:", ["Satisfação no trabalho.", "Comprometimento organizacional.", "Poder de referência.", "Coesão."], 0, "Satisfação refere-se à avaliação/experiência em relação ao trabalho."], ["O vínculo e a ligação do trabalhador com a organização correspondem a:", ["Satisfação.", "Comprometimento organizacional.", "Segurança psicológica.", "Poder de informação."], 1, "Comprometimento diz respeito ao vínculo com a organização."], ["Uma relação de trabalho focada apenas no cumprimento mínimo de obrigações aproxima-se de:", ["Contrato transacional.", "Contrato relacional.", "Liderança transformacional.", "Co-construção."], 0, "O transacional enfatiza obrigações delimitadas e trocas materiais."], ["Uma organização promete desenvolvimento e estabilidade, fortalecendo lealdade. Isso se aproxima de:", ["Contrato relacional.", "Contrato transacional.", "Poder coercitivo.", "Laissez-faire."], 0, "Desenvolvimento, suporte e estabilidade são elementos relacionais."], ["Segurança psicológica favorece especialmente:", ["Comunicação, aprendizagem e participação.", "Silêncio obrigatório.", "Ausência de responsabilidade.", "Coerção."], 0, "A segurança para riscos interpessoais facilita comunicação e aprendizagem."], ["Satisfação e comprometimento são:", ["Conceitos relacionados, mas distintos.", "Sinônimos exatos.", "Bases de poder.", "Estilos de liderança."], 0, "Satisfação é avaliação do trabalho; comprometimento é vínculo com a organização."], ["Um trabalhador pode estar satisfeito com suas tarefas sem que isso seja exatamente o mesmo que:", ["Estar comprometido com a organização.", "Possuir poder legítimo.", "Exercer coerção.", "Pertencer ao nível meso."], 0, "Satisfação e comprometimento não são equivalentes."]], "9. Motivação e teorias": [["Qual definição resume motivação no material?", ["Força que move e direciona a ação.", "Cargo formal.", "Capacidade de punir.", "Ausência de esforço."], 0, "Motivação direciona e sustenta a ação."], ["Na motivação intrínseca, a pessoa age principalmente por:", ["Interesse, valor, aprendizagem ou propósito na atividade.", "Apenas punição externa.", "Somente salário.", "Autoridade do cargo."], 0, "A motivação intrínseca se liga ao significado interno da atividade."], ["Maslow é associado a:", ["Hierarquia de necessidades.", "Fatores higiênicos e motivadores.", "Expectativa, instrumentalidade e valência.", "Metas específicas e feedback."], 0, "Maslow propõe uma hierarquia de necessidades."], ["Segundo Herzberg, salário e condições de trabalho são principalmente:", ["Fatores higiênicos.", "Motivadores.", "Valência.", "Autorrealização."], 0, "Fatores higiênicos evitam insatisfação, mas não equivalem aos motivadores."], ["Segundo Herzberg, desafio, responsabilidade e crescimento são:", ["Motivadores.", "Fatores higiênicos.", "Poderes posicionais.", "Necessidades fisiológicas."], 0, "Esses elementos são motivadores no modelo."], ["Vroom é associado a:", ["Expectativa, instrumentalidade e valência.", "Autonomia, competência e pertencimento.", "Alarme, resistência e exaustão.", "Demanda e controle."], 0, "A teoria de Vroom articula expectativa, instrumentalidade e valência."], ["Deci e Ryan são associados a:", ["Autonomia, competência e pertencimento.", "Punição, recompensa e coerção.", "Meta, cargo e informação.", "Esforço, recompensa e controle."], 0, "A Teoria da Autodeterminação destaca autonomia, competência e pertencimento."], ["Locke e Latham são associados a:", ["Metas claras, específicas e desafiadoras acompanhadas de feedback.", "Hierarquia de necessidades.", "Fatores higiênicos.", "Contrato relacional."], 0, "A teoria de metas enfatiza clareza, especificidade, desafio e feedback."], ["Daniel Pink, no material, enfatiza principalmente:", ["Autonomia, domínio/desenvolvimento e propósito.", "Coerção, recompensa e cargo.", "Alarme, resistência e exaustão.", "Demanda, controle e suporte."], 0, "Pink é relacionado à motivação 3.0, com autonomia, domínio/desenvolvimento e propósito."], ["Qual distinção evita o erro mais comum em Herzberg?", ["Fatores higiênicos evitam insatisfação; motivadores favorecem satisfação e motivação.", "Salário é sempre motivador intrínseco.", "Todo fator higiênico gera autorrealização.", "Motivadores e fatores higiênicos são sinônimos."], 0, "O modelo diferencia condições que evitam insatisfação de fatores ligados à motivação."]]}}, "Juliana": {"sub": "Saúde, Trabalho e Riscos Psicossociais", "topics": {"1. POT e saúde organizacional": [["Uma empresa atribui o adoecimento de vários trabalhadores apenas à personalidade de cada um. Pela perspectiva da POT estudada, qual análise é mais adequada?", ["Investigar a interação entre pessoa, trabalho e organização.", "Realizar apenas diagnóstico clínico individual.", "Considerar somente a remuneração.", "Avaliar apenas características de personalidade."], 0, "A POT analisa conjuntamente pessoa, trabalho e organização."], ["Em um setor há metas elevadas, pouco apoio da liderança e conflitos frequentes. O que deve orientar a análise psicológica?", ["Somente a capacidade individual de suportar pressão.", "A interação entre condições de trabalho, organização e experiência dos trabalhadores.", "Apenas a existência de transtornos mentais diagnosticados.", "Somente os resultados de produtividade."], 1, "O sofrimento no trabalho não é explicado por um único fator; a análise deve integrar pessoa, trabalho e organização."], ["Qual situação representa melhor uma organização considerada saudável no material?", ["Ausência absoluta de conflitos.", "Alta produtividade independentemente das condições de trabalho.", "Participação, reconhecimento, segurança, relações saudáveis e equilíbrio entre demandas e recursos.", "Oferta exclusiva de atendimento psicológico após afastamentos."], 2, "Saúde organizacional envolve condições que favoreçam saúde, participação, reconhecimento e equilíbrio entre demandas e recursos."], ["Um trabalhador relata que o emprego lhe trouxe autonomia, pertencimento e desenvolvimento. O caso demonstra que o trabalho:", ["Pode participar da construção da identidade e produzir experiências positivas.", "É apenas fonte de adoecimento.", "Não interfere na experiência subjetiva.", "Produz saúde somente quando não existem demandas."], 0, "O material reconhece que o trabalho pode favorecer identidade, pertencimento, autonomia e desenvolvimento."], ["Uma equipe apresenta sofrimento após mudanças na organização do trabalho. Antes de propor uma intervenção, o psicólogo deve:", ["Individualizar imediatamente o problema.", "Investigar as condições concretas e a organização do trabalho.", "Encaminhar todos os trabalhadores para psicoterapia.", "Concluir que a equipe tem baixa resiliência."], 1, "A análise organizacional deve anteceder explicações individualizantes e considerar as condições de trabalho."], ["Qual alternativa expressa melhor a relação entre trabalho e saúde apresentada no material?", ["O trabalho produz somente riscos.", "O trabalho é neutro para a saúde.", "O trabalho pode favorecer desenvolvimento e também produzir estresse, conflitos, acidentes e adoecimento.", "A saúde depende exclusivamente do indivíduo."], 2, "O trabalho pode ter efeitos positivos e negativos, dependendo de como se articula com a pessoa e a organização."], ["Uma empresa cria ações de bem-estar, mas mantém jornadas excessivas e falta de recursos. Qual crítica é coerente com a POT?", ["A ação é suficiente porque saúde é responsabilidade individual.", "É necessário também analisar e modificar fatores organizacionais que produzem sofrimento.", "O problema deve ser tratado apenas pela CIPAA.", "Jornadas e recursos não pertencem à análise psicológica."], 1, "A atuação não deve se limitar ao indivíduo quando as condições organizacionais participam do problema."], ["Ao investigar um problema de saúde no trabalho, qual pergunta está mais alinhada à perspectiva estudada?", ["Quem é emocionalmente mais frágil?", "Qual diagnóstico explica todos os casos?", "Como características individuais, atividade e contexto organizacional estão interagindo?", "Qual trabalhador deve ser substituído?"], 2, "A questão central é compreender a interação entre indivíduo, atividade e contexto organizacional."], ["Reconhecimento e participação aparecem no material como elementos relacionados a:", ["Saúde organizacional.", "Punição disciplinar.", "Diagnóstico clínico.", "Seleção de pessoal exclusivamente."], 0, "Reconhecimento e participação integram as condições associadas à saúde organizacional."], ["Uma intervenção em POT considera indicadores coletivos, escuta trabalhadores e analisa a organização das tarefas. Essa atuação demonstra:", ["Uma visão exclusivamente clínica.", "Uma análise ampliada do trabalho e da organização.", "Uma investigação restrita à personalidade.", "Uma substituição do SESMT pelo psicólogo."], 1, "A POT articula dimensões individuais, coletivas e organizacionais."]], "2. Diversidade, inclusão, igualdade e equidade": [["Uma empresa contrata pessoas de diferentes grupos sociais, mas elas não participam das decisões nem têm oportunidades reais de crescimento. O caso mostra:", ["Diversidade sem inclusão.", "Equidade plena.", "Igualdade de resultados.", "Inclusão consolidada."], 0, "A presença de diversidade não garante participação, pertencimento e oportunidades reais."], ["Dois trabalhadores recebem exatamente o mesmo recurso, embora um deles necessite de adaptação específica para realizar a atividade. A empresa aplicou principalmente:", ["Equidade.", "Igualdade.", "Inclusão plena.", "Acessibilidade individualizada."], 1, "Igualdade oferece o mesmo; equidade considera necessidades diferentes."], ["Uma organização adapta ferramentas e condições para que pessoas com necessidades diferentes tenham possibilidade real de participação. Isso exemplifica:", ["Equidade.", "Segregação.", "Uniformidade.", "Racismo institucional."], 0, "Equidade ajusta recursos e suportes às necessidades."], ["Qual frase diferencia corretamente diversidade de inclusão?", ["Diversidade é presença de diferenças; inclusão envolve participação e pertencimento reais.", "Diversidade e inclusão são sinônimos.", "Inclusão é apenas contratar pessoas diferentes.", "Diversidade exige que todos recebam exatamente o mesmo suporte."], 0, "Diversidade diz respeito à presença de diferenças; inclusão exige condições efetivas de participação."], ["Uma política afirma tratar todos exatamente da mesma forma, mas ignora barreiras específicas enfrentadas por alguns grupos. O conceito que ajuda a problematizar essa prática é:", ["Equidade.", "Produtividade.", "GRO.", "Presenteísmo."], 0, "A equidade considera necessidades e barreiras distintas para promover oportunidades reais."], ["Qual ação está mais alinhada à inclusão organizacional?", ["Apenas aumentar a diversidade numérica.", "Garantir acesso, participação, respeito e oportunidades de desenvolvimento.", "Aplicar as mesmas condições sem considerar barreiras.", "Evitar discutir diferenças para tratar todos igualmente."], 1, "Inclusão ultrapassa a presença e envolve participação e oportunidades reais."], ["Uma organização tem diversidade racial em cargos iniciais, mas quase nenhuma presença desses trabalhadores em liderança. O dado indica que:", ["A diversidade numérica, sozinha, não comprova inclusão e equidade nas oportunidades.", "A organização já alcançou inclusão plena.", "A ausência em liderança é irrelevante para a análise.", "Diversidade elimina desigualdades estruturais."], 0, "É preciso observar participação e oportunidades, não apenas presença."], ["No trabalho do psicólogo organizacional, promover inclusão significa principalmente:", ["Adaptar pessoas às barreiras existentes.", "Identificar barreiras e favorecer condições reais de participação.", "Substituir políticas organizacionais por atendimento clínico.", "Evitar analisar processos de seleção e desenvolvimento."], 1, "A atuação pode identificar barreiras e contribuir para práticas organizacionais inclusivas."], ["Uma empresa oferece o mesmo treinamento em formato inacessível a um trabalhador com deficiência. Embora exista igualdade de oferta, falta:", ["Equidade e acessibilidade.", "Produtividade.", "Poder legítimo.", "CIPAA."], 0, "A mesma oferta não garante acesso quando necessidades específicas não são consideradas."], ["Qual relação está correta?", ["Igualdade = mesmo tratamento; equidade = suporte ajustado às necessidades.", "Igualdade = participação; equidade = diversidade numérica.", "Igualdade = acessibilidade; equidade = ausência de diferenças.", "Igualdade e equidade são conceitos idênticos."], 0, "O material distingue igualdade de equidade pela consideração das necessidades e barreiras."]], "3. Racismo e divisão racial do trabalho": [["Uma ofensa racial praticada diretamente por uma pessoa contra outra exemplifica, no esquema estudado:", ["Racismo individual.", "Racismo institucional.", "Racismo estrutural exclusivamente.", "Divisão racial do trabalho."], 0, "O racismo individual aparece em atitudes e práticas discriminatórias entre indivíduos."], ["Uma organização mantém procedimentos que, mesmo sem declaração explícita, produzem desvantagens recorrentes para trabalhadores negros. Isso se aproxima de:", ["Racismo institucional.", "Somente racismo individual.", "Equidade.", "Segurança psicológica."], 0, "O racismo institucional se manifesta em práticas e funcionamento das instituições."], ["Desigualdades raciais reproduzidas historicamente nas estruturas sociais correspondem a:", ["Racismo estrutural.", "Apenas preconceito individual.", "Inclusão.", "Igualdade formal."], 0, "O racismo estrutural se relaciona à organização histórica e social que reproduz desigualdades."], ["Uma empresa possui trabalhadores negros, mas eles se concentram em funções menos valorizadas e quase não aparecem em cargos de liderança. O conceito mais diretamente relacionado é:", ["Divisão racial do trabalho.", "CIPAA.", "Presenteísmo.", "GRO."], 0, "A divisão racial do trabalho aparece na distribuição desigual entre ocupações, remuneração e liderança."], ["Qual situação melhor evidencia que diversidade racial não é sinônimo de inclusão racial?", ["Há trabalhadores racialmente diversos, mas oportunidades de promoção permanecem desiguais.", "Todos recebem acesso real às mesmas oportunidades.", "A empresa identifica barreiras e corrige processos.", "Há participação de diferentes grupos em todos os níveis."], 0, "A presença de grupos diversos não basta quando participação e oportunidades permanecem desiguais."], ["Ao analisar desigualdade racial em uma organização, limitar-se a procurar uma pessoa explicitamente preconceituosa é insuficiente porque:", ["Também é necessário examinar práticas institucionais e estruturas que reproduzem desigualdades.", "Somente a intenção individual importa.", "Racismo existe apenas em relações interpessoais.", "Indicadores organizacionais não podem revelar desigualdades."], 0, "O material diferencia dimensões individual, institucional e estrutural do racismo."], ["Diferenças persistentes de remuneração e acesso à liderança entre grupos raciais devem ser analisadas como possíveis evidências de:", ["Divisão racial do trabalho e desigualdades organizacionais.", "Somente diferenças de personalidade.", "Risco físico.", "Acidente típico."], 0, "O material relaciona divisão racial do trabalho a ocupações, remuneração e liderança."], ["Qual associação está correta?", ["Individual = atitudes entre pessoas; institucional = práticas das instituições; estrutural = desigualdades reproduzidas social e historicamente.", "Individual = estrutura social; institucional = personalidade; estrutural = regras da CIPAA.", "Individual = salários; institucional = acidentes; estrutural = PGR.", "Os três conceitos são equivalentes."], 0, "A distinção organiza o racismo em níveis individual, institucional e estrutural."], ["Uma política de seleção aparentemente neutra exclui repetidamente um grupo racial. Para uma análise institucional, o foco deve estar:", ["Nos efeitos e no funcionamento do processo de seleção.", "Apenas na intenção declarada do recrutador.", "Somente no comportamento dos candidatos.", "Na existência de diagnóstico clínico."], 0, "A dimensão institucional exige observar práticas e seus efeitos organizacionais."], ["Ao propor ações contra desigualdade racial, o psicólogo organizacional deve evitar:", ["Reduzir o problema exclusivamente a atitudes individuais.", "Analisar barreiras em processos organizacionais.", "Observar indicadores de participação e oportunidades.", "Considerar dimensões institucionais e estruturais."], 0, "Reduzir o racismo apenas ao indivíduo ignora dimensões institucionais e estruturais."]], "4. PcD, Lei de Cotas e BNCC": [["Uma empresa cumpre numericamente a Lei de Cotas, mas não oferece acessibilidade nem oportunidades de desenvolvimento. Qual conclusão é adequada?", ["O cumprimento da cota, sozinho, não garante inclusão real.", "A inclusão está automaticamente garantida.", "A acessibilidade deixa de ser necessária.", "A cota substitui todas as políticas de inclusão."], 0, "Inclusão exige mais que contratação: envolve acessibilidade e oportunidades reais."], ["Segundo o material, empresas com 100 a 200 empregados devem reservar qual percentual de vagas para PcD/reabilitados?", ["2%.", "3%.", "4%.", "5%."], 0, "Na faixa de 100 a 200 empregados, a cota indicada é de 2%."], ["Uma empresa possui 350 empregados. Segundo a tabela estudada da Lei de Cotas, o percentual correspondente é:", ["2%.", "3%.", "4%.", "5%."], 1, "Na faixa de 201 a 500 empregados, o percentual é de 3%."], ["Uma empresa com 800 empregados enquadra-se, segundo o material, em qual percentual?", ["2%.", "3%.", "4%.", "5%."], 2, "Na faixa de 501 a 1.000 empregados, o percentual é de 4%."], ["Para uma empresa com mais de 1.000 empregados, o percentual indicado no material é:", ["2%.", "3%.", "4%.", "5%."], 3, "A partir de 1.001 empregados, a cota indicada é de 5%."], ["Qual situação representa uma barreira atitudinal à inclusão de uma pessoa com deficiência?", ["Presumir incapacidade e impedir que participe de uma atividade sem avaliar suas condições reais.", "Adaptar uma ferramenta de trabalho.", "Disponibilizar recurso de acessibilidade.", "Rever um processo seletivo excludente."], 0, "Barreiras atitudinais envolvem crenças e condutas que restringem participação."], ["A contratação de PcD acompanhada de acessibilidade, integração e oportunidades de desenvolvimento indica:", ["Uma abordagem de inclusão para além do cumprimento formal da cota.", "Somente cumprimento burocrático.", "Dispensa de adaptações futuras.", "Substituição da equidade pela igualdade."], 0, "A inclusão real exige condições de participação e desenvolvimento."], ["No material, a BNCC aparece relacionada principalmente a:", ["Aprendizagens essenciais e educação inclusiva.", "Gerenciamento de riscos ocupacionais.", "Bases de poder.", "Diagnóstico de burnout."], 0, "A BNCC aparece associada às aprendizagens essenciais e à inclusão educacional."], ["Qual afirmação está de acordo com o conteúdo estudado sobre PcD?", ["A presença no quadro de funcionários não elimina automaticamente barreiras de inclusão.", "A cota garante pertencimento e progressão profissional.", "Acessibilidade é desnecessária quando a vaga foi preenchida.", "Inclusão depende exclusivamente da adaptação da pessoa."], 0, "A inclusão depende também de remover barreiras e criar oportunidades reais."], ["Uma organização quer avaliar se sua política para PcD é inclusiva. Além do número de contratações, deve observar:", ["Acessibilidade, participação e oportunidades reais de desenvolvimento.", "Somente a existência do contrato de trabalho.", "Apenas a produtividade individual.", "Somente o percentual legal."], 0, "A análise da inclusão ultrapassa o cumprimento numérico da cota."]], "5. Segurança e análise de acidentes": [["Após um acidente, a empresa conclui imediatamente que o trabalhador foi desatento. Qual é o principal problema dessa análise?", ["Ela reduz um fenômeno multifatorial a uma causa individual.", "Ela considera fatores organizacionais demais.", "Ela aplica corretamente a análise sistêmica.", "Ela prioriza a prevenção."], 0, "A análise de acidentes deve superar a busca de culpados e investigar múltiplos fatores."], ["Qual sequência de perguntas corresponde ao roteiro de investigação estudado?", ["O que? Como? Por quê? O que poderia ter sido diferente?", "Quem? Quanto? Onde? Qual punição?", "Qual diagnóstico? Qual culpa? Qual sanção? Qual demissão?", "Quando? Quem errou? Quem viu? Quem paga?"], 0, "O roteiro busca reconstruir o evento e identificar possibilidades de prevenção."], ["Um acidente ocorreu durante uma jornada extensa, com equipamento inadequado e pressão por produtividade. A análise deve considerar:", ["As condições e a organização do trabalho, além de fatores individuais.", "Somente a atenção do trabalhador.", "Apenas o equipamento.", "Somente a pressão produtiva."], 0, "Acidentes são multifatoriais e exigem análise de condições, organização, recursos e fatores humanos."], ["Ao reconstruir um acidente, qual fator pertence à análise dos fatores humanos?", ["Fadiga, estresse, atenção, treinamento e experiência.", "Somente faturamento da empresa.", "Apenas número de clientes.", "Exclusivamente diagnóstico psiquiátrico."], 0, "O material inclui atenção, fadiga, estresse, treinamento e experiência entre os fatores relevantes."], ["Falhas de comunicação e supervisão antes de um acidente devem ser tratadas como:", ["Elementos relevantes da investigação.", "Questões sem relação com segurança.", "Provas automáticas de culpa do trabalhador.", "Fatores exclusivamente clínicos."], 0, "Comunicação e supervisão fazem parte das condições que podem contribuir para acidentes."], ["Após um acidente, um trabalhador apresenta medo de retornar, alterações do sono e hipervigilância. A Psicologia pode:", ["Acolher, avaliar, acompanhar e encaminhar quando necessário.", "Concluir automaticamente um diagnóstico.", "Ignorar porque o acidente já terminou.", "Substituir toda a equipe de SST."], 0, "O material prevê acolhimento, avaliação, acompanhamento e encaminhamento, sem automatizar diagnósticos."], ["A pergunta 'o que tornou o evento possível?' é preferível a 'quem errou?' porque:", ["Direciona a análise para condições e fatores que contribuíram para o acidente.", "Elimina a necessidade de investigar o evento.", "Serve apenas para definir punição.", "Considera somente fatores técnicos."], 0, "A abordagem sistêmica busca compreender condições de ocorrência, e não apenas culpabilizar."], ["Qual situação representa uma análise reducionista de acidente?", ["Atribuir o evento exclusivamente ao comportamento inseguro do trabalhador.", "Examinar equipamento, procedimento, comunicação e pressão produtiva.", "Reconstruir a sequência do evento.", "Investigar treinamento e supervisão."], 0, "Atribuir o acidente a uma única falha individual ignora sua natureza multifatorial."], ["Ao analisar percepção de risco, o objetivo é compreender:", ["Como o trabalhador reconhecia e interpretava os riscos presentes na atividade.", "Qual punição deve ser aplicada.", "Somente sua personalidade.", "Se existe um transtorno mental."], 0, "A percepção de risco integra a reconstrução das condições do acidente."], ["Uma investigação identifica falha de procedimento, treinamento insuficiente e cobrança por velocidade. A conclusão mais coerente é:", ["Há combinação de fatores organizacionais e de trabalho que precisa ser tratada preventivamente.", "O acidente possui necessariamente um único culpado.", "Treinamento insuficiente exclui todos os demais fatores.", "A pressão por produtividade não pertence à análise."], 0, "A prevenção depende de compreender a combinação de fatores que tornou o evento possível."]], "6. NR-1, GRO e PGR": [["Uma empresa mantém um processo contínuo de identificação, avaliação, controle e acompanhamento dos riscos ocupacionais. Isso corresponde ao:", ["GRO.", "PGR.", "CIPAA.", "BNCC."], 0, "GRO é o processo contínuo de gerenciamento dos riscos ocupacionais."], ["A empresa registra os riscos identificados em um inventário e organiza medidas em um plano de ação. Esses documentos integram o:", ["PGR.", "GRO apenas como conceito abstrato.", "CIPAA.", "SESMT."], 0, "No material, o PGR materializa o gerenciamento por meio do inventário de riscos e do plano de ação."], ["Qual frase resume corretamente a distinção estudada?", ["GRO = gerenciar; PGR = registrar e planejar o gerenciamento.", "GRO = documento; PGR = processo contínuo.", "GRO e PGR são sinônimos perfeitos.", "PGR substitui o gerenciamento dos riscos."], 0, "O macete preserva a distinção entre processo de gerenciamento e sua materialização documental."], ["Uma organização identifica um risco, implementa controle e depois acompanha se a medida funcionou. O ciclo descrito exemplifica:", ["GRO.", "Somente inventário do PGR.", "Cota legal.", "CIPAA clínica."], 0, "Identificar, avaliar, controlar e acompanhar caracteriza o processo contínuo do GRO."], ["Em uma auditoria, é solicitado o documento que organiza os riscos levantados e as ações previstas. O foco está no:", ["PGR.", "GRO enquanto processo contínuo.", "Racismo estrutural.", "Presenteísmo."], 0, "Inventário e plano de ação são elementos documentais do PGR."], ["Segundo o material, os fatores de risco psicossociais relacionados ao trabalho devem ser incorporados:", ["Ao gerenciamento dos riscos ocupacionais.", "Somente ao atendimento clínico.", "Apenas às pesquisas de clima.", "Exclusivamente à seleção de pessoal."], 0, "Os riscos psicossociais relacionados ao trabalho integram o gerenciamento dos riscos ocupacionais."], ["Se uma questão enfatizar 'processo contínuo', qual conceito deve ser priorizado?", ["GRO.", "PGR.", "BNCC.", "Lei de Cotas."], 0, "A expressão processo contínuo é a pista decisiva para GRO."], ["Se uma questão enfatizar 'inventário de riscos e plano de ação', qual conceito deve ser priorizado?", ["PGR.", "GRO como processo.", "CIPAA.", "POT."], 0, "Inventário e plano de ação são os componentes documentais destacados do PGR."], ["Qual alternativa está incorreta sobre GRO e PGR?", ["O PGR é o processo contínuo e o GRO é apenas seu documento.", "O GRO envolve gerenciamento contínuo.", "O PGR organiza inventário e plano de ação.", "Os dois se articulam na gestão dos riscos."], 0, "A alternativa inverte os conceitos: GRO é o processo e PGR materializa/documenta o gerenciamento."], ["Uma empresa atualiza o inventário após identificar novos riscos e define novas medidas no plano de ação. Essa prática mostra:", ["Articulação entre o processo de GRO e sua organização no PGR.", "Substituição do GRO pelo PGR.", "Atuação exclusivamente clínica.", "Ausência de gerenciamento."], 0, "GRO e PGR se articulam: o processo de gerenciamento é organizado e documentado no programa."]], "7. Riscos psicossociais e indicadores": [["Metas impossíveis, baixa autonomia e relações hostis são investigadas como:", ["Fatores de risco psicossociais relacionados ao trabalho.", "Diagnósticos clínicos.", "Doenças mentais obrigatórias.", "Riscos biológicos."], 0, "Risco psicossocial é fator do trabalho que pode afetar saúde e bem-estar, não diagnóstico."], ["Qual afirmação diferencia corretamente risco psicossocial de transtorno mental?", ["O risco é uma condição/fator do trabalho; o transtorno é uma condição clínica e não são sinônimos.", "Todo risco psicossocial é um transtorno.", "Todo trabalhador exposto desenvolverá doença.", "Risco psicossocial só existe após diagnóstico."], 0, "O material reforça que risco psicossocial não é diagnóstico de transtorno mental."], ["Aumento simultâneo de absenteísmo e rotatividade em um setor deve ser tratado como:", ["Indicador que pode justificar investigação das condições de trabalho.", "Prova automática de transtorno mental.", "Evidência de fragilidade individual.", "Dado sem relevância psicossocial."], 0, "Indicadores coletivos podem sinalizar a necessidade de investigar o contexto organizacional."], ["Vários trabalhadores do mesmo setor relatam exaustão e conflitos após mudança de metas. Qual conduta é mais adequada?", ["Investigar o padrão coletivo e a organização do trabalho.", "Diagnosticar todos com o mesmo transtorno.", "Considerar coincidência individual.", "Avaliar somente quem pediu afastamento."], 0, "Padrões coletivos exigem investigação das condições organizacionais."], ["Qual conjunto contém apenas indicadores organizacionais citados no material?", ["Absenteísmo, presenteísmo, rotatividade e afastamentos.", "Pressão arterial, glicemia, altura e peso.", "QI, personalidade, memória e atenção.", "Salário, idade, endereço e escolaridade."], 0, "O material cita absenteísmo, presenteísmo, rotatividade, acidentes, denúncias e afastamentos como indicadores relevantes."], ["Presenteísmo, no contexto dos indicadores estudados, deve ser analisado:", ["Em conjunto com outros dados e condições de trabalho.", "Como diagnóstico clínico isolado.", "Como prova de comprometimento elevado.", "Sem relação com saúde ocupacional."], 0, "Indicadores não devem ser interpretados isoladamente; ajudam a orientar investigação."], ["Uma única queixa individual permite concluir que existe risco psicossocial coletivo?", ["Não; é necessário investigar contexto, exposição e padrões, sem transformar a queixa em diagnóstico coletivo.", "Sim, automaticamente.", "Sim, desde que haja baixa produtividade.", "Não, porque riscos psicossociais não podem ser avaliados."], 0, "A análise exige evidências e contexto; risco psicossocial não equivale a diagnóstico."], ["Carga de trabalho, apoio da liderança, relações, jornada e autonomia aparecem no material como:", ["Aspectos a observar na avaliação de riscos psicossociais.", "Critérios de diagnóstico psiquiátrico.", "Bases de poder.", "Elementos da Lei de Cotas."], 0, "Esses elementos integram o checklist de fatores psicossociais relacionados ao trabalho."], ["Quando denúncias e afastamentos aumentam no mesmo setor, o psicólogo deve:", ["Cruzar indicadores com análise do trabalho e outras evidências organizacionais.", "Concluir imediatamente que a liderança é culpada.", "Tratar cada caso sem olhar o coletivo.", "Desconsiderar os dados por não serem diagnósticos."], 0, "Indicadores orientam a investigação, mas precisam ser articulados ao contexto de trabalho."], ["Qual é o erro conceitual em afirmar 'o trabalhador tem um risco psicossocial, portanto tem um transtorno mental'?", ["Confundir fator de risco com diagnóstico clínico.", "Confundir GRO com PGR.", "Confundir diversidade com inclusão.", "Confundir acidente com incidente."], 0, "Exposição a risco psicossocial não significa automaticamente presença de transtorno mental."]], "8. CIPAA e atuação do psicólogo": [["Qual é a natureza principal da atuação da CIPAA no conteúdo estudado?", ["Preventiva e voltada à segurança e saúde no trabalho.", "Clínica e diagnóstica.", "Exclusivamente disciplinar.", "Restrita ao período após acidentes."], 0, "A CIPAA atua preventivamente e não substitui diagnóstico ou tratamento psicológico."], ["Ao identificar fatores psicossociais, a CIPAA deve:", ["Participar da prevenção e encaminhar questões dentro de suas atribuições, sem diagnosticar transtornos mentais.", "Realizar diagnóstico clínico dos trabalhadores.", "Substituir o psicólogo.", "Prescrever tratamento."], 0, "A atuação da CIPAA é preventiva e não clínica."], ["Um psicólogo analisa absenteísmo, escuta trabalhadores e discute mudanças na organização do trabalho com a equipe de SST. Essa atuação é:", ["Compatível com uma prática integrada e preventiva.", "Restrita à psicoterapia.", "Incompatível com a Psicologia do Trabalho.", "Substituição automática do SESMT."], 0, "A Psicologia pode articular indicadores, escuta, prevenção e análise organizacional."], ["Qual conduta reduz indevidamente a atuação do psicólogo em SST?", ["Limitar sua função à psicoterapia individual.", "Participar da análise de riscos.", "Articular dados coletivos e organização do trabalho.", "Contribuir para prevenção."], 0, "O material enfatiza que a atuação do psicólogo do trabalho não se restringe à clínica."], ["Diante de aumento de afastamentos, qual contribuição do psicólogo é coerente com o material?", ["Analisar indicadores e condições organizacionais, acolher quando necessário e contribuir para ações preventivas.", "Diagnosticar coletivamente todos os trabalhadores.", "Atribuir o problema à falta de resiliência.", "Atuar somente depois de novos afastamentos."], 0, "A atuação integra dimensões individuais, coletivas e organizacionais."], ["A CIPAA pode contribuir com riscos psicossociais principalmente por meio de:", ["Identificação de situações de risco, participação preventiva e discussão de medidas de melhoria.", "Psicoterapia de grupo obrigatória.", "Emissão de diagnóstico psicológico.", "Prescrição de medicamentos."], 0, "Sua função é preventiva, dentro do campo de saúde e segurança."], ["Por que a atuação do psicólogo deve ser multiprofissional em SST?", ["Porque os riscos do trabalho envolvem dimensões que exigem articulação entre diferentes áreas e responsabilidades.", "Porque o psicólogo deve assumir todas as funções da SST.", "Porque somente profissionais clínicos avaliam riscos.", "Porque a CIPAA não participa de prevenção."], 0, "A prevenção e o gerenciamento dos riscos exigem atuação integrada."], ["Após um acidente, qual combinação representa melhor a atuação psicológica indicada?", ["Acolher o trabalhador e também contribuir para compreender fatores organizacionais e prevenir recorrências.", "Realizar apenas teste de personalidade.", "Buscar um culpado para o evento.", "Ignorar fatores do trabalho."], 0, "A Psicologia pode atuar no acolhimento e na prevenção, articulando indivíduo e organização."], ["Ao participar do gerenciamento de riscos psicossociais, o psicólogo deve evitar:", ["Transformar a avaliação organizacional em diagnóstico clínico coletivo.", "Analisar organização do trabalho.", "Considerar indicadores.", "Contribuir com ações preventivas."], 0, "Riscos psicossociais não devem ser confundidos com diagnósticos de transtornos mentais."], ["Qual frase sintetiza a atuação ampliada do psicólogo no conteúdo de Juliana?", ["Articular indivíduo, organização, indicadores, análise do trabalho e prevenção.", "Atender clinicamente e deixar a organização fora da análise.", "Substituir os demais profissionais de SST.", "Atuar somente quando houver doença diagnosticada."], 0, "A atuação estudada é integrada, preventiva e organizacional, não limitada à clínica."]]}}, "Mariana / Mariane": {"sub": "Saúde Mental, Trabalho e Relações Organizacionais", "topics": {"1. Evolução histórica do trabalho": [["Ford é associado a:", ["Linha de montagem.", "Relações humanas.", "Demanda-controle.", "Burnout."], 0, "Fordismo é associado à linha de montagem."], ["Hawthorne destaca:", ["Linha de montagem.", "Coerção.", "PGR.", "Relações humanas e fator humano."], 3, "Hawthorne amplia o olhar para relações sociais e fator humano."], ["Em uma situação organizacional, ford é associado a:", ["Demanda-controle.", "Burnout.", "Linha de montagem.", "Relações humanas."], 2, "Fordismo é associado à linha de montagem."], ["Em uma situação organizacional, hawthorne destaca:", ["PGR.", "Relações humanas e fator humano.", "Linha de montagem.", "Coerção."], 1, "Hawthorne amplia o olhar para relações sociais e fator humano."], ["Durante uma análise de caso, ford é associado a:", ["Linha de montagem.", "Relações humanas.", "Demanda-controle.", "Burnout."], 0, "Fordismo é associado à linha de montagem."], ["Durante uma análise de caso, hawthorne destaca:", ["Linha de montagem.", "Coerção.", "PG
